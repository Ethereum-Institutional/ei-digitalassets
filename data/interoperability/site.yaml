sections:
- title: Connecting is not interoperating
  text: 'ISO 22739 defines interoperability as the ability of two or more systems to exchange information and use it. The second half is the point: two ledgers interoperate when the receiving side can act on a message as reliably as the sending side recorded it.'
  items:
  - title: Three ways an asset reaches another ledger
    text: 'Locked at the source and represented by a new token at the destination: the holder depends on the lock and the route. Burned and minted again by its issuer: the holder has the issuer''s token on both sides. Left where it is, with a second ledger settling against it. Each puts the risk somewhere different.'
    see: [taxonomy]
  - title: The trust belongs to the route
    text: 'A token''s name says nothing about which route carried it. A route is as strong as its weakest part: who confirms, the contracts that hold or mint the asset, and whoever can upgrade or pause them.'
  sources:
  - { title: 'ISO 22739:2024, Blockchain and distributed ledger technologies: Vocabulary, 3.52 interoperability', url: 'https://www.iso.org/standard/82208.html', checked: '2026-11-24' }
- title: A message is not a settlement
  text: 'Most routes deliver a message that the destination acts on later, so a payment can arrive while the asset it paid for does not. Delivery versus payment across two ledgers needs both legs to settle together, which only a few routes provide.'
  see: [scenarios]
  items:
  - title: How two legs are tied together
    text: 'A hash time-locked contract on each side releases both legs with the same secret, or refunds both after a timeout, with no one in the middle. Other routes put an operator in the middle: the Eurosystem''s Pontes, launched on 21 September 2026, settles a leg on a market ledger against a payment in central bank money in T2, the Eurosystem''s real-time gross settlement system.'
    sources:
    - { title: 'BIP 199, Hashed Time-Locked Contract transactions (2017)', url: 'https://raw.githubusercontent.com/bitcoin/bips/master/bip-0199.mediawiki', checked: '2026-11-24' }
    - { title: 'ECB, Pontes (launched 21 September 2026; Hash-Link protocol; cash leg final in T2)', url: 'https://www.ecb.europa.eu/paym/target/pontes/html/index.en.html', checked: '2026-11-24' }
    - { title: 'ECB, TARGET Services and Pontes (TARGET Services, the Eurosystem''s market infrastructure services; T2, its real-time gross settlement system)', url: 'https://www.ecb.europa.eu/paym/target/html/index.en.html', checked: '2026-11-25' }
- title: Acting across chains in one step
  text: 'The newest work goes beyond messages: one transaction that completes on several ledgers at once. Within a family of chains the aim is synchronous composability: a contract on one chain calls a contract on another and uses the answer in the same transaction, as it would on one ledger. Early approaches are on the map for two different problems: joining Ethereum mainnet and its rollups (the Ethereum Economic Zone, Puffer UniFi) and joining institutions'' separate ledgers (Consensys CLIP).'
  items:
  - title: Within Ethereum, the Ethereum Economic Zone
    text: 'An open framework, announced in March 2026 by Gnosis and ZisK with Ethereum Foundation funding: a contract on one rollup calls a contract on another, or on Ethereum mainnet, and uses the answer in the same transaction. It is designed to prove every state change to mainnet; on today''s test network signers attest instead, and zero-knowledge proving is still research.'
    sources:
    - { title: 'EEZ, Introducing the Ethereum Economic Zone (29 March 2026)', url: 'https://eez.io/blog/introducing-the-eez', checked: '2026-11-24' }
    - { title: 'EEZ documentation', url: 'https://docs.eez.io', checked: '2026-11-24' }
    - { title: 'Ethereum Research forum, Synchronous Composability Between Rollups via Realtime Proving (2 February 2026)', url: 'https://ethresear.ch/t/synchronous-composability-between-rollups-via-realtime-proving/23998', checked: '2026-11-25' }
    - { title: 'EEZ core protocol, Multi-Prover Specification (each rollup''s owner chooses proof systems and threshold)', url: 'https://github.com/eez-association/eez-core-protocol/blob/main/docs/MULTI_PROVER_SPEC.md', checked: '2026-11-25' }
    - { title: 'EEZ RollupX roadmap, 23 November 2026 (M-of-N attestation done; ZisK prover integration a research item)', url: 'https://eez-association.github.io/eez-rollupx-roadmap/', checked: '2026-11-25' }
  - title: Within Ethereum, Puffer UniFi
    text: 'A based rollup whose blocks are designed to be ordered by Ethereum mainnet''s own validators, so that a transaction can act on Ethereum mainnet and the rollup in the same block. It runs on public testnets; by its own documentation, the messaging that gives it synchronous composability is not yet deployed there, and its fast confirmations carry no penalty yet.'
    sources:
    - { title: 'Puffer UniFi documentation, Architecture', url: 'https://docs-unifi.puffer.fi/developers/concepts/architecture', checked: '2026-11-25' }
    - { title: 'Puffer UniFi documentation, L1 to L2 Composability Examples (not yet deployed to the testnet)', url: 'https://docs-unifi.puffer.fi/developers/reference/L1-to-L2-composability-examples', checked: '2026-11-25' }
  - title: Between institutions' own ledgers, Consensys CLIP
    text: 'A commercial protocol, launched in November 2026, for ledgers that stay separate: each proves its part is ready, and a verification ledger run by the institution, a market infrastructure or Consensys commits all or nothing. It sits with the operator-run routes because that ledger, not the destination, makes the check. EVM chains are supported now. Its proof system is not published, so its claims are vendor-stated.'
    sources:
    - { title: 'Consensys, Consensys Introduces Sovereign Network Interoperability (2 November 2026)', url: 'https://consensys.com/blog/consensys-introduces-sovereign-network-interoperability-a-technology-stack-for-connecting-financial-networks', checked: '2026-11-24' }
- title: Before you use a route
  text: 'The same questions apply to every route: who confirms a transfer, what failure would let a false one through, who can upgrade or pause the contracts, how much can move before a limit stops it, and what the holder is left with if the route fails.'
  see: [architecture]
