# Interoperability map: page text and settings. A grid page (kind: grid; owner, 25 November 2026, D59) of the routes
# that make an asset, a payment or a message on one ledger usable on another: columns for who a route relies on, rows for
# whether both legs settle together (grid.yaml), with the routes in badges.yaml, a "Focus on" sidebar of facts and the
# narrative in `sections`. Named Interoperability, the ISO 22739 term (3.52), with "connectivity" naming the patterns
# inside it (owner, 24 November 2026). Writing rules: US spelling; no em-dashes; quote YAML values that contain ": ";
# "Ethereum mainnet" for the chain; third person ("Ethereum Institutional"), never "we".

kind: grid
title: Interoperability
slug: interoperability
eyebrow: Ethereum Institutional · Research
heading:
  text: Interoperability
  italic: Interoperability
intro: 'How does one ledger learn what happened on another? Every route between ledgers answers that question. Across the top: who you rely on for the answer. Down the side: whether both legs of an exchange settle together. Further right means fewer parties to trust, but usually a narrower reach. A dashed bar marks a route whose model each deployment chooses. Click a route for details, or use Focus on to filter.'
intro_more: 'Settlement is simplest when the asset and the cash that pays for it sit on the same ledger and move in one transaction; that is the case for a shared ledger such as Ethereum mainnet. Today they are spread out: tokenized funds and bonds on Ethereum mainnet and its rollups, deposit tokens on bank networks, central bank money in central banks'' own systems, and some records on private Ethereum-technology networks. Until they meet, each move between ledgers needs a route, and every route asks you to rely on someone or something. The same token can arrive by routes with different models, so the trust belongs to the route, not to the token.'
intro_more_label: 'Why interoperability?'
panel_default:
  title: Between ledgers
  text: Hover over a column, a row or a route to read about it; click to pin it here with all its facts.
badge: pill
sections_collapsed: true
pill_scale: 1.1
facts_as_of: '2026-11-25'
