# this), `part` (partly), a `note`. Readers pick values; within a facet any picked value matches, across facets all
# must. `na` (does not apply) and `unknown` never match. `neutral: true` marks a facet readers value differently.
facets_title: Focus on
facets_noun: route
facets_help: Pick what matters to you. Routes that match stay highlighted; dashed means partly.
