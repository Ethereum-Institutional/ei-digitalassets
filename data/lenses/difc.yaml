notes:
  btc: A DFSA-recognised Crypto Token.
  eth: A DFSA-recognised Crypto Token.
  natoth: A Crypto Token, but usable in the DIFC only once recognised by the DFSA.
  cbdc: CBDCs are Excluded Tokens.
  td: A deposit, not a Crypto Token.
  dt: A deposit, not a Crypto Token, whatever it is called.
  sc: 'Fiat Crypto Tokens: Crypto Tokens subject to additional recognition criteria. The DFSA does not regulate their issuance.'
  lsc: Recognised Fiat Crypto Tokens can be used for payments, settlement and margining in the DIFC.
  unreg: Still a Crypto Token by definition, but unrecognised tokens cannot be used in the DIFC.
  alg: 'A Prohibited Token: no financial services may be provided in relation to it.'
  sec: Investment Tokens — regulated as investments, not Crypto Tokens.
  dv: Futures and options, including on Crypto Tokens, are regulated as investments.
  fund: Investment Tokens — tokenized fund units, including MMFs.
  pm: A Crypto Token if used for payment or investment and not an Investment Token; assessed case by case.
  ocom: Investment Token if structured as a derivative; otherwise assessed case by case.
  re: Investment Token if it confers rights in a security or fund; assessed case by case.
  pc: Usually an Investment Token (debt instrument).
  coll: Assessed case by case.
  ip: Usually an Investment Token where it confers income rights.
  art: NFTs are Excluded Tokens.
  util: Utility tokens are Excluded Tokens.
  game: Excluded where it is a utility or non-fungible token.
  loy: Generally an Excluded (utility) Token.
  id: Non-fungible / utility — an Excluded Token.
  tix: Non-fungible / utility — an Excluded Token.
  fmi: A wholesale settlement asset, typically regulated as a payment system rather than as a crypto token.
