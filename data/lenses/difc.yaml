# Lens: DIFC DFSA — crypto, fiat crypto and investment tokens
# status: in | part | out per circle id (part = depends, exempt or restricted). Circles not listed are outside,
#   except containers (derived from their children). `groups` draw one dotted perimeter per group and mark its circles as inside.
# notes: the sentence shown under a circle's definition when this lens is active.
# Please add sources (URL + date) for every regulatory claim you change.

id: difc
group: jurisdiction
menu: AE · DIFC (DFSA) — crypto, fiat crypto & investment tokens
name: DIFC DFSA — crypto, fiat crypto and investment tokens
short: DIFC DFSA
color: '#0e7490'
intro: In the DIFC, the DFSA defines a Crypto Token as a token used, or intended to be used, as a medium of exchange or for payment or investment. It carves out Excluded Tokens (NFTs, utility tokens, CBDCs) and Investment Tokens (tokenized securities and derivatives, regulated as investments). Stablecoins are “Fiat Crypto Tokens” with extra recognition criteria. Privacy and algorithmic tokens are Prohibited Tokens. Firms may only deal in tokens the DFSA has recognised. This lens shows all three categories the DFSA regulates; Excluded Tokens (NFTs, utility tokens, CBDCs) are faded.
groups:
- id: ct
  label: Crypto Tokens
  name: recognised by the DFSA
  color: '#6d28d9'
  circles:
  - btc
  - eth
  - comm
  - gov
  - lst
- id: fct
