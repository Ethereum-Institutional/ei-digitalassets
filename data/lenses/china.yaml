notes:
  sc: Unapproved stablecoins — including RMB-pegged ones issued offshore — are banned.
  td: Not addressed by the notice; bank deposits remain under banking law.
  dt: Not addressed by the notice; tokens on public chains would face the ban on crypto-linked activity.
  art: “Digital collectibles” on permissioned platforms without secondary trading are tolerated; tradeable NFTs are not.
  rwa: Illegal unless approved and run within designated financial infrastructure.
  lsc: Foreign licensed stablecoins have no approval route onshore.
  fmi: A wholesale settlement asset, typically regulated as a payment system rather than under crypto-asset rules; check local treatment.
