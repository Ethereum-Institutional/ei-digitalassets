name: UK “qualifying cryptoasset”
short: UK
color: '#4338ca'
intro: The UK brings “qualifying cryptoassets” and “qualifying stablecoins” (fiat-referenced) into FCA regulation under HM Treasury’s 2025 order. The FCA finalised its rules in 2026; the regime applies from 25 October 2027, with applications open from 30 September 2026. Specified investments (tokenized securities, deposits), e-money and fiat currency are outside the new crypto definitions. Systemic stablecoins will also be supervised by the Bank of England.
