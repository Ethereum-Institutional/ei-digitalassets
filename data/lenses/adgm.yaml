notes:
  natoth: Firms may only deal in “Accepted Virtual Assets” approved by the FSRA.
  cbdc: Legal tender issued by a jurisdiction — not a virtual asset.
  td: Fiat currency held as a deposit — not a virtual asset.
  dt: Still fiat (commercial bank money) — not a virtual asset.
  sc: Fiat-referenced stablecoins sit in the FRT regime; others may be virtual assets.
  lsc: 'Fiat-Referenced Tokens: backed 1:1 by segregated cash and high-quality liquid assets; only Accepted FRTs may be dealt with in ADGM.'
  unreg: 'Not an Accepted FRT: cannot be dealt with in ADGM.'
  alg: Algorithmic stablecoins are expressly prohibited.
  sec: Digital Securities — regulated as securities, not virtual assets.
  dv: Derivatives are Specified Investments, not virtual assets.
  fund: Units in tokenized funds are securities — tokenized MMFs included.
  pm: 'Assessed case by case: a virtual asset or a commodity-linked investment depending on structure.'
  ocom: Assessed case by case.
  re: A Digital Security if structured as a security; otherwise assessed case by case.
  pc: Usually a Digital Security (debt instrument).
  coll: Assessed case by case.
  ip: Usually a Digital Security where it confers income rights.
  art: NFTs are assessed case by case.
  util: Assessed case by case.
  game: Closed-loop items generally fall outside.
  loy: Closed-loop points generally fall outside.
  id: Generally outside.
  tix: Generally outside.
  fmi: A wholesale settlement asset, typically regulated as a payment system rather than as a virtual asset.
