# Lens: ADGM FSRA — virtual assets, FRTs and digital securities
# status: in | part | out per circle id (part = depends, exempt or restricted). Circles not listed are outside,
#   except containers (derived from their children). `groups` draw one dotted perimeter per group and mark its circles as inside.
# notes: the sentence shown under a circle's definition when this lens is active.
# Please add sources (URL + date) for every regulatory claim you change.

id: adgm
group: jurisdiction
menu: AE · ADGM (FSRA) — virtual assets, FRTs & digital securities
name: ADGM FSRA — virtual assets, FRTs and digital securities
short: ADGM FSRA
color: '#4338ca'
intro: In ADGM, the FSRA defines a Virtual Asset as a digital representation of value that can be digitally traded and functions as a medium of exchange, unit of account or store of value, without legal tender status — distinguished from fiat currency and e-money. Tokenized securities are regulated as Digital Securities. Fiat-backed stablecoins fall under the FSRA’s Fiat-Referenced Token (FRT) regime (consulted on in 2024), and algorithmic stablecoins are expressly prohibited. This lens shows all three categories the FSRA regulates, so tokenized stocks, bonds and funds appear as digital securities.
