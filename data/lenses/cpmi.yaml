status: {}
notes:
  lsc: Even licensed stablecoins trade on their own terms and can break par, failing singleness; BIS views them as best confined to a narrow role.
  dt: Commercial bank money settles at par with central bank money — it passes singleness, even when tokenized.
  wcbdc: The foundation of the BIS unified-ledger vision (e.g. Project Agorá).
  nat: Not considered money by the BIS.
  rwa: Tokenized government bonds and other assets settle against tokenized central bank and bank money on a unified ledger.
  fmi: Central bank money held through an FMI — passes the singleness test because it is fully backed by reserves.
