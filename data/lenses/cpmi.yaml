id: cpmi
group: standard-setter
menu: BIS / CPMI — money tests
name: BIS / CPMI money tests
short: BIS / CPMI
color: '#1d4ed8'
intro: The BIS (Annual Economic Report 2025) tests forms of money against singleness (trades at par with all other money), elasticity (can expand to meet payment needs) and integrity (resists illicit use). Central bank reserves and commercial bank money on a tokenized “unified ledger” pass; stablecoins fall short. CPMI and IOSCO also apply the Principles for Financial Market Infrastructures to systemically important stablecoin arrangements.
