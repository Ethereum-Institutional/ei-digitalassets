name: Dubai VARA “virtual asset”
short: Dubai VARA
color: '#0369a1'
intro: Dubai Law No. 4 of 2022 defines a virtual asset as a digital representation of value that can be digitally traded or transferred and used for exchange, payment or investment — excluding digital representations of fiat currencies and securities. Applies in Dubai outside the DIFC. Fiat-referenced payment tokens are also subject to the CBUAE Payment Token Services Regulation.
