notes:
  cbdc: A digital representation of fiat currency.
  td: A digital representation of fiat currency held as a deposit.
  dt: Still a digital representation of fiat currency (commercial bank money), whatever it is called.
  sc: Fiat-referenced virtual assets (FRVAs) under the VARA Rulebook.
  lsc: FRVAs require VARA approval; AED payment tokens are licensed by the CBUAE, and only AED payment tokens may be used for onshore payments for goods and services.
  unreg: In the definition, but issuing or marketing in Dubai without VARA approval is prohibited.
  alg: A virtual asset, but algorithmic stablecoins are prohibited under the CBUAE payment token rules.
  pm: Asset-referenced virtual assets (ARVAs).
  ocom: Generally ARVAs, unless structured as securities or derivatives.
  re: Dubai Land Department / VARA tokenized title deeds are virtual assets; property tokens structured as securities fall to the SCA or DFSA.
  pc: 'Usually out: typically structured as securities.'
  coll: Assessed case by case; fractionalised ownership may be a security.
  ip: Income-bearing royalty tokens are often securities.
  sec: Securities fall to the SCA or DFSA, not VARA.
  dv: Derivatives on securities or commodities fall to the SCA; derivatives referencing virtual assets need case-by-case analysis of VARA’s activity rules.
  fund: Fund units are securities — tokenized MMFs included.
  art: NFTs are assessed case by case; fractionalised NFTs may be securities.
  game: Non-transferable or closed-loop in-game tokens are exempt virtual assets.
  loy: Non-transferable loyalty points are exempt virtual assets.
  id: Non-transferable credentials are generally exempt.
  tix: Closed-loop or non-transferable tickets are exempt virtual assets.
  fmi: A wholesale settlement asset, typically regulated as a payment system rather than under crypto-asset rules; check local treatment.
