name: Switzerland FINMA token classes
short: Switzerland
color: '#0369a1'
intro: 'FINMA classifies tokens by economic function: payment tokens (cryptocurrencies), utility tokens (access to a service) and asset tokens (claims or securities, which the DLT Act lets be issued as ledger-based securities). Stablecoins are assessed case by case; FINMA’s 2024 guidance requires bank default guarantees where an issuer lacks a banking licence. A Federal Council draft (consultation from October 2025) would add “payment instrument institution” licences for stable-value payment tokens and “crypto-institution” licences for service providers.'
