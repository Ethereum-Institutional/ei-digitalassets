menu: EU · European Union (MiCA) — “crypto-asset”
name: EU MiCA “crypto-asset”
short: EU MiCA
color: '#1d4ed8'
intro: 'MiCA (Reg. (EU) 2023/1114) defines a crypto-asset as a digital representation of value or a right transferable using DLT, then excludes from scope: assets issued by central banks, unique non-fungible assets, and anything already regulated as a financial instrument, deposit, fund (unless an e-money token), securitisation, insurance or pension product (Art. 2).'
