notes:
  cbdc: Central banks acting as monetary authority are excluded (Art. 2(2)).
  td: Deposits are excluded (Art. 2(4)(c)).
  dt: Still a deposit, so excluded (Art. 2(4)(c)). The EBA has flagged this boundary for case-by-case assessment.
  sc: E-money tokens (EMTs) or asset-referenced tokens (ARTs).
  lsc: Authorised EMT/ART issuers (credit institutions or e-money institutions).
  unreg: In the definition, but cannot lawfully be offered or admitted to trading in the EU without authorisation.
  alg: 'A crypto-asset, but not an EMT or ART: treated as an ordinary crypto-asset and cannot be presented as a stablecoin.'
  pm: Commodity-backed tokens are typically asset-referenced tokens (ARTs).
  ocom: An ART if it references commodities; a financial instrument if structured as a derivative.
  re: Out if the token is a financial instrument; otherwise may be a crypto-asset.
  pc: 'Usually out: private credit tokens are typically financial instruments.'
  coll: A crypto-asset if fractionalised and fungible; out if unique or a financial instrument.
  ip: Usually a financial instrument where it confers income rights.
  sec: Financial instruments are regulated under MiFID II, not MiCA.
  dv: Derivatives — including on crypto-assets — are MiFID II financial instruments.
  fund: Fund units are financial instruments — tokenized MMFs included.
  art: Out if truly unique and non-fungible (Art. 2(3)); in if issued in large series or fractionalised.
  game: Freely transferable items are in; closed-loop points may use the limited-network exemption.
  loy: Closed-loop loyalty points can use the limited-network exemption (Art. 4(3)).
  id: Unique, non-transferable names or credentials are generally out.
  tix: Unique tickets are non-fungible (out); closed-loop passes may use the limited-network exemption.
  fmi: A wholesale settlement asset, typically regulated as a payment system rather than under crypto-asset rules; check local treatment.
