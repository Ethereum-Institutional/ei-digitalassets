notes:
  rcbdc: The retail e-HKD has been researched and piloted, but there is no decision to issue it.
  wcbdc: Tokenized central bank money is the target settlement asset for EnsembleTX.
  td: Supervised as bank deposits and excluded from the Stablecoins Ordinance; EnsembleTX uses them for real-value settlement in 2026.
  dt: Still a deposit under the Banking Ordinance, so excluded from the Stablecoins Ordinance whatever it is called.
  lsc: 'Licensed issuers so far: Anchorpoint Financial (FRS01) and HSBC (FRS02), both HKD-referenced, from 10 April 2026.'
  sc: A licence is required to issue in Hong Kong or to issue an HKD-referenced token anywhere; unlicensed foreign stablecoins may be offered to professional investors only.
  unreg: Cannot be offered to retail or advertised in Hong Kong.
  alg: 'Outside the regime: only fully reserved, fiat-referenced tokens can be licensed.'
  fund: Tokenized money-market funds are the first use case in EnsembleTX, settled with tokenized deposits — the fund itself is SFC territory.
  fmi: A wholesale settlement asset, typically regulated as a payment system rather than under crypto-asset rules; check local treatment.
