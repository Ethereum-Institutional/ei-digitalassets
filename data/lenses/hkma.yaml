menu: HK · Hong Kong (HKMA) — stablecoins, tokenized deposits & CBDC
name: Hong Kong HKMA — stablecoins, tokenized deposits & central bank money
short: Hong Kong HKMA
color: '#1d4ed8'
intro: 'The Hong Kong Monetary Authority licenses issuers of fiat-referenced stablecoins under the Stablecoins Ordinance: anyone issuing in Hong Kong, or issuing a token referenced to the Hong Kong dollar anywhere. The first two licences took effect on 10 April 2026 (Anchorpoint Financial and HSBC, both HKD-referenced). Reserves must be fully backed, held on trust and matched to the reference currency, and interest to holders is prohibited. Only licensed stablecoins may be offered to retail. The HKMA also supervises banks’ tokenized deposits, which the Ordinance excludes as deposits, and runs Project Ensemble: its EnsembleTX pilot settles real-value tokenized-deposit transactions (starting with tokenized money-market funds) during 2026, first via RTGS and progressively in tokenized central bank money.'
