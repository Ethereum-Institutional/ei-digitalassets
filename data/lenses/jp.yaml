menu: JP · Japan — crypto-assets & stablecoins
name: Japan crypto-assets & stablecoins
short: Japan
color: '#4338ca'
intro: Japan regulates three token types separately. “Crypto-assets” under the Payment Services Act (transferable value usable for payment to unspecified persons, excluding currency and currency-denominated assets); “electronic payment instruments” — fiat stablecoins, which since 2023 only banks, fund-transfer providers and trust companies may issue (e.g. JPYC); and security tokens (“electronically recorded transferable rights”) under the Financial Instruments and Exchange Act. A bill to reclassify crypto-assets as financial instruments cleared a lower-house committee in June 2026 — check whether it has been enacted.
