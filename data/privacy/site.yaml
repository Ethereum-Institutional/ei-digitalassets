intro: 'How confidentiality is achieved on shared ledgers and what each approach gives up. The map will range from restricting who can see the ledger at all (private and consortium networks, stakeholder-only data as in Canton and Corda) to keeping a public ledger verifiable while hiding amounts and counterparties (shielded pools, zero-knowledge proofs, validity rollups, privacy-preserving tokens on Ethereum mainnet), and will set each against what institutions need: selective disclosure to regulators, auditability and settlement finality.'
