# Privacy map: page text and settings. A Venn map (no `kind`) of what each design hides from the public, with
# badges for protocols and techniques (badges.yaml), a "Focus on" sidebar of facts (`facets` below, values in each
# badge's `facts`) and the
# narrative in `sections` under the map. The whole page is public (owner, 26 October 2026).
# Writing rules: US spelling; no em-dashes; quote YAML values that contain ": "; "Ethereum mainnet" for the chain;
# legal history as dates and holdings only.

title: Privacy
slug: privacy
eyebrow: Ethereum Institutional · Research
heading:
  text: Privacy
  italic: Privacy
intro: 'Confidential tokens are the center of privacy on Ethereum, and privacy here is thriving in many forms, on Ethereum mainnet, on Layer 2s and on private networks. The map shows what each design hides from the public; Focus on picks out the designs that fit what you need, and the institutional wish list shows which come closest.'
panel_default:
  title: Privacy on a shared ledger
  text: Hover over a circle or a design to read what it hides; click to pin it here with all its facts. Use Focus on to pick what matters to you, or start from the institutional wish list.
badge: pill
pill_scale: 1.3
facts_as_of: '2026-10-26'
legend:
- kind: pill
  color: '#627eea'
  text: 'Live on an EVM ledger or a Layer 2 that settles on Ethereum mainnet'
- kind: pill
  hollow: true
  color: '#627eea'
  text: 'On a public testnet'
# Facets: the "Focus on" sidebar. Each design (badges.yaml `facts`) gives one or more values per facet: `in` (it
# has this), `part` (partly, or a supporting part of the design), a `note` with figure and date, and `sources`.
# `filter: false` facets are information only (shown in each design's fact sheet, not in the sidebar).
# Readers pick values; within a facet any picked value matches (`match: all`: every one must), across facets all must. Values `na` (does not apply)
# and `unknown` (not yet researched) are always allowed and never match. Facets marked `from: status` or
# `from: since` are filled by the build from the badge's `status` or `since` date. Aligned with the PSE private
# transfers benchmark (`pse:` names its property) so a reading can cite it. `neutral: true` marks a facet that readers
# value differently (a notary is a requirement to a compliance officer and a defect to a cypherpunk): its marks in a
# design's fact sheet are plain ink boxes, never green or red.
facets_title: Focus on
facets_help: Pick what matters to you. Designs that have all of it stay highlighted; dashed means partly.
facet_presets:
- id: wishlist
  label: The institutional wish list
  text: 'Permissioned privacy institutions can use: verified participants, compliance checks, a notary, issuer controls, any EVM ledger, open code, and operators you run yourself, with no fee beyond gas or a commercial license, in production or a public pilot. No permissioned design yet has five years live, native ERC-3643 or ERC-7943 support, a notary whose decryptions leave an on-chain notice, or full post-quantum cryptography.'
  require: [permission, checks]     # must-haves: a design must at least partly meet these to be ranked
  picks:
    permission: [permissioned]
    association: ['no']
    checks: [builtin, capable]
    visibility: [notice, notary]
    controls: [freeze, forced, pause, mint]
    chains: [anyevm]
    pq: ['yes', hashes]
    license: [open]
    operator: [self]
    external: ['no']
    fees: [none, license]
    upgrade: [operator]
    institutions: [production, public]
