sections:
- title: What institutions are asking for
  text: 'Confidential tokens are what institutions want from privacy, with requirements that differ from an individual’s. No design meets them all yet: pick the institutional wish list in Focus on to see which come closest.'
  items:
  - title: Permissioned, with a notary
    text: 'In our work with institutions, permissionless privacy, open to anyone with no check on who enters, is treated as a reputational risk, and the concern travels with the service: a pool, network or named service that also serves permissionless privacy raises it even when your own deployment is permissioned, while software you deploy for yourself does not. Institutions want privacy among verified participants holding verified assets, with a notary (the institution, its regulator, or law enforcement on an order) who can decrypt in a way that leaves an on-chain notice: the auditability Project Epic names beside anonymity and confidentiality. Standard setters ask firms to manage anonymity-enhancing technology or stay away from it; US Treasury, for its part, told Congress in March 2026 that lawful users may use mixers for financial privacy.'
    sources:
    - - { title: 'FATF, Updated Guidance for a Risk-Based Approach to Virtual Assets and VASPs (28 October 2021), paragraph 174', url: 'https://www.fatf-gafi.org/en/publications/Fatfrecommendations/Updated-guidance-va-vasp.html', checked: '2026-10-26' }
    - - { title: 'J.P. Morgan Kinexys, Project Epic whitepaper (2024), What is on-chain privacy', url: 'https://www.jpmorgan.com/kinexys/documents/JPMC-Kinexys-Project-Epic-Whitepaper-2024.pdf', checked: '2026-10-26' }
    - - { title: 'US Treasury, GENIUS Act report to Congress on innovative methods (March 2026)', url: 'https://home.treasury.gov/system/files/246/GENIUS-Act-Illicit-Finance-Innovation-Congressional-Report-March-2026.pdf', checked: '2026-10-26' }
  - title: Any EVM ledger, any token
    text: 'One design for private, consortium and public ledgers under any consensus, carrying ERC-20 stablecoins and deposit tokens, permissioned securities (ERC-3643, ERC-7943), non-fungible tokens and vault shares, with the issuer’s freeze, forced transfer and recovery intact.'
  - title: Open, verifiable and built to last
    text: 'Open-source code on open standards, independently audited, with every private transfer verified by the chain rather than trusted to an operator’s signature, and nothing on the public record a quantum computer could decrypt later. Every component (prover, indexer, key service, relayer) is one you can run yourself, with no dependence on another network and no fee beyond gas, and it works with keys your custodian already manages. If the privacy layer fails, you should lose privacy, not funds.'
- title: Privacy across the whole workflow
  text: 'A confidential token does not make the workflow private. Check every layer a transaction touches.'
  items:
  - title: Getting in and out
    text: 'Deposits into and withdrawals from a shielded pool are public, and the address that pays gas links to the one that acts unless a relayer or an ERC-4337 paymaster pays instead.'
    sources:
    - { title: 'Privacy Pools docs, deposit and withdrawal (public deposits; direct versus relayed withdrawals)', url: 'https://docs.privacypools.com/protocol/withdrawal', checked: '2026-10-26' }
    - { title: 'ERC-4337, Account Abstraction (paymasters pay gas on the sender’s behalf; Final)', url: 'https://eips.ethereum.org/EIPS/eip-4337', checked: '2026-10-26' }
  - title: Data kept off chain
    text: 'Keeping data off chain (a private group, a validium or a notary’s ledger) hides it from the public, but the operator and whoever holds the data still see everything, and you rely on them to keep it available.'
    sources:
    - { title: 'ethereum.org, Validium (off-chain data remains visible to the operator)', url: 'https://ethereum.org/en/developers/docs/scaling/validium/', checked: '2026-10-26' }
  - title: Messages beside the ledger
    text: 'Payment messages travel off chain beside any confidential token, and ISO 20022 calls for structured identification of every party.'
    sources:
    - { title: 'CPMI, Harmonised ISO 20022 data requirements (October 2023)', url: 'https://www.bis.org/cpmi/publ/d218.pdf', checked: '2026-10-26' }
- title: The Ethereum roadmap for privacy
  text: 'Privacy is a stated goal of the Ethereum roadmap, built in three pillars: private writes, private reads and private proving. Dates are targets, not guarantees; items move a reading on this page only once they are live.'
  items:
  - title: Live today
    text: 'Stealth addresses and their registry (ERC-5564 and ERC-6538, both Final); account abstraction (ERC-4337, and EIP-7702 since Pectra in May 2025), which lets a third party pay gas so a private address need not be funded from a linked one; and the confidential-token interface ERC-7945, Final on 7 October 2026. ERC-7984, the other confidential-token interface, is a Draft.'
    more: { title: ethereum.org, the privacy roadmap, url: 'https://ethereum.org/en/roadmap/privacy/' }
    sources:
    - { title: 'ERC-5564, Stealth Addresses (Final, 28 May 2024)', url: 'https://eips.ethereum.org/EIPS/eip-5564', checked: '2026-10-26' }
    - { title: 'ERC-6538, Stealth Meta-Address Registry (Final, 25 June 2024)', url: 'https://eips.ethereum.org/EIPS/eip-6538', checked: '2026-10-26' }
    - { title: 'ERC-7945, Confidential Transactions Supported Token (Final, 7 October 2026)', url: 'https://eips.ethereum.org/EIPS/eip-7945', checked: '2026-10-26' }
    - { title: 'ERC-7984, Confidential Fungible Token (Draft)', url: 'https://eips.ethereum.org/EIPS/eip-7984', checked: '2026-10-26' }
    - { title: 'EIP-7702, Set Code for EOAs (Final; live since Pectra, 7 May 2025)', url: 'https://eips.ethereum.org/EIPS/eip-7702', checked: '2026-10-26' }
  - title: 'Coming next: private transfers without a relayer'
    text: 'Frame transactions (EIP-8141, scheduled for the Hegotá upgrade) let a transaction’s authorization be any program, including a zero-knowledge proof. Three drafts make that fast and reliable for privacy protocols: keyed nonces (EIP-8250) let many users spend through one shared sender at once, each spend’s nonce derived from its nullifier, instead of queuing behind a single nonce; recent roots (EIP-8272) let a spend prove against a privacy tree root from a recent slot, so nodes can admit it to the public mempool without a relayer; and EIP-8369 defines which of these spends inclusion lists (FOCIL, EIP-7805) must include, so a builder cannot leave them out. All four are Drafts, running together on a public Hegotá privacy testnet (chain 8141, the ethrex client) since 11 August 2026, where a transaction carrying a proof costs about 352,800 gas.'
    sources:
    - { title: 'EIP-8081, Hardfork Meta: Hegotá (scheduled, considered and declined items)', url: 'https://eips.ethereum.org/EIPS/eip-8081', checked: '2026-10-26' }
    - { title: 'EIP-8141, Frame Transaction (Draft)', url: 'https://eips.ethereum.org/EIPS/eip-8141', checked: '2026-10-26' }
    - { title: 'EIP-8250, Keyed Nonces for Frame Transactions (Draft, 16 April 2026)', url: 'https://eips.ethereum.org/EIPS/eip-8250', checked: '2026-10-26' }
    - { title: 'EIP-8272, Recent Roots for Frame Transactions (Draft, 15 May 2026)', url: 'https://eips.ethereum.org/EIPS/eip-8272', checked: '2026-10-26' }
    - { title: 'EIP-8369, VOPS Profiles for FOCIL Eligibility (Draft, Informational, 5 August 2026)', url: 'https://eips.ethereum.org/EIPS/eip-8369', checked: '2026-10-26' }
    - { title: 'EIP-7805, Fork-choice enforced Inclusion Lists (Draft)', url: 'https://eips.ethereum.org/EIPS/eip-7805', checked: '2026-10-26' }
    - { title: 'Hegotá privacy testnet (ethrex, chain 8141): faucet and changelog', url: 'https://faucet.privacy.ethrex.xyz/', checked: '2026-10-26' }
  - title: 'Built into the protocol: not yet'
    text: 'A protocol-level shielded pool (EIP-8182) was declined for Hegotá; an enshrined encrypted mempool (EIP-8105), which would hide transactions until their order is fixed, is a Draft.'
    sources:
    - { title: 'EIP-8081, Hardfork Meta: Hegotá (scheduled, considered and declined items)', url: 'https://eips.ethereum.org/EIPS/eip-8081', checked: '2026-10-26' }
    - { title: 'EIP-8105, Universal Enshrined Encrypted Mempool (Draft)', url: 'https://eips.ethereum.org/EIPS/eip-8105', checked: '2026-10-26' }
    - { title: 'Ethereum Foundation, EF Protocol: current and emerging priorities (7 September 2026)', url: 'https://blog.ethereum.org/2026/09/07/protocol-priorities', checked: '2026-10-26' }
  - title: Who is building it
    text: 'The Ethereum Foundation’s Privacy Stewards of Ethereum (formerly PSE) lead the work, including the Kohaku wallet toolkit (alpha) and a public benchmark of private-transfer protocols.'
    more: { title: PSE, private transfers benchmark, url: 'https://private-transfers.pse.dev/' }
    sources:
    - { title: 'PSE, Roadmap: 2025 and beyond (Privacy Stewards of Ethereum)', url: 'https://pse.dev/blog/pse-roadmap-2025', checked: '2026-10-26' }
    - { title: 'Ethereum Foundation, The EF’s commitment to privacy (8 October 2025)', url: 'https://blog.ethereum.org/2025/10/08/privacy-commitment', checked: '2026-10-26' }
    - { title: 'ethereum/kohaku repository (alpha, unaudited)', url: 'https://github.com/ethereum/kohaku', checked: '2026-10-26' }
    - { title: 'Vitalik Buterin, A maximally simple L1 privacy roadmap (11 April 2025)', url: 'https://ethereum-magicians.org/t/a-maximally-simple-l1-privacy-roadmap/23459', checked: '2026-10-26' }
- title: Confidentiality that has to last
  text: 'Ledger data is permanent, so ask how long each secret must stay secret, and what a quantum computer would expose.'
  items:
  - title: What lasts and what does not
    text: 'Fully homomorphic encryption is built on lattices, believed safe against quantum attack, and hash-based STARK proofs are too. Pairing-based SNARKs are not: a quantum computer could forge proofs, though a stored proof does not reveal its secret inputs. The notes many shielded pools encrypt on chain with elliptic-curve keys could be decrypted later: harvest now, decrypt later. A design that keeps only salted hashes or state roots on chain leaves nothing public to decrypt, though its signatures and the channels carrying the private data stay classical.'
    more: { title: Quantum, where it bites a ledger, url: '../quantum/ledger/' }
    sources:
    - { title: 'Zama TFHE-rs, security and cryptography (LWE, quantum-resistant)', url: 'https://docs.zama.org/tfhe-rs/get-started/security-and-cryptography', checked: '2026-10-26' }
    - { title: 'ethereum.org, Quantum resistance (SNARKs, KZG and STARKs)', url: 'https://ethereum.org/en/roadmap/future-proofing/quantum-resistance/', checked: '2026-10-26' }
    - { title: 'Zcash ZIP 2005, quantum recoverability (balance versus privacy against a quantum adversary)', url: 'https://zips.z.cash/zip-2005', checked: '2026-10-26' }
    - { title: 'NIST IR 8547 initial public draft (harvest now, decrypt later; 2030 and 2035)', url: 'https://nvlpubs.nist.gov/nistpubs/ir/2024/NIST.IR.8547.ipd.pdf', checked: '2026-10-26' }
- title: What regulators have said
  text: 'Dates and holdings only. Informational, not legal advice.'
  items:
  - title: Standard setters and the EU
    text: 'The FATF’s updated guidance of 28 October 2021 says virtual asset service providers must be able to manage the risks of anonymity-enhancing technologies, including mixers and privacy wallets, or should not engage with them. The EU anti-money-laundering regulation bars anonymous accounts and accounts allowing anonymity-enhancing coins from 10 July 2027.'
    sources:
    - { title: 'FATF, Updated Guidance for a Risk-Based Approach to Virtual Assets and VASPs (28 October 2021), paragraph 174', url: 'https://www.fatf-gafi.org/en/publications/Fatfrecommendations/Updated-guidance-va-vasp.html', checked: '2026-10-26' }
    - { title: 'Regulation (EU) 2024/1624, Article 79 (to verify against the Official Journal)', url: 'https://eur-lex.europa.eu/eli/reg/2024/1624/oj/eng', checked: '2026-10-26' }
  - title: United States
    text: 'OFAC designated Tornado Cash on 8 August 2022. On 26 November 2024 the Fifth Circuit held that its immutable smart contracts are not property under IEEPA, and Treasury removed the designation on 21 March 2025. Treasury’s March 2026 report to Congress under the GENIUS Act says lawful users may use mixers for financial privacy on public blockchains.'
    sources:
    - { title: 'US Treasury, Tornado Cash designation (8 August 2022)', url: 'https://home.treasury.gov/news/press-releases/jy0916', checked: '2026-10-26' }
    - { title: 'Fifth Circuit, Van Loon v. Department of the Treasury, No. 23-50669 (26 November 2024)', url: 'https://www.ca5.uscourts.gov/opinions/pub/23/23-50669-CV0.pdf', checked: '2026-10-26' }
    - { title: 'US Treasury, Tornado Cash delisting (21 March 2025)', url: 'https://home.treasury.gov/news/press-releases/sb0057', checked: '2026-10-26' }
    - { title: 'US Treasury, GENIUS Act report to Congress on innovative methods (March 2026)', url: 'https://home.treasury.gov/system/files/246/GENIUS-Act-Illicit-Finance-Innovation-Congressional-Report-March-2026.pdf', checked: '2026-10-26' }
  - title: Central banks and supervisors
    text: 'The BIS Project Agorá prototype (report of 27 May 2026) used Hyperledger Paladin for token-level and workflow-level privacy. The HKMA’s e-HKD pilot tested Zeto and Anonymous Zether on public chains (October 2025). The FCA and the Bank of England wrote in May 2026 that “technological advances mean that public chains can now also maintain privacy standards”.'
    sources:
    - { title: 'BIS, Project Agorá report (27 May 2026; Paladin Noto and Pente)', url: 'https://www.bis.org/publications/project-agora-shared-programmable-platform-wholesale-cross-border-payments.pdf', checked: '2026-10-26' }
    - { title: 'HKMA, e-HKD Pilot Programme Phase 2 report (October 2025)', url: 'https://www.hkma.gov.hk/media/eng/doc/key-functions/financial-infrastructure/e-HKD_Pilot_Programme_Phase_2_Report.pdf', checked: '2026-10-26' }
    - { title: 'FCA and Bank of England, The future of tokenisation, call for input (May 2026), paragraph 3.18', url: 'https://www.fca.org.uk/publication/call-for-input/future-tokenisation-joint-vision-authorities-uk-wholesale-financial-markets.pdf', checked: '2026-10-26' }
