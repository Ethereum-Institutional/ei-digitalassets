- id: payy
  name: Payy
  circle: who
  x: 0
  y: 0
  eth: true
  pse: payy
  desc: 'A stablecoin payments network (Polybase Labs) with a non-custodial wallet and a Visa card: a UTXO rollup hiding sender, receiver and amount with client-made Noir proofs. Its Polygon validium closed on 12 September 2025 and its Ethereum mainnet rollup went live on 17 February 2026 (USDC only, about 3.8 million at peak). On 24 September 2026 forged proofs drained about USD 1.92 million through a Barretenberg verifier soundness bug; Payy paused deposits, withdrawals, transfers and card payments and opened a claims window. Its EVM Layer 2 (chain ID 7298) is an alpha testnet whose endpoints did not answer on 27 October 2026.'
  sources:
  - { title: 'Payy docs, Get Started (testnet alpha)', url: 'https://docs.payy.network/build-on-payy/get-started.md', checked: '2026-10-27' }
