- id: eerc
  name: 'AvaCloud eERC'
  circle: amount
  x: 190
  y: 395
  eth: true
  pse: eerc20
  status: mainnet
  since: '2025-05-28'
  facts:
    verify: { in: ['yes'], note: 'Contracts verify a Groth16 proof for every mint, transfer and withdrawal.', sources: [{ title: 'ava-labs/EncryptedERC repository', url: 'https://github.com/ava-labs/EncryptedERC', checked: '2026-10-26' }] }
    fees: { in: [none], note: 'No protocol fee; royalty-free license, but production use is limited to Avalanche, so gas is paid in AVAX.', sources: [{ title: 'ava-labs/EncryptedERC, Ecosystem License 1.1', url: 'https://github.com/ava-labs/EncryptedERC/blob/main/LICENSE.md', checked: '2026-10-26' }] }
    pet: { in: [he, snark], note: 'Additively homomorphic ElGamal on the BabyJubJub curve, Poseidon-encrypted amounts, Groth16 proofs (Circom).' }
    proving: { in: [device], note: 'Encryption, decryption and proofs are made in the user’s browser or app.' }
    pq: { in: ['no'], note: 'Elliptic-curve ElGamal and BN254 Groth16: amounts stored on chain could be decrypted later by a quantum computer.' }
    operator: { in: [self], note: 'No off-chain service in the transfer path; AvaCloud offers hosted deployment as an option.' }
    external: { in: ['no'], note: 'Only the host chain.' }
    chains: { in: [evm], note: 'Avalanche C-Chain and Avalanche L1s; the license limits production use to the Avalanche platform.' }
    keys: { in: [existing], part: [new], note: 'A BabyJubJub key is derived from a wallet signature and registered on chain once (about 322,000 gas).' }
    wallet: { in: [app], note: 'Balances read through the eERC SDK or an app built on it; Taurus notes limited wallet support (January 2026).' }
    indexing: { in: [none], note: 'Encrypted balance stored per account in the contract; no scanning.' }
    tokens: { in: [erc20], note: 'Converter mode wraps any ERC-20; standalone mode mints a new private token. Not ERC-7984.' }
    hidden: { in: [public, participants], note: 'No operator sees data, but the auditor named by the owner can decrypt every amount and balance.' }
    controls: { in: [mint], note: 'Owner mints in standalone mode and can blocklist an underlying token in converter mode; no account freeze, pause or forced transfer.' }
    permission: { in: [selective], note: 'Anyone may register a key and transact; no allowlist in the contracts.' }
    disclosure: { in: [auditor], part: [viewkey], note: 'Every mint, transfer and burn carries a copy of the amount encrypted to the auditor; a holder can also share their key.' }
    visibility: { in: [notice], note: 'No operator sees data, but the auditor named by the owner can decrypt every amount and balance. The auditor, a single rotatable key set by the owner (issuer, regulator or auditor), decrypts all amounts without the holder. AuditorChanged is emitted on rotation and each transfer event names the auditor address; no timelock.' }
    checks: { in: [none], note: 'Anyone may register a key and transact; no allowlist in the contracts.' }
    association: { in: [shared] }
    upgrade: { in: [immutable], note: 'No proxy in the reference contracts; the owner keeps admin functions (auditor, mint, token blocklist).' }
    exit: { in: ['yes'], note: 'Holders withdraw with their own proof; no operator involved.' }
    censorship: { in: ['no'], note: 'Only the chain orders transactions; an owner can block deposits of a given token, not an account.' }
    failure: { in: [privacy, funds], note: 'A circuit or contract bug can lose funds (fixes of 31 August 2026 closed one converter drain path); a lost auditor key exposes all amounts.' }
    value: { in: [lt10m], note: 'About 40 C-Chain deployments with small test-sized balances seen on Snowtrace; no aggregate published (26 October 2026).' }
    institutions: { in: [none], part: [public], note: 'Kinexys Project EPIC (November 2024) tested AvaCloud Privacy Solutions (Avacy and DHE), eERC’s predecessor; no eERC deployment by a regulated institution found.' }
    audits: { in: ['yes'], note: 'Hexens: contracts and Gnark circuits (January 2025), Circom circuits (April 2025); later review fixes merged 31 August 2026.' }
    incidents: { in: [none], note: 'No exploit found; the 31 August 2026 commit fixed an unconstrained proof field, zero-randomness disclosure and a key overwrite that could lock funds.' }
    license: { in: [available], note: 'Ava Labs Ecosystem License 1.1: source-available, use limited to the Avalanche platform or non-production research.' }
    steward: { in: [company], note: 'Ava Labs (AvaCloud); originated with EtraPay, acquired November 2024.' }
    gas: { in: [gt500k], note: 'About 947,000 gas per private transfer; withdraw about 796,000, deposit about 565,000 (repository gas report, Avalanche C-Chain).' }
    latency: { in: [minute], note: 'Client-side Groth16 proof plus about two-second C-Chain finality; proving time not published.' }
    anonymity: { in: ['na'] }
  desc: 'Hides balances and transfer amounts with ElGamal encryption and Groth16 proofs made on your device; sender, receiver, token and converter deposit amounts stay public. A built-in auditor key, named by the deployer, decrypts every amount. You trust only the contracts, the circuits’ trusted setup and the chain; anyone can withdraw with their own proof. The owner keeps the auditor, minting in standalone mode and a token blocklist, but no freeze. Runs on Avalanche C-Chain and L1s under Ava Labs’ Ecosystem License; on C-Chain since May 2025, small deployments only, with security fixes in August 2026. It needs no committee, enclave or key service.'
  sources:
