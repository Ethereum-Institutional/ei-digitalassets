- id: nullmask
  name: 'Nullmask'
  circle: who
  x: 360
  y: 350
  eth: true
  pse: nullmask
  status: mainnet
  since: '2026-10-01'
  facts:
    verify: { in: ['yes'], note: 'An on-chain verifier checks an UltraHonk proof for every shielded action; one admin key can upgrade it.', sources: [{ title: 'PSE evaluation, Nullmask (Verifiability)', url: 'https://github.com/ethereum/private-transfers-benchmarks/blob/main/project-evaluations/src/data/evaluations/nullmask.json', checked: '2026-10-26' }] }
    fees: { in: [protocol], note: '0.5% on deposits and on withdrawals, 0.2% on bridging; private transfers and swaps pay no Nullmask fee.', sources: [{ title: 'Nullmask docs, fees', url: 'https://nullmask.io/docs/fees', checked: '2026-10-26' }] }
    pet: { in: [snark], note: 'UltraHonk proofs over BN254 with Poseidon2; privacy from the operator rests on access control only, since its servers hold your keys.' }
    proving: { in: [server], note: 'Proofs are made by Nullmask’s RPC proxy servers by default; a self-hosted device mode was described in earlier docs but is not the default.' }
    pq: { in: ['no'], note: 'BN254, Grumpkin and secp256k1 throughout; none is quantum-resistant.' }
    operator: { in: [company], note: 'Nullmask runs the RPC proxy, prover, guard (deposit screening) and six relayers.' }
    external: { in: ['no'], part: ['yes'], note: 'Needs Nullmask’s own off-chain services, not another chain; the optional bridge uses NEAR Intents. PSE reads this as yes, permissioned.' }
    chains: { in: [mainnet, l2, evm], note: 'Ethereum mainnet (1 Oct 2026), Base (7 Oct), BNB Chain (12 Oct), Robinhood Chain per its 19 Oct press release; Solana planned.' }
    keys: { in: [existing], note: 'Viewing and nullifying keys are derived from one signature of your wallet; every action is signed by that wallet.' }
    wallet: { in: [any], note: 'Works with MetaMask and other EVM wallets, including hardware wallets, through a personal RPC link.' }
    indexing: { in: [service], note: 'Nullmask’s servers scan and trial-decrypt notes and keep your balance.' }
    tokens: { in: [eth, erc20], note: 'ETH and USDT on Ethereum mainnet, ETH and USDC on Base, BNB and USDT on BNB Chain; other tokens are refused.' }
    hidden: { in: [public, participants], note: 'Hidden from chain observers only; the docs say Nullmask can see your balance and history.' }
    controls: { in: [none], note: 'No token-issuer control inside the pool; the operator can pause the pool and withdrawals and refuse deposits.' }
    permission: { in: [selective], note: 'Each depositor checked against OFAC, EU and UK lists, the Chainalysis oracle, issuer blacklists and AMLBot scores; no identity check.' }
    disclosure: { in: [grant], part: [viewkey], note: 'The operator already holds every user’s viewing keys; a user can also share the keys with an auditor.' }
    visibility: { in: [notary, operator], note: 'Hidden from chain observers only; the docs say Nullmask can see your balance and history. Nullmask answers law-enforcement and regulator requests with legal process and provides the information available to it. No timelock or on-chain notice for operator access to user data.' }
    checks: { in: [builtin], note: 'Each depositor checked against OFAC, EU and UK lists, the Chainalysis oracle, issuer blacklists and AMLBot scores; no identity check.' }
    association: { in: [shared] }
    upgrade: { in: [company], note: 'UUPS proxy; the admin is a single externally owned account; upgraded 7 October 2026. Terms: upgrades, pauses and fee changes without notice.' }
    exit: { in: ['yes'], note: 'A fee-less, self-submitted withdrawal is allowed by the contract, unless the admin pauses withdrawals or upgrades the pool.' }
    censorship: { in: ['yes'], note: 'The guard can refuse any deposit; withdrawal recipients are also checked; the admin can pause.' }
    failure: { in: [funds, privacy], note: 'Funds sit in one upgradeable pool; a breach of Nullmask’s servers would expose every user’s history.' }
    value: { in: [lt10m], note: 'About USD 224,000 across five chains (DefiLlama, 26 Oct 2026); Ethereum mainnet pool held 21.4 ETH and 2,428 USDT.' }
    institutions: { in: [none], note: 'None found.' }
    audits: { in: ['no'], note: 'Terms of Use: not independently audited; compliance page says a report will be published when complete (13 Oct 2026).' }
    incidents: { in: [none], note: 'None found as of 26 Oct 2026.' }
    license: { in: [proprietary], part: [open], note: 'Contracts verified on Etherscan with MIT headers; proxy, prover and circuits not published.' }
    steward: { in: [company], note: 'An operating company whose legal details are given on request (Terms 1.1); MASK token trades on Solana.' }
    gas: { in: [gt500k], note: 'Measured: shielded withdrawal median 4.47 million gas on Ethereum mainnet (52 transactions, 26 Oct 2026); transfers use the same verifier type.' }
    latency: { in: [minute], part: [longer], note: 'Fast withdrawal in about a minute; deposits are credited within minutes, some after up to 24 hours of checks.' }
    anonymity: { in: [medium], note: 'Registered receiving keys on 26 Oct 2026: 4,423 on Ethereum mainnet, 3,125 on Base, 4,866 on BNB Chain.' }
  desc: 'A shielded pool behind a custom RPC network added to the wallet you already use: inside the pool, the sender, recipient and amount of a transfer are hidden from the public, while deposits, withdrawals and swaps stay visible. Nothing is hidden from the operator: Nullmask’s servers hold your viewing keys, make the proofs and answer legal process. Every deposit is screened against sanctions lists and AMLBot risk scores, and one admin key can upgrade and pause the pool. Live on Ethereum mainnet since 1 October 2026, then Base, BNB Chain and Robinhood Chain; not yet audited. Only your own wallet’s signature can spend.'
  sources:
