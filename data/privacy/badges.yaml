  since: '2025-11-04'
  facts:
    verify: { in: ['yes'], note: 'The aggregator verifies Groth16 proofs for shielding, aggregation and unshielding before the vault moves funds.', sources: [{ title: 'Curvy docs, privacy aggregator', url: 'https://docs.curvy.box/for-the-curious/building-blocks/privacy-aggregator.html', checked: '2026-10-26' }, { title: 'PSE evaluation, Curvy (Verifiability)', url: 'https://github.com/ethereum/private-transfers-benchmarks/blob/main/project-evaluations/src/data/evaluations/curvy.json', checked: '2026-10-26' }] }
    fees: { in: [protocol], note: '0.1% to shield, 0.1% per aggregation (private transfer), 0.2% to unshield; relayer gas paid from a note in the token.', sources: [{ title: 'Curvy docs, FAQ (how Curvy makes money)', url: 'https://docs.curvy.box/faq.html', checked: '2026-10-26' }, { title: 'Curvy docs, privacy aggregator (fees)', url: 'https://docs.curvy.box/for-the-curious/building-blocks/privacy-aggregator.html', checked: '2026-10-26' }] }
    pet: { in: [snark], note: 'Groth16 circuits (Circom) over Baby Jubjub notes, plus secp256k1 stealth addresses; a trusted-setup ceremony tool appeared in October 2026.' }
    proving: { in: [device], part: [server], note: 'Current docs: aggregation and withdrawal proofs made by the SDK on your device; Curvy''s batch prover commits new notes.' }
    pq: { in: ['no'], note: 'secp256k1 keys, Baby Jubjub and pairing-based Groth16; no post-quantum primitive in the live protocol.' }
    operator: { in: [company], note: 'Curvy runs the portal broadcaster (shielding), relayer, batch prover, notes registry and ENS resolver.' }
    external: { in: ['yes'], note: 'Deposits on other chains are bridged to Arbitrum through LiFi; entry depends on Global Ledger scores.' }
    chains: { in: [l2], part: [mainnet, evm], note: 'Pool on Arbitrum One; portals on Ethereum mainnet, Base, Optimism, Linea, Polygon, BNB Chain, Gnosis Chain and Tempo; a Solana portal.' }
    keys: { in: [new], note: 'A Curvy root from a passkey or a wallet signature plus password derives viewing, spending and Baby Jubjub keys.' }
    wallet: { in: [app], part: [any], note: 'Curvy app and SDKs; any wallet can pay a Curvy stealth address; payments SDK for merchants and x402 agents.' }
    indexing: { in: [client], note: 'The SDK syncs every note from the notes registry and trial-decrypts them to find yours.' }
    tokens: { in: [eth, erc20], note: 'ETH, WETH, USDC, USDT, WBTC and UNI; tokens are registered by the operator.' }
    hidden: { in: [public, participants], part: [operator], note: 'Current docs say no service sees plaintext; the PSE evaluation (June 2026) found Curvy''s prover saw every transaction''s inputs.' }
    controls: { in: [none], part: [freeze], note: 'No per-holder issuer control inside the pool; an issuer blacklisting the vault would lock every holder of that token.' }
    permission: { in: [selective], part: [permissioned], note: 'Global Ledger scores decide whether a portal is deployed; KYC only in custom enterprise deployments; retroactive tainting not yet live.' }
    disclosure: { in: [viewkey], note: 'The holder can share the viewing private key; it is fixed at sign-up and cannot be scoped or revoked.' }
    visibility: { in: [na], part: [parties], note: 'Current docs say no service sees plaintext; the PSE evaluation (June 2026) found Curvy''s prover saw every transaction''s inputs. No route to decrypt without the holder, under the client-side proving the docs describe. No notary route to safeguard.' }
    checks: { in: [builtin], note: 'Global Ledger scores decide whether a portal is deployed; KYC only in custom enterprise deployments; retroactive tainting not yet live.' }
    association: { in: [shared] }
    upgrade: { in: [company], note: 'UUPS proxies; the upgrade role sits with a 4-of-6 Safe on Arbitrum One, with no timelock found.' }
    exit: { in: ['na'], part: ['yes'], note: 'Anyone may submit a withdrawal proof for committed notes; new deposits need Curvy''s broadcaster and batch prover; stuck portal funds have a recovery path.' }
    censorship: { in: ['yes'], note: 'The broadcaster can refuse to deploy a portal, so a flagged sender cannot shield.' }
    failure: { in: [funds], part: [privacy], note: 'The vault holds funds behind upgradeable proxies; a leaked viewing key loses privacy only.' }
    value: { in: [lt10m], note: 'About USD 56,000 in the Arbitrum One vaults (version 2 USD 55,000, version 1 USD 600), read from token balances on 26 October 2026.' }
    institutions: { in: [none], note: 'No regulated institution found; enterprise deployments with KYC are offered.' }
    audits: { in: ['yes'], note: 'Ethernal, 23 March to 15 April 2026: version 1 contracts, 22 findings, none critical or high, all fixed.' }
    incidents: { in: [none], note: 'No exploit found.' }
    license: { in: [open], part: [available], note: 'Core contracts Apache-2.0, verifiers GPL-3.0, SDK MIT; the verifier interface is BUSL-1.1.' }
    steward: { in: [company], note: 'Curvy, a company.' }
    gas: { in: [gt500k], note: 'On Arbitrum One, 26 October 2026: about 629,000 gas per private transfer (aggregation), plus about 280,000 per five-note commitment batch.' }
    latency: { in: [minute], part: [longer], note: 'Transfers inside the pool settle in seconds; one shielding the PSE tested took a day for compliance checks.' }
    anonymity: { in: [medium], note: '3,505 notes in the version 2 pool on Arbitrum One, 26 October 2026, across all tokens and including change notes.' }
  desc: 'Stealth addresses that feed a shielded pool on Arbitrum One: transfers inside it hide sender, recipient, amount and token, while shielding shows the sender and amount and unshielding the recipient and amount. Curvy runs the portal broadcaster, relayer and batch prover and screens entries with Global Ledger; a 4-of-6 Safe can upgrade the contracts without a timelock. An issuer can only freeze the whole vault. Deposits arrive from Ethereum mainnet and seven other EVM chains through LiFi. Live since November 2025, version 2 since July 2026, about USD 56,000 held. Anyone can be paid privately from an ordinary wallet.'
