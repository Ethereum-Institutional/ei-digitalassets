- id: noto
  name: Paladin Noto
  circle: who
  x: 392
  y: 282
  eth: true
  status: mainnet
  status_note: 'Generally available software (Paladin v1.0.0, 25 June 2026) that each institution deploys itself; no named production deployment found.'
  since: '2026-06-25'
  facts:
    verify: { in: ['no'], note: 'The contract accepts any transfer the notary signs; it does not check amounts or balances.', sources: [{ title: 'Paladin docs, Noto', url: 'https://lfdt-paladin.github.io/paladin/head/architecture/noto/', checked: '2026-10-26' }, { title: 'Besu docs, Privacy with Paladin (notary signature as proof of validity)', url: 'https://docs.besu-eth.org/private-networks/concepts/privacy-with-paladin', checked: '2026-10-26' }] }
    fees: { in: [none], note: 'Apache 2.0 and self-run; no protocol fee or token.', sources: [{ title: 'LFDT-Paladin/paladin (Apache 2.0)', url: 'https://github.com/LFDT-Paladin/paladin', checked: '2026-10-26' }] }
    pet: { in: [offchain], note: 'Notary pattern: salted hash commitments on chain, the notary checks signatures and value; no zero-knowledge proofs.' }
    proving: { in: [none], note: 'The notary’s EIP-712 signature is the proof of validity (Besu docs comparison).' }
    pq: { in: [hashes], note: 'Only salted hashes on chain, so nothing public to decrypt later (Grover only weakens hashes); no post-quantum algorithm: secp256k1 signatures and TLS between nodes are classical.' }
    operator: { in: [self], note: 'Each party runs a Paladin node; the notary is any Paladin identity, usually the issuer’s own node.' }
    external: { in: ['no'] }
    chains: { in: [anyevm, private], part: [mainnet, l2], note: 'Besu private networks in practice; docs cover Ethereum mainnet and Layer 2s, but no named public-chain deployment found.' }
    keys: { in: [existing], note: 'Ordinary secp256k1 keys held in the node’s keystore or an HSM; no separate privacy key.' }
    wallet: { in: [app], note: 'A Paladin node (state store, indexer, keystore) for each party; no consumer wallet support.' }
    indexing: { in: [client], note: 'Your own Paladin node indexes the base ledger and receives private states directly from the sender and notary.' }
    tokens: { in: ['na'], part: [erc20], note: 'Its own notarized UTXO token, issued natively; a public ERC-20 leg can settle atomically against it through Atom.' }
    hidden: { in: [public, participants], note: 'Holders see only their own states; the notary sees every balance and transfer by design.' }
    controls: { in: [mint, freeze, pause, forced], note: 'Hooks mode: transferFrom and burnFrom let an authorized sender move or burn a holder’s tokens without the holder’s signature, as the hooks contract allows (disabled in basic mode). Freeze and pause work by the notary refusing to sign.', sources: [{ title: 'Paladin source, Noto transferFrom: the sender signs, the hooks contract decides (handler_transfer_common.go)', url: 'https://github.com/LFDT-Paladin/paladin/blob/main/domains/noto/internal/noto/handler_transfer_common.go', checked: '2026-10-26' }, { title: 'Paladin docs, Noto notary modes (transferFrom and burnFrom in hooks mode only)', url: 'https://lfdt-paladin.github.io/paladin/head/architecture/noto/', checked: '2026-10-26' }] }
    permission: { in: [permissioned], note: 'Set by the notary; hooks mode can enforce an allow list or KYC in a private Pente contract.' }
    disclosure: { in: [grant], note: 'The notary holds the full ledger and can share it; a hooks privacy group can include an observer.' }
    visibility: { in: [notary, operator], note: 'Holders see only their own states; the notary sees every balance and transfer by design. The issuer as notary sees everything; designated auditors can be given the private data (BIS Agorá report). The notary’s view is permanent and leaves no on-chain trace.' }
    checks: { in: [capable], note: 'Set by the notary; hooks mode can enforce an allow list or KYC in a private Pente contract.' }
    association: { in: ['no'], note: 'Paladin is software each institution deploys for itself; Zeto’s open variants are a technology choice, not a service, so a permissioned deployment is not associated.' }
    upgrade: { in: [operator], note: 'UUPS proxy; upgrades are authorized by the notary of each deployment.' }
    exit: { in: ['no'], note: 'Only the notary can submit transfers; a delegated lock spender can settle a prepared lock without it.' }
    censorship: { in: ['yes'], note: 'The notary can decline any transfer; its downtime halts transfers.' }
    failure: { in: [privacy, funds], note: 'A compromised notary loses both: the contract does not check amounts, only the notary’s signature.' }
    value: { in: [unseen], note: 'Deployments are on private or permissioned networks; no public pool to read.' }
    institutions: { in: [public], note: 'BIS Project Agorá used Paladin (tokenized reserves and deposits): prototype report May 2026, then live trials with real money from July 2026 (22 institutions, five central banks, 30 transactions, about CHF 800,000); production needs further phases. No named production deployment found.', sources: [{ title: 'Ledger Insights for LF Decentralized Trust, Institutional adoption of LF Decentralized Trust technologies (2026), Project Agorá and Paladin (pp. 11, 12, 22)', url: 'https://www.lfdecentralizedtrust.org/hubfs/LFDT%20Institutional%20Adoption%20-%20Ledger%20Insights%20Report%202026.pdf', checked: '2026-10-26' }] }
    audits: { in: ['no'], note: 'No public security audit of Paladin or Noto found, 26 October 2026.' }
    incidents: { in: [none] }
    license: { in: [open], note: 'Apache 2.0.' }
    steward: { in: [foundation], note: 'LF Decentralized Trust project since 11 November 2025; maintainers are at Kaleido.' }
    gas: { in: [unknown], note: 'No gas figure published by Paladin, the BIS or PSE; Noto is not in the PSE benchmark.' }
    latency: { in: [block], note: '"Seconds" per the Besu docs: one notary-submitted base-ledger transaction.' }
    anonymity: { in: [small], note: 'Per deployment: the holders of one token on one network (Agorá: eight central banks and over 40 institutions).' }
  desc: 'Notarized tokens in Hyperledger Paladin: the chain records only salted hashes of each holding, so the public sees neither holders nor amounts. The notary, usually the issuer, sees and approves every transfer, so you trust it for privacy and integrity, and the institution can run every part itself. Mint, burn, lock and, with hooks, forced transfer and blocklists survive. Any EVM chain, including Ethereum mainnet and Besu; locks settle atomic DvP. Used in the BIS Project Agorá prototype (May 2026).'
  sources:
  - { title: 'Paladin docs, Noto', url: 'https://lfdt-paladin.github.io/paladin/head/architecture/noto/', checked: '2026-10-26' }
  - { title: 'Paladin docs, running with a public L1 or L2', url: 'https://lfdt-paladin.github.io/paladin/head/administration/l1-and-l2-chains/', checked: '2026-10-26' }
