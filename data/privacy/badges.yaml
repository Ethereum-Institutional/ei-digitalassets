- id: coti
  name: 'COTI'
  circle: amount
  x: 190
  y: 430
  eth: true
  pse: coti
  status: mainnet
  since: '2025-03-26'
  facts:
    verify: { in: ['no'], note: 'Results of the garbled-circuit MPC are trusted from the executors; no proof that encrypted operations were computed correctly.', sources: [{ title: 'PSE evaluation, COTI (Verifiability)', url: 'https://github.com/ethereum/private-transfers-benchmarks/blob/main/project-evaluations/src/data/evaluations/coti.json', checked: '2026-10-26' }, { title: 'COTI docs, COTI architecture (sequencer, executors, garbler)', url: 'https://docs.coti.io/coti-documentation/how-coti-works/introduction/coti-architecture', checked: '2026-10-26' }] }
    fees: { in: [token], note: 'Gas on COTI V2 is paid in the COTI token; no separate portal fee found.', sources: [{ title: 'COTI docs, Mainnet (native currency COTI)', url: 'https://docs.coti.io/coti-documentation/networks/mainnet', checked: '2026-10-26' }, { title: 'COTI docs, Privacy Portal', url: 'https://docs.coti.io/coti-documentation/coti-privacy-portal', checked: '2026-10-26' }] }
    pet: { in: [mpc], note: 'Garbled circuits evaluated by two executors in MPC; AES-encrypted ciphertexts on chain. Secure enclaves only planned as an extra layer.' }
    proving: { in: [none], note: 'No proofs; the device only encrypts inputs with the user’s AES key.' }
    pq: { in: ['no'], note: 'Each user’s AES key is delivered on chain under RSA, which Shor breaks; a post-quantum migration path is described, not deployed.' }
    operator: { in: [company], note: 'One sequencer orders all blocks; garbler and two executors not named, run by COTI as far as documented. Licensed full nodes only validate.' }
    external: { in: ['no'], part: ['yes'], note: 'Own stack end to end; bridged assets (USDC.e, WETH, WBTC) depend on the bridge that brings them in.' }
    chains: { in: [own], part: [anyevm], note: 'COTI V2 mainnet (chain 2632500). Privacy on Demand for other EVM host chains is on testnets only (Sepolia, Fuji).' }
    keys: { in: [new], note: 'A separate AES key per user, issued by the network at onboarding; the existing wallet key still signs every transaction.' }
    wallet: { in: [app], note: 'MetaMask with the COTI Snap holds the AES key and shows private balances; the Privacy Portal web app converts tokens.' }
    indexing: { in: [none], note: 'One encrypted balance per account; a direct lookup, no scanning.' }
    tokens: { in: [erc20, nft, any], note: 'PrivateERC20 and PrivateERC721; portal tokens p.COTI, p.WETH, p.WBTC, p.USDT, p.USDC.e, p.WADA, p.gCOTI.' }
    hidden: { in: [public, participants], part: [operator], note: 'The network key is split across nodes; the executors could decrypt only by colluding. The AES key is derived by the network.' }
    controls: { in: [mint], note: 'Reference PrivateERC20 has MINTER_ROLE (bridges) and an admin switch for public-amount calls; no freeze, pause or forced transfer.' }
    permission: { in: [selective], note: 'Anyone may onboard and transfer; no allowlist, screening or attestation in the transaction path.' }
    disclosure: { in: [viewkey], note: 'The holder can share the AES key or point their balance ciphertext at another address (setAccountEncryptionAddress); no auditor key.' }
    visibility: { in: [na], part: [parties], note: 'The network key is split across nodes; the executors could decrypt only by colluding. The AES key is derived by the network. No issuer, regulator or law-enforcement route; only colluding executors could read values. No third-party decryption route, so no safeguard applies.' }
    checks: { in: [none], note: 'Anyone may onboard and transfer; no allowlist, screening or attestation in the transaction path.' }
    association: { in: [shared] }
    upgrade: { in: [company], note: 'Chain changes ship as scheduled hard forks (Hydrogen 19 October 2025, Helium 11 January 2026); token admin is the deployer.' }
    exit: { in: ['no'], note: 'Docs claim withdrawal from L1 without permission, but no Ethereum mainnet rollup contract or forced exit is documented.' }
    censorship: { in: ['yes'], note: 'A single sequencer can drop or delay transactions; full nodes cannot force inclusion.' }
    failure: { in: [privacy, funds], note: 'Executor collusion exposes values; balances are computed by the executors, so a faulty MPC result moves funds.' }
    value: { in: [lt10m], note: 'COTI chain TVL about USD 80,000 on DefiLlama, 26 October 2026; private-token supplies are encrypted.' }
    institutions: { in: [none], note: 'No regulated institution found using it in production or public.' }
    audits: { in: ['yes'], note: 'Hacken (MPC, March 2025; geth, August 2025); Sayfer (onboarding, Private ERC20 and Snap, March 2026; Privacy Portal, May 2026).' }
    incidents: { in: [none], note: 'None found (26 October 2026).' }
    license: { in: [proprietary], part: [open], note: 'Contracts and SDKs Apache 2.0; the node, garbler and executor ship as Docker images without published source.' }
    steward: { in: [company], part: [foundation], note: 'COTI builds and runs the network; the COTI Foundation runs grants and the V1 migration.' }
    gas: { in: [gt500k], note: '884,893 gas for one private USDC.e transfer on COTI mainnet, 18 October 2026 (our reading); approvals about 458,000.' }
    latency: { in: [block], note: 'About five-second blocks on COTI; no Ethereum mainnet settlement step documented.' }
    anonymity: { in: ['na'] }
  desc: 'Encrypts balances, transfer amounts and any contract value marked private, computed with garbled circuits; sender, receiver, token contract and portal-in amounts stay public. Other holders see ciphertext. You trust COTI’s sequencer and its two MPC executors not to collude. Private tokens keep a minter role but no freeze or pause. Runs on COTI V2, its own EVM chain: called a Layer 2, but no settlement on Ethereum mainnet is documented. Mainnet since 26 March 2025, private USDT and USDC since 2026, no incidents found. Plain Solidity with private types, and fast.'
  sources:
  - { title: 'COTI docs, Mainnet (chain ID 2632500; "Layer 2 over Ethereum"; Hydrogen and Helium hard forks)', url: 'https://docs.coti.io/coti-documentation/networks/mainnet', checked: '2026-10-26' }
