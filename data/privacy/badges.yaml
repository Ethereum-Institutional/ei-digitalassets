# ---- All three: parties, amounts and logic ----
- id: pente
  name: Paladin Pente
  circle: logic
  x: 450
  y: 458
  eth: true
  status: mainnet
  status_note: 'Generally available software (Paladin v1.0.0, 25 June 2026) that each institution deploys itself; no named production deployment found.'
  since: '2026-06-25'
  facts:
    verify: { in: ['no'], note: 'Members re-execute off chain; the contract checks only the threshold of member endorsement signatures over state hashes.', sources: [{ title: 'Paladin docs, Pente', url: 'https://lfdt-paladin.github.io/paladin/head/architecture/pente/', checked: '2026-10-26' }, { title: 'LFDT-Paladin/paladin, PentePrivacyGroup.sol (endorsement threshold)', url: 'https://github.com/LFDT-Paladin/paladin/tree/main/solidity/contracts/domains/pente', checked: '2026-10-26' }] }
    fees: { in: [none], note: 'Apache 2.0 and self-run; no protocol fee or token.', sources: [{ title: 'LFDT-Paladin/paladin (Apache 2.0)', url: 'https://github.com/LFDT-Paladin/paladin', checked: '2026-10-26' }] }
    pet: { in: [offchain], note: 'Privacy group: off-chain execution among members, on-chain salted state hashes and EIP-712 endorsements; no zero-knowledge proofs.' }
    proving: { in: [none], note: 'Validity comes from every member re-executing and endorsing (Besu docs).' }
    pq: { in: [hashes], note: 'Only salted state hashes on chain, so nothing public to decrypt later; no post-quantum algorithm: secp256k1 endorsements and TLS between nodes are classical.' }
    operator: { in: [self], note: 'Each member runs a Paladin node; no third party.' }
    external: { in: ['no'] }
    chains: { in: [anyevm, private], part: [mainnet, l2], note: 'Any EVM base ledger; Besu permissioned networks in practice (Agorá ran QBFT Besu); no public-chain deployment found.' }
    keys: { in: [existing], note: 'secp256k1 keys from the node’s key manager or an HSM, one group-scoped address per group.' }
    wallet: { in: [app], note: 'A Paladin node for each member.' }
    indexing: { in: [client], note: 'Each member’s node indexes the base ledger and holds the group state.' }
    tokens: { in: [any], note: 'Any Solidity contract inside the group; positions cannot leave the group, so tokens that move use Noto or Zeto.' }
    hidden: { in: [public, participants, operator], note: 'Non-members see only hashes; every member sees everything; there is no operator.' }
    controls: { in: [freeze, forced, pause, mint], note: 'Any control the private contract codes (Pente runs ordinary Solidity), enforced by member endorsement; none comes built in.' }
    permission: { in: [permissioned], note: 'Membership is fixed when the group is created.' }
    disclosure: { in: [grant], note: 'Add a regulator or auditor as a member at creation; no viewing keys.' }
    visibility: { in: [notary], note: 'Non-members see only hashes; every member sees everything; there is no operator. Every member institution sees the whole group state; a regulator only if made a member.' }
    checks: { in: [capable], note: 'Membership is fixed when the group is created.' }
    association: { in: ['no'], note: 'Paladin is software each institution deploys for itself; Zeto’s open variants are a technology choice, not a service, so a permissioned deployment is not associated.' }
    upgrade: { in: [operator], note: 'UUPS proxy; an upgrade must be pre-authorized by the group’s endorsement threshold.' }
    exit: { in: ['no'], note: 'Every transition needs the endorsement threshold; state cannot leave without the members.' }
    censorship: { in: ['yes'], note: 'The default threshold is every member, so one absent or unwilling member stalls the group.' }
    failure: { in: [privacy], note: 'A leak by any member exposes the group; on-chain hashes prevent the state divergence seen with Tessera.' }
    value: { in: [unseen] }
    institutions: { in: [public], note: 'BIS Project Agorá used Paladin (payment coordination): prototype report May 2026, then live trials with real money from July 2026 (22 institutions, five central banks, 30 transactions, about CHF 800,000); production needs further phases. No named production deployment found.', sources: [{ title: 'Ledger Insights for LF Decentralized Trust, Institutional adoption of LF Decentralized Trust technologies (2026), Project Agorá and Paladin (pp. 11, 12, 22)', url: 'https://www.lfdecentralizedtrust.org/hubfs/LFDT%20Institutional%20Adoption%20-%20Ledger%20Insights%20Report%202026.pdf', checked: '2026-10-26' }] }
    audits: { in: ['no'], note: 'No public security audit of Paladin or Pente found, 26 October 2026.' }
    incidents: { in: [none] }
    license: { in: [open], note: 'Apache 2.0.' }
    steward: { in: [foundation], note: 'LF Decentralized Trust project since 11 November 2025; maintainers are at Kaleido.' }
    gas: { in: [unknown], note: 'No gas figure published by Paladin, the BIS or PSE.' }
    latency: { in: [block], note: '"Seconds" per the Besu docs; a whole Agorá cross-border payment averaged about 80 seconds.' }
    anonymity: { in: ['na'], note: 'Members are named at group creation; outsiders see only the group contract.' }
  desc: 'Ordinary Solidity run inside a Hyperledger Paladin privacy group, so parties, amounts and contract logic stay with the members; the chain sees only salted state hashes and endorsements. Every member endorses each step, so there is no operator, but one absent member stalls the group. A regulator can be a member. Any EVM chain; side effects settle atomically with Noto, Zeto or ERC-20. The successor to Besu’s Tessera private transactions, removed from Besu in June 2025. Used in the BIS Project Agorá prototype.'
  sources:
