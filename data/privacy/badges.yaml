- id: prividium
  name: ZKsync Prividium
  circle: logic
  x: 450
  y: 491
  eth: true
  pse: zksync-prividium
  status: mainnet
  since: '2025-05-27'
  facts:
    verify: { in: ['yes'], note: 'Ethereum mainnet verifies a validity proof of every batch; data is withheld, so the RPC permission layer and data availability are trusted.', sources: [{ title: 'ZKsync docs, Prividium overview (validity proof per batch)', url: 'https://docs.zksync.io/zk-stack/prividium/overview', checked: '2026-10-26' }, { title: 'PSE evaluation, ZKsync Prividium (Verifiability)', url: 'https://github.com/ethereum/private-transfers-benchmarks/blob/main/project-evaluations/src/data/evaluations/zksync-prividium.json', checked: '2026-10-26' }] }
    fees: { in: [license], note: 'A licensed product: live deployments need a commercial contract with Matter Labs; Prividium Core is Apache 2.0. No price published.', sources: [{ title: 'ZKsync docs, Prividium overview (licensed product)', url: 'https://docs.zksync.io/zk-stack/prividium/overview', checked: '2026-10-26' }, { title: 'PSE evaluation, ZKsync Prividium (Open source: commercial licence)', url: 'https://github.com/ethereum/private-transfers-benchmarks/blob/main/project-evaluations/src/data/evaluations/zksync-prividium.json', checked: '2026-10-26' }] }
    pet: { in: [offchain], note: 'Privacy is a proxy RPC with roles; its STARK proofs, wrapped in a KZG SNARK, prove correctness, not secrecy.' }
    proving: { in: [server], note: 'The operator’s sequencer and prover farm in a private subnet; nothing proven on user devices.' }
    pq: { in: [hashes], note: 'Only state roots and proofs on chain; data is never published, so nothing public to harvest. The final SNARK (BN254, KZG) and ECDSA are classical.' }
    operator: { in: [self], part: [company], note: 'Self-hostable (the Bundesbank runs its own, September 2026); Matter Labs also sells a managed service.' }
    external: { in: ['no'], note: 'Its own sequencer and prover; settles to Ethereum mainnet through the ZKsync Gateway.' }
    chains: { in: [private], part: [own], note: 'A private ZKsync validium settling to Ethereum mainnet; extended to Hyperledger Besu on 2 July 2026.' }
    keys: { in: [existing], note: 'Sign-in with Okta or OIDC SSO, or Sign-In with Ethereum on an existing key; no new key material.' }
    wallet: { in: [app], part: [any], note: 'The Prividium SDK handles sign-in; an existing wallet signs through the gated RPC.' }
    indexing: { in: [none], note: 'Ordinary account balances served by the permissioned RPC and explorer.' }
    tokens: { in: [erc20, nft, any], note: 'Any EVM contract an admin allows; no ERC-3643 deployment found.' }
    hidden: { in: [public, participants], note: 'Each user sees what their role permits; the operator sees all plaintext in its database.' }
    controls: { in: [freeze, pause], part: [forced, mint], note: 'Admins block any function call by role or argument and filter forced L1 transactions; other controls as the token codes.' }
    permission: { in: [permissioned], note: 'SSO or SIWE identity, then admin-assigned roles.' }
    disclosure: { in: [grant], note: 'The operator grants auditor roles, filtered views, Merkle proofs or database extracts.' }
    visibility: { in: [notary, operator], note: 'Each user sees what their role permits; the operator sees all plaintext in its database. The operator reads everything and can give a regulator or auditor a view-only role. Permission changes take effect immediately; no timelock or on-chain notice documented.' }
    checks: { in: [capable], note: 'SSO or SIWE identity, then admin-assigned roles.' }
    association: { in: ['no'] }
    upgrade: { in: [operator], note: 'A single initial admin per chain holds users, roles, disclosure and upgrades.' }
    exit: { in: ['no'], note: 'Validium: state cannot be rebuilt if the operator withholds data; forced L1 transactions can be filtered.' }
    censorship: { in: ['yes'], note: 'The proxy RPC returns 401 for any call the operator does not allow.' }
    failure: { in: [privacy], part: [funds], note: 'A database breach exposes everything; proofs stop theft, but withheld data can strand funds.' }
    value: { in: [unseen] }
    institutions: { in: [public], part: [production], note: 'Deutsche Bank DAMA 2 on the Memento chain (vendor says in use); Bundesbank test; Cari Network banks, production planned later 2026.' }
    audits: { in: ['no'], part: ['yes'], note: 'ZK Stack provers and contracts are audited; no public audit of the Prividium permission modules; SOC 2 Type I only.' }
    incidents: { in: [none] }
    license: { in: [open], part: [proprietary], note: 'Prividium Core permission engine Apache 2.0 since September 2026; admin console and bank connectors stay commercial.' }
    steward: { in: [company], note: 'Matter Labs.' }
    gas: { in: ['na'], note: 'Transfers run inside the private chain; Ethereum mainnet sees only one root and proof per batch.' }
    latency: { in: [block], note: 'One private-chain block; L1 finality and withdrawals wait about three hours (validator timelock).' }
    anonymity: { in: ['na'], note: 'Nothing reaches the public; members are identified and the operator sees everyone.' }
  desc: 'A private ZKsync chain run by or for the institution: Ethereum mainnet sees only state roots and validity proofs, so parties, amounts and logic stay in the operator’s database. Privacy here is access control, not cryptography: the operator sees everything and grants views by role, including to auditors and regulators. Correctness is proven; exit depends on the operator publishing data. Extended to Besu on 2 July 2026; chosen by Deutsche Bank’s Memento chain and by the Cari Network of US banks.'
  sources:
