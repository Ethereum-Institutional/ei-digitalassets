  desc: 'Private proof-of-burn (EIP-7503): you send ETH to an address that looks like any fresh account, then mint BETH, an ERC-20 receipt, to another address with a zero-knowledge proof, so only the link between burner and receiver is hidden; the minted amount and the receiver are public. The burn looks like an ordinary transfer, which gives deniability. Immutable contracts, no admin, no screening; burned ETH cannot be recovered, so getting ETH back means selling BETH. Proofs are heavy and usually made by an external prover that sees your inputs. Live on Ethereum mainnet since 11 February 2026; audited by yAudit and Hashlock.'
  sources:
  - { title: 'WORM whitepaper', url: 'https://github.com/worm-privacy/whitepaper', checked: '2026-10-26' }
  - { title: 'worm-privacy/worm (BETH and WORM contracts, MIT; mainnet addresses; audits)', url: 'https://github.com/worm-privacy/worm', checked: '2026-10-26' }
