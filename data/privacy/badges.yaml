  - { title: 'Zeto docs, Qurrency (ML-KEM auditor) variant', url: 'https://lfdt-paladin.github.io/zeto/latest/implementations/anon_nullifier_qurrency/', checked: '2026-10-26' }
  - { title: 'Zeto docs, FAQ (chains tested, wallet effort)', url: 'https://lfdt-paladin.github.io/zeto/latest/faqs/', checked: '2026-10-26' }
  - { title: 'Zeto Solidity contracts (owner powers, KYC registry)', url: 'https://github.com/LFDT-Paladin/zeto/tree/main/solidity/contracts', checked: '2026-10-26' }
  - { title: 'Zeto pull request #95 (under-constrained check fixed, 11 October 2024)', url: 'https://github.com/LFDT-Paladin/zeto/pull/95', checked: '2026-10-26' }
  - { title: 'Besu docs, Privacy with Paladin (Zeto latency and visibility)', url: 'https://docs.besu-eth.org/private-networks/concepts/privacy-with-paladin', checked: '2026-10-26' }
  - { title: 'LFDT-Paladin/paladin release v1.0.0 (25 June 2026; bundles Zeto)', url: 'https://github.com/LFDT-Paladin/paladin/releases/tag/v1.0.0', checked: '2026-10-26' }
  - { title: 'IACR ePrint 2026/015, Qurrency', url: 'https://eprint.iacr.org/2026/015', checked: '2026-10-26' }
- id: merces
  name: Merces
  circle: who
  x: 523
  y: 350
  eth: true
  pse: merces
  status: mainnet
  since: '2026-09-16'
  status_note: 'Live on Monad and World Chain mainnet with limited users and volume caps; the SDK test group TACEO publishes allows 1 USDC per transaction and 100 members. Public testnets since 18 November 2025 (Base testnet), later Arc, Plasma, Stable and Polygon Amoy.'
  facts:
    verify: { in: ['yes'], note: 'The contract verifies the client’s Groth16 proof on submission and the operators’ coSNARK (a standard Groth16 proof) before committing each update. The owner Safe can replace both verifiers.' }
    fees: { part: [license, protocol], note: 'No published pricing; offered as a white-label service, with operators paid by TACEO and no token. The ID registry can charge a join fee per user group (zero on the published test group).' }
    pet: { in: [mpc, snark], note: 'REP3 secret sharing across three MPC nodes; collaborative Groth16 proofs (co-snarks) on BN254; Poseidon2 commitments; BabyJubJub ECDH with Poseidon2 encryption of shares to the nodes.' }
    proving: { in: [device, server], note: 'The client proves its own inputs locally (Circom, SnarkJS); the three MPC nodes jointly prove each balance update without seeing the witness.' }
    pq: { in: ['no'], note: 'Shares are encrypted to the nodes with elliptic-curve key agreement and posted on chain, open to harvest-now-decrypt-later (TACEO roadmap: migration to a post-quantum KEM is in progress). The MPC layer is information-theoretic; Groth16 is pairing-based.' }
    operator: { in: [committee], part: [self], note: 'Three MPC nodes run by TACEO’s permissioned operator set ("managed"), or by operators an institution nominates ("bring your own"), with TACEO monitoring and approving deployments. The nodes on the mainnet deployments are not named.' }
    external: { in: ['yes'], note: 'Every action waits for the TACEO Network’s MPC committee to process it and post a proof; screening calls Predicate.' }
    chains: { in: [l2, evm, anyevm], note: 'Mainnet: World Chain (an OP Stack rollup on Ethereum mainnet) and Monad. Testnets: Base, Arc, Plasma, Stable, Polygon Amoy, Sepolia. Not on Ethereum mainnet; TACEO says it deploys on any EVM chain.' }
    keys: { in: [existing], part: [new], note: 'Users sign with their existing wallet. Registration commits to an authentication secret, which the demo derives from a wallet signature (PSE evaluation).' }
    wallet: { in: [app], note: 'Balances are read through the Merces SDK or a white-label app; TACEO’s own payment app (Tapa) runs on Monad mainnet.' }
    indexing: { in: [none], part: [service], note: 'The client asks the MPC nodes for its encrypted balance shares and recombines them; transaction history comes from a scan the nodes run. The nodes learn who is asking.' }
    tokens: { in: [erc20], note: 'One ERC-20 per deployment (USDC on both mainnets); EIP-2612 permit or EIP-3009 deposits. Multiple assets per tree are future work.' }
    permission: { in: [selective, permissioned], note: 'Accounts must register in an on-chain ID registry, and registration, deposits and withdrawals pass a compliance contract. User groups can gate joining through an admin contract (for example a KYC credential).' }
    association: { in: ['no'], note: 'Each deployment is its own contract and pool. The public Monad and World Chain deployments screen every registration, deposit and withdrawal through Predicate.' }
    checks: { in: [builtin, capable], note: 'Predicate attestations, verified on chain by the BasicPredicateCompliance contract on World Chain, screen addresses against OFAC, EU, UK and UN sanctions lists, AML and CFT rules, and the operator’s own allow and block lists. Private-mode transfers are not screened.' }
    hidden: { in: [public, participants], part: [operator], note: 'Operators see the transaction graph in the default mode but no balance or amount; two of three colluding could reconstruct everything. A graph-private mode (oblivious RAM) also hides the graph, on testnet only. Deposits and withdrawals are public, and the wallet that submits a transaction is visible unless a relayer sends it.' }
    controls: { in: [freeze, pause], note: 'The owner Safe can pause the contract and permanently freeze an account (moved to a banned group); per-group caps on amount and transfers per epoch. No forced transfer; no minting.' }
    disclosure: { in: [grant], note: 'No viewing keys. An authorized party requests a wallet’s history for a time range; each node verifies and approves, then the nodes threshold-decrypt to the requester’s key.' }
    visibility: { in: [notary], note: 'The operators jointly act as notary for authorized requests (court orders use the same route); the docs do not say whether a request leaves an on-chain notice. On the public testnet anyone could query any account’s history.' }
    upgrade: { in: [company], note: 'Mainnet contracts are UUPS proxies owned by a 3-of-6 Safe on World Chain and a 3-of-4 Safe on Monad, which can also swap verifiers and the MPC key; no timelock found. The Plasma testnet demo contract is immutable (PSE).' }
    exit: { in: ['no'], note: 'Withdrawals need the MPC network. A self-triggering escape hatch is in beta and not deployed; the mainnet contract source marks it "not implemented yet".' }
    censorship: { in: ['yes'], note: 'The MPC committee, the owner’s pause and freeze, and Predicate screening can each stop a user.' }
    failure: { in: [privacy, funds], note: 'Two colluding operators lose privacy. The operators cannot forge an update, but an owner upgrade or verifier swap could put funds at risk, and a network halt locks them with no exit.' }
    value: { in: [lt10m], note: 'USD 211 in the Monad contract and USD 2 in the World Chain contract (USDC, read on chain 27 October 2026).', sources: [{ title: 'Monadscan, Merces contract on Monad mainnet', url: 'https://monadscan.com/address/0x9Dd5DE40592AdfcDD60F0f3fF3B014553998f7c1', checked: '2026-10-27' }, { title: 'Worldscan, Merces contract on World Chain', url: 'https://worldscan.org/address/0x458838De82E065A84e947D7dAC3844E473c404DA', checked: '2026-10-27' }] }
    institutions: { in: [none], note: 'Integration partners named for demos (IntellectEU CatalyX payroll, LayerZero, Orion Finance, Zenith); no regulated institution in production or in a public pilot found.' }
    audits: { in: ['no'], note: 'No public audit of Merces found; the demo repository says the code is not audited. The specification has a UC security proof (IACR ePrint 2026/850), which is not an audit.' }
    incidents: { in: [none] }
    license: { in: [open], note: 'Mainnet contracts verified on explorers under MIT; merces1-paper MIT; merces1-x402 MIT or Apache-2.0; co-snarks MIT or Apache-2.0. The production node software was not found in a public repository.' }
    steward: { in: [company], note: 'TACEO GmbH, a TU Graz spin-out (July 2022).' }
    gas: { in: [k200to500], part: [gt500k], note: 'About 445,000 gas per transfer call, plus about 347,000 for the operators’ processMpc, which carried one action per call: about 793,000 in all (27 transfers and 64 processMpc calls on World Chain, 22 September to 16 October 2026).', sources: [{ title: 'Worldscan, Merces contract transactions on World Chain (our gas measurement over 131 transactions)', url: 'https://worldscan.org/address/0x458838De82E065A84e947D7dAC3844E473c404DA', checked: '2026-10-27' }] }
    latency: { in: [minute], note: 'The operators finalized each action 2 to 6 seconds (average 3.7) after the user’s transaction on World Chain; the paper’s demo reports about 8.4 seconds end to end.' }
    anonymity: { in: [small], note: 'Registered accounts in the ID registry: 39 on Monad and 3 on World Chain (27 October 2026).' }
  desc: 'Hides the sender, receiver and amount of each transfer behind commitments; balances are secret-shared across three MPC operators, who see the transaction graph but no amounts. Deposits and withdrawals stay public. You trust that no two operators collude and that the network stays live (the escape hatch is not yet deployed); correctness does not depend on them, because the chain verifies a Groth16 proof of every update. The owner can pause and freeze accounts, Predicate screens entry and exit, and authorized parties can request threshold decryption. You can nominate your own operators. Live with caps on Monad and World Chain since September 2026; testnets since November 2025.'
