    visibility: { in: [na], part: [parties], note: 'Relayers see metadata only; the enclave prover receives plaintext inputs unless you prove locally; Chainalysis sees depositor addresses. Nobody can decrypt without the holder; a flagged depositor is limited to a public withdrawal to the original address. No notary route to safeguard.' }
