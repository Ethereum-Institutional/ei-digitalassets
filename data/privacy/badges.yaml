  desc: 'A shielded pool that hides sender, recipient, amount and token for transfers inside it; shields and unshields stay public. Groth16 proofs made on your device, so no operator sees your data, and read-only viewing keys can be shared with an auditor. Admission is permissionless at the contract, with Private Proofs of Innocence screening in wallets. An issuer cannot freeze a holder inside the pool. Ethereum mainnet since 2022 (current contracts), plus Arbitrum, Polygon and BNB Chain; contracts are proprietary (UNLICENSED).'
