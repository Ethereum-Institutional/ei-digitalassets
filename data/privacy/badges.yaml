- id: nightfall
  name: Nightfall
  circle: who
  x: 505
  y: 248
  eth: true
  pse: nightfall
  status: testnet
  since: '2025-09-30'
  facts:
    verify: { in: ['yes'], note: 'The contract verifies a rollup proof per block; a deployment left on the default mock prover accepts any proof.', sources: [{ title: 'PSE evaluation, Nightfall (Verifiability)', url: 'https://github.com/ethereum/private-transfers-benchmarks/blob/main/project-evaluations/src/data/evaluations/nightfall.json', checked: '2026-10-26' }, { title: 'EYBlockchain/nightfall_4_CE README', url: 'https://github.com/EYBlockchain/nightfall_4_CE', checked: '2026-10-26' }] }
