    fees: { in: [protocol], note: '0.5% of each minted amount goes to the WORM reward pool; prover and broadcaster fees are optional if you prove yourself.', sources: [{ title: 'worm-privacy/worm, BETH.sol (poolFee 0.5%, prover and broadcaster fees)', url: 'https://github.com/worm-privacy/worm/blob/main/src/BETH.sol', checked: '2026-10-26' }, { title: 'Etherscan, BETH on Ethereum mainnet (reward pool set; our read)', url: 'https://etherscan.io/address/0x5624344235607940d4d4EE76Bf8817d403EB9Cf8#readContract', checked: '2026-10-26' }] }
    pet: { in: [snark], note: 'Groth16 Circom circuits proving the burn address in Ethereum mainnet state (Merkle Patricia Trie).' }
