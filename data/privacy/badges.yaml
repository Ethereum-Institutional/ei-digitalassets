  - { title: 'Bermuda, Safe privacy add-on (testnet beta on Base Sepolia; not audited; mainnet "soon")', url: 'https://bermudabay.xyz/safe', checked: '2026-10-26' }
  - { title: 'bermudabay/chain-state (deployments per chain id)', url: 'https://github.com/bermudabay/chain-state', checked: '2026-10-26' }
  - { title: 'bermudabay/wdk-wallet-evm-bermuda (beta; Plasma testnet only; Apache-2.0)', url: 'https://github.com/bermudabay/wdk-wallet-evm-bermuda', checked: '2026-10-26' }
  - { title: 'Gnosisscan, Bermuda test pool (created 12 May 2026)', url: 'https://gnosisscan.io/address/0xb8ed8415f15d46bca5f31aeb548b9c630fb5f0c1', checked: '2026-10-26' }
