  desc: 'Encrypts balances and transfer amounts with fully homomorphic encryption (TFHE, lattice-based) in ERC-7984 tokens such as cUSDC and cUSDT, built on OpenZeppelin’s confidential contracts. Sender, receiver, asset and wrap amounts stay public, so monitoring tools keep working. You trust a 13-operator threshold key service and five coprocessor operators, which you cannot run yourself today. The wrapper owner keeps a denylist, a pause and observers, and a regulator can be granted decryption. On Ethereum mainnet since 30 December 2025, composable in plain Solidity; about 497,000 gas per transfer.'
