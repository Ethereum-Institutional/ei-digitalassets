  - { title: 'Etherscan, Umbra contract (gas of recent sends and withdrawals)', url: 'https://etherscan.io/address/0xFb2dc580Eed955B528407b4d36FfaFe3da685401', checked: '2026-10-26' }
  - { title: 'Consensys Diligence, Umbra smart contracts audit (March 2021)', url: 'https://diligence.consensys.io/audits/2021/03/umbra-smart-contracts', checked: '2026-10-26' }
  - { title: 'Fluidkey FAQ (seven EVM chains; Dedaub audit May 2024)', url: 'https://docs.fluidkey.com/readme/frequently-asked-questions', checked: '2026-10-26' }
  - { title: 'Fluidkey, how to complete KYC (bank features only)', url: 'https://docs.fluidkey.com/guides/how-to-complete-kyc-on-fluidkey', checked: '2026-10-26' }
  - { title: 'Kovács and Seres, Anonymity Analysis of the Umbra Stealth Address Scheme on Ethereum (arXiv 2308.01703)', url: 'https://arxiv.org/abs/2308.01703', checked: '2026-10-26' }
  - { title: 'PSE evaluation, Umbra Cash (ScopeLift Umbra)', url: 'https://github.com/ethereum/private-transfers-benchmarks/blob/main/project-evaluations/src/data/evaluations/umbra-cash.json', checked: '2026-10-26' }
  - { title: 'PSE evaluation, Fluidkey', url: 'https://github.com/ethereum/private-transfers-benchmarks/blob/main/project-evaluations/src/data/evaluations/fluidkey.json', checked: '2026-10-26' }
# ---- Who and how much: shielded pools and notarized or ZK UTXO tokens ----
- id: railgun
  name: Railgun
  circle: who
  x: 450
  y: 180
  eth: true
  pse: railgun
  status: mainnet
  since: '2022-05-01'
  facts:
    verify: { in: ['yes'], note: 'The contract verifies a Groth16 proof for every shielded transaction.', sources: [{ title: 'PSE evaluation, Railgun (Verifiability)', url: 'https://github.com/ethereum/private-transfers-benchmarks/blob/main/project-evaluations/src/data/evaluations/railgun.json', checked: '2026-10-26' }] }
