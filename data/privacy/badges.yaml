  desc: 'A shielded balance with stealth addresses that hides parties, amount and token inside; entries and exits are public. Entry is screened by Chainalysis and deposits over $10,000 need a KYC or zkTLS attestation; viewing keys can be shared with an auditor. You trust Hinkal’s admin key and relayers. Ethereum mainnet and other EVM chains, plus Solana and TRON. About $800,000 was drained by a double-spend bug on 2 July 2026; the Ethereum mainnet contract was redeployed on 16 July 2026.'
