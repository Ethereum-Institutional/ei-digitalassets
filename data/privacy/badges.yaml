    disclosure: { in: [none], note: 'Sharing the burnKey reveals the burn but also lets the holder spend it.' }
    visibility: { in: [na], part: [parties], note: 'The external prover sees your burn inputs unless you run your own. Nobody can decrypt. No notary route.' }
