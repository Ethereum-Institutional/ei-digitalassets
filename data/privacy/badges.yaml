- id: blanksquare
  name: 'Blanksquare'
  circle: who
  x: 710
  y: 335
  eth: true
  pse: blanksquare
  status: mainnet
  since: '2025-07-23'
  facts:
    verify: { in: ['yes'], note: 'The Shielder contract verifies a Halo2 proof; the owner can upgrade the verifier.', sources: [{ title: 'PSE evaluation, Blanksquare (Verifiability)', url: 'https://github.com/ethereum/private-transfers-benchmarks/blob/main/project-evaluations/src/data/evaluations/blanksquare.json', checked: '2026-10-26' }] }
    fees: { in: [none], note: 'Owner-set deposit and withdrawal fees are 0 bps on Base (our read, 26 October 2026). Relayer fees optional: you can self-broadcast.', sources: [{ title: 'Basescan, Shielder contract (protocolDepositFeeBps and protocolWithdrawFeeBps return 0; our read)', url: 'https://basescan.org/address/0x064A67a5484DF6baf36be42F9554d45E7741dCFf#readProxyContract', checked: '2026-10-26' }, { title: 'Blanksquare docs, understanding fees', url: 'https://docs.blanksquare.io/integration-guides/fees', checked: '2026-10-26' }] }
    pet: { in: [snark], part: [tee], note: 'Halo2 (Ultraplonk, KZG on BN256); AWS Nitro enclaves run the optional one-click scheduler and Shielder Guard.' }
    proving: { in: [device], note: 'WASM prover in the browser, 600 to 800 ms on consumer hardware; TEE proof delegation is work in progress.' }
    pq: { in: ['no'], note: 'KZG and BN256 pairings; revoker encryption is ElGamal on Grumpkin.' }
    operator: { in: [self], part: [company], note: 'You can prove and self-broadcast; Blanksquare runs the default relayer and its owner multisig can pause.' }
    external: { in: ['no'], note: 'No committee or oracle between user and contract; relayers optional.' }
    chains: { in: [l2, evm], note: 'Base mainnet and HyperEVM mainnet; testnets on Base Sepolia and Arbitrum Sepolia. Not on Ethereum mainnet.' }
    keys: { in: [existing], note: 'The web app derives the shielded account from a signature by your existing wallet.' }
    wallet: { in: [app], part: [dedicated], note: 'Web app with any EVM wallet, a Blanksquare mobile wallet, or the Shielder SDK; HyperBloom integrates silent transfers.' }
    indexing: { in: [client], note: 'The client syncs Shielder state and builds proofs locally.' }
    tokens: { in: [eth, erc20], part: [erc4626], note: 'Native token and any ERC-20; Shielded Yield shields vault shares (an Autopilot USDC share seen on Base).' }
    hidden: { in: [public, participants], part: [operator], note: 'Relayers see only the withdrawal; the Anonymity Revoker can decrypt a user''s history.' }
    controls: { in: [none], note: 'No issuer control inside; the owner''s pause stops the whole pool, not one holder.' }
    permission: { in: [selective], note: 'No screening at the contract; Shielder Guard (TEE screening) is described but undocumented.' }
    disclosure: { in: [viewkey, auditor], note: 'Holder viewing keys, plus an Anonymity Revoker key built into every account.' }
    visibility: { in: [notary], note: 'Relayers see only the withdrawal; the Anonymity Revoker can decrypt a user''s history. The revoker whose public key the owner sets (Blanksquare on Base) can decrypt after a governance decision; no regulator or court named. Decryption needs no on-chain step; the docs say the revoker may publish the user key, which anyone can verify.' }
    checks: { in: [none], note: 'No screening at the contract; Shielder Guard (TEE screening) is described but undocumented.' }
    association: { in: [shared] }
    upgrade: { in: [company], note: 'UUPS proxy; owner (a 2-of-N multisig per PSE) upgrades, pauses, sets fees and the revoker key.' }
    exit: { in: ['no'], note: 'Withdrawals are pausable by the owner and the verifier is upgradeable; no forced-exit path.' }
    censorship: { in: ['yes'], note: 'The owner can pause all deposits and withdrawals; relayers can be bypassed by self-broadcasting.' }
    failure: { in: [funds], part: [privacy], note: 'A circuit or contract bug risks funds; a leaked revoker key exposes every account.' }
    value: { in: [lt10m], note: 'About 48 USDC, 14 vault shares and 0.078 ETH in the Base contract, under USD 1,000; Basescan, 26 October 2026.' }
    institutions: { in: [none], note: 'No regulated institution found.' }
    audits: { in: ['yes'], note: 'zkSecurity audit of the Aleph Zero Shielder (circuits, contract, SDK), 25 March 2025.' }
    incidents: { in: [none], note: 'No exploit found.' }
    license: { in: [open], part: [available], note: 'Deployed contracts, SDK and relayer Apache-2.0; the newer v2 monorepo (Noir circuits) carries no license.' }
    steward: { in: [company], note: 'Cardinal Cryptography, the developer behind Aleph Zero.' }
    gas: { in: [gt500k], note: 'No in-pool transfer: medians about 1.78 million gas to deposit and 1.84 million to withdraw on Base.' }
    latency: { in: [block], note: 'Sub-second proving plus one Base block; silent transfers add a chosen delay.' }
    anonymity: { in: [small], note: '99 shielded accounts and 446 transactions on Base from 23 July 2025 to 2 April 2026.' }
  desc: 'A shielded pool that hides which deposit funded which withdrawal; amounts, tokens and both addresses stay public, and there is no in-pool transfer. Halo2 proofs are made on your device and relayers only post them. Each account carries an encrypted key for an Anonymity Revoker chosen by the contract owner, who can reveal a user''s full history after a governance decision on illicit funds; the owner multisig can also pause and upgrade. No issuer control survives. Base since 23 July 2025, also HyperEVM; about 450 transactions, none since April 2026. Its strength is a built-in, verifiable reveal route.'
  sources:
