- id: stealth
  name: Stealth addresses
  circle: who
  x: 710
  y: 300
  eth: true
  pse: [umbra-cash, fluidkey]
  status: mainnet
  since: '2021-04-30'
  facts:
    verify: { in: ['yes'], note: 'Ordinary execution: payments are plain ETH or ERC-20 transfers the chain executes; nothing is accepted on an operator''s word.', sources: [{ title: 'PSE evaluation, Umbra Cash (Verifiability)', url: 'https://github.com/ethereum/private-transfers-benchmarks/blob/main/project-evaluations/src/data/evaluations/umbra-cash.json', checked: '2026-10-26' }, { title: 'PSE evaluation, Fluidkey (Verifiability)', url: 'https://github.com/ethereum/private-transfers-benchmarks/blob/main/project-evaluations/src/data/evaluations/fluidkey.json', checked: '2026-10-26' }] }
    fees: { in: [none], note: 'Umbra toll is 0 on Ethereum mainnet (our read, 26 October 2026). Fluidkey bank features charge 0.10% to 0.30% above USD 3,000 monthly, optional.', sources: [{ title: 'Etherscan, Umbra contract (toll() returns 0; our read)', url: 'https://etherscan.io/address/0xFb2dc580Eed955B528407b4d36FfaFe3da685401#readContract', checked: '2026-10-26' }, { title: 'Fluidkey docs, fee structure', url: 'https://docs.fluidkey.com/readme/fee-structure', checked: '2026-10-26' }] }
    pet: { in: ['na'], note: 'Elliptic-curve key exchange (ECDH on secp256k1) with view tags; no proofs and no encrypted balances.' }
    proving: { in: [none], note: 'No proofs; the sender derives the address, the receiver scans announcements.' }
    pq: { in: ['no'], note: 'secp256k1 ECDH; a quantum attacker could derive viewing and spending keys from published meta-addresses.' }
    operator: { in: [self], part: [company], note: 'Umbra and the ERC contracts are permissionless and scanning is client-side; Fluidkey scans for you with a shared viewing-key node.' }
    external: { in: ['no'], note: 'Nothing beyond the host chain; Umbra falls back from its subgraph to plain RPC logs.' }
    chains: { in: [mainnet, l2, evm], note: 'Umbra: Ethereum mainnet, Arbitrum, Optimism, Polygon, Base, Gnosis Chain. Fluidkey: the same six plus BNB Chain.' }
    keys: { in: [existing], note: 'Spending and viewing keys derived from one signature by your existing wallet.' }
    wallet: { in: [app], part: [any], note: 'Receiving needs the Umbra or Fluidkey app (or an ERC-5564 wallet); any wallet can send to a stealth address.' }
    indexing: { in: [client], part: [service], note: 'Umbra scans announcements on your device; Fluidkey scans server-side with your viewing node.' }
    tokens: { in: [eth, erc20], part: [nft], note: 'ETH and ERC-20; ERC-5564 metadata can carry ERC-721 transfers, little used.' }
    hidden: { in: [public], part: [operator], note: 'The sender knows the recipient; Umbra has no operator; Fluidkey sees every incoming payment and balance.' }
    controls: { in: [freeze, forced, pause, mint], note: 'Ordinary tokens at ordinary addresses, so every issuer control works; Umbra holds unclaimed ERC-20s in its contract until withdrawn.' }
    permission: { in: [permissionless], part: [selective], note: 'Anyone can register a meta-address or send; no screening in the contracts. Fluidkey KYC applies only to its bank features.' }
    disclosure: { in: [viewkey], note: 'Share the viewing key; it covers all incoming payments, past and future, and cannot be scoped or revoked.' }
    visibility: { in: [na], part: [notary, parties], note: 'The sender knows the recipient; Umbra has no operator; Fluidkey sees every incoming payment and balance. Umbra: nobody. Fluidkey holds a viewing node, so it could be ordered to disclose incoming payments without the holder. No delay or on-chain notice on any viewing access.' }
    checks: { in: [none], note: 'Anyone can register a meta-address or send; no screening in the contracts. Fluidkey KYC applies only to its bank features.' }
    association: { in: [shared] }
    upgrade: { in: [immutable], note: 'Umbra logic is not upgradeable (the owner sets only a toll); ERC-5564 and ERC-6538 singletons and Safe accounts are immutable.' }
    exit: { in: ['yes'], note: 'Funds sit at addresses you control; Fluidkey''s MIT kit recovers every stealth account without Fluidkey.' }
    censorship: { in: ['no'], note: 'Permissionless contracts; a sender can always pay a derived address directly.' }
    failure: { in: [privacy], note: 'A leaked viewing key or careless spending re-links payments; there is no pool to lose.' }
    value: { in: ['na'], note: 'No pool; funds sit at separate addresses. The Umbra contract held about USD 5,500 of unclaimed ERC-20s on Ethereum mainnet, 26 October 2026.' }
    institutions: { in: [none], note: 'No regulated institution found; Fluidkey serves individuals, freelancers and DAOs.' }
    audits: { in: ['yes'], note: 'Umbra: Consensys Diligence (March 2021) and Least Authority (May 2021). Fluidkey: Dedaub (May 2024); Earn module by Ackee.' }
    incidents: { in: [none], note: 'No exploit found; a 2023 study linked the recipient of 48.5% of Umbra payments on Ethereum mainnet by heuristics.' }
    license: { in: [open], note: 'Umbra MIT; Fluidkey Stealth Account Kit MIT, Earn module GPL-3.0; the Fluidkey app is closed.' }
    steward: { in: [company], note: 'ScopeLift (Umbra) and Fluidkey; the ERC-5564 and ERC-6538 standards are Final.' }
    gas: { in: [lt200k], note: 'Umbra on Ethereum mainnet, 26 October 2026: send ETH 62,002 gas, send ERC-20 83,867, sponsored withdrawal 70,625.' }
    latency: { in: [block], note: 'One ordinary transaction; no waiting period.' }
    anonymity: { in: [medium], note: 'Umbra has over 22,000 payments on Ethereum mainnet (PSE); heuristics re-link about half, so the effective set is smaller.' }
  desc: 'Each payment goes to a fresh one-time address only the receiver can link to themselves (ERC-5564 and ERC-6538, Final since 2024). Sender, amount, token and timing stay public, and because the tokens are ordinary ERC-20s every issuer control still works. Plain elliptic-curve key exchange, no proofs, cheap as a normal transfer. Umbra on Ethereum mainnet since 30 April 2021; Fluidkey since 2024. Poor gas hygiene undoes it.'
  sources:
  - { title: 'ERC-5564, Stealth Addresses (Final)', url: 'https://eips.ethereum.org/EIPS/eip-5564', checked: '2026-10-26' }
  - { title: 'ScopeLift Umbra protocol', url: 'https://github.com/ScopeLift/umbra-protocol', checked: '2026-10-26' }
  - { title: 'Fluidkey technical walkthrough', url: 'https://docs.fluidkey.com/technical-documentation/technical-walkthrough', checked: '2026-10-26' }
  - { title: 'ERC-6538, Stealth Meta-Address Registry (Final)', url: 'https://eips.ethereum.org/EIPS/eip-6538', checked: '2026-10-26' }
