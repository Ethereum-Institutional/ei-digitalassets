- id: zerc20
  name: 'zERC20'
  circle: who
  x: 710
  y: 370
  eth: true
  pse: zerc20
  status: mainnet
  since: '2026-02-04'
  facts:
    verify: { part: ['yes'], note: 'Redemptions and transfer roots are proven on chain; the cross-chain global root arrives over LayerZero, trusted rather than proven.', sources: [{ title: 'zERC20 docs, Architecture overview', url: 'https://zerc20.gitbook.io/zerc20/for-developers/architecture', checked: '2026-10-26' }, { title: 'PSE evaluation, zERC20 (Verifiability)', url: 'https://github.com/ethereum/private-transfers-benchmarks/blob/main/project-evaluations/src/data/evaluations/zerc20.json', checked: '2026-10-26' }] }
    fees: { in: [protocol], note: 'Redeem fee 0.35% (maximum 1%); unwrapping on low-liquidity chains costs up to 10%. Gasless relay fee optional.', sources: [{ title: 'zERC20 docs, fees and rewards', url: 'https://zerc20.gitbook.io/zerc20/for-users/fees-and-rewards', checked: '2026-10-26' }] }
    pet: { in: [snark], note: 'Groth16 for single redemptions, Nova folding for batches, Poseidon trees on BN254.' }
    proving: { in: [device], part: [server], note: 'Single proofs in the browser (about 105 ms); batch proofs are finished by a decider prover service.' }
    pq: { in: ['no'], note: 'Groth16 and Nova on BN254 are not quantum-resistant.' }
    operator: { in: [company], part: [self], note: 'INTMAX runs the indexer, decider prover, cross-chain job and relay node; users may run their own indexer.' }
    external: { in: ['yes'], note: 'Cross-chain roots travel over LayerZero; stealth messages are stored on the Internet Computer.' }
    chains: { in: [mainnet, l2, evm], note: 'Ethereum mainnet, Arbitrum, Base, BNB Chain, Polygon and Kaia (blocklist on all six).' }
    keys: { in: [existing], note: 'Your normal wallet key; each transfer adds a one-time burn secret shared with the recipient.' }
    wallet: { in: [any], part: [app], note: 'Any wallet holds and sends zERC20; private send and receive use the app, CLI or SDK.' }
    indexing: { in: [service], part: [client], note: 'The indexer rebuilds the Merkle tree and finds receipts; self-hosting is recommended for privacy.' }
    tokens: { in: [eth, erc20], note: 'zETH, zUSDC and zBNB wrappers; local-mode tokens such as zJPYC on testnet.' }
    hidden: { in: [public], part: [participants], note: 'Only the sender-to-recipient link is hidden; the indexer operator can link them.' }
    controls: { in: [freeze], note: 'A shared OFAC blocklist stops listed addresses from sending, receiving, wrapping and redeeming.' }
    permission: { in: [selective], note: 'OFAC blocklist on chain since 14 April 2026; optional proof of innocence.' }
    disclosure: { in: [none], note: 'No viewing key; a sender can show the burn secret to prove a payment.' }
    visibility: { in: [operator], note: 'Only the sender-to-recipient link is hidden; the indexer operator can link them. No decryption route; nothing is encrypted on chain except ICP stealth messages. No notary route.' }
    checks: { in: [builtin], note: 'OFAC blocklist on chain since 14 April 2026; optional proof of innocence.' }
    association: { in: [shared] }
    upgrade: { in: [company], note: 'Token, verifier, hub and liquidity manager upgradeable by the owner, a 3-of-4 Safe on Ethereum mainnet; blocklist not upgradeable.' }
    exit: { in: ['no'], note: 'Blocked addresses cannot unwrap; others redeem without the relay node, but roots come from the operator’s indexer.' }
    censorship: { in: ['yes'], note: 'The blocklist owner can block any address; the owner can rotate verifiers.' }
    failure: { in: [funds], part: [privacy], note: 'Upgradeable contracts hold the backing; an indexer breach links senders and recipients.' }
    value: { in: [lt10m], note: 'About USD 68,000 across six chains (DefiLlama, 26 Oct 2026); Ethereum mainnet 6.25 ETH and 7,417 USDC.' }
    institutions: { in: [none], note: 'None found.' }
    audits: { in: ['yes'], note: 'zkSecurity audit of circuits and core contracts (from 8 Dec 2025); liquidity contracts and generated verifiers out of scope.' }
    incidents: { in: [none], note: 'None found as of 26 Oct 2026.' }
    license: { in: [available], note: 'Business Source License 1.1, changing to GPL 2.0 or later on 8 April 2030.' }
    steward: { in: [company], note: 'INTMAX.' }
    gas: { in: [k200to500], note: 'Measured on Ethereum mainnet: burn transfer about 70,000 gas plus redemption 338,000 to 389,000 gas.' }
    latency: { in: [longer], note: 'FAQ: 30 minutes to 1 hour on mainnet, waiting for root proofs and LayerZero.' }
    anonymity: { in: [small], note: 'Ethereum mainnet zUSDC verifier: 10 redemptions among its last 100 transactions (May to Oct 2026).' }
  desc: 'An ERC-20 wrapper (zETH, zUSDC, zBNB) whose private transfer is a payment to a burn address that the recipient later redeems with a zero-knowledge proof, so only the link between sender and recipient is hidden; amounts, the asset and both addresses are public. Proofs are made on your device, but the indexer operator sees sender, burn address and amount, and learns the recipient on query unless you run your own. The token enforces an OFAC blocklist, and a 3-of-4 multisig can upgrade it. Built by INTMAX; live on Ethereum mainnet since 4 February 2026 and on five other chains via LayerZero. Audited by zkSecurity; composable like any ERC-20.'
