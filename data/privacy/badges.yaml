  - { title: 'LFDT-Paladin/paladin, Noto.sol (UUPS, onlyNotary transfer, mint and locks)', url: 'https://github.com/LFDT-Paladin/paladin/tree/main/solidity/contracts/domains/noto', checked: '2026-10-26' }
  - { title: 'Besu docs, Privacy with Paladin (Noto, Zeto and Pente compared: visibility, signers, latency)', url: 'https://docs.besu-eth.org/private-networks/concepts/privacy-with-paladin', checked: '2026-10-26' }
