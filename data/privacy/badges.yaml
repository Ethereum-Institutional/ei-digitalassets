- id: anomapay
  name: 'AnomaPay'
  circle: who
  x: 530
  y: 316
  eth: true
  pse: anoma-pay
  status: mainnet
  since: '2026-04-02'
  facts:
    verify: { in: ['yes'], note: 'The Protocol Adapter verifies RISC Zero proofs (via a Groth16 wrapper) before moving funds.', sources: [{ title: 'PSE evaluation, AnomaPay (Verifiability)', url: 'https://github.com/ethereum/private-transfers-benchmarks/blob/main/project-evaluations/src/data/evaluations/anoma-pay.json', checked: '2026-10-26' }] }
    fees: { in: [none], note: 'Deposits and withdrawals free; transfers pay only chain gas, deducted from the token sent. XAN not required.', sources: [{ title: 'Anoma blog, AnomaPay V1 is Live (2 June 2026; fees)', url: 'https://anoma.net/blog/anomapay-v1-is-live', checked: '2026-10-26' }] }
    pet: { in: [stark], part: [snark], note: 'RISC Zero zkVM proofs (STARK-based), checked on chain through RISC Zero’s Groth16 verifier router.' }
    proving: { in: [server], note: 'A hosted Proving Service on Vast.ai GPUs makes all proofs; client-side proving is on the roadmap, not live.' }
    pq: { in: ['no'], note: 'Inner STARKs are hash-based, but the on-chain Groth16 wrapper and secp256k1 note encryption are not quantum-resistant.' }
    operator: { in: [company], note: 'One Transaction Service and Proving Service, run for Anoma; the docs say anyone could run them, but no package is published.' }
    external: { in: ['no'], part: ['yes'], note: 'No other chain is needed; proving runs on third-party Vast.ai datacenters.' }
    chains: { in: [mainnet, l2, evm], note: 'Ethereum mainnet, Arbitrum and Base, plus BNB Chain, Monad and Stable (docs, 26 Oct 2026).' }
    keys: { in: [new], part: [existing], note: 'A root seed or passkey derives the AnomaPay keys; you can sign up with an existing wallet.' }
    wallet: { in: [app], note: 'A web app at anomapay.app, with passkeys or MetaMask, Rabby, Coinbase, OKX and other wallets; the App SDK for developers.' }
    indexing: { in: [service], note: 'An indexer returns your resources when given your discovery key.' }
    tokens: { in: [eth, erc20], note: 'ETH, USDC, USDT, USDT0, WBTC, XAN and others, varying by chain.' }
    hidden: { in: [public, participants], note: 'The proving operator and its datacenter see sender, receiver, asset and amount while proving.' }
    controls: { in: [none], note: 'No issuer freeze inside the pool; the adapter has a one-way emergency stop.' }
    permission: { in: [selective], part: [permissioned], note: 'Docs: the proving operator runs "consistent checks" for KYC and AML rules; what is checked is not specified.' }
    disclosure: { in: [viewkey], note: 'A user can share viewing material with a chosen party, such as an auditor.' }
    visibility: { in: [operator], note: 'The proving operator and its datacenter see sender, receiver, asset and amount while proving. No documented decryption route; the operator sees each transfer only while proving it. No notary route documented.' }
    checks: { in: [builtin], note: 'Docs: the proving operator runs "consistent checks" for KYC and AML rules; what is checked is not specified.' }
    association: { in: [shared] }
    upgrade: { in: [immutable], part: [company], note: 'Adapter and Forwarder are not upgradeable; a 3-of-5 Safe holds the emergency stop; a committee can migrate the Forwarder once.' }
    exit: { in: [], part: ['yes'], note: 'Contracts release funds to any valid proof, but running your own prover is not yet packaged.' }
    censorship: { in: ['yes'], note: 'The operator can refuse to prove or relay a transfer it judges non-compliant.' }
    failure: { in: [funds, privacy], note: 'Contracts hold the tokens; a breach of the proving service would expose transfers it processed.' }
    value: { in: [lt10m], note: 'About USD 14,000 in forwarders on 26 Oct 2026: Ethereum mainnet 5,500, BNB Chain 8,600, Base and Arbitrum 300 (XAN, Monad, Stable not counted).' }
    institutions: { in: [none], note: 'None found.' }
    audits: { in: ['yes'], note: 'Nethermind (13 Nov 2025) and Informal Systems (24 Nov 2025) on the adapter; Informal Systems on AnomaPay Phase I (19 Dec 2025).' }
    incidents: { in: [none], note: 'None found as of 26 Oct 2026.' }
    license: { in: [open], note: 'Adapter and Forwarder MIT; App SDK Apache 2.0; the hosted services are not published.' }
    steward: { in: [foundation], note: 'Anoma Foundation (Switzerland).' }
    gas: { in: [gt500k], note: 'Adapter execute() median 858,000 gas on Ethereum mainnet (100 calls, 23 Sep to 25 Oct 2026), mixing deposits, transfers and withdrawals.' }
    latency: { in: [minute], note: 'About 15 seconds of proving per transfer (Anoma, 2 June 2026).' }
    anonymity: { in: [small], part: [medium], note: 'Adapter commitments on 26 Oct 2026: 1,343 Ethereum mainnet, 2,824 Base, 10,470 BNB Chain, shared by all Anoma apps.' }
  desc: 'A shielded pool for ERC-20 tokens that settles through the Anoma Protocol Adapter: transfers inside it hide sender, recipient, asset and amount from the public, while deposits and withdrawals stay visible. Anoma’s proving and transaction services see each transfer in the clear while they build its RISC Zero proof, and they apply AML checks, so you trust that operator for privacy but not for custody. There is no issuer freeze inside; a 3-of-5 multisig can stop the adapter. Public beta on BNB Chain from 2 April 2026, V1 on Ethereum mainnet since 2 June 2026, then Arbitrum, Base, Monad and Stable. Audited MIT contracts and payment links instead of addresses.'
