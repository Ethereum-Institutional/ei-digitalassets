- id: aztec
  name: Aztec
  circle: logic
  x: 417
  y: 425
  eth: true
  pse: aztec
  status: mainnet
  since: '2026-03-30'
  facts:
    verify: { in: ['yes'], note: 'Ethereum mainnet verifies a recursive rollup proof per epoch; docs warn some circuits are under-constrained.', sources: [{ title: 'PSE evaluation, Aztec (Verifiability)', url: 'https://github.com/ethereum/private-transfers-benchmarks/blob/main/project-evaluations/src/data/evaluations/aztec.json', checked: '2026-10-26' }, { title: 'Aztec docs, Alpha Network (under-constrained circuits)', url: 'https://docs.aztec.network/participate/alpha', checked: '2026-10-26' }] }
    fees: { in: [token], note: 'Fees paid in Fee Juice, AZTEC bridged one way from Ethereum mainnet; a fee-paying contract can accept other tokens. Under USD 0.05 per private transfer.', sources: [{ title: 'Aztec docs, fees (Fee Juice)', url: 'https://docs.aztec.network/developers/docs/foundational-topics/fees', checked: '2026-10-26' }, { title: 'Aztec docs, paying fees on mainnet (bridge AZTEC)', url: 'https://docs.aztec.network/participate/basics/fees', checked: '2026-10-26' }] }
    pet: { in: [snark], note: 'Client-side CHONK proofs (Plonk family) and UltraHonk rollup proofs on BN254, KZG setup from the 2019 Ignition ceremony.' }
    proving: { in: [device], note: 'Private functions are proven in your PXE: about 2.5 s native, 6.8 s in a browser (Aztec).' }
    pq: { in: ['no'], note: 'Elliptic-curve and pairing based; Aztec targets a post-quantum migration between February 2027 and end of 2030.' }
    operator: { in: [self], note: 'You can run your own node and PXE; sequencing (200,000 AZTEC stake) and proving are permissionless.' }
    external: { in: ['no'], note: 'Its own sequencer and prover sets; data in Ethereum mainnet blobs.' }
    chains: { in: [nonevm], note: 'Its own Layer 2, settling to Ethereum mainnet; V6 canonical since 26 October 2026. Its own VM: contracts are written in Noir; Solidity runs only on Ethereum mainnet behind portals.' }
    keys: { in: [new], note: 'New nullifier and incoming viewing keys on Grumpkin, generated by the PXE, plus a signing key.' }
    wallet: { in: [dedicated], note: 'An Aztec wallet running a PXE.' }
    indexing: { in: [client], note: 'The PXE queries a node for tagged logs and decrypts its own notes.' }
    tokens: { in: [any], part: [erc20], note: 'AIP-20 tokens and any Noir contract; ERC-20 only bridged in through portals.' }
    hidden: { in: [public, participants, operator], note: 'Sequencers and provers never see plaintext; the node your PXE queries learns what you look up.' }
    controls: { in: [none], part: [freeze, mint], note: 'Nothing at protocol level; a token has freeze or blocklist only if its Noir code adds them.' }
    permission: { in: [selective] }
    disclosure: { in: [viewkey], note: 'The incoming viewing secret opens all of an account’s notes and cannot be rotated; app-scoped secrets can be shared instead.' }
    visibility: { in: [parties], note: 'Sequencers and provers never see plaintext; the node your PXE queries learns what you look up. Only if the holder shares a key or a proof. No notary route.' }
    checks: { in: [none] }
    association: { in: [shared] }
    upgrade: { in: [governance], note: 'Core contracts are immutable; AZTEC holders vote in a new canonical rollup, taking at least 12 days.' }
    exit: { in: ['yes'], note: 'Escape hatch: a 332 million AZTEC bonded proposer every 2 days 23 hours; inclusion is probabilistic.' }
    censorship: { in: ['no'], note: 'Permissionless sequencers sampled into 48-member committees; L2BEAT notes no deterministic maximum inclusion delay.' }
    failure: { in: [funds], note: 'Docs: some circuits are under-constrained; a proving bug can accept invalid transitions and put funds at risk.' }
    value: { in: [lt10m], note: 'L2BEAT, 26 October 2026: USD 104 on V6 (all AZTEC); USD 55,310 left on archived V5.' }
    institutions: { in: [none] }
    audits: { in: ['no'], part: ['yes'], note: 'Aztec docs: "No part of the Aztec stack has been fully audited"; audits ongoing, partial reports published.' }
    incidents: { in: [none], note: 'Critical proving bugs found 17 March (V4) and 27 July 2026 (V5); no loss confirmed, V5 exploitation cannot be ruled out.' }
    license: { in: [open], note: 'Apache 2.0 monorepo.' }
    steward: { in: [dao], part: [company], note: 'AZTEC token governance decides upgrades; Aztec Labs leads core development.' }
    gas: { in: [unknown], note: 'No gas-unit figure published; Aztec quotes a private transfer at under USD 0.05; PSE has no gas data.' }
    latency: { in: [minute], note: 'Seconds of proving plus an L2 block of about 6 s; L1 finality takes up to one 38-minute epoch.' }
    anonymity: { in: [small], note: 'No published figure; value held is tiny (USD 104 on V6, 26 October 2026), so few notes to hide among.' }
  desc: 'A privacy rollup on Ethereum mainnet: for private functions it hides sender, receiver, amount, asset and which function ran, from the public, sequencers and provers, with proofs made on your device. You trust the proof system, not an operator. No protocol-level issuer controls; a token has freeze or blocklist only if coded in. Still labeled alpha: critical proving bugs were found on 17 March and 27 July 2026.'
  sources:
