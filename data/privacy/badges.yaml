    pet: { in: [snark], note: 'UltraPlonk client proofs and a recursive rollup proof (Nightfish), universal setup from Perpetual Powers of Tau; Babyjubjub keys.' }
    proving: { in: [device], part: [server], note: 'Transfers and withdrawals proven by your client; the proposer proves deposits and each rollup block.' }
    pq: { in: ['no'], note: 'BN254 proofs and Babyjubjub keys are exposed.' }
    operator: { in: [self], part: [committee], note: 'You can run the client and a proposer; proposers are certificate-holding, staked and take turns.' }
    external: { in: ['no'] }
    chains: { in: [anyevm], part: [l2, evm], note: 'Testnet on Celo Sepolia; deployments announced on Plume (September 2025) and Starknet (February 2026), status not stated.' }
    keys: { in: [new], note: 'A BIP-32 mnemonic for zero-knowledge keys, plus an Ethereum key and an X.509 certificate key.' }
    wallet: { in: [dedicated], note: 'Each user runs a Nightfall client with its own database.' }
    indexing: { in: [client], note: 'The client tracks on-chain block events and keeps its own commitment database.' }
    tokens: { in: [erc20, nft], note: 'ERC-20, ERC-721, ERC-1155 and ERC-3525.' }
    hidden: { in: [public, participants, operator], note: 'Proposers do not see transfer details, except deposits; no auditor view.' }
    controls: { in: [none], part: [freeze], note: 'No freeze or forced transfer in the pool; revoking a certificate or sanctions listing blocks deposits and withdrawals.' }
    permission: { in: [permissioned], note: 'An X.509 certificate validated on chain; a sanctions-list contract checked at entry and exit.' }
    disclosure: { in: [none], note: 'No viewing key or auditor role in the protocol.' }
    visibility: { in: [parties], note: 'Proposers do not see transfer details, except deposits; no auditor view. No notary route.' }
    checks: { in: [builtin], note: 'An X.509 certificate validated on chain; a sanctions-list contract checked at entry and exit.' }
    association: { in: [name], part: ['no'], note: 'Nightfall_4 requires a certificate, but Polygon Nightfall, its earlier version, ran as an open public service (mainnet beta) from May 2022.', sources: [{ title: 'Polygon, Introducing Polygon Nightfall mainnet (17 May 2022)', url: 'https://www.polygon.technology/blog/introducing-polygon-nightfall-mainnet-decentralized-private-transactions-for-enterprise', checked: '2026-10-26' }] }
    upgrade: { in: [operator], note: 'UUPS proxies upgraded by a single owner key set by each deployment.' }
    exit: { in: ['no'], note: 'Withdrawals need an active proposer; no forced exit on the host chain.' }
    censorship: { in: ['yes'], note: 'The certificate issuer or sanctions-list owner can block entry and exit; proposers can ignore a transaction.' }
    failure: { in: [funds], note: 'No forced exit; a deployment left on the default mock prover accepts any proof.' }
    value: { in: [lt10m], note: 'Testnet only; no real value held, 26 October 2026.' }
    institutions: { in: [none], note: 'EY supports the Plume and Starknet rollouts; no named regulated user.' }
    audits: { in: ['no'], note: 'No audit report published for Nightfall_4.' }
    incidents: { in: [none] }
    license: { in: [open], note: 'Public domain (CC0 1.0).' }
    steward: { in: [company], note: 'EY built it and keeps the repository, but says the code is "not owned by EY".' }
    gas: { in: [lt200k], note: '"Around 6000 Gas" per private transfer, amortized over a 64-transaction block (design document, not measured).' }
    latency: { in: [longer], note: 'Client proof in seconds, but a block’s rollup proof takes about 15 minutes on a 144-core machine.' }
    anonymity: { in: [small], note: 'Testnet only; no production set to hide in.' }
  desc: 'EY’s zero-knowledge rollup (Nightfall_4, public domain) for ERC-20, 721, 1155 and 3525 transfers, hiding sender, receiver, amount and token from the public and from proposers. Entry and exit need an on-chain X.509 certificate and a sanctions-list check; there is no viewing key and no private contract logic. Deploys on any EVM chain; announced on Plume and Starknet, but marked experimental with no confirmed production mainnet. About 6,000 gas per transfer, amortized.'
