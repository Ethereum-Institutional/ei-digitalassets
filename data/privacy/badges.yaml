    exit: { in: ['yes'], note: 'Unshield at any time by calling the contract directly; PPOI is not enforced on-chain.' }
    censorship: { in: ['no'], part: ['yes'], note: 'Contract is permissionless; a flagged user may be refused by wallets and broadcasters but can self-broadcast.' }
    failure: { in: [funds], part: [privacy], note: 'A circuit or contract bug risks funds; a leaked viewing key loses privacy only.' }
    value: { in: [m100to1b], note: 'About USD 112 million across four chains (Ethereum mainnet USD 107 million), excluding RAIL staking; DefiLlama, 26 October 2026.' }
