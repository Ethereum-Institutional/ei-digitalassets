  - { title: 'LFDT blog, Paladin becomes an LF Decentralized Trust project (11 November 2025)', url: 'https://www.lfdecentralizedtrust.org/blog/paladin-a-unified-programmable-privacy-framework-for-evm-becomes-newest-lf-decentralized-trust-project', checked: '2026-10-26' }
