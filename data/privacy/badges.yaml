    tokens: { in: [erc20, nft, any], note: 'ERC-20, ERC-721, ERC-1155 and any EVM contract inside a node; tokens need operator approval on the hub; no ERC-3643 found.' }
    hidden: { in: [public, participants], note: 'Other institutions see only their side; hub validators see ciphertext; the operator can decrypt cross-node messages.' }
    controls: { in: [freeze, mint], note: 'Freeze and unfreeze at three layers, participant freeze, mint and burn.' }
    permission: { in: [permissioned], note: 'Hub registry allow list with roles PARTICIPANT, ISSUER and AUDITOR.' }
    disclosure: { in: [auditor, grant], note: 'An AUDITOR participant gets a full view; the operator can decrypt and attest.' }
    visibility: { in: [notary, operator], note: 'Other institutions see only their side; hub validators see ciphertext; the operator can decrypt cross-node messages. The network operator decrypts cross-node messages (view keys encrypted to its key); a regulator can hold the AUDITOR role. No timelock or on-chain notice documented for operator or auditor decryption.' }
    checks: { in: [capable], note: 'Hub registry allow list with roles PARTICIPANT, ISSUER and AUDITOR.' }
    association: { in: ['no'] }
    upgrade: { in: [operator], note: 'Each network operator governs its hub; each institution its own node.' }
    exit: { in: ['no'], note: 'Cross-node movements need the hub and relayer; no exit without the operator.' }
    censorship: { in: ['yes'], note: 'The operator admits participants and tokens and can freeze them.' }
    failure: { in: [privacy, funds], note: 'A node or operator key breach exposes data; Drex found a relayer failure could cost a participant its balance.' }
    value: { in: [unseen] }
    institutions: { in: [production, public], note: 'Vendor claims production for Núclea (since June 2024) and XP’s Clear USDXP (March 2026); publics: Banco Central do Brasil Drex, Kinexys Project EPIC.' }
