    fees: { in: [protocol], note: '0.3% deposit fee; withdrawals and private transfers through Veil''s relayer carry no extra fee.', sources: [{ title: 'Veil Cash docs, FAQ (fees)', url: 'https://docs.veil.cash/veil-cash-pools/faq', checked: '2026-10-26' }] }
    pet: { in: [snark], note: 'Groth16 proofs with Poseidon hashing (Tornado Cash Nova design).' }
    proving: { in: [device], part: [server], note: 'Transfer and withdrawal proofs are built locally; the deposit proof is generated by Veil’s backend.' }
    pq: { in: ['no'], note: 'Groth16 on BN254 and elliptic-curve note encryption are not quantum-resistant.' }
    operator: { in: [company], note: 'Veil runs the entry queue, deposit engine and relayer; 0xbow screens unverified deposits.' }
    external: { in: ['no'], part: ['yes'], note: 'No other chain; entry relies on 0xbow screening or Coinbase, Binance and Ethos attestations.' }
    chains: { in: [l2], note: 'Base only; a cbBTC pool is deprecated.' }
    keys: { in: [new], part: [existing], note: 'A Veil keypair derived from a wallet signature, a passkey, or imported; each route gives a different key.' }
    wallet: { in: [app], note: 'The Veil web app, SDK, CLI and an MCP server for agents.' }
    indexing: { in: [client], note: 'The client reads encrypted outputs from the pool and decrypts its own.' }
    tokens: { in: [eth, erc20], note: 'ETH and USDC only.' }
    hidden: { in: [public, participants], part: [operator], note: 'FAQ: operators cannot see balances or transfers; the backend that proves deposits sees the deposit.' }
    controls: { in: [none], note: 'No freeze or recovery inside the pool; Circle could freeze the whole USDC pool address.' }
    permission: { in: [selective], part: [permissioned], note: 'Verified addresses (Coinbase EAS, Binance BABT, Ethos) enter at once; others pass 0xbow KYT, usually about 15 minutes.' }
    disclosure: { in: [none], note: 'No separate viewing key; the one Veil private key both decrypts and spends.' }
    visibility: { in: [na], part: [parties], note: 'FAQ: operators cannot see balances or transfers; the backend that proves deposits sees the deposit. Nobody but the key holder can decrypt. No notary route.' }
    checks: { in: [builtin], note: 'Verified addresses (Coinbase EAS, Binance BABT, Ethos) enter at once; others pass 0xbow KYT, usually about 15 minutes.' }
    association: { in: [shared] }
    upgrade: { in: [immutable], part: [company], note: 'Pools are not upgradeable; the owner can only change the validator contract allowed to deposit.' }
    exit: { in: ['yes'], note: 'Withdrawal and transfer functions accept any valid proof from any caller; the relayer is optional.' }
    censorship: { in: ['yes'], note: 'Only the validator contract can deposit, so entry can be refused; exits cannot.' }
    failure: { in: [funds], part: [privacy], note: 'Pool contracts hold the funds; a verifier flaw drained a legacy pool in February 2026.' }
    value: { in: [lt10m], note: '3.77 WETH and 1,918 USDC in the pools, about USD 10,700 (26 Oct 2026); DefiLlama USD 10,669.' }
    institutions: { in: [none], note: 'None found.' }
    audits: { in: ['yes'], note: 'Sherlock collaborative audit of the ETH and USDC pools (10 March 2026); an earlier Pashov audit excluded the verifier.' }
    incidents: { in: [funds], note: 'About 20 Feb 2026 a legacy 0.1 ETH pool with an unfinished trusted setup lost 2.9 ETH; all recovered.' }
    license: { in: [open], note: 'Pool contracts MIT (SPDX headers); entry and queue contracts not published; SDK MIT.' }
    steward: { in: [company], note: 'The veil.cash team, with a VEIL staking token; no legal entity named in the docs.' }
    gas: { in: [gt500k], note: 'Measured on Base: private transfer (transactUSDC) about 1.24 million gas, withdrawal about 1.27 million (Oct 2026).' }
    latency: { in: [minute], part: [longer], note: 'Transfers go through the relayer in about a block; a screened deposit takes about 15 minutes, up to 5 days.' }
    anonymity: { in: [small], part: [medium], note: '6,332 and 2,444 note commitments in the ETH and USDC pools (about two per transaction), 26 Oct 2026.' }
  desc: 'A Tornado Cash Nova fork on Base for ETH and USDC: transfers inside the pool hide sender, recipient and amount, while deposits, withdrawals and the asset (one pool each) stay public. Proofs for transfers and withdrawals are made on your device and the pools cannot be upgraded, so you trust the circuits, not the operator. Entry is screened: verified addresses (Coinbase, Binance or Ethos attestations) or 0xbow KYT on each deposit; the owner can only change who may deposit. ETH pool since 12 June 2025; a legacy fixed-amount pool lost 2.9 ETH in February 2026, all recovered. Audited by Sherlock in March 2026; about USD 11,000 held.'
