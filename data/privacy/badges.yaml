    incidents: { in: [none], note: 'No exploit found; the Drex pilot found double spends detected only after confirmation.' }
    license: { in: [open], part: [available], note: 'Open stack Apache 2.0; Axyl and Enygma under Business Source License 1.1 (the Enygma repository says SSPL).' }
    steward: { in: [company], note: 'Parfin and Rayls Labs; a Rayls Foundation runs the public chain treasury.' }
    gas: { in: ['na'], note: 'Transfers run on private nodes; Enygma verification costs about 280,000 gas on the hub, not on Ethereum mainnet.' }
    latency: { in: [minute], note: 'Drex phase 1: 10 to 60 s for simple cross-node transfers, 1 to 4 minutes for DvP.' }
    anonymity: { in: ['na'], note: 'Nothing reaches the public; on the hub Enygma hides a sender among 2 to 6 institutions.' }
  desc: 'Each institution runs its own EVM privacy node, so balances, counterparties and logic never reach a public ledger; a permissioned Besu hub carries encrypted messages between them. The network operator and appointed auditors can decrypt, and issuers keep freeze, mint and burn. Tested in Brazil’s Drex pilot and in Kinexys Project Epic (2024).'
