    fees: { in: [none], note: 'No protocol fee in the contracts. An optional relayer (AVNU paymaster) takes a fee in the transferred token, set by the relayer owner; Starknet fees are paid in STRK.' }
    pet: { in: [he], note: 'Additively homomorphic ElGamal on the Stark curve, with sigma-protocol proofs (Fiat-Shamir), not SNARKs, so there is no trusted setup.' }
    proving: { in: [device], note: 'The SDK makes every proof on your device; there is no proving service.' }
    pq: { in: ['no'], note: 'ElGamal on the Stark curve rests on discrete logarithms: a future quantum computer could decrypt the ciphertexts stored on chain.', sources: [{ title: 'PSE evaluation, Tongo (Post-quantum secure)', url: 'https://github.com/ethereum/private-transfers-benchmarks/blob/main/project-evaluations/src/data/evaluations/tongo.json', checked: '2026-10-27' }] }
    operator: { in: [self], note: 'No Tongo service is needed: the SDK makes the proofs and anyone may submit, and the relayer is optional. Starknet’s sequencer orders transactions.' }
    external: { in: ['no'], note: 'Only Starknet, which settles to Ethereum mainnet; the AVNU paymaster used by the relayer is optional.' }
    chains: { in: [nonevm], note: 'Starknet only. It is an Ethereum Layer 2 that settles to Ethereum mainnet but runs the Cairo VM, not the EVM. Tongo is Cairo code and does not run on EVM chains.' }
    keys: { in: [new], note: 'A separate Stark-curve key that is not derived from the Starknet wallet key (Starkzap docs). You also need a Starknet account to submit, or a relayer.' }
    wallet: { in: [app], note: 'Balances are read and decrypted through the Tongo SDK or Starkzap; no wallet or custodian support found.' }
    indexing: { in: [none], note: 'The encrypted balance and a decryption hint are stored per public key in the contract; there is nothing to scan.' }
    tokens: { in: [erc20], note: 'Starknet ERC-20s, one ledger per token: USDC, USDT, STRK, ETH and WBTC on v2; USDC.e and DAI also on v1. Not ERC-7984.' }
    hidden: { in: [public, participants], part: [operator], note: 'There is no operator. On ledgers with an auditor key, the instance owner can rotate that key to one it holds.' }
    controls: { in: [none], note: 'The instance owner can only rotate an existing auditor key and approve other ledgers for cross-ledger transfers. There is no freeze, pause, mint or forced transfer.' }
    permission: { in: [permissionless, selective], note: 'Anyone may fund and transfer, with no screening. The v2 ledgers have no auditor, so only the holder can disclose; the v1 ledgers, and any ledger deployed with an auditor key, give a view.' }
    disclosure: { in: [auditor], part: [viewkey], note: 'An optional auditor key is fixed at deployment (a single key, or one split across several auditors). A holder can also make an ex-post proof of one transfer for any third party, checked off chain.' }
    visibility: { in: [parties, notice], note: 'The v2 ledgers (13 July 2026) have no auditor, so only the parties see amounts. The v1 ledgers carry an auditor key, rotatable by the owner, that decrypts every balance and amount without the holder. Setting or rotating the key emits AuditorPubKeySet, and each audited operation stores the auditor ciphertext on chain; the decryption itself leaves no notice.' }
    checks: { in: [none], note: 'No screening in the v2.0.0 contracts. The docs describe range, velocity and allow-list proofs, but no shipped code implements them.' }
    association: { in: [shared], part: [name], note: 'The canonical ledgers are open to anyone. A new ledger deployed through a v2 Vault leaves its tokens in that Vault, alongside the open ledgers’ tokens. A self-deployed Vault would carry only the shared name.' }
    upgrade: { in: [immutable], note: 'The deployed v1 and v2 classes have no upgrade function (read from Starknet mainnet). Starknet’s own contracts can be upgraded instantly by its 9-of-12 Security Council (L2BEAT).' }
    exit: { in: ['yes'], note: 'You withdraw or ragequit with your own proof; no operator is involved. Starknet has no forced inclusion, so an exit stuck at the sequencer needs its Security Council (L2BEAT).' }
    censorship: { in: ['no'], part: ['yes'], note: 'No Tongo owner can block an account. Starknet’s sequencer can delay or refuse a transaction, and users cannot force inclusion (L2BEAT).' }
    failure: { in: [funds, privacy], note: 'A proof or contract bug could drain a ledger: zkSecurity found two proof-forgery issues, marked fixed. A leaked auditor key exposes every amount on its ledger.' }
    value: { in: [lt10m], note: 'About USD 40 across all twelve ledgers: 7.78 USDC in the v2 Vaults; 296 STRK, 12.1 in stablecoins and dust ETH and WBTC in v1 (our Starknet reading, 27 October 2026).' }
    institutions: { in: [none], note: 'No named institution, pilot or partner found (27 October 2026).' }
    audits: { in: ['yes'], note: 'zkSecurity, October 2025: contracts, the SHE library and the TypeScript provers. It made 11 findings, including two high (proof forgery), all marked fixed. No published audit covers the v2 Vault, relayer or external transfers (July 2026).', sources: [{ title: 'zkSecurity, Audit of Tongo (engaged 13 October 2025)', url: 'https://reports.zksecurity.xyz/reports/tongo/', checked: '2026-10-27' }] }
    incidents: { in: [none], note: 'None found.' }
    license: { in: [open], note: 'Apache-2.0 for the contracts, the SDK and the SHE library.' }
    steward: { in: [company], note: 'FAT Solutions (GitHub organization fatlabsxyz).' }
    gas: { in: ['na'], note: 'Not EVM gas. A v2 private transfer used 42.4 million Starknet L2 gas plus 1,696 L1 data gas, a fee of 1.33 to 1.46 STRK (about USD 0.07 at the 27 October 2026 price). Measured on the three v2 transfers (13 to 29 July 2026, our reading); there is no EVM-comparable bucket.' }
    latency: { in: [block], note: 'One Starknet transaction, with proofs made on the device. The receiver needs a rollover transaction before spending, and Ethereum mainnet finality follows with the STARK proof.' }
    anonymity: { in: ['na'] }
  desc: 'Hides balances and transfer amounts with ElGamal encryption on the Stark curve and sigma-protocol proofs made on your device; sender and receiver keys, the token and fund and withdraw amounts stay public. On ledgers deployed with an auditor key (v1), that key decrypts every amount; the v2 ledgers have none. You trust the contracts, the discrete-log assumption and Starknet: no trusted setup, operator or key service, and anyone exits with their own proof. No issuer freeze, pause or mint. Runs on Starknet, a non-EVM Ethereum Layer 2; live since 14 November 2025, audited by zkSecurity, about 130 private transfers and USD 40 held.'
  sources:
  - { title: 'Tongo docs, introduction (what is hidden; ElGamal on the Stark curve; no trusted setup)', url: 'https://docs.tongo.cash/protocol/introduction.html', checked: '2026-10-27' }
  - { title: 'Tongo docs, contracts (v1 and v2 mainnet addresses; our Starknet RPC reading of deployment blocks, owners, auditor keys, balances and transfers, 27 October 2026)', url: 'https://docs.tongo.cash/protocol/contracts.html', checked: '2026-10-27' }
  - { title: 'Tongo docs, auditor (global auditor, rotation, threshold, ex-post proving)', url: 'https://docs.tongo.cash/protocol/auditor.html', checked: '2026-10-27' }
  - { title: 'Tongo docs, ragequit', url: 'https://docs.tongo.cash/sdk/operations/ragequit.html', checked: '2026-10-27' }
  - { title: 'Tongo docs, accounts (key, decryption hints)', url: 'https://docs.tongo.cash/sdk/accounts.html', checked: '2026-10-27' }
  - { title: 'Tongo, website (built by Fat Solutions; relayer fee paid in the transferred asset)', url: 'https://tongo.cash', checked: '2026-10-27' }
  - { title: 'fatlabsxyz/tongo repository (Apache-2.0; v2.0.0 of 13 July 2026; Tongo, Vault and Relayer source)', url: 'https://github.com/fatlabsxyz/tongo', checked: '2026-10-27' }
  - { title: 'zkSecurity, Audit of Tongo (October 2025)', url: 'https://reports.zksecurity.xyz/reports/tongo/', checked: '2026-10-27' }
  - { title: 'Starknet docs, Starkzap confidential transfers (Tongo key separate from the wallet key)', url: 'https://docs.starknet.io/build/starkzap/confidential.md', checked: '2026-10-27' }
  - { title: 'L2BEAT, Starknet (sequencer, forced transactions, Security Council)', url: 'https://l2beat.com/scaling/projects/starknet', checked: '2026-10-27' }
  - { title: 'PSE evaluation, Tongo', url: 'https://github.com/ethereum/private-transfers-benchmarks/blob/main/project-evaluations/src/data/evaluations/tongo.json', checked: '2026-10-27' }
