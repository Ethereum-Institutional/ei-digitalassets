# Privacy badges: one per design, placed in the region matching what it hides from the PUBLIC by default.
# `circle` names the region's primary circle; x,y place the pill inside the overlap where it belongs. Only designs
# available today on an EVM ledger are drawn (owner, 26 October 2026), so every badge is `eth: true`; designs held
# for future review (non-EVM, archived or not yet deployed) wait in held.yaml. Facts checked 26 October 2026; legal history as dates and holdings only. Writing rules: US
# spelling; no em-dashes; quote YAML values that contain ": "; "Ethereum mainnet" for the chain.

as_of: 26 October 2026
badges:
# ---- How much only: amounts and balances hidden, parties visible ----
- id: zama
  name: Zama
  circle: amount
  x: 190
  y: 290
  eth: true
  pse: zama
  status: mainnet
  since: '2025-12-30'
  facts:
    verify: { in: ['no'], note: 'Ethereum mainnet checks 3-of-5 coprocessor signatures on inputs and KMS signatures on decryptions; FHE computation has no validity proof.', sources: [{ title: 'L2BEAT Privacy, Zama confidential tokens (coprocessors trusted for validity; KMSVerifier thresholds)', url: 'https://l2beat.com/privacy/projects/zama-confidential-tokens', checked: '2026-10-26' }, { title: 'PSE evaluation, Zama (Verifiability)', url: 'https://github.com/ethereum/private-transfers-benchmarks/blob/main/project-evaluations/src/data/evaluations/zama.json', checked: '2026-10-26' }] }
    fees: { in: [token], note: 'Gateway fees in ZAMA: 1 ZAMA per encrypted input, 0.1 ZAMA per decryption, paid by the relayer today; prices set by the gateway Safe.', sources: [{ title: 'L2BEAT Privacy, Zama confidential tokens (fees)', url: 'https://l2beat.com/privacy/projects/zama-confidential-tokens', checked: '2026-10-26' }] }
    pet: { in: [fhe], part: [mpc, tee, snark], note: 'TFHE (lattice). Key held by a 13-node threshold MPC in AWS Nitro Enclaves; a ZK proof of knowledge on each encrypted input.' }
    proving: { in: [device], note: 'The client encrypts inputs and builds the proof of knowledge; coprocessors re-verify it.' }
    pq: { part: ['yes'], note: 'TFHE and the MPC are lattice-based; the input proof, ECDSA and EIP-712 signatures are not post-quantum.' }
    operator: { in: [committee], note: '13 named KMS operators and 5 coprocessor operators; a relayer can be self-hosted, the rest cannot (26 October 2026).' }
    external: { in: ['yes'], note: 'Coprocessor network, threshold KMS and the Gateway, an Arbitrum-based rollup (chain id 261131).' }
    chains: { in: [mainnet, evm], part: [own], note: 'Ethereum mainnet and Polygon host chains; the Gateway runs on its own rollup. Other EVM chains in principle.' }
    keys: { in: [existing], note: 'Existing wallet key signs EIP-712 decryption requests; the SDK adds a per-signer ML-KEM transport key.' }
    wallet: { in: [app, custodian], note: 'Balances read through the Zama SDK or relayer; BitGo supports ERC-7984 on Ethereum mainnet with a per-enterprise viewing key.' }
    indexing: { in: [none], note: 'Account-based handles: the wallet reads its balance slot, no scanning.' }
