    visibility: { in: [notice], note: 'Coprocessors see only ciphertext; KMS operators colluding above threshold could decrypt everything. Wrapper owner can add observers who decrypt every amount; L2BEAT: no token has an observer today (26 October 2026). Observer authorization is recorded on chain in the ACL as a decryption delegation; no timelock.' }
    checks: { in: [capable], part: [builtin], note: 'Anyone may hold; the wrapper denylist and the underlying token’s blocklist screen addresses.' }
    association: { in: [shared] }
    upgrade: { in: [company], part: [governance], note: 'Instant upgrades by 9/17 and 3/6 multisigs, no timelock (L2BEAT); operator governance adopts protocol changes.' }
    exit: { in: ['no'], note: 'Unwrapping needs the KMS to decrypt; no escape hatch if the operators stop.' }
    censorship: { in: ['yes'], note: 'Any of 17 pausers can pause the ACL; coprocessors and KMS could refuse service.' }
    failure: { in: [privacy, funds], note: 'KMS collusion loses privacy; a bad upgrade, forged unwrap attestation or coprocessor input could lose funds.' }
    value: { in: [m100to1b], note: 'USD 135.8 million locked in Zama confidential tokens, including USD 11.0 million in ZAMA (L2BEAT, 26 October 2026).' }
    institutions: { in: [public], note: 'Kinexys by J.P. Morgan Project EPIC ran fhEVM in a Kinexys Digital Assets sandbox (November 2024); no regulated institution in production found.' }
    audits: { in: ['yes'], note: 'OpenZeppelin audit of confidential contracts 0.3.0 published March 2026; other audits claimed without public reports.' }
