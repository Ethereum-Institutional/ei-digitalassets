  desc: 'Fixed-size pools that hide only which deposit funded which withdrawal; amounts, the asset and every depositing and withdrawing address stay public. Immutable Groth16 contracts with no operator, no screening and no issuer control inside. On Ethereum mainnet since December 2019. Dates and holdings: designated by OFAC on 8 August 2022; on 26 November 2024 the Fifth Circuit held its immutable smart contracts are not property under IEEPA; removed from the sanctions list on 21 March 2025.'
