- id: zeto
  name: Paladin Zeto
  circle: who
  x: 508
  y: 282
  eth: true
  status: mainnet
  status_note: 'Generally available software (Paladin v1.0.0, 25 June 2026) that each institution deploys itself; no named production deployment found.'
  since: '2026-06-25'
  facts:
    verify: { in: ['yes'], note: 'Verifier contracts check a Groth16 proof for every transfer; no notary.', sources: [{ title: 'Zeto docs, implementations', url: 'https://lfdt-paladin.github.io/zeto/latest/implementations/', checked: '2026-10-26' }, { title: 'Besu docs, Privacy with Paladin (Zeto)', url: 'https://docs.besu-eth.org/private-networks/concepts/privacy-with-paladin', checked: '2026-10-26' }] }
    fees: { in: [none], note: 'Apache 2.0 and self-run; no protocol fee or token.', sources: [{ title: 'LFDT-Paladin/zeto (Apache 2.0)', url: 'https://github.com/LFDT-Paladin/zeto', checked: '2026-10-26' }] }
    pet: { in: [snark], note: 'Groth16 on BN254 (circom, snarkjs) over Poseidon commitments; nullifier variants add a Sparse Merkle Tree.' }
    proving: { in: [device], note: 'The sender proves in its own Paladin node or client; under 30 seconds with native binaries (Besu docs).' }
    pq: { in: ['no'], note: 'Groth16, BN254 and Babyjubjub keys are exposed; the Qurrency variant protects only its ML-KEM-512 auditor channel.' }
    operator: { in: [self], note: 'No notary or operator: holders prove and submit; the recommended client is a Paladin node.' }
    external: { in: ['no'] }
    chains: { in: [anyevm, private], part: [mainnet, l2, evm], note: '"Any EVM blockchain"; the HKMA pilot ran it on four permissionless chains; no named production deployment.' }
    keys: { in: [new], note: 'New Babyjubjub keys for UTXO ownership, alongside the Ethereum key that signs the transaction.' }
    wallet: { in: [app], note: 'A Paladin node or SDK; the FAQ calls building your own wallet "a major engineering effort".' }
    indexing: { in: [client], note: 'Your indexer scans from the contract’s deployment and keeps the Merkle tree.' }
    tokens: { in: [erc20], part: [nft], note: 'Deposit and withdraw against one ERC-20 per contract; non-fungible variants are ERC-721-like, not ERC-721.' }
    hidden: { in: [public, participants, operator], note: 'Only sender and receiver know values; the issuer sees nothing unless a variant encrypts to an arbiter or auditor.' }
    controls: { in: [mint], note: 'Owner-only mint and an optional KYC registry; no freeze, pause, blocklist or forced transfer.' }
    permission: { in: [selective, permissioned], note: 'KYC variants prove membership of an owner-kept key registry, append-only with no revocation.' }
    disclosure: { in: [viewkey], part: [auditor], note: 'Holders disclose their own UTXO secrets; non-repudiation and Qurrency variants encrypt every transfer to an arbiter or auditor key.' }
    visibility: { in: [na], part: [notary, parties], note: 'Only sender and receiver know values; the issuer sees nothing unless a variant encrypts to an arbiter or auditor. Only in the arbiter (non-repudiation) or Qurrency auditor variants, set at contract creation. The arbiter or auditor key decrypts silently; no timelock or on-chain notice.' }
    checks: { in: [capable], note: 'KYC variants prove membership of an owner-kept key registry, append-only with no revocation.' }
    association: { in: ['no'], note: 'Paladin is software each institution deploys for itself; Zeto’s open variants are a technology choice, not a service, so a permissioned deployment is not associated.' }
    upgrade: { in: [operator], note: 'UUPS proxy upgradeable by each deployment’s owner.' }
    exit: { in: ['yes'], note: 'A holder withdraws to the ERC-20 with its own proof; no operator involved.' }
    censorship: { in: ['no'], note: 'No operator; but the owner could upgrade the contract, and KYC variants need the owner to register you.' }
    failure: { in: [funds], part: [privacy], note: 'A soundness bug or a bad trusted setup allows undetectable inflation; lost Babyjubjub keys lose funds.' }
    value: { in: [unseen], note: 'No public production pool found; deployments are per institution.' }
    institutions: { in: [public], note: 'HKMA e-HKD Phase 2 (report October 2025) tested Zeto on four permissionless blockchains; up to 320 times an ERC-20 transfer’s cost.' }
    audits: { in: ['no'], note: 'No published audit, 26 October 2026; the README warns proving keys need a documented ceremony.' }
    incidents: { in: [none], note: 'An under-constrained sum check (issue #92) was fixed on 11 October 2024, before use; no exploit reported.' }
    license: { in: [open], note: 'Apache 2.0.' }
    steward: { in: [foundation], note: 'LF Decentralized Trust, within Paladin; maintained by Kaleido.' }
    gas: { in: [k200to500, gt500k], note: 'Docs estimates, 2-in/2-out: 326,583 (Anon), 425,338 (AnonEnc), about 2.0 to 2.8 million (nullifier, KYC, arbiter variants).' }
    latency: { in: [minute], note: 'Proof under 30 s with native binaries (3 to 5 min first-run WASM warm-up), then one transaction.' }
    anonymity: { in: [small], note: 'Per deployment: holders of one Zeto contract; nullifier variants also hide which coins were spent.' }
  desc: 'Zero-knowledge UTXO tokens in Hyperledger Paladin: Groth16 proofs hide holders and amounts, and the nullifier variants hide which coins were spent. No notary sees transfers; you trust the circuits, the trusted setup and your own keys. Variants add a KYC registry, an arbiter key or a post-quantum (ML-KEM) auditor key; there is no freeze or forced transfer. Any EVM chain; atomic DvP with Noto, Pente and ERC-20. About 330,000 to 2.8 million gas per transfer by variant; tested by the HKMA in its e-HKD pilot (October 2025).'
  sources:
  - { title: 'Zeto docs, implementations (variants and gas)', url: 'https://lfdt-paladin.github.io/zeto/latest/implementations/', checked: '2026-10-26' }
  - { title: 'LFDT-Paladin/zeto (trusted setup, license)', url: 'https://github.com/LFDT-Paladin/zeto', checked: '2026-10-26' }
