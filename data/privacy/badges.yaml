    keys: { in: [existing], part: [new], note: 'Spending and encryption keys derived from one seed, which can be your wallet key; Safe, ERC-4337 and EIP-7702 accounts supported.' }
    wallet: { in: [app], note: 'Partner-only SDK, a Tether WDK wallet module (beta, Plasma testnet) and a Safe privacy add-on (testnet beta).' }
    indexing: { in: [service], note: 'The SDK bootstraps from Bermuda Bay-published chain-state snapshots or its indexer, then decrypts locally.' }
    tokens: { in: [erc20, erc4626], note: 'Any ERC-20 in one multi-token pool, including USDC, EURC and ERC-4626 vault shares.' }
    hidden: { in: [public, participants, operator], note: 'The relayer sees submission metadata only; the screening engine sees depositor addresses; the issuer sees its own token.' }
    controls: { in: [freeze, forced], part: [pause], note: 'Per-token issuer policy, selective freeze and clawback with a proof inside the pool; a Bermuda Bay pauser can halt transfers and claims.' }
    permission: { in: [selective], part: [permissioned], note: 'Deposits screened with expiring approval; flagged lineage is forced to a public exit; issuer allow lists possible.' }
    disclosure: { in: [auditor], part: [viewkey], note: 'Optional issuer viewing key for its token; holders can share a per-withdrawal proof with an exchange or regulator.' }
    visibility: { in: [notary], note: 'The relayer sees submission metadata only; the screening engine sees depositor addresses; the issuer sees its own token. An issuer holding the optional viewing key decrypts transfers of its token without the holder. Viewing-key decryption is off-chain and leaves no notice; clawbacks are on-chain transactions.' }
    checks: { in: [builtin], note: 'Deposits screened with expiring approval; flagged lineage is forced to a public exit; issuer allow lists possible.' }
    association: { in: [shared] }
    upgrade: { in: [immutable], part: [company], note: 'Pool and verifiers are not upgradeable; a governor sets fees, recovery parameters and the public-withdrawal delay and appoints the pauser.' }
    exit: { in: ['yes'], note: 'Withdrawals can be self-submitted; flagged funds exit publicly rather than being blocked; the pauser can halt claims.' }
    censorship: { in: ['yes'], note: 'Screening can refuse a deposit; the relayer can delay or censor, with self-submission as fallback.' }
    failure: { in: [funds], part: [privacy], note: 'The pool holds funds, so a circuit or contract bug risks them; no audit published.' }
    value: { in: [lt10m], note: 'Testnet only; the Gnosis Chain test contracts (May 2026) moved dust amounts of EURe and WXDAI.' }
    institutions: { in: [none], note: 'Linea proof of concept (June 2026) and the GL1 programmable-compliance paper; no regulated institution named in a public.' }
    audits: { in: ['no'], note: 'No third-party audit or bug bounty published; the Safe beta page says it is not audited.' }
    incidents: { in: [none], note: 'None found.' }
    license: { in: [proprietary], part: [open], note: 'Circuits and contracts not public; SDK wallet modules Apache-2.0.' }
    steward: { in: [company], note: 'Hyperpool AG, trading as Bermuda Bay.' }
    gas: { in: [gt500k], note: 'About 2.5 million gas per pool transaction on the Gnosis Chain test contracts (May 2026); nothing published for a mainnet transfer.' }
    latency: { in: [unknown], note: 'No proving time published; the governor sets a delay for public withdrawals.' }
    anonymity: { in: [small], note: '176 and 92 commitments in the two Gnosis Chain test pools (snapshot 24 October 2026); no production pool.' }
  desc: 'A shielded pool over native tokens (USDC, EURC, ERC-4626 shares) that hides balances, amounts and counterparties, built so the issuer keeps a per-token policy, a viewing key, freeze and clawback inside the pool. Screened deposits; flagged funds are forced to a public exit. Noir proofs with a universal setup, made on your device; Bermuda Bay runs the relayer and the screening. On testnets with a partner-only SDK, with a June 2026 cross-chain DvP proof of concept on Linea. The strongest issuer-control design here, with the least track record.'
  sources:
  - { title: 'Bermuda, website', url: 'https://bermudabay.xyz', checked: '2026-10-26' }
  - { title: 'Bermuda docs, how compliance works', url: 'https://docs.bermudabay.xyz/compliance-solution/how-compliance-works', checked: '2026-10-26' }
