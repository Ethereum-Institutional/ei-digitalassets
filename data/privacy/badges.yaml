  - { title: 'L2BEAT, Aztec Network v6 (Stage 2; TVS; 3,191 sequencers; governance; v6 canonical 26 October 2026)', url: 'https://l2beat.com/scaling/projects/aztecnetworkv6', checked: '2026-10-26' }
