# Digital Asset Taxonomy: layout (geometry only)
# cx,cy,rx,ry = ellipse center and radii; t:rect uses x,y,w,h,r. lx,ly = label anchor; fs/fw = label font size/weight.
# suby/sy/s3y/liney/l2y position the small sub-labels. Units are SVG user units on a 1600×1300 canvas.

# bridges: corridors that join a lens group's perimeter into one continuous outline, keyed "<lens id>.<group id>".
#   Each corridor is a list of [x, y] waypoints routed through empty space so the outline encloses no other circle.
bridges:
  ch.pay:
  - [[330, 560], [372, 610], [930, 610], [964, 550]]   # Other Layer-1s → USDC, USDT
  - [[330, 560], [412, 700], [406, 792], [380, 838]]   # Other Layer-1s → Community Coins (clear of the Other Crypto-Assets title)

# annotations: small drawn notes. `caption` = a leader line and a label that belongs to a circle (it dims with it);
#   `connector` = a dotted link with a dot at its end and free-standing labels.
annotations:
- kind: caption            # the two hybrid overlaps in Financial Instruments
  circle: sn
  path: M1290 1071 L1290 1104
  x: 1290
  y: 1116
  label: Structured notes
- kind: caption
  circle: trk
  path: M1288 891 L1288 868
  x: 1288
  y: 861
  label: Trackers & warrants
- kind: connector          # "look-alike": Deposit Token ⇢ bank-issued stablecoins (Commercial Bank ∩ Stablecoins)
  path: M786 459 Q 790 472 784 486
  dot: [784, 488]
  color: '#14213d'
  labels:
  - { x: 796, y: 470, text: look-alike, italic: true }
  - { x: 762, y: 500, text: bank-issued, size: 9, color: '#3b4580', anchor: middle }
- kind: connector          # "look-alike": Synthetic Dollars ⇢ Stablecoins (in Other Issuers)
  path: M1152 449 Q 1160 465 1154 480
  dot: [1154, 482]
  color: '#14213d'
  labels:
  - { x: 1164, y: 468, text: look-alike, italic: true }
- kind: connector          # "claim on": Staked & Wrapped ⇢ Native Cryptocurrencies, shown while Staked & Wrapped is picked
  'on': lst
  path: M189 840 C 150 780, 168 660, 296 584
  dot: [298, 582]
  color: '#14213d'
  labels:
  - { x: 120, y: 760, text: claim on, italic: true }
