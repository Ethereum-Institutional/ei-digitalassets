# Digital Asset Taxonomy: column layout (geometry only), used on narrow screens; layout.yaml is the wide one.
# cx,cy,rx,ry = ellipse center and radii; t:rect uses x,y,w,h,r. lx,ly = label anchor; fs/fw = label font size/weight.
# suby/sy/s3y/liney/l2y position the small sub-labels. Units are SVG user units on a 700×3190 canvas.
# Column layout (owner, 9 November 2026), shown under 900px: read top to bottom as Digital Money (Tokenized Currencies, then Native
# Cryptocurrencies), Tokenized Real-World Assets (Financial Instruments, then Commodities, then the rest) and Other
# Crypto-Assets, so the map reads on a scrolling screen and a phone. Tokenized Currencies is the wide 1600×1300 block
# turned on its side: the four issuer circles stacked, the Stablecoins band running down beside them, so every overlap
# keeps its meaning. Badge places for this layout are `column:` in tokens.yaml.

# Lens corridors (`bridges`) join a lens group's perimeter into one continuous outline, keyed "<lens id>.<group id>";
#   each corridor is a list of [x, y] waypoints routed through empty space so the outline encloses no other circle.
#   ch.pay: Other Layer-1s up into the Stablecoins band (USDC, USDT), and down the right margin to Community Coins.
# Drawn notes (`annotations`): `caption` = a leader line and a label that belongs to a circle (it dims with it);
#   `connector` = a dotted link with a dot at its end and free-standing labels. The "claim on" link from Staked &
#   Wrapped to Native Cryptocurrencies runs up the left margin, shown only while Staked & Wrapped is picked.
