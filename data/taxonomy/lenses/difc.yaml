# Lens: DIFC DFSA (crypto, fiat crypto and investment tokens)
# status: in | part | out per circle id (part = depends, exempt or restricted). Circles not listed are outside,
#   except containers (derived from their children). `groups` draw one dotted perimeter per group and mark its circles as inside.
# notes: the sentence shown under a circle's definition when this lens is active.
# Please add sources (URL + date) for every regulatory claim you change.

id: difc
group: jurisdiction
menu: 'AE · DIFC (DFSA): crypto, fiat crypto & investment tokens'
name: 'DIFC DFSA: crypto, fiat crypto and investment tokens'
short: DIFC DFSA
color: '#14130f'
intro: In the DIFC, the DFSA defines a Crypto Token as a token used, or intended to be used, as a medium of exchange or for payment or investment. It carves out Excluded Tokens (NFTs, utility tokens, CBDCs) and Investment Tokens (tokenized securities and derivatives, regulated as investments). Stablecoins are “Fiat Crypto Tokens” with extra recognition criteria. Privacy and algorithmic tokens are Prohibited Tokens. Firms may only deal in tokens the DFSA has recognized. This lens shows all three categories the DFSA regulates; Excluded Tokens (NFTs, utility tokens, CBDCs) are faded.
groups:
- id: ct
  label: Crypto Tokens
  name: recognized by the DFSA
  color: '#a21caf'
  circles:
  - btc
  - eth
  - comm
  - gov
  - lst
- id: fct
  label: Fiat Crypto Tokens
  name: stablecoins meeting extra criteria
  color: '#0ea5e9'
  circles:
  - lsc
- id: inv
  label: Investment Tokens
  name: regulated as investments
  color: '#155e75'
  circles:
  - sec
  - eq
  - fund
  - fi
  - dv
  - sn
  - trk
status:
  nat: in
  natoth: part
  cbdc: out
  td: out
  dt: out
  sc: in
  unreg: part
  alg: part
  pm: part
  ocom: part
  re: part
  pc: part
  coll: part
  ip: part
  art: out
  game: part
  util: out
  loy: part
  id: out
  fmi: part
  syn: part
notes:
  btc: A DFSA-recognized Crypto Token.
  eth: A DFSA-recognized Crypto Token.
  natoth: A Crypto Token, but usable in the DIFC only once recognized by the DFSA.
  cbdc: CBDCs are Excluded Tokens.
  td: A deposit, not a Crypto Token.
  dt: A deposit, not a Crypto Token, whatever it is called.
  sc: 'Fiat Crypto Tokens: Crypto Tokens subject to additional recognition criteria. The DFSA does not regulate their issuance.'
  lsc: Fiat Crypto Tokens verified by the DFSA as suitable (reported to be USDC, EURC and RLUSD) can be used for payments, settlement and margining in the DIFC. Since 12 January 2026 firms assess other crypto tokens themselves, but fiat tokens are still verified by the DFSA.
  USDC: Reported as assessed suitable by the DFSA as a Fiat Crypto Token; Circle’s issuance is not regulated by the DFSA.
  unreg: Still a Crypto Token by definition, but a fiat-referenced token the DFSA has not verified cannot be used as a Fiat Crypto Token in the DIFC.
  alg: 'A Prohibited Token: no financial services may be provided in relation to it.'
  sec: 'Investment Tokens: regulated as investments, not Crypto Tokens.'
  dv: Futures and options, including on Crypto Tokens, are regulated as investments.
  fund: 'Investment Tokens: tokenized fund units, including MMFs.'
  pm: A Crypto Token if used for payment or investment and not an Investment Token; assessed case by case.
  ocom: Investment Token if structured as a derivative; otherwise assessed case by case.
  re: Investment Token if it confers rights in a security or fund; assessed case by case.
  pc: Usually an Investment Token (debt instrument).
  coll: Assessed case by case.
  ip: Usually an Investment Token where it confers income rights.
  art: NFTs are Excluded Tokens.
  util: Utility tokens are Excluded Tokens.
  game: Excluded where it is a utility or non-fungible token.
  loy: 'Generally an Excluded (utility) Token. Tickets and passes: non-fungible / utility: an Excluded Token.'
  id: 'Non-fungible / utility: an Excluded Token.'
  fmi: A wholesale settlement asset, typically regulated as a payment system rather than as a crypto token.
sources:
- title: DFSA, updated rules on the regulation of crypto tokens in the DIFC (effective 12 January 2026)
  url: https://www.dfsa.ae/news/dfsa-issues-updated-rules-regulation-crypto-tokens-difc
  checked: '2026-10-24'
last_reviewed: '2026-10-24'
