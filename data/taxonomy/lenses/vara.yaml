id: vara
group: jurisdiction
menu: 'AE · Dubai (VARA): “virtual asset”'
name: Dubai VARA “virtual asset”
short: Dubai VARA
color: '#0369a1'
intro: Dubai Law No. 4 of 2022 defines a virtual asset broadly, as a digital representation of value that can be digitally traded or transferred and used for exchange, payment or investment, and lets VARA add any other digital representation of value. It has no express carve-out for securities or fiat. In practice the line is drawn by the asset inside the token. Security tokens (shares, bonds and sukuk, fund and SPV units) fall to the federal Capital Markets Authority (CMA), which replaced the Securities and Commodities Authority (SCA) on 1 January 2026. Dirham payment tokens, the Digital Dirham and bank deposits fall to the CBUAE. Applies in Dubai outside the DIFC.
