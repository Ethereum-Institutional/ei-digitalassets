notes:
  cbdc: CBDC is expressly excluded.
  td: Deposits; the Bank of Korea has piloted deposit tokens (Project Hangang).
  dt: Deposits; the Bank of Korea has piloted deposit tokens (Project Hangang).
  sc: Stablecoins are virtual assets today. Korea has no stablecoin license yet; the Digital Asset Basic Act, still being negotiated, would introduce authorization for won stablecoins.
  sec: Electronically registered securities are excluded; security tokens fall under capital-markets law.
  rwa: Excluded where structured as securities; otherwise assessed case by case.
  game: Game money and items are expressly excluded.
  art: NFTs are generally excluded unless issued in large fungible series or used for payment.
  loy: Excluded where it is a prepaid instrument or e-money.
  fmi: A wholesale settlement asset, typically regulated as a payment system rather than under crypto-asset rules; check local treatment.
