notes:
  cbdc: CBDC is expressly excluded.
  td: Deposits; deposit tokens linked to the CBDC network are excluded from the virtual asset definition (June 2024 decree), and the Bank of Korea has piloted them (Project Hangang).
  dt: Deposits; deposit tokens linked to the CBDC network are excluded from the virtual asset definition (June 2024 decree), and the Bank of Korea has piloted them (Project Hangang).
  sc: 'Stablecoins are virtual assets today. Korea has no stablecoin license yet; the Digital Asset Basic Act, still pending, would introduce authorization for won stablecoins, and the FSC’s September 2026 roadmap makes stablecoin-linked payments conditional on it.'
  sec: Electronically registered securities are excluded; security tokens fall under capital-markets law, with the FSC’s tokenization roadmap starting in February 2027 (private money market funds, institutional bonds, unlisted shares through trusts, fractional investment securities).
  rwa: Excluded where structured as securities; otherwise assessed case by case.
  game: Game money and items are expressly excluded.
  art: NFTs are excluded by the June 2024 enforcement decree unless, under the FSC’s guidelines, they are issued in large fungible series or used for payment.
  loy: Excluded where it is a prepaid instrument or e-money.
  fmi: A wholesale settlement asset, typically regulated as a payment system rather than under crypto-asset rules; check local treatment.
