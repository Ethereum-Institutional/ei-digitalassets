notes:
  cbdc: 'CBDC is expressly excluded. In the Bank of Korea’s Project Hangang pilot, only participating banks hold CBDC, for interbank settlement; users hold bank deposit tokens.'
  td: 'Deposits; deposit tokens linked to the CBDC network are excluded from the virtual asset definition (June 2024 decree). In the Bank of Korea’s Project Hangang, banks issue deposit tokens to users’ wallets: seven banks ran phase 1 in 2025, and on 15 July 2026 the FSC designated phase 2, with nine banks, up to 500,000 wallets, transfers between users and treasury payments.'
  dt: 'Deposits; deposit tokens linked to the CBDC network are excluded from the virtual asset definition (June 2024 decree). In the Bank of Korea’s Project Hangang, banks issue deposit tokens to users’ wallets: seven banks ran phase 1 in 2025, and on 15 July 2026 the FSC designated phase 2, with nine banks, up to 500,000 wallets, transfers between users and treasury payments.'
  sc: 'Stablecoins are virtual assets today. Korea has no stablecoin license yet; the Digital Asset Basic Act, still pending, would introduce authorization for won stablecoins, and the government draft the FSC’s Virtual Asset Committee discussed on 4 March 2026 centers issuance on banks holding 50% plus one share. The FSC’s September 2026 roadmap makes stablecoin-linked payments conditional on that legislation.'
  sec: 'Electronically registered securities are excluded; security tokens fall under capital-markets law. Amendments to the Act on Electronic Registration of Stocks and Bonds and the Financial Investment Services and Capital Markets Act, passed on 15 January 2026, recognize a distributed ledger as a securities register from 4 February 2027, when the FSC’s tokenization roadmap starts (private money market funds, institutional bonds, unlisted shares through trusts, fractional investment securities). Draft FSC rules of 1 October 2026 would require the ledger to be shared by at least two account management entities and the Korea Securities Depository.'
  rwa: 'Excluded where structured as securities; otherwise assessed case by case. Investment contract securities, issued so far for art and livestock projects, can be traded through securities firms under amendments passed on 15 January 2026 and in force from 4 February 2027; draft FSC rules of 1 October 2026 would let them be issued as tokens.'
  game: Game money and items are expressly excluded.
  art: NFTs are excluded by the June 2024 enforcement decree unless, under the FSC’s guidelines, they are issued in large fungible series or used for payment.
  loy: Excluded where it is a prepaid instrument or e-money.
  fmi: A wholesale settlement asset, typically regulated as a payment system rather than under crypto-asset rules; check local treatment.
