name: South Korea “virtual asset”
short: South Korea
color: '#4338ca'
intro: Korea defines virtual assets (Specified Financial Information Act) as electronic certificates with economic value that can be traded or transferred, excluding game items, prepaid instruments and e-money, electronically registered securities, electronic bills and CBDC; NFTs are generally excluded under FSC guidance. The Virtual Asset User Protection Act (July 2024) protects users. The Digital Asset Basic Act (exchange licensing and a won-stablecoin framework) is still being negotiated, including whether only banks may issue.
