menu: 'KR · South Korea (FSC): “virtual asset”'
name: South Korea FSC “virtual asset”
short: South Korea FSC
color: '#4338ca'
intro: 'The Financial Services Commission (FSC) writes the rules, the Financial Supervisory Service inspects, and the FSC’s Financial Intelligence Unit (KoFIU) registers providers. A virtual asset is an electronic token with economic value that can be traded or transferred electronically, excluding what other laws already cover or what poses no harm to users: in-game currency, e-money, digital shares, CBDC, and, since the June 2024 enforcement decree, electronic bonds, mobile gift certificates, deposit tokens linked to the CBDC network and non-fungible tokens, read with the FSC’s guidelines on when an NFT is a virtual asset. The Act on the Protection of Virtual Asset Users (enacted 18 July 2023, in force 19 July 2024) requires segregated assets, bank-held deposits, cold storage, insurance and bans unfair trading. The Digital Asset Basic Act (exchange licensing and a won-stablecoin framework) is still pending; the FSC’s tokenization roadmap of 4 September 2026 starts securities tokenization in February 2027 and makes stablecoin-linked on-chain payment its final phase, subject to that legislation.'
