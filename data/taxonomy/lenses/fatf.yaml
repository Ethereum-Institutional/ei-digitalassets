# Lens: FATF standards (AML)
# status: in | part | out per circle id (part = depends, exempt or restricted). Circles not listed are outside,
#   except containers (derived from their children). `groups` draw one dotted perimeter per group and mark its circles as inside.
# notes: the sentence shown under a circle's definition when this lens is active.
# Please add sources (URL + date) for every regulatory claim you change.

id: fatf
group: standard-setter
menu: 'FATF: AML standards (virtual & financial assets)'
name: FATF standards (AML)
short: FATF
color: '#14130f'
intro: The FATF defines a virtual asset as a digital representation of value that can be digitally traded or transferred and used for payment or investment. It excludes digital representations of fiat currencies, securities and other financial assets already covered by the FATF Recommendations. It is the anti-money-laundering perimeter behind most national VASP regimes (including VARA’s definition) and the Travel Rule.
groups:
- id: va
  label: Virtual assets
  name: VASP rules and Travel Rule
  color: '#a21caf'
  circles:
  - btc
  - eth
  - natoth
  - sc
  - unreg
  - alg
  - comm
  - gov
  - util
  - lst
- id: fa
  label: Fiat and financial assets
  name: covered by bank and securities AML rules
  color: '#155e75'
  circles:
  - cbdc
  - fmi
  - td
  - dt
  - sec
  - eq
  - fund
  - fi
  - dv
  - sn
  - trk
status:
  nat: in
  pm: part
  ocom: part
  re: part
  pc: part
  coll: part
  ip: part
  art: part
  game: part
  loy: part
  id: part
  tix: part
notes:
  cbdc: 'Fiat currency: outside the virtual-asset definition, but covered as fiat.'
  td: Not a virtual asset (a digital representation of fiat), but squarely within FATF standards through bank AML rules.
  dt: Not a virtual asset, but covered through bank AML rules as a deposit.
  sc: Stablecoins are treated as virtual assets (or as financial assets where they already fall under other FATF rules).
  unreg: 'In scope: issuers and service providers face AML/CFT and Travel Rule obligations.'
  sec: 'Not virtual assets: tokenized stocks, bonds and funds are securities, covered by the FATF Recommendations for securities firms and other financial institutions.'
  rwa: Out where the token is a security or other covered financial asset; otherwise assessed on function.
  art: NFTs are generally not virtual assets unless used for payment or investment in practice.
  loy: Closed-loop points that cannot be traded are generally outside.
  game: Outside if not tradeable or transferable outside the game.
  eq: 'Tokenized stocks are securities: outside the virtual-asset definition, inside FATF standards as financial assets.'
  fmi: 'Backed by central bank money: covered as fiat through FMI and bank AML rules, not as a virtual asset.'
sources: []
