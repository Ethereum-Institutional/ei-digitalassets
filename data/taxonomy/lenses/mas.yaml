notes:
  cbdc: Money, not a DPT.
  wcbdc: 'Central bank money, not a DPT. MAS is trialing tokenized MAS Bills settled in wholesale CBDC on the Singapore dollar Test Network (SGD Testnet), with issues from 23 September 2026. On 16 November 2026 MAS and the Deutsche Bundesbank reported a successful test, Project Simbolon, of EUR/SGD payment-versus-payment settlement in wholesale CBDC across their separate test environments.'
  td: 'Bank deposits; MAS will issue separate guidance on tokenized deposits. BLOOM, an MAS initiative launched on 16 October 2025 to enable settlement in tokenized bank liabilities and well-regulated stablecoins, added Bank Negara Malaysia and the Bank of Thailand as policymaker members on 23 October 2026.'
  dt: 'Bank deposits, not DPTs; MAS will issue separate guidance on tokenized deposits. Since 17 April 2026, under an MAS consultation, banks may treat a cryptoasset on a permissionless blockchain as Group 1 for capital if it meets MAS’s risk requirements (for example, an issuer able to freeze or correct transactions and allowlisted holders), within exposure and issuance caps, until the rules are final.'
  sc: 'Stablecoins are DPTs today. Under the draft amendments (MAS, 1 September 2026), licensed issuers of single-currency stablecoins pegged to the Singapore dollar or a G10 currency could market them as “MAS-regulated stablecoins”, with no interest to holders and the technical ability to trace, freeze or burn tokens used for illicit activity; other stablecoins would remain DPTs. MAS proposed on 16 October 2026 that MAS-regulated stablecoin issuers join the Financial Industry Disputes Resolution Centre (FIDReC) after the framework comes into force.'
  unreg: 'A DPT, with proposed retail protections for non-MAS-regulated stablecoins. The draft amendments (MAS, 1 September 2026) would let MAS designate a stablecoin as systemic whether or not it is issued or licensed in Singapore, and direct licensed service providers to stop offering or delist one that fails its requirements.'
  alg: A DPT, but cannot be a MAS-regulated stablecoin.
  sec: Capital markets products under the SFA.
  dv: Derivatives contracts under the SFA (crypto derivatives included).
  fund: Units in collective investment schemes under the SFA, tokenized MMFs included.
  pm: 'Depends on structure: DPT, or capital markets product if it is a derivative or fund unit.'
  ocom: Depends on structure.
  re: Usually a capital markets product.
  pc: Usually a capital markets product (debenture).
  coll: Depends on structure.
  ip: Usually a capital markets product.
  art: NFTs are generally not DPTs unless used as a medium of exchange.
  gov: A DPT if used as a medium of exchange; otherwise may fall outside.
  util: A DPT if used as a medium of exchange; otherwise may fall outside.
  game: Limited-purpose in-game tokens are excluded.
  loy: 'Limited-purpose loyalty points are excluded. Tickets and passes: generally limited-purpose, so outside.'
  id: Generally outside.
  fmi: A wholesale settlement asset, typically regulated as a payment system rather than under crypto-asset rules; check local treatment.
