notes:
  cbdc: Money, not a DPT.
  td: Bank deposits; MAS will issue separate guidance on tokenized deposits.
  dt: Bank deposits, not DPTs; MAS will issue separate guidance on tokenized deposits.
  sc: Stablecoins are DPTs today. Under the draft amendments, licensed issuers of single-currency stablecoins pegged to the Singapore dollar or a G10 currency could market them as “MAS-regulated stablecoins”, with no interest to holders; other stablecoins would remain DPTs.
  unreg: A DPT, with proposed retail protections for non-MAS-regulated stablecoins.
  alg: A DPT, but cannot be a MAS-regulated stablecoin.
  sec: Capital markets products under the SFA.
  dv: Derivatives contracts under the SFA (crypto derivatives included).
  fund: Units in collective investment schemes under the SFA, tokenized MMFs included.
  pm: 'Depends on structure: DPT, or capital markets product if it is a derivative or fund unit.'
  ocom: Depends on structure.
  re: Usually a capital markets product.
  pc: Usually a capital markets product (debenture).
  coll: Depends on structure.
  ip: Usually a capital markets product.
  art: NFTs are generally not DPTs unless used as a medium of exchange.
  gov: A DPT if used as a medium of exchange; otherwise may fall outside.
  util: A DPT if used as a medium of exchange; otherwise may fall outside.
  game: Limited-purpose in-game tokens are excluded.
  loy: Limited-purpose loyalty points are excluded.
  id: Generally outside.
  tix: Generally limited-purpose, so outside.
  fmi: A wholesale settlement asset, typically regulated as a payment system rather than under crypto-asset rules; check local treatment.
