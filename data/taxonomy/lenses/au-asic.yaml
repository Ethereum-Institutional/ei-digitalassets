# Lens: Australia, ASIC “financial product”
# status: in | part | out per circle id (part = depends, exempt or restricted). Circles not listed are outside,
#   except containers (derived from their children). notes: the sentence shown under a circle's definition when this
#   lens is active. Please add sources (URL + date) for every regulatory claim you change.
# Here “in” means a financial product under Chapter 7 of the Corporations Act 2001 (ASIC's perimeter), “part” depends
#   on the rights attached, “out” means ASIC's guidance or the Act says it is unlikely to be, or is not, a financial
#   product. Where INFO 225 gives no example, a note says so and the reading is marked as Ethereum Institutional's
#   (owner-approved house views, 9 November 2026). The Corporations Amendment (Digital Assets Framework) Act 2026
#   commences on 8 April 2027; readings that change on that date say so.

id: au-asic
group: jurisdiction
menu: 'AU · Australia (ASIC): “financial product”'
name: Australia, ASIC “financial product”
short: AU ASIC
color: '#155e75'
intro: 'Australia tests what a token does, not what it is called. ASIC asks whether a digital asset is a financial product under Chapter 7 of the Corporations Act 2001: a facility for making a financial investment, managing financial risk or making non-cash payments, or one of the listed products (a security, an interest in a managed investment scheme, a derivative, a deposit-taking facility of a bank). Its Information Sheet 225, updated in October 2025, works through 18 examples and warns that overseas categories such as security, utility and exchange tokens "do not necessarily translate" to Australia, where the definition is often broader. The High Court confirmed the breadth on 17 June 2026: a fixed-yield "earn" product funded in dollars was both a financial investment facility and a derivative. From 8 April 2027 the Digital Assets Framework Act makes digital asset platforms and tokenised custody platforms financial products, so their operators need an Australian financial services licence (applications open on 8 April 2027; a platform already operating must apply by 7 October 2027 to keep operating while ASIC assesses it), and it excludes public digital token infrastructure, consensus rewards, custodial staking offered through a licensed platform and the redemption right of qualifying wrapped tokens. Still open: payment stablecoin issuers are to move into a payments licensing regime, regulations on digital assets related to public infrastructure are anticipated, and ASIC''s guidance on these points is out for consultation until 27 November 2026.'
