# Lens: ISO 22739 vocabulary (technical terms, not law)
# status: in | part | out per circle id (part = depends, exempt or restricted). Circles not listed are outside,
#   except containers (derived from their children). `groups` draw one dotted perimeter per group and mark its circles as inside.
# notes: the sentence shown under a circle's definition when this lens is active.
# The definitions are paraphrased from the standard's text, never quoted (ISO's wording is copyrighted); cite the
# clause number with each one. The vocabulary was read in its EN ISO 22739:2025 adoption, identical to ISO 22739:2024.

id: iso
group: standard-setter
menu: 'ISO 22739: blockchain and DLT vocabulary'
name: ISO 22739 vocabulary
short: ISO
color: '#14130f'
intro: 'ISO 22739:2024 is the international vocabulary for blockchain and distributed ledger technologies. It defines terms by technology, not by law. Its crypto-asset is any digital asset implemented with cryptography, which reaches every circle on this map, CBDCs, deposits and tokenized securities included; regulators’ “crypto-asset” is a narrower legal term. Three of its token terms draw the groups: cryptocurrency, designed for payment or value exchange under decentralized control; security token, a token that is a financial or investment instrument under the applicable law; and utility token, used to obtain goods or services, usually from its issuer. Non-fungible token is a property of any token, so it is noted, not drawn. The vocabulary has no term for stablecoins, CBDCs, tokenized deposits or tokenized real-world assets.'
