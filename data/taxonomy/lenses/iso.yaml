notes:
  nat: 'Cryptocurrency (ISO 22739, 3.15): a crypto-asset designed as a means of payment or value exchange. ISO’s note adds decentralized control, with cryptography securing transactions, the creation of new units and transfers.'
  alg: 'Designed as a means of payment under decentralized, algorithmic control: a cryptocurrency in ISO’s terms.'
  tc: 'ISO 22739 has no term for tokenized currency, CBDCs, deposit tokens or stablecoins. Each is a crypto-asset and a token (an asset representing a collection of entitlements, 3.92) designed for payment, but an issuer’s control sets it apart from the decentralized control in ISO’s note on cryptocurrency.'
  sc: 'Not an ISO term. A design under decentralized control reads as a cryptocurrency; a coin an issuer redeems from reserves does not meet ISO’s note on decentralized control.'
  unreg: 'Crypto-collateralized designs run by their protocol read as cryptocurrencies in ISO’s terms; reserve-backed coins with an issuer in control do not.'
  comm: 'A community coin used for payment reads as a cryptocurrency; one held for speculation or membership is only a token in ISO’s vocabulary.'
  sec: 'Security token (ISO 22739, 3.84): a token that meets the definition of a financial instrument or other investment instrument under the law of the jurisdiction. ISO leaves the test to the law, so the group follows this map’s Financial Instruments.'
  rwa: 'ISO has no term for tokenized real-world assets. A token over real estate, credit, a commodity or a collectible is a security token where the law treats it as a financial or investment instrument, and otherwise a token: an asset representing a collection of entitlements (3.92).'
  gov: 'No ISO term. A governance token is a security token only where the law treats it as an investment instrument.'
  util: 'Utility token (ISO 22739, 3.96): a token its holder can use to obtain goods or services. ISO notes it is usually accepted only by its issuer; tokens for a network’s resources are accepted by the protocol instead.'
  loy: 'The closest fit for ISO’s utility token: redeemed with the issuer that accepts it.'
  game: 'In-game currency spent with the publisher is a utility token; items and characters are usually non-fungible tokens (3.64).'
  id: 'A name or credential is usually a non-fungible token (3.64); one used to reach a service is also a utility token.'
  art: 'Non-fungible token (ISO 22739, 3.64): a token whose units cannot be substituted one for another. Fungibility is a property of any token in ISO’s vocabulary, not a class, so it draws no perimeter here.'
  coll: 'Usually a non-fungible token (3.64); a security token where the law treats it as an investment instrument.'
  lst: 'No ISO term: a token representing an entitlement to staked or wrapped native coins (3.92).'
sources:
