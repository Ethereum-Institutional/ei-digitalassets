# Lens: Australia, AUSTRAC “virtual asset”
# status: in | part | out per circle id. Here “in” means a virtual asset under section 5B of the Anti-Money Laundering
#   and Counter-Terrorism Financing Act 2006 (as inserted by the 2024 amendment, in force 31 March 2026), “part” depends
#   on the token's function or rights, “out” means the Act excludes it. Readings beyond the Act's text are marked as
#   Ethereum Institutional's (owner-approved house views, 9 November 2026).

id: au-austrac
group: jurisdiction
menu: 'AU · Australia (AUSTRAC): “virtual asset”'
name: Australia, AUSTRAC “virtual asset”
short: AU AUSTRAC
color: '#a21caf'
intro: 'Australia''s anti-money-laundering regulator asks a different question from ASIC: whether a token is a virtual asset under section 5B of the AML/CTF Act, as amended in 2024 with effect from 31 March 2026. A virtual asset is a digital representation of value that functions as a medium of exchange, a store of economic value, a unit of account or an investment, is not issued by or under the authority of a government body, and can be transferred, stored or traded electronically; a token that lets its holder vote on the governance of such arrangements is expressly included. Money, value used only inside an electronic game, loyalty or reward points, and similar things not meant to be convertible are excluded. The designated services are exchanging virtual assets for money or for other virtual assets, safekeeping, services in connection with an offer or sale, and transfers of value that involve a virtual asset, which carry the travel rule. Securities and derivatives keep their Corporations Act meaning inside the AML/CTF Act, so a tokenised security is regulated as a security first, and AUSTRAC reads a simple digital record of owning shares as outside the definition. AUSTRAC''s own examples: bitcoin, ether, USDC, USDT, DAI and AUDD, governance tokens, and NFTs that represent a weight of gold; money on deposit and a CBDC are money, not virtual assets. Exchange between virtual assets and money has been regulated since 2018; the other new services carry full obligations from 1 July 2026, and reporting of transfers involving unverified self-hosted wallets starts on 31 March 2029.'
