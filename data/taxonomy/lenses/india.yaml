id: india
group: jurisdiction
menu: 'IN · India (CBDT and FIU-IND): “virtual digital asset”'
name: 'India CBDT and FIU-IND “virtual digital asset”'
short: India CBDT and FIU-IND
color: '#a21caf'
intro: 'India has no dedicated crypto licensing regime; two arms of the Ministry of Finance apply one definition. The Central Board of Direct Taxes administers the “virtual digital asset” (VDA) definition, carried into the Income-tax Act, 2025 from 1 April 2026: any cryptographically generated information, code, number or token representing value that can be transferred, stored or traded electronically, non-fungible tokens, and anything else the government notifies, excluding Indian and foreign currency, with a power to exclude assets by notification (used for gift cards and reward points); it drives a flat tax and tax deducted at source on transfers. Under section 509 of that Act and rules 241 to 244 of the Income-tax Rules, 2026, crypto-asset service providers report the transactions of users resident outside India from calendar year 2026, with penalties for failing to report or reporting inaccurately (section 446), and since 1 January 2026 the Common Reporting Standard also covers interests in crypto-assets and accounts holding CBDC. The Financial Intelligence Unit (FIU-IND) registers VDA service providers as reporting entities under the anti-money-laundering act (notice of 4 July 2023), sets their due diligence, travel rule and sanctions screening duties in guidelines updated on 8 January 2026, and pursues offshore platforms serving Indian users, including notices to 15 platforms on 9 September 2026. The RBI remains skeptical of private crypto-assets, argues against private stablecoins and promotes the e-rupee. A parliamentary committee is studying a framework.'
