notes:
  cbdc: 'The e-rupee is currency, not a VDA; the RBI has run it in pilot since November 2022 (wholesale) and December 2022 (retail). Tokenized certificates of deposit on the RBI’s Unified Markets Interface settle in wholesale e-rupee, and SEBI’s Demat 2.0 tokenized corporate bond pilot settles in e-rupee.'
  td: Currency held as deposits, not a VDA.
  dt: Currency held as deposits, not a VDA.
  sc: 'Stablecoins are VDAs: taxed and subject to AML rules, with no licensing route; the RBI argues against private stablecoins (RBI, December 2025).'
  art: NFTs are expressly within the VDA definition.
  loy: Reward points are excluded by government notification.
  sec: 'Tokenized securities fall to SEBI; in its Demat 2.0 pilot, launched on 10 September 2026 in its regulatory sandbox, corporate bonds issued as tokens on a depository-owned ledger remain securities and settle in e-rupee. The VDA treatment is unsettled.'
  rwa: Treatment depends on structure and is unsettled.
  fmi: A wholesale settlement asset, typically regulated as a payment system rather than under crypto-asset rules; check local treatment.
