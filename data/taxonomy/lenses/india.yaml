notes:
  cbdc: The e-rupee is currency, not a VDA.
  td: Currency held as deposits, not a VDA.
  dt: Currency held as deposits, not a VDA.
  sc: 'Stablecoins are VDAs: taxed and subject to AML rules, with no licensing route.'
  art: NFTs are expressly within the VDA definition.
  loy: Reward points are excluded by government notification.
  sec: Tokenized securities would fall to SEBI; the VDA treatment is unsettled.
  rwa: Treatment depends on structure and is unsettled.
  fmi: A wholesale settlement asset, typically regulated as a payment system rather than under crypto-asset rules; check local treatment.
