notes:
  rcbdc: 'The retail e-HKD has been researched and piloted, but there is no decision to issue it: wholesale use comes first, with preparatory work for a possible retail e-HKD due by mid-2026.'
  wcbdc: Tokenized central bank money is the target settlement asset for EnsembleTX.
  td: Supervised as bank deposits and excluded from the Stablecoins Ordinance; EnsembleTX settles real-value transactions in them.
  dt: Still a deposit under the Banking Ordinance, so excluded from the Stablecoins Ordinance whatever it is called.
  lsc: 'A “specified stablecoin” references one or more official currencies (section 4(1)); issuing one in Hong Kong, or an HKD-referenced one anywhere, needs a licence (section 5); only permitted offerors may offer it (section 9); it bears no interest (Schedule 2, section 15). Licensed issuers so far: Anchorpoint Financial (FRS01) and HSBC (FRS02), both HKD-referenced, from 10 April 2026. HSBC RedCoin (RCHKD) is live in PayMe, on HSBC’s own DLT network.'
  sc: A license is required to issue in Hong Kong or to issue an HKD-referenced token anywhere; unlicensed foreign stablecoins may be offered to professional investors only.
  unreg: Cannot be offered to retail or advertised in Hong Kong; holders of unlicensed stablecoins are at their own risk (HKMA, 29 July 2025).
  alg: 'Outside the regime: only fully reserved, fiat-referenced tokens can be licensed.'
  fund: Tokenized money-market funds are among the first real-value use cases in EnsembleTX, settled with tokenized deposits; the fund itself is SFC territory.
  fi: 'The Digital Bond Grant Scheme (from 28 November 2024, three years) pays half of the DLT platform, arranger, legal, audit, rating, listing and CMU costs of a digital bond issued in Hong Kong: up to HKD 1.25 million, or HKD 2.5 million for an issue of HKD 1 billion or more sold to five or more investors and listed on HKEX or an SFC-licensed platform; two issues per issuer.'
  pm: 'A bank selling tokenized gold follows the same rules as selling gold (the Code of Banking Practice and the HKMA’s conduct requirements), as a tokenized product takes the rules of its underlying product (HKMA, 20 February 2024).'
  fmi: A wholesale settlement asset, typically regulated as a payment system rather than under crypto-asset rules; check local treatment.
  syn: 'Outside the regime: only fully reserved, fiat-referenced tokens can be licensed.'
