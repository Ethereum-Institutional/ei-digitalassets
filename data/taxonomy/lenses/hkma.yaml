id: hkma
group: jurisdiction
menu: 'HK · Hong Kong (HKMA): stablecoins, tokenized deposits & CBDC'
name: 'Hong Kong HKMA: stablecoins, tokenized deposits & central bank money'
short: Hong Kong HKMA
color: '#14130f'
intro: 'The Hong Kong Monetary Authority licenses issuers of fiat-referenced stablecoins under the Stablecoins Ordinance (Cap. 656, in force since 1 August 2025): anyone issuing in Hong Kong, or issuing a token referenced to the Hong Kong dollar anywhere. The first two licenses took effect on 10 April 2026 (Anchorpoint Financial and HSBC, both HKD-referenced). Reserves must be fully backed, segregated and matched to the reference currency, redemption is at par, interest to holders is prohibited, and only permitted offerors (licensees, banks, stored-value licensees and SFC-licensed platforms and firms) may offer a licensed stablecoin. The HKMA also supervises banks’ tokenized deposits, which the Ordinance excludes as deposits; banks sell tokenized products under the rules of the underlying product (circular of 20 February 2024) and hold client digital assets, including tokenized securities, to the HKMA’s custody standards as updated on 27 May 2026, with extra caution for permissionless tokens on public permissionless networks; the Basel crypto-asset capital standard applies in Hong Kong from 1 January 2026. Project Ensemble’s pilot phase, EnsembleTX, has settled real-value tokenized-deposit transactions (corporate treasury and tokenized money-market funds first) since November 2025, between banks first through RTGS and since 2 November 2026 in tokenized central bank money, 24/7, with 12 tokenized-deposit banks.'
