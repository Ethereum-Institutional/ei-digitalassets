# notes: the sentence shown under a circle's definition when this lens is active.
# Please add sources (URL + date) for every regulatory claim you change.

id: hkma
group: jurisdiction
menu: 'HK · Hong Kong (HKMA): stablecoins, tokenized deposits & CBDC'
name: 'Hong Kong HKMA: stablecoins, tokenized deposits & central bank money'
short: Hong Kong HKMA
color: '#14130f'
intro: 'The Hong Kong Monetary Authority licenses issuers of fiat-referenced stablecoins under the Stablecoins Ordinance (Cap. 656, in force since 1 August 2025): anyone issuing in Hong Kong, or issuing a token referenced to the Hong Kong dollar anywhere. The first two licenses took effect on 10 April 2026 (Anchorpoint Financial and HSBC, both HKD-referenced). Reserves must be fully backed, segregated and matched to the reference currency, redemption is at par, interest to holders is prohibited, and only permitted offerors (licensees, banks, stored-value licensees and SFC-licensed platforms and firms) may offer a licensed stablecoin. The HKMA also supervises banks’ tokenized deposits, which the Ordinance excludes as deposits; banks sell tokenized products under the rules of the underlying product and hold digital assets to the HKMA’s custody standards (both circulars of 20 February 2024); the Basel crypto-asset capital standard applies in Hong Kong from 1 January 2026. Project Ensemble’s pilot phase, EnsembleTX, settles real-value tokenized-deposit transactions (corporate treasury and tokenized money-market funds first) around the clock alongside RTGS, progressively in tokenized central bank money.'
