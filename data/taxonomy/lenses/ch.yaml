# Lens: Switzerland FINMA token classes
# status: in | part | out per circle id (part = depends, exempt or restricted). Circles not listed are outside,
#   except containers (derived from their children). `groups` draw one dotted perimeter per group and mark its circles as inside.
# notes: the sentence shown under a circle's definition when this lens is active.
# Please add sources (URL + date) for every regulatory claim you change.

id: ch
group: jurisdiction
menu: 'CH · Switzerland (FINMA): token classes'
name: Switzerland FINMA token classes
short: Switzerland
color: '#14130f'
intro: 'FINMA classifies tokens by economic function: payment tokens (cryptocurrencies), utility tokens (access to a service) and asset tokens (claims or securities, which the DLT Act lets be issued as ledger-based securities). Stablecoins are assessed case by case; FINMA’s 2024 guidance requires bank default guarantees where an issuer lacks a banking license. A Federal Council draft (consultation from October 2025) would add FINMA “payment instrument institution” licenses for issuers of value-stable crypto-based means of payment (wertstabile kryptobasierte Zahlungsmittel) and “crypto-institution” licenses for service providers.'
