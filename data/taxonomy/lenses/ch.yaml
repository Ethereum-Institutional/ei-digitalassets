notes:
  cbdc: The SNB has issued wholesale CBDC for settlement on a regulated DLT platform (Project Helvetia); there is no retail CBDC.
  wcbdc: Live pilots under Project Helvetia.
  td: Bank deposits under banking law.
  dt: Bank deposits; a stablecoin without a bank default guarantee may itself be treated as a deposit.
  sc: 'Case by case: may be a deposit, a collective investment scheme or a payment token depending on backing. Switzerland has no stablecoin license yet: a Federal Council draft (consultation 22 October 2025 to 6 February 2026) would license “value-stable crypto-based means of payment” referencing a single fiat currency, with segregated, bankruptcy-remote reserves, redemption at par and no interest, issued by FINMA-licensed payment instrument institutions (banks would not issue directly). It is not yet law.'
  USDT: Shown as a payment token, but FINMA classifies stablecoins case by case and USDT holds no Swiss license or designation; issued abroad, it may instead be treated as deposit-like.
  USDC: Shown as a payment token, but FINMA classifies stablecoins case by case and USDC holds no Swiss license or designation; issued abroad, it may instead be treated as deposit-like.
  unreg: Case by case, like other stablecoins. Under FINMA’s 2024 guidance, an issuer without a Swiss banking license needs a bank default guarantee.
  alg: Classified case by case by economic function; no Swiss regime authorizes algorithmic stablecoins.
  lst: Depends on the claim; a token representing a claim on the underlying asset may be an asset token rather than a payment token.
  gov: 'Hybrid: often utility, sometimes asset tokens if they carry economic rights.'
  art: NFTs are generally outside financial-market law unless they function as payment or asset tokens.
  fmi: A wholesale settlement asset, typically regulated as a payment system rather than under crypto-asset rules; check local treatment.
sources:
