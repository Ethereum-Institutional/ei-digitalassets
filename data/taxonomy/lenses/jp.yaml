id: jp
group: jurisdiction
menu: 'JP · Japan (FSA): crypto-assets, stablecoins & security tokens'
name: 'Japan FSA: crypto-assets, stablecoins and security tokens'
short: Japan FSA
color: '#14130f'
intro: 'The Financial Services Agency (FSA) regulates three token types separately. “Crypto-assets” (transferable value usable for payment to unspecified persons, excluding currency and currency-denominated assets), until now under the Payment Services Act; “electronic payment instruments”, meaning fiat stablecoins, which since 2023 only banks, fund-transfer providers and trust companies may issue (e.g. JPYC); and security tokens (“electronically recorded transferable rights”) under the Financial Instruments and Exchange Act. The Act amending both laws, submitted on 10 April 2026 and enacted on 15 July 2026, moves the rules on crypto-asset transactions from the Payment Services Act into the Financial Instruments and Exchange Act, treating crypto-assets as a financial product distinct from securities, while stablecoins and prepaid instruments stay under the Payment Services Act; check the commencement date before relying on the new regime.'
