notes:
  sc: Fiat stablecoins are electronic payment instruments, not crypto-assets; algorithmic ones are crypto-assets.
  unreg: 'Foreign stablecoins can be handled only by registered electronic payment instruments exchange service providers; since 1 June 2026 the test for handling one is equivalence with Japan’s regime, and a beneficiary interest in a trust under an equivalent foreign law counts as an electronic payment instrument (FSA order of 19 May 2026).'
  USDC: Handled in Japan as a foreign electronic payment instrument through a registered intermediary (SBI VC Trade, from March 2025); Circle itself is not licensed in Japan.
  lsc: 'Only banks, fund-transfer service providers and trust companies may issue. JPYC, issued since 27 October 2025, is the first yen stablecoin from a fund-transfer service provider (registered 18 August 2025); its issuers call JPYSC (SBI Shinsei Trust Bank, 24 June 2026) the first trust-type one. Since 1 June 2026 a trust-type stablecoin may hold part of its backing in government bonds with three months or less to run and in term deposits that can be withdrawn early (orders of 22 May 2026).'
  alg: 'Not an electronic payment instrument: treated as a crypto-asset.'
  td: Bank deposits. Banks can also issue stablecoins, so the deposit-token / stablecoin boundary is especially close in Japan.
  dt: A deposit under banking law, whatever it is called.
  rwa: Security tokens if they confer investment rights; otherwise assessed case by case.
  art: NFTs are generally not crypto-assets unless they work as a means of payment.
  fmi: A wholesale settlement asset, typically regulated as a payment system rather than under crypto-asset rules; check local treatment.
