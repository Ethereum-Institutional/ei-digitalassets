menu: 'SV · El Salvador (CNAD): “digital asset” & Bitcoin Law'
name: El Salvador CNAD “digital asset”
short: El Salvador
color: '#0369a1'
intro: El Salvador’s Digital Assets Issuance Law (LEAD, 2023) defines a digital asset broadly as any digital representation that can be stored and transferred on a distributed ledger, and declares that digital assets are not securities, so tokenized shares, funds and real estate issued under it are supervised by the National Digital Assets Commission (CNAD) rather than the securities regulator. Foreign CBDCs, closed-loop tokens and non-tradable tokens are excluded. CNAD’s stablecoin regulation requires at least 1:1 reserves and excludes algorithmic designs, and service providers may distribute only stablecoins on CNAD’s eligible list, which includes USDT (issued by Tether from El Salvador) and USDC. The 2021 Bitcoin Law made bitcoin legal tender; the January 2025 amendment under the IMF program made acceptance voluntary and ended tax payments in bitcoin, and the program restricts public-sector bitcoin purchases.
