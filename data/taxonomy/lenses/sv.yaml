notes:
  nat: Within the broad LEAD definition of a digital asset.
  btc: 'Governed by the Bitcoin Law. Since the January 2025 amendment, private-sector acceptance is voluntary and taxes are paid only in US dollars. An October 2024 LEAD reform reportedly brought bitcoin into the digital-asset framework; sources differ on whether CNAD or the central bank (BCR) and the SSF supervise bitcoin service providers.'
  cbdc: El Salvador uses the US dollar and has no CBDC; foreign CBDCs are excluded from LEAD (Art. 4).
  td: Not specifically addressed by LEAD; banks remain supervised by the SSF, and a bank can also register with CNAD as a digital-asset issuer.
  dt: Not specifically addressed by LEAD; banks remain supervised by the SSF, and a bank can also register with CNAD as a digital-asset issuer.
  fmi: Not addressed; El Salvador has no FMI settlement token.
  sc: Stablecoins are digital assets. CNAD’s 2023 stablecoin regulation covers tokens referencing fiat currency, bitcoin, T-bills, money-market funds or gold, with at least 1:1 reserves and redemption on demand or within a reasonable time.
  lsc: 'Stablecoins on CNAD’s eligible list, either issued through a CNAD-registered public offering (USDT, CNHT and MXNT from Tether; MXNB; XAUt) or cleared for foreign issuers by a CNAD “No Objection” (USDC, PYUSD, USDG, RLUSD, USDM, PAXG).'
  unreg: Service providers may not distribute stablecoins that are not on CNAD’s eligible list.
  alg: Excluded from the stablecoin regulation, so algorithmic designs cannot be offered as stablecoins.
  pm: Gold tokens (XAUt, PAXG) are on CNAD’s stablecoin list; El Salvador’s stablecoin definition is not limited to fiat currency.
  rwa: LEAD tokens are not securities. CNAD names real estate, shares, art, commodities, intellectual property and funds as assets that can be tokenized under it.
  sec: In if issued under LEAD, in which case the token is legally not a security and CNAD supervises it; securities issued under the Securities Market Law stay with the SSF.
  oth: Tradable tokens fall within the broad LEAD definition; tokens usable only with their issuer (closed-loop) and non-tradable tokens are excluded (Art. 4).
