# Lens: Basel Committee cryptoasset groups (standard under review)
# status: in | part | out per circle id (part = depends, exempt or restricted). Circles not listed are outside,
#   except containers (derived from their children). `groups` draw one dotted perimeter per group and mark its circles as inside.
# notes: the sentence shown under a circle's definition when this lens is active.
# Please add sources (URL + date) for every regulatory claim you change.

id: basel
group: standard-setter
menu: 'Basel Committee (BCBS): cryptoasset groups (under review)'
name: Basel Committee cryptoasset groups (standard under review)
short: Basel
color: '#14130f'
intro: 'The BCBS prudential standard for banks’ cryptoasset exposures (SCO60; finalized 2022, amended 2024, implementation date 1 January 2026) covers private digital assets that depend on cryptography and DLT, including tokenized traditional assets, and excludes CBDCs. It sorts them into groups that drive capital: Group 1a tokenized traditional assets and Group 1b stablecoins (treated broadly like the underlying), Group 2a hedgeable cryptoassets, and Group 2b everything else (1,250% risk weight). Assets on permissionless blockchains currently cannot qualify for Group 1. The Committee has been reviewing parts of the standard; check current status.'
