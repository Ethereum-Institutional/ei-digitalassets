notes:
  nat: 'Split: BTC and ETH can be Group 2a if hedging-recognition criteria are met; other native assets are Group 2b.'
  btc: Group 2a if hedging-recognition criteria are met; otherwise 2b.
  eth: Group 2a if hedging-recognition criteria are met; otherwise 2b.
  cbdc: CBDCs are excluded from the standard.
  td: Group 1a if the classification conditions are met, typically on a permissioned ledger.
  dt: Group 1a only if the conditions are met; on a permissionless blockchain it currently falls to Group 2b.
  sc: Group 1b or Group 2 depending on issuer supervision, the redemption-risk test and the blockchain used.
  lsc: Candidate for Group 1b; tokens on permissionless blockchains currently fall to Group 2.
  unreg: 'Group 2b: no effective stabilization or supervised issuer.'
  alg: 'Group 2b: algorithm-based stabilization cannot qualify for Group 1b.'
  rwa: Group 1a if the classification conditions are met (incl. permissioned ledger); otherwise Group 2.
  dv: 'Depends on the underlying: tokenized derivatives on traditional assets can be Group 1a; derivatives on Group 2 cryptoassets (e.g. BTC perps) are Group 2.'
  oth: Group 2b.
  fmi: Classification still under discussion; the industry argues for treatment equivalent to the central bank money behind it.
