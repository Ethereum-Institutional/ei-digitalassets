notes:
  sc: 'Fiat-pegged stablecoins are treated as partly performing money functions: issuing an RMB-pegged one, onshore or offshore, needs approval, and unapproved ones are banned (Article 1).'
  td: Not addressed by the notice; bank deposits remain under banking law.
  dt: Not addressed by the notice; tokens on public chains would face the ban on crypto-linked activity.
  oth: Tradeable tokens fall under the ban on virtual-currency business; see Digital Art & NFTs for the tolerated non-tradeable “digital collectibles”.
  art: “Digital collectibles” on permissioned platforms without secondary trading are tolerated; tradeable NFTs are not.
  rwa: 'Tokenizing asset ownership or income rights, and the intermediary and technology services behind it, is illegal unless approved by the business regulator and run on designated financial infrastructure (Article 2); offshore tokens on mainland rights follow the NDRC, CSRC and SAFE rules for foreign debt and securitization, or CSRC filing (Article 14).'
  fmi: A wholesale settlement asset, typically regulated as a payment system rather than under crypto-asset rules; check local treatment.
  ECNY-R: 'Permitted: the PBoC''s own retail CBDC. Since 1 January 2026 a balance in a commercial bank wallet is booked as the bank''s deposit liability.'
  ECNY-W: 'Permitted: the wholesale use of e-CNY, issued and redeemed by the PBoC on Project mBridge.'
