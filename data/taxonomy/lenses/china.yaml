# Lens: Mainland China PBoC prohibition
# status: in | part | out per circle id (part = depends, exempt or restricted). Circles not listed are outside,
#   except containers (derived from their children). `groups` draw one dotted perimeter per group and mark its circles as inside.
# notes: the sentence shown under a circle's definition when this lens is active.
# Please add sources (URL + date) for every regulatory claim you change.

id: china
group: jurisdiction
menu: 'CN · Mainland China (PBoC): prohibition'
name: Mainland China PBoC prohibition
short: Mainland China PBoC
color: '#14130f'
tint: true
intro: 'A notice of the People’s Bank of China with seven other departments (the NDRC, MIIT, the Ministry of Public Security, SAMR, the NFRA, the CSRC and SAFE; Yin Fa [2026] No. 42, 6 February 2026, replacing the 2021 notice) confirms that virtual currencies have no legal-tender status and that exchange, trading, token issuance, pricing and intermediary services and crypto-linked products are illegal financial activity, which offshore firms may not offer to mainland parties either. Issuing an RMB-pegged stablecoin, onshore or offshore, needs the authorities’ approval; tokenizing asset ownership or income rights, and the intermediary and technology services behind it, is illegal unless approved by the business regulator and run on designated financial infrastructure, with the CSRC leading on tokenization and the PBoC on virtual currencies. Banks and payment firms may not provide accounts, clearing, products, collateral or insurance for either. The e-CNY is the sanctioned digital currency.'
