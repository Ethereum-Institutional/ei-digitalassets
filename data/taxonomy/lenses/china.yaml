# Lens: Mainland China prohibition
# status: in | part | out per circle id (part = depends, exempt or restricted). Circles not listed are outside,
#   except containers (derived from their children). `groups` draw one dotted perimeter per group and mark its circles as inside.
# notes: the sentence shown under a circle's definition when this lens is active.
# Please add sources (URL + date) for every regulatory claim you change.

id: china
group: jurisdiction
menu: 'CN · Mainland China: prohibition'
name: Mainland China prohibition
short: Mainland China
color: '#14130f'
tint: true
intro: A joint notice from the People’s Bank of China and nine other regulators (6 February 2026) confirms that virtual currencies have no legal-tender status and that exchange, trading, token issuance and crypto-linked products are illegal financial activity. It bans unapproved RMB-pegged stablecoins (onshore and offshore) and classifies tokenizing asset ownership or income rights as illegal unless approved and carried out within designated financial infrastructure. The e-CNY is the sanctioned digital currency.
