menu: 'IOSCO: crypto & digital assets'
name: IOSCO crypto & digital assets
short: IOSCO
color: '#6d28d9'
intro: IOSCO’s 2023 Policy Recommendations for Crypto and Digital Asset Markets cover service providers dealing in crypto-assets, including stablecoins, applying “same activity, same risk, same regulatory outcome”. Tokenized securities stay under IOSCO’s existing Objectives and Principles of Securities Regulation, and IOSCO has since reported on tokenization risks. CBDCs and bank deposits are outside its remit.
