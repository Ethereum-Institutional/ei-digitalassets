notes:
  btc: 'Since 11 February 2026, SFC-licensed virtual-asset brokers may finance virtual-asset trading for their existing securities margin clients; if they take virtual assets as collateral, only bitcoin and ether qualify, at a haircut of at least 60% (SFC).'
  eth: 'Since 11 February 2026, SFC-licensed virtual-asset brokers may finance virtual-asset trading for their existing securities margin clients; if they take virtual assets as collateral, only bitcoin and ether qualify, at a haircut of at least 60% (SFC).'
  dv: 'Perpetual contracts (exchange positions, not tokens): since 11 February 2026 licensed platforms may propose them to the SFC for professional investors only, referencing a virtual asset open to retail spot trading on that platform or an index of such assets; margin is received in full before an order, never on credit, in fiat or in stablecoins or tokenized deposits regulated by the HKMA (SFC).'
  nat: Cryptocurrency is property under Hong Kong law and can be held on trust (Re Gatecoin, Court of First Instance, 31 March 2023).
  lsc: '“Relevant Stablecoins” (specified stablecoins issued under an HKMA license) may be offered to retail on SFC-licensed platforms since 27 May 2026: the liquidity and index tests and the exposure-limit count are waived, the knowledge assessment is waived only for clients served in Relevant Stablecoins alone, the coin is non-complex, and suitability applies on a solicitation or recommendation. An SFC-authorized fund’s holdings of them are outside the requirements for funds with more than 10% in virtual assets (SFC, 27 May 2026).'
  sc: Unlicensed stablecoins such as USDT and USDC remain virtual assets but may be offered only to professional investors.
  unreg: Professional investors only; cannot be offered to retail.
  alg: A virtual asset if traded, but never a licensable stablecoin.
  fund: 'Primary dealing of tokenized SFC-authorized funds is allowed since November 2023, and secondary trading on SFC-licensed platforms under a framework of 20 April 2026 (open-ended funds first, with a market maker, an indicative NAV at least every 15 seconds and a price-deviation alert); an existing product needs the SFC’s prior consultation and approval, case by case. The first two, tokenized money market funds, began trading around the clock on 26 October 2026, and the SFC will consider broadening the product scope. The product provider stays responsible for the ownership record, issues no bearer tokens and uses a public permissionless network only with added controls such as a permissioned token.'
  sec: 'Tokenized securities are traditional securities with a tokenization wrapper: the prospectus and Part IV regimes apply, complexity is read through to the underlying, and there is no professional-investor-only restriction (SFC, 2 November 2023). Bearer tokens on public permissionless networks carry heightened cyber and AML risk; transfer restrictions or allowlists are the accepted answer.'
  re: 'A fractionalized interest tokenized other than as a traditional fund is likely a collective investment scheme and a complex product: professional investors only unless authorized under Part IV (SFC, 2 November 2023).'
  coll: 'A fractionalized interest tokenized other than as a traditional fund is likely a collective investment scheme and a complex product: professional investors only unless authorized under Part IV (SFC, 2 November 2023).'
  ip: 'A tokenized profit-sharing or royalty arrangement that is not a traditional security is a digital security, likely a complex product: professional investors only unless authorized under Part IV (SFC, 2 November 2023).'
  pm: 'Tokenized gold products can be SFC-authorized investment products sold to retail, such as the HSBC Gold Token (since 2024, on HSBC’s private ledger) and a tokenized unlisted class of the Hang Seng Gold ETF; the SFC named tokenized gold ETFs as a possible next pilot for secondary trading on licensed platforms (2 November 2026). Gold tokens traded as crypto are virtual assets.'
  td: 'A bank deposit: HKMA territory, not the SFC’s. Tokenized deposits held by an SFC-authorized fund are outside the requirements for funds with more than 10% in virtual assets (SFC, 27 May 2026).'
  dt: 'A bank deposit: HKMA territory, not the SFC’s.'
  cbdc: 'Central bank money: HKMA territory.'
  loy: Limited-purpose tokens (loyalty, gaming) are excluded.
  game: Limited-purpose tokens are excluded.
  fmi: A wholesale settlement asset, typically regulated as a payment system rather than under crypto-asset rules; check local treatment.
