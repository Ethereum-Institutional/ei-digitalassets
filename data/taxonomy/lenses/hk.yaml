notes:
  nat: Cryptocurrency is property under Hong Kong law and can be held on trust (Re Gatecoin, Court of First Instance, 31 March 2023).
  lsc: '“Relevant Stablecoins” (specified stablecoins issued under an HKMA licence) may be offered to retail on SFC-licensed platforms since 27 May 2026: the liquidity and index tests, the exposure-limit count and the knowledge assessment are waived, the coin is non-complex, and suitability applies only on a recommendation.'
  sc: Unlicensed stablecoins such as USDT and USDC remain virtual assets but may be offered only to professional investors.
  unreg: Professional investors only; cannot be offered to retail.
  alg: A virtual asset if traded, but never a licensable stablecoin.
  fund: 'Primary dealing of tokenized SFC-authorized funds is allowed since November 2023 and secondary trading on SFC-licensed platforms since 20 April 2026 (open-ended funds first, with a market maker, an indicative NAV at least every 15 seconds and a price-deviation alert). The product provider stays responsible for the ownership record, issues no bearer tokens and uses a public permissionless network only with added controls such as a permissioned token.'
  sec: 'Tokenized securities are traditional securities with a tokenization wrapper: the prospectus and Part IV regimes apply, complexity is read through to the underlying, and there is no professional-investor-only restriction (SFC, 2 November 2023). Bearer tokens on public permissionless networks carry heightened cyber and AML risk; transfer restrictions or allowlists are the accepted answer.'
  re: 'A fractionalized interest tokenized other than as a traditional fund is likely a collective investment scheme and a complex product: professional investors only unless authorized under Part IV (SFC, 2 November 2023).'
  coll: 'A fractionalized interest tokenized other than as a traditional fund is likely a collective investment scheme and a complex product: professional investors only unless authorized under Part IV (SFC, 2 November 2023).'
  ip: 'A tokenized profit-sharing or royalty arrangement that is not a traditional security is a digital security, likely a complex product: professional investors only unless authorized under Part IV (SFC, 2 November 2023).'
  pm: Tokenized gold products can be SFC-authorized investment products; gold tokens traded as crypto are virtual assets.
  td: 'A bank deposit: HKMA territory, not the SFC’s.'
  dt: 'A bank deposit: HKMA territory, not the SFC’s.'
  cbdc: 'Central bank money: HKMA territory.'
  loy: Limited-purpose tokens (loyalty, gaming) are excluded.
  game: Limited-purpose tokens are excluded.
  fmi: A wholesale settlement asset, typically regulated as a payment system rather than under crypto-asset rules; check local treatment.
