id: hk
group: jurisdiction
menu: 'HK · Hong Kong (SFC): virtual assets & tokenized securities'
name: 'Hong Kong SFC: virtual assets & tokenized securities'
short: Hong Kong SFC
color: '#14130f'
intro: 'The Securities and Futures Commission licenses virtual-asset trading platforms under the AMLO and will be the lead regulator of the dealing, custody, advisory and management regimes consulted on in 2025 and 2026, with a bill targeted for 2026. The AMLO virtual-asset definition excludes securities and futures, digital representations of fiat and stored value. Tokenized securities are “fundamentally traditional securities with a tokenisation wrapper” (SFC, 2 November 2023): “same business, same risks, same rules”, read through to the underlying for complexity, with no professional-investor-only restriction, while the prospectus and Part IV offering regimes still apply. Tokenized SFC-authorized products may be dealt in the primary market since November 2023 and traded on SFC-licensed platforms since 20 April 2026; product providers keep the ownership record, issue no bearer tokens and use a public permissionless network only with added controls such as a permissioned token. Since 27 May 2026, HKMA-licensed “Relevant Stablecoins” trade on SFC-licensed platforms with lighter requirements.'
