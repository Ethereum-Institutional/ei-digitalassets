id: hk
group: jurisdiction
menu: 'HK · Hong Kong (SFC): virtual assets & tokenized securities'
name: 'Hong Kong SFC: virtual assets & tokenized securities'
short: Hong Kong SFC
color: '#14130f'
intro: The Securities and Futures Commission licenses virtual-asset trading platforms under the AMLO and is building out VA dealing, custody, advisory and management regimes (legislation planned for 2026). The AMLO virtual-asset definition excludes securities and futures, digital representations of fiat and stored value. Tokenized securities and tokenized SFC-authorized products (such as tokenized money-market funds) stay securities under the SFO, using a “see-through” approach. Since May 2026, HKMA-licensed “Relevant Stablecoins” can be listed on SFC-licensed platforms with lighter requirements.
