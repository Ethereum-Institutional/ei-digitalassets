# Lens: Hong Kong SFC (virtual assets & tokenized securities)
# status: in | part | out per circle id (part = depends, exempt or restricted). Circles not listed are outside,
#   except containers (derived from their children). `groups` draw one dotted perimeter per group and mark its circles as inside.
# notes: the sentence shown under a circle's definition when this lens is active.
# Please add sources (URL + date) for every regulatory claim you change.

id: hk
group: jurisdiction
menu: 'HK · Hong Kong (SFC): virtual assets & tokenized securities'
name: 'Hong Kong SFC: virtual assets & tokenized securities'
short: Hong Kong SFC
color: '#14130f'
intro: 'The Securities and Futures Commission licenses virtual-asset trading platforms under the AMLO and will be the lead regulator of the dealing and custody regimes (consultation conclusions, 24 December 2025) and the advisory and management regimes (consultation conclusions, 26 May 2026); the Virtual Asset Services Legislation (Amendment) Bill 2026, which would put both into law, was gazetted on 20 November 2026 for first reading on 2 December. The AMLO virtual-asset definition excludes securities and futures, digital representations of fiat and stored value. Tokenized securities are “fundamentally traditional securities with a tokenisation wrapper” (SFC, 2 November 2023): “same business, same risks, same rules”, read through to the underlying for complexity, with no professional-investor-only restriction, while the prospectus and Part IV offering regimes still apply. Tokenized SFC-authorized products may be dealt in the primary market since November 2023 and, since 20 April 2026, traded on SFC-licensed platforms with the SFC’s prior consultation and approval of each product; the first two, tokenized money market funds, began trading on 26 October 2026. Product providers keep the ownership record, issue no bearer tokens and use a public permissionless network only with added controls such as a permissioned token. Since 27 May 2026, HKMA-licensed “Relevant Stablecoins” trade on SFC-licensed platforms with lighter requirements.'
