# Lens: US SEC “security”
# status: in | part | out per circle id (part = depends, exempt or restricted). Circles not listed are outside,
#   except containers (derived from their children). `groups` draw one dotted perimeter per group and mark its circles as inside.
# notes: the sentence shown under a circle's definition when this lens is active.
# Please add sources (URL + date) for every regulatory claim you change.
# Here “in” means a security (inside the SEC’s perimeter), “part” depends on the facts, “out” means the Commission or
#   its staff has said it is not a security. Deposits, CBDC and FMI tokens are left unlisted (outside) with notes.

id: us-sec
group: jurisdiction
menu: 'US · United States (SEC): securities'
name: US SEC “security”
short: US SEC
color: '#3b5b7a'
intro: 'The Securities and Exchange Commission (SEC) regulates securities under the Securities Act of 1933 and the Securities Exchange Act of 1934; a token that is not a listed instrument such as a share or a bond is a security only if it is sold as an investment contract under the Supreme Court’s Howey test (an investment of money in a common enterprise with a reasonable expectation of profits from the essential managerial efforts of others). After staff statements in 2025 under Chairman Atkins’ Project Crypto, the Commission itself issued an interpretation on 17 March 2026, joined by the CFTC, that sorts crypto assets into digital commodities, digital collectibles, digital tools, stablecoins and digital securities: the first three are not securities in themselves, stablecoins depend on their design, and a security stays a security whether it is recorded on chain or off. On 17 September 2026 its “Innovation Exemption” let tokenized NMS stock trade in permissioned automated market maker pools on public, permissionless ledgers until 17 September 2031. Staff statements are not rules and have no legal force, and the March 2026 interpretation supersedes them; the statutory definition can change only by law, and the CLARITY Act, which would draw the line in statute, failed a Senate procedural vote in September 2026 (press report).'
