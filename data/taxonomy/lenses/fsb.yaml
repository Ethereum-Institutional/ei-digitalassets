menu: 'FSB: “crypto-asset”'
name: FSB “crypto-asset”
short: FSB
color: '#1d4ed8'
intro: The Financial Stability Board defines a crypto-asset as a private-sector digital asset that depends primarily on cryptography and distributed-ledger or similar technology. Stablecoins are crypto-assets that aim to keep a stable value against a specified asset; “global stablecoins” get additional recommendations. CBDCs are public money and fall outside. The guiding principle is “same activity, same risk, same regulation”.
