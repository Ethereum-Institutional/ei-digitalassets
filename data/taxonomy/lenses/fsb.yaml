notes:
  cbdc: Public money, outside the private-sector definition.
  td: Not covered by the FSB stablecoin recommendations; bank deposits stay under banking rules.
  dt: Not a stablecoin for FSB purposes; remains bank money under banking rules.
  sc: Stablecoins are crypto-assets; those that could reach global scale are “global stablecoins” with extra requirements.
  alg: Crypto-assets; the FSB stresses that algorithmic designs do not meet its stablecoin standards.
  rwa: Tokenized traditional assets can meet the broad definition, but existing regulation for the underlying applies.
  sec: Existing securities regulation applies (“same activity, same risk, same regulation”).
  art: Unique NFTs are generally outside the FSB’s financial-stability focus.
  fmi: A wholesale settlement asset, typically regulated as a payment system rather than under crypto-asset rules; check local treatment.
