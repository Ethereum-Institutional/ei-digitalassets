# Lens: UK “qualifying cryptoasset”
# status: in | part | out per circle id (part = depends, exempt or restricted). Circles not listed are outside,
#   except containers (derived from their children). `groups` draw one dotted perimeter per group and mark its circles as inside.
# notes: the sentence shown under a circle's definition when this lens is active.
# Please add sources (URL + date) for every regulatory claim you change.

id: uk
group: jurisdiction
menu: 'UK · United Kingdom: “qualifying cryptoasset”'
name: UK “qualifying cryptoasset”
short: UK
color: '#4338ca'
intro: 'The UK brings “qualifying cryptoassets” and “qualifying stablecoins” (tokens that hold backing assets to keep a stable value against one fiat currency) into FCA regulation under the Financial Services and Markets Act 2000 (Cryptoassets) Regulations 2026, passed on 4 February 2026. The FCA’s final rules (PS26/9 to PS26/13, 30 June 2026) and perimeter guidance (PS26/18, PERG 18) apply from 25 October 2027; the application window runs from 30 September 2026 to 28 February 2027. Already today, cryptoasset firms register with the FCA for money laundering supervision (since January 2020) and promotions to UK consumers are regulated (since October 2023). Specified investments (tokenized securities and funds, deposits), e-money, fiat currency and central bank digital currencies are outside the new crypto definitions. Systemic stablecoins will be regulated jointly with the Bank of England.'
