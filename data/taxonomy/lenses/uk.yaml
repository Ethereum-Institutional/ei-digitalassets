notes:
  nat: 'Qualifying cryptoassets. Firms already register with the FCA for money laundering (since 10 January 2020) and promotions to UK consumers are regulated (since 8 October 2023); trading platforms, dealing, arranging, custody, staking and lending need FCA authorization from 25 October 2027. Trading on one’s own account without serving others, and market making on a UK platform, are to be excluded from dealing (2026 amending regulations, before Parliament).'
  td: Deposits are specified investments, outside the cryptoasset definitions.
  dt: Still a deposit, outside the cryptoasset definitions; tokenized deposits are to join stablecoin payments in a future payments regime.
  cbdc: Fiat currency, including a central bank digital currency, is excluded from the qualifying cryptoasset definition (PERG 18.4).
  sc: 'Qualifying stablecoin: a qualifying cryptoasset that seeks a stable value against a single fiat currency and holds backing assets to keep it (PERG 18.5). It need not be UK-issued: stablecoins issued overseas are qualifying stablecoins too. A token cannot be both e-money and a qualifying stablecoin; the FCA’s draft indicators of a stablecoin include minting before issue, issuance on a ledger, seeking admission to trading, backing held to assure others of its value, and purposes beyond payment (CP26/36, PERG 18.4.5B, under consultation).'
  lsc: 'Issuing a qualifying stablecoin in the UK needs FCA authorization from 25 October 2027: fully backed, redeemable at par by the end of the next business day, backing assets on a statutory trust with an unconnected third party, and up to 5% excess in the backing pool (PS26/10). A coin issued under that permission is a “UK qualifying stablecoin”: under the 2026 amending regulations its transfers and exchanges are excluded from dealing and arranging (not lending), holding it briefly for a payment and holding its backing assets are excluded from safeguarding, and CASS 16 still applies to the backing assets; a payments regime is to follow. Systemic stablecoins are regulated jointly with the Bank of England.'
  alg: 'Not a qualifying stablecoin: value kept partly or wholly by algorithm rather than backing assets does not count (PERG 18.5), so it is treated as a qualifying cryptoasset. A wrapped stablecoin is not automatically a qualifying stablecoin.'
  unreg: 'In scope as qualifying stablecoins wherever issued; only issuing one in the UK needs authorization, and only a UK-issued coin gets the payment and transfer exclusions of the 2026 amending regulations. Dealing, arranging, custody and trading for UK consumers need authorization from October 2027, and promotions are already regulated.'
  sec: 'Specified investments, regulated as securities, including via the Digital Securities Sandbox. A token that is also a specified investment (a specified investment cryptoasset) stays under its existing rules (PERG 18.4.6). Safeguarding it under the arrangements of a recognized CSD that accepts responsibility to the client is excluded from the new safeguarding activity (article 9R(4), 2026 amending regulations).'
  fund: 'A tokenized fund unit is still a unit in a collective investment scheme, a specified investment; the FCA works on fund tokenization with industry (the Investment Association’s Blueprint, November 2023; Project Guardian).'
  rwa: Out where the token is a specified investment; otherwise assessed case by case.
  art: 'Judged on substance, not the label: a token called an NFT is a qualifying cryptoasset if its units are in practice interchangeable (PERG 18.4.2); unique tokens are generally outside.'
  loy: Excluded where the token can only be redeemed with the issuer or used within a limited network (PERG 18.4); transferable points are assessed like other tokens.
  gov: 'A qualifying cryptoasset. Holding or voting governance rights is not itself a regulated activity; the FCA’s draft guidance attributes an activity to whoever determines or materially influences an arrangement’s design or parameters, judged case by case, and says distributed governance alone does not make a protocol decentralized (CP26/36, PERG 18.1 and 18.8.32, under consultation).'
  fmi: Regulated as a systemic payment system overseen by the Bank of England (e.g. Fnality), not as a cryptoasset.
  syn: 'A qualifying cryptoasset; a qualifying stablecoin only if it holds backing assets to keep its value (PERG 18.5).'
