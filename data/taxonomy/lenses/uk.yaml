notes:
  nat: 'Qualifying cryptoassets. Firms already register with the FCA for money laundering (since 10 January 2020) and promotions to UK consumers are regulated (since 8 October 2023); trading platforms, dealing, arranging, custody, staking and lending need FCA authorization from 25 October 2027.'
  td: Deposits are specified investments, outside the cryptoasset definitions.
  dt: Still a deposit, outside the cryptoasset definitions; tokenized deposits are to join stablecoin payments in a future payments regime.
  cbdc: Fiat currency, including a central bank digital currency, is excluded from the qualifying cryptoasset definition (PERG 18.4).
  sc: 'Qualifying stablecoin: a qualifying cryptoasset that seeks a stable value against a single fiat currency and holds backing assets to keep it (PERG 18.5). It need not be UK-issued: stablecoins issued overseas are qualifying stablecoins too.'
  lsc: 'Issuing a qualifying stablecoin in the UK needs FCA authorization from 25 October 2027: fully backed, redeemable at par by the end of the next business day, backing assets on a statutory trust with an unconnected third party, and up to 5% excess in the backing pool (PS26/10). Systemic stablecoins are regulated jointly with the Bank of England; stablecoin payments are to move into a future payments regime.'
  alg: 'Not a qualifying stablecoin: value kept partly or wholly by algorithm rather than backing assets does not count (PERG 18.5), so it is treated as a qualifying cryptoasset. A wrapped stablecoin is not automatically a qualifying stablecoin.'
  unreg: 'In scope as qualifying stablecoins wherever issued; only issuing one in the UK needs authorization. Dealing, arranging, custody and trading for UK consumers need authorization from October 2027, and promotions are already regulated.'
  sec: 'Specified investments, regulated as securities, including via the Digital Securities Sandbox. A token that is also a specified investment (a specified investment cryptoasset) stays under its existing rules (PERG 18.4.6).'
  fund: 'A tokenized fund unit is still a unit in a collective investment scheme, a specified investment; the FCA works on fund tokenization with industry (the Investment Association’s Blueprint, November 2023; Project Guardian).'
  rwa: Out where the token is a specified investment; otherwise assessed case by case.
  art: 'Judged on substance, not the label: a token called an NFT is a qualifying cryptoasset if its units are in practice interchangeable (PERG 18.4.2); unique tokens are generally outside.'
  loy: Excluded where the token can only be redeemed with the issuer or used within a limited network (PERG 18.4); transferable points are assessed like other tokens.
  fmi: Regulated as a systemic payment system overseen by the Bank of England (e.g. Fnality), not as a cryptoasset.
