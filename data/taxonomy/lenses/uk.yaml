id: uk
group: jurisdiction
menu: 'UK · United Kingdom (FCA): “qualifying cryptoasset”'
name: UK FCA “qualifying cryptoasset”
short: UK FCA
color: '#4338ca'
intro: 'The UK brings “qualifying cryptoassets” and “qualifying stablecoins” (tokens that hold backing assets to keep a stable value against one fiat currency) into FCA regulation under the Financial Services and Markets Act 2000 (Cryptoassets) Regulations 2026, made on 4 February 2026. The FCA’s final rules (PS26/9 to PS26/13, 30 June 2026) and perimeter guidance (PS26/18, PERG 18) apply from 25 October 2027; the application window runs from 30 September 2026 to 28 February 2027. A second instrument, the Cryptoassets (Miscellaneous Amendments) Regulations 2026, laid on 15 September 2026 and before both Houses in November, adds exclusions for temporary settlement holdings, proprietary trading and market making on a UK platform, a purely technical interface to an authorized firm or to a “decentralised protocol”, and transfers of a “UK qualifying stablecoin” (one issued under a UK permission); the FCA’s draft guidance on them (CP26/36, 21 October 2026) is open until 18 November 2026, with final text expected in spring 2027. Already today, cryptoasset firms register with the FCA for money laundering supervision (since January 2020) and promotions to UK consumers are regulated (since October 2023). Specified investments (tokenized securities and funds, deposits), e-money, fiat currency and central bank digital currencies are outside the new crypto definitions. A regulated firm using a permissionless ledger is not outsourcing to it (FG26/6): it maps the dependency and plans for contingencies. Systemic stablecoins will be regulated jointly with the Bank of England.'
