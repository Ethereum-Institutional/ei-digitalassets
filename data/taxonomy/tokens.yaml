# Token badges: the ten largest digital assets by market capitalization, placed by issuer and structure.
# `circle` is the id of the circle the badge sits in (its definition inherits that circle's lens treatment).
# Badges never move. `licensed_under` lists the lenses that license the token: under those lenses the lens-only circle
# the lens shows (Licensed or Recognized Stablecoins / Payment Tokens) stretches to take the badge in. List a lens only
# where that regime licensed the issuer or its regulator specifically recognized the token; tolerance does not count.

as_of: October 2026
tokens:
- ticker: BTC
  name: Bitcoin
  circle: btc
  x: 300
  y: 343
  desc: The largest digital asset, about $1.6 trillion in mid-October 2026. Native to the Bitcoin network; no issuer, no redemption claim.
- ticker: ETH
  name: Ether
  circle: eth
  x: 300
  y: 423
  desc: The native asset of Ethereum, about $290 billion in mid-October 2026. Pays gas fees and is staked to secure the network.
- ticker: BNB
  name: BNB
  circle: natoth
  x: 266
  y: 517
  desc: The native asset of BNB Chain, about $96 billion. Closely associated with the Binance exchange group.
- ticker: XRP
  name: XRP
  circle: natoth
  x: 300
  y: 517
  desc: The native asset of the XRP Ledger, about $83 billion.
- ticker: SOL
  name: Solana
  circle: natoth
  x: 334
  y: 517
  desc: The native asset of Solana, about $60 billion.
- ticker: TRX
  name: TRON
  circle: natoth
  x: 266
  y: 546
  desc: The native asset of TRON, about $31 billion. TRON is a major settlement network for USDT.
- ticker: HYPE
  name: Hyperliquid
  circle: natoth
  x: 300
  y: 546
  desc: The native asset of the Hyperliquid Layer-1, which runs an on-chain perpetuals exchange; about $20 billion.
- ticker: ZEC
  name: Zcash
  circle: natoth
  x: 334
  y: 546
  desc: 'The native asset of Zcash, about $18 billion. A privacy coin, with optional shielded transfers: some regulators list privacy tokens as prohibited, and many venues restrict them.'
- ticker: USDT
  name: Tether USDt
  circle: sc
  x: 984
  y: 534
  licensed_under: [adgm, sv]
  desc: 'The largest stablecoin by circulation, issued by Tether, which is headquartered and licensed in El Salvador. As of October 2026 it is a CNAD-registered stablecoin there and an Accepted Fiat-Referenced Token in ADGM, but it is not authorized under MiCA or the GENIUS Act and is not registered under the CBUAE payment-token regime. Switch on a lens to see where it counts as licensed.'
- ticker: USDC
  name: USD Coin
  circle: sc
  x: 944
  y: 534
  licensed_under: [mica, jp, adgm, difc, sv]
  desc: 'Issued by Circle, a regulated fintech. Authorized as an e-money token under MiCA through Circle’s French e-money license, and recognized in Japan, ADGM, the DIFC and El Salvador. Not yet a US payment stablecoin: the GENIUS Act takes effect on 18 January 2027, although Circle’s national trust bank received final OCC approval on 10 July 2026. Switch on a lens to see where it counts as licensed.'
- ticker: RCHKD
  name: HSBC RedCoin
  circle: sc
  x: 764
  y: 532
  licensed_under: [hkma]
  only_under: [hkma]     # shown only under the HKMA lens (owner, 29 October 2026)
  desc: 'A Hong Kong dollar stablecoin issued by HSBC under HKMA stablecoin issuer licence FRS02 (effective 10 April 2026): fully backed by cash, redeemable 1:1 for HKD, and not a protected deposit. HKD 83.2 million in circulation against HKD 84.2 million of reserves on 29 October 2026. It runs on HSBC’s own DLT network, not a public blockchain; live in PayMe, coming to the HSBC HK app. A bank-issued stablecoin, so it sits where Commercial Bank meets Stablecoins.'
  sources:
  - title: HSBC Hong Kong, HSBC RedCoin (RCHKD) stablecoin page (licence FRS02, reserves, network, PayMe)
    url: https://www.hsbc.com.hk/stablecoins/
    checked: '2026-10-29'
