# Scenario page: corporate actions and distributions on tokenized securities, a coupon or dividend paid and a redemption at maturity, on the same ledger as the asset. Content in scenario.yaml.

kind: scenario
title: 'Corporate actions: distributions, elections and redemptions on tokenized securities'
slug: corporate-actions-tokenized
eyebrow: Ethereum Institutional · Research · Scenarios
heading:
  text: Corporate actions
  italic: actions
intro: 'A corporate action is what an issuer does to all its holders at once: pay a coupon or dividend, offer a choice, redeem a bond, split a share, hold a vote. Today the work is finding the holders through a chain of intermediaries and reconciling what each thinks the entitlement was. This page works through one distribution and one redemption on a tokenized security: the record date is a block, the holders are the ledger, and every holder is paid in one transaction in the tokenized currency the asset trades against. What does not change is the event: the issuer decides it, its documents govern it, and the tax is the holder’s and the issuer’s.'
svg_label: Swimlane diagram of a distribution and a redemption on a tokenized security, from the announcement to the record
panel_default:
  title: How it works
  text: Hover over a step to read what happens and which standards do the work; click to pin it. Dashed arrows are off-ledger, solid arrows are on the ledger, and each band across the columns is one transaction in which every holder is paid, or the security is cancelled against cash.
