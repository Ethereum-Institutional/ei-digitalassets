# Scenario page: securities lending, a tokenized security lent against tokenized collateral, with recall and return on the ledger. Content in scenario.yaml.

kind: scenario
title: 'Securities lending: a tokenized security against tokenized collateral'
slug: securities-lending-tokenized
eyebrow: Ethereum Institutional · Research · Scenarios
heading:
  text: Securities lending
  italic: lending
intro: 'A securities loan is a temporary transfer of a security to a borrower who needs it, to settle a sale, to cover a short position or to deliver on an obligation, against collateral worth more than the security and for a fee; the lender keeps the economics of the security (the coupons or dividends reach it as manufactured payments) and can recall it, and the borrower returns equivalent securities at the end. This page works through one loan, a tokenized bond lent against tokenized collateral, because it shows where the ledger changes the work: the delivery of the security and of the collateral settle in one transaction, the collateral is marked and margined every block rather than every day, and a recall and return settle the moment they are instructed. The lender’s credit exposure to the borrower, the haircuts, the fee, the tax on manufactured payments and the legal form of the loan, a transfer of title or a pledge under the market’s master agreement, are what they were; the ledger changes how the legs move, not what the loan is.'
svg_label: Swimlane diagram of a securities loan between a tokenized security and tokenized collateral, from the master agreement to the return
