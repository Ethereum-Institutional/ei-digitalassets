# Scenario page: securities lending, a tokenized security lent against tokenized collateral, with recall and return on the ledger. Content in scenario.yaml.

kind: scenario
title: 'Securities lending: a tokenized security against tokenized collateral'
slug: securities-lending-tokenized
eyebrow: Ethereum Institutional · Research · Scenarios
heading:
  text: Securities lending
  italic: lending
intro: 'A securities loan transfers a security to a borrower that needs it, against collateral worth more than the security and for a fee; the lender keeps the economics, can recall, and gets equivalent securities back. This page works through a tokenized bond lent against tokenized collateral. The security and the collateral settle in one transaction, the collateral is margined every block, and a recall settles when instructed. The credit exposure, the haircuts, the fee, the tax on manufactured payments and the legal form of the loan are what they were; the ledger changes how the legs move, not what the loan is.'
svg_label: Swimlane diagram of a securities loan between a tokenized security and tokenized collateral, from the master agreement to the return
panel_default:
  title: How it works
  text: Hover over a step to read what happens and which standards do the work; click to pin it. Dashed arrows are off-ledger, solid arrows are on the ledger, and each band across the columns is one transaction in which the security and the collateral change hands.
