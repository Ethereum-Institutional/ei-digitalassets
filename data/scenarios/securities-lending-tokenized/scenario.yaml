# Scenario: securities lending, a tokenized security lent against tokenized collateral, with margin, recall and return on the ledger.
# Actors are columns in the diagram; steps are rows (kind: offchain | onchain | atomic; an atomic step names `lanes`).
# Tokens link to the taxonomy; standards link to eips.ethereum.org. Writing rules: US spelling; no em-dashes.

icon: lending
tags:
- { kind: move, label: Asset moves }
- { kind: move, label: Credit is extended }
- { label: Asset manager }
- { label: Bank }
- { label: Market infrastructure }

actors:
- id: lender
  name: Lender (beneficial owner)
  role: An asset manager, a pension fund or an insurer holding tokenized securities for the long term and lending them for a fee. Keeps the economics of the security while it is on loan and can recall it.
- id: agent
  name: Agent lender or custodian
  role: 'Runs the lending program for the lender: sets the eligible borrowers, the collateral schedule and the haircuts, values the collateral, calls margin, recalls and returns, acting on the lending contract with its own keys. A lender may act for itself instead.'
- id: ledger
  name: Ledger and lending contract
  kind: ledger
  role: Ethereum mainnet (or a rollup or a private Ethereum-technology network, by deployment style) running the security-token contract, the collateral-token contracts and a lending contract that records each loan (security, quantity, fee, collateral, margin threshold) and moves both legs in one transaction at the opening and at the return.
- id: borrower
  name: Borrower (broker-dealer)
  role: A bank or broker-dealer that needs the security to settle a sale, cover a short position or deliver on an obligation. Delivers collateral worth more than the security, pays the fee, and returns equivalent securities when the loan ends or is recalled.
- id: registrar
  name: Security registrar or tokenization agent
  role: Keeps the security’s register and the identity registry its token checks on every transfer; pays coupons or dividends to the holder of record, from which the manufactured payment to the lender follows. Acts for the issuer.
- id: observer
  name: Auditor or regulator
  kind: observer
  role: 'Reads the same ledger as everyone else: the opening, each margin movement, the manufactured payments and the return are transfer events, with no statement to request.'

steps:
- title: Master agreement, onboarding and eligibility
  from: registrar
  to: ledger
  kind: onchain
  text: 'Before the first loan, lender and borrower are eligible holders of the security (the registrar registers both wallets in its identity registry) and of each collateral token (the issuer of a deposit token adds them to its allowlist; a fund’s transfer agent registers them). Off the ledger they have signed the market’s master agreement for securities lending, which provides for the transfer of title to the securities and to the collateral, or for a pledge of the collateral, and sets the manufactured payments, margin, recall, events of default and close-out that the contract on the ledger executes.'
  standards: [ERC-3643 identity registry, deposit-token allowlist, master agreement]
- title: Loan agreed
  from: borrower
  to: agent
  kind: offchain
  text: 'The borrower asks for the security; the agent lender confirms availability and the terms: quantity, fee, the collateral accepted (cash tokens, fund units or other securities) and its margin above the loan’s value, and whether the loan is open or for a fixed term. The confirmed terms are written into an instance of the lending contract on the ledger.'
- title: Lender authorizes the loan leg
  from: agent
  to: ledger
  kind: onchain
  text: 'The agent authorizes the lending contract to move the security tokens from the lender’s wallet: an ERC-20 approval or a signed permit. The security’s compliance module will re-check at settlement that the borrower is a registered holder, so the loan cannot deliver to an ineligible wallet, and the borrower’s onward delivery (to the buyer it sold to) will be checked the same way.'
  standards: [ERC-20 approve, ERC-2612 permit, ERC-3643 compliance]
- title: Borrower authorizes the collateral leg
  from: borrower
  to: ledger
  kind: onchain
  text: 'The borrower authorizes the lending contract to move collateral worth the loan plus the margin: deposit tokens, a stablecoin, fund units or other security tokens, each with its own eligibility rules that will run at settlement.'
  standards: [ERC-20 approve, ERC-2612 permit, EIP-3009]
- title: Opening, security against collateral in one transaction
  kind: atomic
  lanes: [agent, ledger, borrower]
  text: 'One transaction calls the lending contract, which moves the security tokens from the lender to the borrower and the collateral tokens from the borrower to the lender (a transfer of title, as the master agreement provides; a variant locks the collateral in the contract under the lender’s control instead). Each token’s own rules run inside it; if any check fails nothing moves. The borrower can deliver the security the moment the transaction is included, at any hour.'
  standards: [ERC-20 transferFrom, ERC-3643, lending contract]
- title: 'Life of the loan: margin, manufactured payments, substitution'
  from: ledger
  to: agent
  kind: onchain
  text: 'The contract, or the agent through it, marks the security and the collateral against published prices and calls margin when the collateral falls short, each top-up a transfer settled in minutes; the borrower may substitute eligible collateral by an atomic swap. A coupon or dividend paid while the security is on loan reaches the borrower as holder of record and is passed to the lender as a manufactured payment under the agreement; the lender has no vote while title has passed, and recalls to vote. The fee accrues daily and is settled in the cash token.'
  standards: [ERC-20 transfer, lending contract, price feed]
- title: Recall and return, collateral released in one transaction
  kind: atomic
  lanes: [agent, ledger, borrower]
  text: 'When the lender recalls or the term ends, one transaction moves equivalent security tokens from the borrower back to the lender and the collateral back to the borrower, with the fee settled; both legs settle or neither does, the moment the borrower has the securities to return. If the borrower cannot return them, the loan does not close: the lender keeps the collateral it holds and the master agreement’s default, buy-in and close-out provisions govern what follows, including an enforced transfer under role controls where the tokens support it.'
  standards: [ERC-20 transferFrom, ERC-3643, ERC-7943 forcedTransfer, lending contract]
- title: Finality, register and record
  from: ledger
  to: observer
  kind: onchain
  text: 'On Ethereum mainnet each transaction is finalized within about two epochs (roughly 13 minutes), after which reversing it would cost an attacker at least a third of all staked ETH. The transfer events of the opening, each margin movement, the manufactured payments and the return are the record for both parties, the agent, the custodians and the registrar; the register shows the borrower as holder during the loan where the ledger is the register, and the agent’s books are updated from the same events otherwise. The regulator reads what the parties read, and the contract can emit each loan and its collateral in the form a transaction-reporting regime asks for.'
  standards: [Transfer events]

tokens:
- name: Fixed Income (tokenized bond, the security lent)
  circle: fi
  place: Tokenized Real-World Assets › Financial Instruments › Fixed Income
  role: The security on loan in this example. A bond whose register the registrar keeps, represented as a permissioned token; the borrower must be an eligible holder, and so must anyone it delivers the bond to.
  example: Live example, the European Investment Bank’s first digital bond on a public blockchain, issued on Ethereum mainnet in April 2021.
  sources:
  - { title: 'EIB, first digital bond on a public blockchain (April 2021)', url: https://www.eib.org/en/press/all/2021-141-european-investment-bank-eib-issues-its-first-ever-digital-bond-on-a-public-blockchain, checked: '2026-10-25' }
- name: Equities (the usual security lent)
  circle: eq
  place: Tokenized Real-World Assets › Financial Instruments › Equities
  role: 'Shares are what most securities lending moves, to cover short sales and settlement; a tokenized share works through the same steps, with its own eligibility rules, and the manufactured dividend and the recall for voting matter more. Ethereum Institutional names no live tokenized-equity lending program here.'
- name: Deposit Token (cash collateral)
  circle: dt
  place: Digital Money › Tokenized Currencies › Commercial Bank › Tokenized Deposits › Deposit Token
  role: Cash collateral as bank money. A tokenized claim on a deposit at the issuing bank, held by its clients; the lender may reinvest it (the treasury scenario) and pays the borrower a rebate.
  example: Live example, JPMD (JPM Coin), on Base since November 2025 and on Ethereum mainnet since 19 October 2026.
  sources:
  - { title: 'J.P. Morgan, JPM Coin goes live on Ethereum (19 October 2026)', url: https://www.jpmorgan.com/payments/newsroom/jpm-coin-live-on-ethereum, checked: '2026-10-25' }
- name: Funds (non-cash collateral)
  circle: fund
  place: Tokenized Real-World Assets › Financial Instruments › Funds
  role: Non-cash collateral. Units of a tokenized money market fund posted against the loan where the lender accepts them; they keep earning for the borrower and are the collateral most often named in live tokenized-collateral programs.
  example: Live examples, tokenized money market fund shares moved as collateral on J.P. Morgan’s Tokenized Collateral Network (2022); DTCC’s platform for tokenized real-time collateral management (announced 2 April 2025); Circle USYC and BlackRock BUIDL accepted as collateral by an exchange (2025).
  sources:
  - { title: 'J.P. Morgan, Blockchain brings collateral mobility to traditional assets (15 July 2022): intraday repo on Kinexys Digital Assets since 2020, more than USD 300 billion processed; the Tokenized Collateral Network moves tokenized money market fund shares; an institutional-scale EVM-based chain', url: https://www.jpmorgan.com/insights/payments/wallets/blockchain-kinexys-asset-tokenization, checked: '2026-11-06' }
  - { title: 'DTCC, platform for tokenized real-time collateral management (2 April 2025)', url: https://www.dtcc.com/news/2025/april/02/dtcc-announces-new-platform-for-tokenized-real-time-collateral-management, checked: '2026-10-25' }
  - { title: 'Circle, USYC supported as off-exchange collateral for Binance institutional clients and to be issued natively on BNB Chain (24 July 2025)', url: https://www.circle.com/pressroom/circles-usyc-now-supported-as-yield-bearing-off-exchange-collateral-for-binances-institutional-clients, checked: '2026-10-25' }
  - { title: 'BNB Chain, BUIDL launches on BNB Chain (14 November 2025)', url: https://www.bnbchain.org/en/blog/blackrocks-buidl-fund-launches-bnb-chain-tokenized-by-securitize-and-accepted-as-collateral-on-binance, checked: '2026-10-25' }
- name: Stablecoin (cash collateral)
  circle: sc
  place: Digital Money › Tokenized Currencies › Regulated Non-Bank › Stablecoins
  role: Cash collateral any eligible wallet can hold where lender and borrower do not share a bank; the obligor on the collateral changes from a bank to the stablecoin issuer, and the steps do not.

standards_help: 'Standards to consider, not a prescription. Each is in production or in draft and fits one or more steps; a deployment picks among them by the security token, the collateral it accepts, its legal form (title transfer or pledge) and the systems that must read the tokens, and several (CMTAT, ERC-1400) are alternatives to those listed. The master agreement for securities lending is a legal text the contract performs, not a standard it implements.'
standards:
- id: ERC-20
  title: Token Standard
  status: Final
  role: The base interface of the security and the collateral tokens (balances, transfer, approve); every wallet, custodian and the lending contract speak it.
  url: https://eips.ethereum.org/EIPS/eip-20
- id: ERC-3643
  title: T-REX, Token for Regulated Exchanges
  status: Final
  role: The permissioned security-token standard; an identity registry and a compliance contract decide, on every transfer, whether the receiving wallet is an eligible holder, including the borrower and whoever it delivers to. Alternatives in production are CMTAT and ERC-1400.
  url: https://eips.ethereum.org/EIPS/eip-3643
- id: ERC-7943
  title: uRWA, Universal Real World Asset Interface
  status: Final
  role: The minimal compliance interface a security token can expose (canSend, canReceive, canTransfer, frozen balances, forcedTransfer); the enforced transfer is the default path of the return where the agreement and the token’s rules allow it.
  url: https://eips.ethereum.org/EIPS/eip-7943
- id: ERC-2612
  title: Permit, signed approvals
  status: Final
  role: Lets either party authorize its leg with an off-line signature instead of a separate on-chain approval transaction.
  url: https://eips.ethereum.org/EIPS/eip-2612
- id: EIP-3009
  title: Transfer With Authorization
  status: Draft
  role: A signed authorization that anyone may submit, so the agent or the venue can submit a collateral or fee transfer and pay its fee; implemented by USDC and usable by a deposit token.
  url: https://eips.ethereum.org/EIPS/eip-3009
- id: EIP-712
  title: Typed structured data hashing and signing
  status: Final
  role: The signature format behind permits and authorizations; a lender’s signing policy can read exactly which security, quantity and collateral it is approving.
  url: https://eips.ethereum.org/EIPS/eip-712
- id: ERC-4337
  title: Account abstraction via entry point
  status: Final
  role: Institutional wallets as smart accounts with policy controls (approvals, limits, multiple signers) and fee sponsorship, and the agent’s role keys on the lender’s account; EIP-7702 brings the same to ordinary accounts.
  url: https://eips.ethereum.org/EIPS/eip-4337
- id: ERC-7573
  title: Conditional-upon-Transfer-Decryption for DvP
  status: Draft
  role: For the cross-ledger variant, where the security and the collateral sit on different chains, a mechanism that releases one leg only when the other has succeeded, without an intermediary.
  url: https://eips.ethereum.org/EIPS/eip-7573

sections:
- title: Why a public shared ledger
  lead: true
  items:
  - title: Both legs or neither, at the open and at the return
    text: 'A securities loan settles twice, and each settlement is a delivery against collateral. On a shared ledger each is one transaction that moves both or neither, so the lender is never unsecured between delivering the security and receiving the collateral, and the borrower is never short of collateral it has already returned the security for.'
  - title: Collateral marked every block
    text: 'The security and the collateral are priced and compared continuously, and a margin call is a transfer on the same ledger as the loan, so the gap between a price move and the margin that covers it shrinks from a day to a block; substitution is an atomic swap.'
  - title: Recall and return without a settlement chase
    text: 'A recall settles the moment the borrower has the securities to return, at any hour, and the collateral is released in the same transaction; there is no settlement window to miss and no fail to chase, only the borrower’s obligation to return, which the agreement governs.'
  - title: The security keeps its rules on loan
    text: 'Openness is a property of the ledger, not of the asset. The security stays bound to its issuer’s eligibility rules on every transfer, including the loan, the borrower’s onward delivery and the return, so a lending market on a public ledger is a market among eligible holders, enforced by the token rather than by each venue.'
  - title: One pool of lendable assets
    text: 'The bond lent here is the same token the DvP scenario trades, the repo scenario finances and the collateral scenario pledges; the lender’s long-term holding is lendable where it sits, to every eligible borrower on the ledger, without moving it to a lending platform.'
  - title: Reconciled every block
    text: 'Lender, agent, borrower, custodians and the registrar read the same transfer events, so nobody exchanges statements to agree what is on loan, what collateral covers it and what is owed; the ledger reconciles itself with every block it produces.'
- title: Where it stands today
  items:
  - title: The pieces, not the program
    text: 'The components of this scenario are live: tokenized bonds and fund units on Ethereum mainnet, a bank deposit token since 19 October 2026, and collateral-mobility programs that move tokenized fund units as collateral on bank-run ledgers. The financing neighbor is further along: a vendor-run distributed-ledger repo platform reported USD 8.0 trillion of repo transactions in July 2026 (vendor-stated). Ethereum Institutional names no live tokenized securities lending program here; the scenario is written so that one can be read against it.'
- title: Variants
  items:
  - title: Equities on loan
    text: The security is a tokenized share; the steps are the same, the manufactured dividend and the recall for voting matter more, and the borrower’s onward delivery to a buyer is bounded by the share’s eligibility rules, which bounds who can short it.
  - title: Pledge instead of title transfer
    text: 'Where the parties document a pledge of the collateral rather than a transfer of title, the collateral is locked in the lending contract under the lender’s control for the loan instead of transferred to its wallet; the legal form and its enforceability differ by jurisdiction.'
  - title: Cash collateral reinvested
    text: The lender sweeps cash collateral into a tokenized money market fund (the treasury scenario) and pays the borrower a rebate; the reinvestment risk is the lender’s, as it is off the ledger.
  - title: Agent lending program
    text: An agent lender runs loans for many lenders from a pool, allocating each loan, managing collateral and indemnifying against borrower default under its own terms; the agent is an actor with role keys on each lender’s account and the contract.
  - title: Security and collateral on different ledgers
    text: Where the security lives on one chain and the collateral on another, each leg needs a cross-ledger mechanism (ERC-7573, or a hashed time-lock); settlement is no longer one transaction, and a failure mode returns at the opening and at the return.
  - title: A neighbor, not a variant
    text: A loan that exists only inside one transaction, borrowed and repaid before the block closes or the whole transaction reverts, is a different instrument, uncollateralized because the ledger itself guarantees the repayment; it is a device of the collateral scenario, not a securities loan.
- title: Open questions for your deployment
  items:
  - title: Title transfer or pledge, and who votes
    text: Under a title-transfer loan the borrower is the holder of record and the lender recalls to vote; under a pledge the lender keeps the security and the collateral is charged. The contract must match the form, and the opinions on enforceability and close-out netting must cover tokenized securities and collateral.
  - title: Who may borrow, and deliver on
    text: The security’s eligibility rules bound the borrowers and everyone they deliver to; a loan whose purpose is onward delivery needs the buyer eligible too. Decide whether the token’s rules admit the market you want before the program is built.
  - title: Manufactured payments and tax
    text: A coupon or dividend paid to the borrower and passed to the lender carries the tax treatment of the parties and the security, which the ledger does not change; the Regulatory layer and your advisers, not this page.
  - title: Collateral schedule and reinvestment
    text: Which tokens are eligible collateral, at what haircuts and concentration limits, and whether cash collateral is reinvested and at whose risk, are the lender’s decisions, enforced by the contract once made.
  - title: Default and buy-in
    text: A borrower that cannot return the securities leaves the lender with the collateral and the agreement’s remedies; where the token supports an enforced transfer under role controls, who may invoke it and on what evidence must be settled in advance.
  - title: Visibility of loans and shorts
    text: On a public ledger loans, collateral and returns are visible to anyone who can map a wallet to a name, and a borrow can reveal a short. Permissioned tokens, pseudonymous wallets and confidential-transfer designs (see the Privacy page) are the answers in use.

