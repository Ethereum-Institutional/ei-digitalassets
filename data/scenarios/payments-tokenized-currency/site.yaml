heading:
  text: Payments with tokenized currency
  italic: tokenized
intro: 'A payment is the simplest thing a ledger does and the one institutions do most. This page works through one, a company paying a supplier in another country in a bank deposit token or a regulated stablecoin, because it shows what changes and what does not. The money moves in one transaction, at any hour, from the payer’s address to the payee’s, with no correspondent in between and no cut-off; the payee sees it arrive and reconciles it from the transaction itself. What does not change is everything around the transfer: who may hold the money is still the issuer’s rule, enforced in the token; the two firms that serve payer and payee still identify their customers and exchange the originator and beneficiary information the travel rule requires, off the ledger; and turning the token into local currency at the far end is still a bank’s or a payment firm’s job. The ledger replaces the chain of correspondents, not the obligations of the parties.'
