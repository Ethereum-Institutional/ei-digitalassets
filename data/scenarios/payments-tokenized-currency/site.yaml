# Scenario page: payments with tokenized currency, a cross-border supplier payment in a deposit token or a stablecoin. Content in scenario.yaml.

kind: scenario
title: 'Payments with tokenized currency'
slug: payments-tokenized-currency
eyebrow: Ethereum Institutional · Research · Scenarios
heading:
  text: Payments with tokenized currency
  italic: tokenized
intro: 'A payment is the simplest thing a ledger does and the one institutions do most. This page works through a company paying a supplier abroad in a bank deposit token or a regulated stablecoin. The money moves in one transaction at any hour, from the payer’s address to the payee’s, with no correspondent and no cut-off, and the payee reconciles it from the transaction itself. What does not change is everything around the transfer: who may hold the money is the issuer’s rule, the two firms still exchange travel-rule information off the ledger, and turning the token into local currency is still a bank’s job.'
svg_label: Swimlane diagram of a cross-border payment in a deposit token or stablecoin, from the invoice to the off-ramp
