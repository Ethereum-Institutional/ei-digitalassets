# Scenario page: delivery versus payment, deposit token against a tokenized money market fund. Content in scenario.yaml.

kind: scenario
title: 'DvP: deposit token against a tokenized money market fund'
slug: dvp-deposit-token-tmmf
eyebrow: Ethereum Institutional · Research · Scenarios
heading:
  text: Delivery versus payment
  italic: versus
intro: 'There are many kinds of delivery versus payment: any tokenized product (a bond, an equity, a fund, a commodity) settled against any tokenized payment (a deposit token, a stablecoin, central bank money). This page works through one example, a bank deposit token against a tokenized money market fund, because it is the common case: a payment token that carries little or no yield exchanged for an asset that does. The buyer pays, the seller delivers, and both legs settle in one transaction on the ledger: either the buyer receives the units and the seller receives the money, or nothing moves. No central securities depository, no payment system, no intraday credit and no reconciliation sit between the two legs, because both are records on the same ledger.'
