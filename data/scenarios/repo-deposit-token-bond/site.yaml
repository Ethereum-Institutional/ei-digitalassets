# Scenario page: repo, a tokenized bond against a bank deposit token. Content in scenario.yaml.

kind: scenario
title: 'Repo: a tokenized bond against a deposit token'
slug: repo-deposit-token-bond
eyebrow: Ethereum Institutional · Research · Scenarios
heading:
  text: Repo and reverse repo
  italic: reverse
intro: 'A repurchase agreement is a sale of securities with a commitment to buy them back on a set date at a set price: a collateralized loan in economic terms, a transfer of title in legal terms. Seen from the cash lender it is a reverse repo. This page works through one example, a tokenized bond sold against a bank deposit token and repurchased within the day or the next, because it is where a shared ledger changes the most: both legs of both settlements are records on the same ledger, so the opening and the closing each settle in one transaction, margin moves in minutes rather than at the next settlement cycle, and an intraday repo opens and closes inside the hours its cash leg allows. The counterparty risk, the haircut, and the enforceability of the title transfer and of close-out netting are what they were; the ledger changes how the legs settle, not what the contract is.'
svg_label: Swimlane diagram of a repo between a tokenized bond and a deposit token, from the master agreement to the closing leg
