# Scenario page: repo, a tokenized bond against a bank deposit token. Content in scenario.yaml.

kind: scenario
title: 'Repo: a tokenized bond against a deposit token'
slug: repo-deposit-token-bond
eyebrow: Ethereum Institutional · Research · Scenarios
heading:
  text: Repo and reverse repo
  italic: reverse
intro: 'A repo is a sale of securities with a commitment to buy them back at a set date and price: a collateralized loan in economic terms, a transfer of title in law; the cash lender calls it a reverse repo. This page works through a tokenized bond sold against a bank deposit token and repurchased within the day or the next. Each settlement is one transaction, margin moves in minutes, and an intraday repo fits inside its cash leg’s hours. The counterparty risk, the haircut and the enforceability of title transfer and netting are what they were; the ledger changes how the legs settle, not what the contract is.'
svg_label: Swimlane diagram of a repo between a tokenized bond and a deposit token, from the master agreement to the closing leg
panel_default:
  title: How it works
  text: Hover over a step to read what happens and which standards do the work; click to pin it. Dashed arrows are off-ledger, solid arrows are on the ledger, and each band across the columns is one transaction in which both legs settle.
