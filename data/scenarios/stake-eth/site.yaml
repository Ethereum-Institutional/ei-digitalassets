# Scenario page: staking ETH, from a solo validator to a liquid staking token. Content in scenario.yaml.

kind: scenario
title: 'Stake ETH: solo, through an operator, custodial or liquid'
slug: stake-eth
eyebrow: Ethereum Institutional · Research · Scenarios
heading:
  text: Stake ETH
  italic: Stake
intro: 'Staking is what an institution does with ETH it intends to hold: it locks the asset to a validator that secures Ethereum mainnet and earns the protocol''s rewards for doing so. Four models carry the same eight steps with different hands on the keys: a validator the institution runs itself, an operator that runs it against a withdrawal address the institution controls, a custodian that holds both the keys and the stake, or a liquid staking token that represents a share of a pooled stake. This page shows the steps and what each model leaves with whom; how a regime classifies each model is a question for the Taxonomy''s lenses.'
