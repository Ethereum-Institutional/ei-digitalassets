# Scenario page: AI agent payments, an agent paying for a service in a stablecoin within a mandate its principal controls. Content in scenario.yaml.

kind: scenario
title: 'AI agent payments: an agent pays for a service within its mandate'
slug: agent-payments-x402
eyebrow: Ethereum Institutional · Research · Scenarios
heading:
  text: AI agent payments
  italic: agent
intro: 'A software agent working for an institution will pay for data, compute and other agents’ services, many times a day in small amounts. This page works through one payment: an agent calling a paid API and settling the charge in a stablecoin inside one HTTP round trip. The agent never holds the money; it holds a permission on an account the institution controls, with a limit, allowed payees and an expiry the account enforces whatever the agent was told. The payee needs only an address, and the agent carries an identity and a track record others can read. A prompt is not a control; a limit the ledger enforces is.'
svg_label: Swimlane diagram of an AI agent paying for a service in a stablecoin, from the mandate to the audit record
panel_default:
  title: How it works
  text: Hover over a step to read what happens and which standards do the work; click to pin it. Dashed arrows are off-ledger, solid arrows are on the ledger, and the band across the columns is the one transaction in which the payment settles.
