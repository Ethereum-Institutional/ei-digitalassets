# Scenario page: collateral mobility and margin, tokenized fund units posted as margin and released, substituted or enforced on the ledger. Content in scenario.yaml.

kind: scenario
title: 'Collateral mobility and margin: tokenized fund units posted as margin'
slug: collateral-mobility-margin
eyebrow: Ethereum Institutional · Research · Scenarios
heading:
  text: Collateral mobility
  italic: mobility
intro: 'Every derivative, loan and cleared trade is backed by collateral an institution must post, value, top up, substitute and get back, and the work is in the moving: through custodians and agents, on the next cycle, reconciled against the counterparty’s records. This page works through one margin call, tokenized fund units posted to a counterparty. The units are locked for the taker in one transaction at any hour, the giver keeps their income, a substitution is one atomic swap, and release or enforcement is one transaction. The exposure, the haircuts and the legal form, pledge or title transfer, are what they were; the ledger changes how collateral moves, not what it secures.'
