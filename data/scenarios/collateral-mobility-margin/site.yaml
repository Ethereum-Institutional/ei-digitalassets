# Scenario page: collateral mobility and margin, tokenized fund units posted as margin and released, substituted or enforced on the ledger. Content in scenario.yaml.

kind: scenario
title: 'Collateral mobility and margin: tokenized fund units posted as margin'
slug: collateral-mobility-margin
eyebrow: Ethereum Institutional · Research · Scenarios
heading:
  text: Collateral mobility
  italic: mobility
intro: 'Every derivative, loan and cleared trade an institution holds is backed by collateral it must post, value, top up, substitute and get back, and the work is in the moving: collateral sits at custodians, is pledged through agents, settles on the next cycle and is reconciled against the counterparty’s records. This page works through one margin call, tokenized money market fund units posted as margin to a counterparty, because it shows what a shared ledger changes. The units are locked for the taker in one transaction the moment the call is agreed, at any hour; the giver keeps the income on them while they are posted; a substitution is one atomic swap; and at the end they are released, or taken on a default, in one transaction. The exposure the margin covers, the haircuts, the eligibility schedule and the legal form of the collateral arrangement, a pledge or a transfer of title under the parties’ agreement, are what they were; the ledger changes how collateral moves and where it can be seen, not what it secures.'
