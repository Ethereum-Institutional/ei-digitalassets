# Scenario page: fund subscription and redemption, primary-market dealing in a tokenized fund against a cash leg. Content in scenario.yaml.

kind: scenario
title: 'Fund dealing: subscription and redemption in a tokenized fund'
slug: fund-dealing-tokenized
eyebrow: Ethereum Institutional · Research · Scenarios
heading:
  text: Fund dealing
  italic: dealing
intro: 'Dealing is the fund’s own market: an investor subscribes and the fund issues units against cash; an investor redeems and the fund cancels units and pays, at the price it strikes or, for a constant-price fund, at par on demand. This page works through one subscription and one redemption in a tokenized fund. The order and the cash arrive together, the units are issued in the transaction that takes the cash, and the register is the ledger or is updated from it. What does not change is the fund: its price is struck when it strikes it, its gates and suspensions are what its documents say, and who may invest is what its offering allows.'
svg_label: Swimlane diagram of a subscription and a redemption in a tokenized fund, from onboarding to the register
panel_default:
  title: How it works
  text: Hover over a step to read what happens and which standards do the work; click to pin it. Dashed arrows are off-ledger, solid arrows are on the ledger, and each band across the columns is one transaction in which units and cash change hands.
