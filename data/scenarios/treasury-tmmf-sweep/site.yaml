# Scenario page: treasury management, cash sweeps between a deposit token and tokenized money market fund units. Content in scenario.yaml.

kind: scenario
title: 'Treasury management with tokenized money market funds'
slug: treasury-tmmf-sweep
eyebrow: Ethereum Institutional · Research · Scenarios
heading:
  text: Treasury management
  italic: Treasury
intro: 'A treasury keeps operating cash where it can pay from and invests the rest, usually in a money market fund, moving between the two daily across entities and time zones. This page works through that cycle on a shared ledger: the group’s entities hold a bank deposit token, excess cash is swept into tokenized fund units and back on the fund’s own dealing terms, and payments go out from the same account at any hour. Balances are readable every block and a sweep is one transaction. What does not change is the fund: its price is struck when it strikes it, and a fund that can suspend redemptions still can.'
svg_label: Swimlane diagram of a treasury sweeping cash between a deposit token and tokenized money market fund units, and paying out
