# Scenario page: foreign exchange, payment versus payment between two tokenized currencies. Content in scenario.yaml.

kind: scenario
title: 'FX: payment versus payment between tokenized currencies'
slug: fx-pvp-tokenized-currencies
eyebrow: Ethereum Institutional · Research · Scenarios
heading:
  text: Payment versus payment
  italic: versus
intro: 'A foreign-exchange trade is two payments in opposite directions, and its risk is that one side pays and the other does not. This page works through a euro tokenized currency against a dollar tokenized currency in the shape deployments use: a quote, both legs locked by signature, a wait for finality while the checks run, a release that pays both sides in one transaction or neither, and an off-ramp to a bank account where the buyer wants one. No nostro account is prefunded abroad and there is no settlement cycle; the money on each leg is still an issuer''s liability with the issuer''s rules, and the rate is still agreed between the parties.'
svg_label: Swimlane diagram of a foreign-exchange settlement between a euro token and a dollar token, from quote through escrow and release to payout
panel_default:
  title: How it works
  text: Hover over a step to read what happens and which standards do the work; click to pin it. Dashed arrows are off-ledger, solid arrows are on the ledger, and the band across the columns is the one transaction in which both currencies move.
