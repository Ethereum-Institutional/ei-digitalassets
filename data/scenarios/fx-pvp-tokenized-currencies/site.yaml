# Scenario page: foreign exchange, payment versus payment between two tokenized currencies. Content in scenario.yaml.

kind: scenario
title: 'FX: payment versus payment between tokenized currencies'
slug: fx-pvp-tokenized-currencies
eyebrow: Ethereum Institutional · Research · Scenarios
heading:
  text: Payment versus payment
  italic: versus
intro: 'A foreign-exchange trade is two payments in opposite directions, and its risk is that one side pays and the other does not. This page works through a euro tokenized currency against a dollar tokenized currency. On a shared ledger one transaction moves both legs or neither, at any hour, with no nostro account prefunded abroad and no settlement cycle. The money on each side is still an issuer’s liability with the issuer’s rules, the rate is still agreed between the parties, and converting the token into a bank balance is still a bank’s job; the ledger changes the settlement.'
svg_label: Swimlane diagram of a payment-versus-payment foreign-exchange settlement between a euro token and a dollar token
panel_default:
  title: How it works
  text: Hover over a step to read what happens and which standards do the work; click to pin it. Dashed arrows are off-ledger, solid arrows are on the ledger, and the band across the columns is the one transaction in which both currencies move.
