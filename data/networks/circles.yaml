- id: ethereum
  label:
  - Ethereum mainnet
  family: netc
  pill: true
  eth: true
  mark: ETH
  expand: collapsed
  sub: live institutional deployments
  path: Digital Asset Networks › Public › Permissionless consensus › Dynamically available
  desc: "The reference public permissionless network of the Ethereum ecosystem: about $290 billion of ETH, with roughly 44 million ETH staked by over 800,000 validators. Its virtual machine is the standard the rest of the ecosystem reuses.\n\nBlocks keep coming even when many validators go offline, because the fork choice is dynamically available; if finality stalls for more than four epochs, the inactivity leak drains the stake of validators that are not voting until the rest can finalize again. The protocol knows the staked keys, not the people behind them.\n\nEthereum mainnet launched under proof of work in 2015 and moved to proof of stake in 2022."
  glance:
    asset: "ETH"
    consensus: "Proof of stake (LMD-GHOST and Casper FFG)"
    contracts: "EVM"
    confirmed: "12 seconds (one block)"
