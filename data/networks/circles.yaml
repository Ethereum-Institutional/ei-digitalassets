# Digital Asset Networks: circles (content)
# Each circle: id, label (lines), family (palette key), optional sub-labels, and its definition (desc).
# Positions and sizes live in data/networks/layout.yaml so content edits never touch geometry.
# `containers` are grouping circles; `children` lists what they contain.
# `collapsible: true` gives a region a − control that hides it and everything inside it; `zoom: [x0, x1]` is the
#   strip of the canvas it occupies (the rest stretches to fill the width); `straddles` names regions that never hide
#   it; `band: true` regions (the two consensus squares) collapse to a slim band above the map, one at a time;
#   `alt: {<region>: {lx, ly}}` moves a label while that region is hidden.
# Writing rules: no em-dashes; quote YAML values that contain ": ". "Ethereum mainnet" for the chain, "Ethereum
# ecosystem" for the clients, rollups and deployments built with Ethereum technology.

