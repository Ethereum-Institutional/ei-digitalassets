circles:
- id: dan
  label:
  - Digital Asset Networks
  family: dan
  path: ''
  desc: 'The distributed ledger networks on which digital assets are issued, held and transferred. The map classifies them two ways at once: by who may operate a node (Private, Consortium with its Sovereign subset, and Public) and by how the nodes that order transactions are admitted (permissioned, or one of three degrees of permissionless). The Ethereum ecosystem reaches every region of this map: Ethereum mainnet is the public permissionless reference, its rollups settle on it, and Besu, the Ethereum client institutions deploy for consortium and private chains, is the same client that runs Ethereum mainnet. Ethereum Institutional is aligned to Ethereum mainnet’s north star, a globally verifiable public shared ledger on which every participant can check the same state and build, but supports every Ethereum deployment style on this map.'
- id: perm
  label:
  - Permissioned consensus
  family: perm
  collapsible: true
  band: true
  path: Digital Asset Networks
  desc: 'The nodes that order and finalize transactions are a list set outside the protocol: fixed by the operator or the members (QBFT and IBFT 2.0 in Besu, CometBFT and other Tendermint-style protocols, HotStuff, CantonBFT), or curated by the existing participants, as with the XRP Ledger’s default validator list, Stellar’s quorum sets, Hedera’s council and the single sequencers of today’s rollups. EI’s house rule: a network is permissioned whenever joining consensus requires review by the existing participants, whatever the marketing says. For an Ethereum Layer 2 the rule is read at the layer that can finalize the ledger and change its rules. At Stage 2 of ETHBEAT’s Stages framework (ETHBEAT was L2BEAT) the operator holds no power beyond a bounded delay: anyone can force a transaction through Ethereum mainnet, anyone can submit a fraud proof, and no upgrade other than a fix for an on-chain provable bug takes effect without giving users at least 30 days to exit. The rollup’s consensus is then Ethereum mainnet’s, and EI reads it as permissionless; below Stage 2 the operator or its Security Council still decides something the protocol does not, so the rollup stays permissioned however its sequencer is run. On 10 November 2026 Base, Arbitrum One and OP Mainnet are Stage 1, each short of the 30-day exit window and of a Security Council confined to on-chain provable bugs. Permissioned consensus is fast and final and fits private and consortium ledgers; it also means that the members, not the protocol, decide who counts.'
- id: priv
  label:
  - Private
  family: net
  collapsible: true
  sub: one operator
  path: Digital Asset Networks › Permissioned consensus
  desc: 'One organization operates every node, so it alone decides who may read or write, and it can change the rules or roll back history. Useful for internal books and records, testing and settlement inside a group, at the price of giving outsiders nothing to verify independently. Institutions building private Ethereum-technology networks use clients such as Besu. EI’s reading of why Besu suits them, a house view: its Apache 2.0 license, which Besu’s own history says was needed because enterprise pilots were being blocked by open-source license policies; permissioned consensus (QBFT, IBFT 2.0) and node and account allowlisting built in, where GoQuorum, the earlier enterprise fork, is no longer actively developed; governance by a neutral foundation (Hyperledger, now LF Decentralized Trust) with several commercial support vendors; Ethereum mainnet compatibility, so the EVM specification and the team’s skills carry across to public chains; and Java, which enterprise IT and security teams already run and audit. Private ledgers outside the Ethereum ecosystem (Hyperledger Fabric, Corda) sit here too, without the public-chain upgrade path.'
- id: cons
  label:
  - Consortium
  family: cons
  collapsible: true
  sub: several operators, admitted by agreement
  path: Digital Asset Networks › Permissioned consensus
  desc: 'Several organizations each run nodes and admit new members by agreement, usually under a legal framework that names the operators. Consensus is permissioned by construction: the validator set is a list the members maintain. Consortia give participants shared, tamper-evident records without trusting any one operator, but they are only as neutral and as verifiable as their membership, and outsiders cannot check the ledger. Besu with QBFT is the common Ethereum deployment (Swift’s shared ledger, Project Agorá, Fnality).'
- id: sov
  label:
  - Sovereign
  family: sov
  sub: one jurisdiction
  path: Digital Asset Networks › Permissioned consensus › Consortium
  desc: 'A consortium whose participants are all in one jurisdiction, usually convened or supervised by a central bank, a financial regulator or a national body, so that the network’s rules, data and participants sit inside one legal order. Examples: Fnality’s sterling payment system in the UK, the Bank of Korea’s Project Hangang and DCJPY in Japan.'
  sources:
  - title: 'ETHBEAT (formerly L2BEAT), The Stages Framework (Stage 2: permissionless fraud proofs, a 30-day exit window for upgrades not tied to on-chain provable bugs, a Security Council confined to such bugs; no stage requires decentralized sequencing; changelog to 30 April 2026)'
    url: https://forum.l2beat.com/t/the-stages-framework/291
    checked: '2026-11-10'
  - title: 'ETHBEAT, scaling summary (Arbitrum One, Base and OP Mainnet at Stage 1)'
    url: https://ethbeat.org/scaling/summary
    checked: '2026-11-10'
- id: pub
  label:
  - Public
  family: pub
  collapsible: true
  straddles: [perm, pless]
  alt:
    pless: { lx: 975, ly: 330 }
  sub: anyone may transact and run a node
  path: Digital Asset Networks
  desc: 'Anyone may transact and run a node, and the ledger’s history can be read and re-executed by anyone who does. Whether a node may also take part in ordering transactions is a separate question, answered by the consensus overlay: a public network can be permissionless (Ethereum mainnet, Bitcoin) or permissioned (the XRP Ledger’s curated validator list, Hedera’s council, today’s rollup sequencers). Public networks are where composability lives: any application can call any other, and anyone can verify the result.'
- id: pless
  label:
  - Permissionless consensus
  family: pless
  collapsible: true
  band: true
  path: Digital Asset Networks › Public
  desc: 'Anyone can take part in ordering transactions without anyone’s approval; what they need is a scarce resource, work or stake, that the protocol can count. Lewis-Pye and Roughgarden (Permissionless Consensus, 2023) show that the protocol then faces three challenges: unknown players (the set of entities running it is unknown and of unknown size), player inactivity (they can start or stop at any time) and sybils (one entity can run under any number of identifiers). The three nested bands inside this region are their hierarchy, ordered by how little the protocol assumes about who is running it: fully permissionless at the center, then dynamically available, then quasi-permissionless. A protocol that works in an inner band also works in every band outside it. The Ethereum Foundation’s primer for governments (July 2026) puts the two consensus boxes on one spectrum, the intranet and the open internet, and asks a deployment to judge where a network sits against its own objectives rather than as an abstract property. An Ethereum Layer 2 enters this region only at Stage 2 of ETHBEAT’s Stages framework, when its operator can do no more than delay and its consensus is in effect Ethereum mainnet’s (the Permissioned definition says why); it then sits in Dynamically Available beside Ethereum mainnet, its sequencer noted as a delay-bounded service.'
  sources:
  - title: 'Ethereum Foundation, Ethereum Basics for Governments and Institutions (ethereum.org report, July 2026; the Foundation’s own positions; comparative figures as of March 2026 from OpenZeppelin’s assessment)'
    url: https://ethereum.org/reports/basics-for-governments-institutions.pdf
    checked: '2026-11-10'

- id: quasi
  label:
  - Quasi
  - Permissionless
  family: quasi
  lines:
  - known staked identifiers,
  - a set quorum must keep voting
  path: Digital Asset Networks › Public › Permissionless consensus
  desc: 'The protocol knows a list of staked identifiers (public keys with stake locked on-chain) and, in the paper’s model, assumes every honest one is online. The paper’s definition sets no fraction; the one-third bound on Byzantine stake is the assumption behind its results. In practice each protocol fixes the share of stake that must keep voting for the chain to finalize: more than two-thirds in classic BFT designs, where validators can go offline only within the one-third fault budget (Solana needed coordinated restarts after such halts under Tower BFT), and 60% of stake over two rounds, or 80% in one, under Solana’s Alpenglow since October 2026, which tolerates 40% of stake offline. Below its quorum a chain stops finalizing. This is where BFT-style proof of stake sits (Algorand, Tendermint-style chains, Solana, Avalanche) and where elected or capped validator sets sit when anyone may stand without the incumbents’ approval (BNB Chain, TRON, Hyperliquid). It buys fast, accountable finality (a safety violation leaves signed evidence of who caused it) at the cost of stalling if too many validators go offline. Small elected sets are permissionless in form but concentrated in practice; each badge’s note says how concentrated.'
  sources:
  - title: 'Lewis-Pye and Roughgarden, Permissionless Consensus (arXiv 2304.14701): in the quasi-permissionless setting every identifier controlled by an honest player is assumed to be running the protocol; the less-than-one-third Byzantine stake bound is the assumption of its results, not part of the definition'
    url: https://arxiv.org/abs/2304.14701
    checked: '2026-11-06'
  - title: 'SIMD-0326, Alpenglow: fast finalization on one round of votes from 80% of stake, two rounds from 60%; 40% crash failure resilience'
    url: https://github.com/solana-foundation/solana-improvement-documents/blob/main/proposals/0326-alpenglow.md
    checked: '2026-11-06'
- id: dyn
  label:
  - Dynamically
  - Available
  family: dyn
  lines:
  - known staked identifiers,
  - any share may go offline
  path: Digital Asset Networks › Public › Permissionless consensus
  desc: 'The protocol knows the list of staked identifiers but assumes only that some honest staker is online, so block production can continue as participation falls, as under a longest-chain rule. Cardano’s Ouroboros is the paper’s canonical example. Ethereum mainnet’s fork choice (LMD-GHOST) runs here: the chain can keep growing when most validators are offline, with empty slots for absent proposers, and the inactivity leak slowly removes the stake of those who are absent, while Casper FFG adds quasi-permissionless finality when validators with at least two-thirds of staked ETH cast the required checkpoint votes. That pairing keeps Ethereum mainnet live like Bitcoin and final like a BFT chain.'
- id: full
  label:
  - Fully
  - Permissionless
  family: full
  lines:
  - nobody known
  - to the protocol
  path: Digital Asset Networks › Public › Permissionless consensus
  desc: 'The protocol has no knowledge of which players are running it at any moment and makes no assumption that any of them stays online; sybils are priced by an external resource the protocol cannot observe directly, which is what proof of work is. Bitcoin is the canonical example. Ethereum mainnet began here with proof of work, which is how ETH became widely distributed before the move to proof of stake. The price of this freedom is that finality is only probabilistic and the protocol is safe only while the network is synchronous.'
- id: besu
  label:
  - Besu private chains
  family: besu
  sub: announced by institution
  expand: expanded
  path: Digital Asset Networks › Permissioned consensus › Private
  desc: 'Institutions that have announced their own private chain built on Besu, the Ethereum client written in Java, licensed Apache 2.0 and governed by LF Decentralized Trust, with permissioned consensus (QBFT, IBFT 2.0) and node and account allowlisting built in. Each badge is one institution’s announced Besu network; hover a badge for the platform, the source and how firmly it is documented (Citi and DTCC state Besu themselves; the others rest on LF Decentralized Trust’s 2026 adoption report). Of the 29 G-SIBs, Citi, UBS and BNP Paribas have documented Besu chains; HSBC’s Orion and J.P. Morgan’s Kinexys run on other stacks, and eight G-SIBs reach Besu through Swift’s shared ledger instead. The same client runs Ethereum mainnet, so every chain here keeps the public-chain upgrade path. The Private circle explains why institutions choose Besu.'
  sources:
  - title: Besu documentation (runs on public and private networks; Ethereum mainnet execution client)
    url: https://docs.besu-eth.org/
    checked: '2026-10-25'
  - title: Besu docs, private network consensus (QBFT recommended; Clique and Ethash no longer supported)
    url: https://docs.besu-eth.org/private-networks/how-to/configure/consensus
    checked: '2026-10-25'
- id: swift
  label:
  - Swift shared ledger
  family: ledger
  sub: Besu, 17 banks
  expand: expanded
  path: Digital Asset Networks › Permissioned consensus › Consortium
  desc: 'Swift’s blockchain-based shared ledger for tokenized cross-border payments, announced in September 2025 and declared ready for use in July 2026 with 17 banks across Asia, Europe, the Middle East, Africa and the Americas as the first participants. Swift describes “an Ethereum Virtual Machine (EVM)-compatible architecture based on Hyperledger Besu”; Swift operates the ledger while banks operate their own environments and keep authority over keys, assets, funding and settlement, so the banks are participants rather than node operators: a consortium across many jurisdictions under one operator. HSBC and Standard Chartered completed the first live bank-to-bank tokenized deposit transaction on it on 20 August 2026, with the ledger acting “as a secure orchestration layer” that matched and netted the obligations. It matters twice on this map: as the largest group of banks to adopt Besu, and as a shared ledger, the north star this map argues for, even if a permissioned one. Hover a badge for each participant.'
  sources:
  - title: Swift press release, 29 September 2025 (blockchain-based ledger announced)
    url: https://www.swift.com/news-events/press-releases/swift-add-blockchain-based-ledger-its-infrastructure-stack-groundbreaking-move-accelerate-and-scale-benefits-digital-finance
    checked: '2026-10-25'
  - title: Swift, shared ledger progresses to MVP implementation (30 March 2026; EVM-compatible architecture based on Hyperledger Besu; Swift operates the ledger)
    url: https://www.swift.com/insights/news/swifts-blockchain-based-shared-ledger-progresses-mvp-implementation
    checked: '2026-10-25'
  - title: Swift press release, 9 July 2026 (ready for use; 17 banks)
    url: https://www.swift.com/news-events/press-releases/swifts-blockchain-ledger-ready-use-17-banks-set-pioneer-tokenised-cross-border-payments-trusted-global-infrastructure
    checked: '2026-10-25'
  - title: HSBC and Standard Chartered execute first live tokenised deposit transaction on Swift’s ledger (20 August 2026)
    url: https://www.about.hsbc.com.hk/news-and-media/hsbc-and-standard-chartered-execute-first-live-tokenised-deposit-transaction-on-swifts-blockchain
    checked: '2026-10-25'
- id: partior
  label:
  - Partior
  family: partior
  sub: Quorum (EVM)
  expand: collapsed
  path: Digital Asset Networks › Permissioned consensus › Consortium
  desc: 'The bank-owned interbank settlement network that grew out of Singapore’s Project Ubin: founded in 2021 by DBS, J.P. Morgan and Temasek, with Standard Chartered and Deutsche Bank as later shareholders and settlement banks, and described by Partior as “the production-live, multi-bank blockchain settlement network” for 24/7 atomic cross-border payments and FX payment versus payment. Emirates NBD went live on it for US dollar payments in July 2026. Announced as built on the Ethereum-based Consensys Quorum (EVM); Partior does not disclose its current stack. Member banks across Singapore, the United States, the United Kingdom, Germany and the UAE operate under Partior’s governance: Consortium, not Sovereign.'
  sources:
