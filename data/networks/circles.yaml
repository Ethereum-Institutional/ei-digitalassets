- id: agora
  label:
  - Project Agorá
  family: agora
  sub: BIS, 8 central banks, 40+ firms
  expand: collapsed
  path: Digital Asset Networks › Permissioned consensus › Consortium
  desc: 'The BIS Innovation Hub project in which eight central banks (seven at launch in April 2024: the Banque de France for the Eurosystem, the Bank of Japan, the Bank of Korea, Banco de México, the Swiss National Bank, the Bank of England and the Federal Reserve Bank of New York; the Bank of Canada joined in May 2026) and more than forty private financial firms test tokenized commercial bank deposits and wholesale central bank money on one programmable platform; real-value transactions in six currencies were tested in July 2026. A consortium spanning several jurisdictions, hence not Sovereign, and a signal of how many central banks are working with Ethereum technology: the platform is reported to run on Besu with QBFT consensus (LF Decentralized Trust’s 2026 adoption report), while the BIS itself says only “programmable ledger”.'
  sources:
