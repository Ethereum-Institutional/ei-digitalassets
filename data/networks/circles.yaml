  path: Digital Asset Networks › Public › Permissionless consensus › Quasi Permissionless
  desc: 'Proof of Staked Authority on a fork of Geth. Anyone may register a validator with 2,000 BNB of self-stake; each day the top 45 by stake are elected (21 cabinet members and 24 candidates) and 21 of them order blocks in each epoch. No incumbent review, so quasi-permissionless under EI’s rule, but a few dozen validators in practice, and the chain is closely associated with the Binance group. Runs the EVM. Smart contracts: yes; the EVM.'
