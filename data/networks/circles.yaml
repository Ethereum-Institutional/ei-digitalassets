  desc: "A side-chain of Ethereum mainnet: Bor, built on Geth, executes blocks and a CometBFT-based Heimdall layer checkpoints them to Ethereum mainnet, where the staking and bridge contracts live. Validator seats are capped (100 at launch, 105 since PIP-4) and were originally filled by open on-chain auction; today a seat opens only when an incumbent leaves, and applicants with 100,000 POL of self-stake are reviewed for it. A new validator applies, is scored on stake, experience and a quiz, and is reviewed and interviewed; a slot opens only when a validator leaves, and an application does not guarantee one. Admission by selection is permissioned under EI’s rule, so Polygon PoS sits in public permissioned consensus. It would return to quasi-permissionless if admission were again set by an objective on-chain rule, as the open stake auction was at launch. Its security is its own, not inherited from Ethereum mainnet, which is what separates a side-chain from a rollup."
