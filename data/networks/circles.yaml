    url: https://www.optimism.io/blog/permissionless-fault-proofs-and-stage-1-arrive-to-the-op-stack
    checked: '2026-10-25'
  - title: Optimism docs, sequencer outages (users can always bypass the sequencer)
    url: https://docs.optimism.io/stack/rollup/outages
    checked: '2026-10-25'
  - title: L2BEAT, OP Mainnet (single sequencer set by the foundation operations safe; secondary source)
    url: https://l2beat.com/scaling/projects/optimism
    checked: '2026-10-25'
- id: polygon
  label:
  - Polygon PoS
  family: netc
  pill: true
  eth: true
  expand: collapsed
  sub: live institutional deployments
  path: Digital Asset Networks › Public › Permissionless consensus › Quasi Permissionless
  desc: 'A side-chain of Ethereum mainnet: Bor, built on Geth, executes blocks and a CometBFT-based Heimdall layer checkpoints them to Ethereum mainnet, where the staking and bridge contracts live. Validator seats are capped (100 at launch, 105 since PIP-4) and were originally filled by open on-chain auction, with anyone able to displace the lowest-ranked validator by staking more; today a seat opens only when an incumbent leaves, and applicants with 100,000 POL of self-stake are reviewed for it. EI treats it as quasi-permissionless because the design admits anyone with stake, with the caveat that entry now waits on a vacancy and a review. Its security is its own, not inherited from Ethereum mainnet, which is what separates a side-chain from a rollup. Runs the EVM. Smart contracts: yes; the EVM.'
  sources:
  - title: Polygon docs, PoS architecture overview (Heimdall-v2 and Bor, built on Go Ethereum)
    url: https://docs.polygon.technology/pos/architecture/overview/
    checked: '2026-10-25'
  - title: Polygon docs, becoming a validator (105 cap, seats open on exit, applications reviewed, 100,000 POL)
    url: https://docs.polygon.technology/pos/get-started/becoming-a-validator/
    checked: '2026-10-25'
  - title: 'Matic Network, staking update and becoming a validator (2020: newcomers replace the lowest-ranked validator by stake)'
    url: https://medium.com/the-polygon-blog/matic-network-staking-update-and-becoming-a-validator-d1a06aac258a
    checked: '2026-10-25'
- id: avalanche
  label:
  - Avalanche
  family: netc
  pill: true
  eth: true
  expand: collapsed
  sub: live institutional deployments
  path: Digital Asset Networks › Public › Permissionless consensus › Quasi Permissionless
  desc: 'Snowman consensus with repeated sub-sampled voting among stakers. Anyone can validate the primary network by staking at least 2,000 AVAX with no approval (about 600 validators), but liveness and safety assume the staked validators respond, so quasi-permissionless. The C-Chain is an implementation of the EVM. Smart contracts: yes; the EVM.'
  sources:
  - title: Avalanche docs, how to stake (2,000 AVAX minimum)
    url: https://build.avax.network/docs/nodes/validate/how-to-stake
    checked: '2026-10-25'
  - title: Avalanche docs, primary network (C-Chain is an EVM implementation)
    url: https://build.avax.network/docs/quick-start/primary-network
    checked: '2026-10-25'
- id: hedera
  label:
  - Hedera
  family: netc
  pill: true
  eth: true
  expand: collapsed
  sub: live institutional deployments
  path: Digital Asset Networks › Consortium ∩ Public › Permissioned consensus
  desc: 'A public ledger (anyone may transact and run a mirror node) whose 30 consensus nodes are, in Hedera’s own words, “currently permissioned; operated by the Hedera Council”, a fixed group of about 30 large organizations: Consortium ∩ Public with permissioned consensus. Unlike Canton it keeps one shared state that every consensus node holds and agrees on. Its smart contract service embeds the Besu EVM, so it counts as Ethereum ecosystem. Smart contracts: yes; the Hedera Smart Contract Service embeds the Besu EVM.'
  sources:
