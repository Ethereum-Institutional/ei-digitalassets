- id: non
  label:
  - Network of Networks
  family: canton
  path: Digital Asset Networks › Permissioned consensus › Consortium ∩ Public
  desc: 'Canton (Digital Asset) is drawn mostly inside Consortium with a small public component, which is EI’s view of it. The public part is the Global Synchronizer, Canton Coin and an open application process. The rest fits a consortium: the Global Synchronizer is run by Super Validators who admit new members by vote; a validator needs a sponsor, approval by a foundation committee and allowlisting of its IP address; and there is no shared ledger. Each participant node stores only the contracts its own parties are stakeholders in; Canton’s documentation calls the whole “an imaginary database that represents the union of all parties’ databases” that no single entity sees in its entirety. Synchronizers order encrypted messages and collect confirmations but never see contract contents, there is no global state root, and consistency between counterparties is checked afterwards by exchanged commitments, with a mismatch treated as a fork and repaired operationally. Only Canton Coin is globally visible, because the Super Validators are a signatory on every coin. Daml and the Canton code are open source (Apache 2.0); what is closed is the data, visible only to each contract’s stakeholders, and the membership, granted by approval. Digital Asset describes Canton as “the first public, permissionless blockchain”; by EI’s definition it is public in access but permissioned in consensus, since joining the validators or the Super Validators requires the existing participants’ approval, and it is not a globally verified shared ledger. Corda shares the model on the consortium side: each node stores only the transactions it is party to and notaries attest uniqueness “without global broadcast”. Cosmos and Polkadot are also called networks of networks, but each of their member chains is a complete shared ledger that anyone can verify, so they do not belong here.'
