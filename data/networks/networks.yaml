# Network badges: networks institutions can use as infrastructure (a stablecoin or tokenized asset from a regulated or
# licensed issuer is issued on it, or regulated institutions settle on it), plus the clearest live example of each
# region (Bitcoin for proof of work, Cardano for dynamically available proof of stake). Replaces the earlier rule, the
# ten largest native assets by market capitalization (owner, 13 November 2026, public issue ei-digitalassets#27:
# market capitalization measures an asset, which the Taxonomy map covers); Dogecoin, Monero and Zcash left the map.
# `circle` is the circle the badge sits in; `eth: true` draws it in ink (Ethereum ecosystem: runs an Ethereum client,
# the EVM, or settles on Ethereum mainnet), otherwise gray. Badges never move. Names, not tickers, because "ETH" and
# "Ethereum" are overloaded across the ecosystem; the chain is always "Ethereum mainnet".
# `column:` is the badge's place in the column layout (layout-column.yaml, phones); the build checks both.
# Every claim carries a source (url + date checked). Secondary sources say so in the title.

as_of: 25 October 2026
networks:
# ---- Fully permissionless (proof of work) ----
- id: bitcoin
  name: Bitcoin
  circle: full
  x: 305
  y: 790
  column: { x: 400, y: 734 }
  eth: false
  desc: "The canonical fully permissionless network and the largest digital asset (about $1.6 trillion), with a fixed supply of 21 million. Proof of work means the protocol never knows who is mining, assumes nothing about anyone staying online and prices sybils in electricity and hardware. Bitcoin Script is deliberately not Turing-complete (no loops), but its multisignature and timelock conditions are the building blocks of protocols such as the Lightning Network, which moves payments off-chain through channels funded by on-chain transactions and relies on the blockchain to settle, or to penalize a cheating party, when needed."
  glance:
    asset: "BTC"
    consensus: "Proof of work"
    contracts: "None: Bitcoin Script sets fixed spending conditions"
    confirmed: "About 10 minutes (one block)"
    final: "About 60 minutes (six blocks) by convention; never absolutely final"
  sources:
  - title: "Bitcoin Wiki, Confirmation (10-minute average block interval; six blocks a common but arbitrary convention)"
    url: https://en.bitcoin.it/wiki/Confirmation
    checked: '2026-11-13'
  - title: Lewis-Pye and Roughgarden, Permissionless Consensus (Bitcoin as the fully permissionless protocol)
    url: https://arxiv.org/abs/2304.14701
    checked: '2026-10-25'
  - title: 'Bitcoin Wiki, Script (“intentionally not Turing-complete, with no loops”)'
    url: https://en.bitcoin.it/wiki/Script
    checked: '2026-10-25'
  - title: 'Lightning BOLT 0, introduction (on-chain funding, HTLCs, on-chain enforcement)'
    url: https://github.com/lightning/bolts/blob/master/00-introduction.md
    checked: '2026-10-25'
