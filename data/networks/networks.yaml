# Network badges: the ten largest native cryptocurrencies by market capitalisation (25 October 2026; stablecoins and
# tokens that are not native to a network excluded) plus networks that illustrate each region of the map.
# `circle` is the circle the badge sits in; `eth: true` draws it in ink (Ethereum ecosystem: runs an Ethereum client,
# the EVM, or settles on Ethereum mainnet), otherwise grey. Badges never move. Names, not tickers, because "ETH" and
# "Ethereum" are overloaded across the ecosystem; the chain is always "Ethereum mainnet".
# Every claim carries a source (url + date checked). Secondary sources say so in the title.

as_of: 25 October 2026
networks:
# ---- Fully permissionless (proof of work) ----
- id: bitcoin
  name: Bitcoin
  circle: full
  x: 1295
  y: 730
  eth: false
  desc: 'The canonical fully permissionless network and the largest digital asset (about $1.6 trillion), with a fixed supply of 21 million. Proof of work means the protocol never knows who is mining, assumes nothing about anyone staying online and prices sybils in electricity and hardware; finality is probabilistic. Smart contracts: no. Bitcoin Script is deliberately not Turing-complete (no loops), but its multisignature and timelock conditions are the building blocks of protocols such as the Lightning Network, which moves payments off-chain through channels funded by on-chain transactions and relies on the blockchain to settle, or to penalise a cheating party, when needed.'
  sources:
  - title: Lewis-Pye and Roughgarden, Permissionless Consensus (Bitcoin as the fully permissionless protocol)
    url: https://arxiv.org/abs/2304.14701
    checked: '2026-10-25'
  - title: 'Bitcoin Wiki, Script (“intentionally not Turing-complete, with no loops”)'
    url: https://en.bitcoin.it/wiki/Script
    checked: '2026-10-25'
  - title: 'Lightning BOLT 0, introduction (on-chain funding, HTLCs, on-chain enforcement)'
    url: https://github.com/lightning/bolts/blob/master/00-introduction.md
    checked: '2026-10-25'
- id: dogecoin
  name: Dogecoin
  circle: full
  x: 1295
  y: 775
  eth: false
  desc: 'Scrypt proof of work, merge-mined with Litecoin since September 2014 (auxiliary proof of work), so Litecoin miners secure both chains with the same work. Fully permissionless, but with no supply cap: since its halvings ended at block 600,000 every one-minute block has paid a fixed 10,000 DOGE (about 5.2 billion a year), so inflation falls in percentage terms but never reaches zero. That leaves the token without economic scarcity, which suits community use better than a store of value. Smart contracts: no.'
  sources:
  - title: Dogecoin Core README (Scrypt proof of work)
    url: https://github.com/dogecoin/dogecoin
    checked: '2026-10-25'
  - title: Dogecoin Core 1.8.0 release notes (AuxPoW from block 371,337, September 2014)
    url: https://github.com/dogecoin/dogecoin/releases/tag/v1.8.0
    checked: '2026-10-25'
  - title: 'Dogecoin Core, dogecoin.cpp (block subsidy: fixed 10,000 DOGE after the halvings, “constant inflation”)'
    url: https://github.com/dogecoin/dogecoin/blob/master/src/dogecoin.cpp
    checked: '2026-10-25'
  - title: 'Dogecoin Core, chainparams.cpp (100,000-block halving interval, 60-second blocks)'
    url: https://github.com/dogecoin/dogecoin/blob/master/src/chainparams.cpp
    checked: '2026-10-25'
- id: monero
  name: Monero
  circle: full
  x: 1295
  y: 820
  eth: false
  desc: 'RandomX proof of work (since release 0.15, November 2019), designed to keep general-purpose CPUs competitive with specialised hardware. Fully permissionless, with privacy by default: amounts and counterparties are hidden on-chain, which is why most regulated venues do not list it. Unlike Bitcoin’s absolute cap, Monero pays a tail emission of 0.6 XMR per two-minute block (since May 2022), so miners are always paid to secure the network; the supply still grows by well under 1% a year and that rate keeps falling, so it remains relatively scarce. Smart contracts: no.'
  sources:
  - title: Moneropedia, RandomX
    url: https://www.getmonero.org/resources/moneropedia/randomx.html
    checked: '2026-10-25'
  - title: 'Moneropedia, Tail emission (0.6 XMR per block from May 2022; miners need an incentive)'
    url: https://www.getmonero.org/resources/moneropedia/tail-emission.html
    checked: '2026-10-25'
- id: zcash
  name: Zcash
  circle: full
  x: 1295
  y: 865
  eth: false
  desc: 'Equihash proof of work with a fixed supply of 21 million and Bitcoin-style halvings (the second in November 2024); about 16.9 million ZEC are in circulation. Transactions can be transparent, like Bitcoin’s, or shielded, with amounts and counterparties encrypted and validity proven with zero-knowledge proofs; roughly a quarter to a third of the supply sits in shielded pools (trackers differ). Fully permissionless. Smart contracts: no.'
  sources:
  - title: Electric Coin Company, Why Equihash (2016)
    url: https://electriccoin.co/blog/why-equihash/
    checked: '2026-10-25'
  - title: 'Zcash, the difference between shielded and transparent Zcash'
    url: https://z.cash/learn/what-is-the-difference-between-shielded-and-transparent-zcash/
    checked: '2026-10-25'
  - title: 'Zcash protocol specification (issuance and the 21 million maximum)'
    url: https://zips.z.cash/protocol/protocol.pdf
    checked: '2026-10-25'
  - title: 'Blockworks, Zcash token holder report Q1 2026 (shielded pool share; secondary source)'
    url: https://blockworks.com/api/investor-report/zcash-token-holder-report-q1-2026/pdf
    checked: '2026-10-25'
# ---- Dynamically available ----
- id: cardano
  name: Cardano
  circle: dyn
  x: 1295
  y: 603
  eth: false
  desc: 'Ouroboros proof of stake, the paper’s canonical dynamically available protocol: a longest-chain rule in which slot leaders are drawn from registered stake pools, so the chain keeps growing however many pools are online. Anyone can register a pool (a refundable 500 ADA deposit; about 2,900 registered pools). Not EVM based. Smart contracts: yes; Plutus Core, a Turing-complete language on the extended UTXO model (contracts written in Plinth or Aiken compile to it).'
  sources:
  - title: Cardano docs, Consensus explained (Ouroboros)
    url: https://docs.cardano.org/about-cardano/learn/consensus-explained
    checked: '2026-10-25'
  - title: Cardano docs, About stake pools (operators register their own pools)
    url: https://docs.cardano.org/stake-pool-operators/about-stake-pools
    checked: '2026-10-25'
  - title: Lewis-Pye and Roughgarden, Permissionless Consensus, Table 1 (Ouroboros as the dynamically available protocol)
    url: https://arxiv.org/abs/2304.14701
    checked: '2026-10-25'
  - title: 'Plutus Core and Plutus Tx user guide (Untyped Plutus Core is Turing-complete)'
    url: https://plutus.cardano.intersectmbo.org/docs/essential-concepts/plutus-core-and-plutus-tx
    checked: '2026-10-25'
# ---- Quasi-permissionless ----
- id: tron
  name: TRON
  circle: quasi
  x: 1415
  y: 418
  eth: true
  desc: 'Delegated proof of stake: 27 Super Representatives elected by TRX votes every six hours produce blocks; any account can stand by burning 9,999 TRX. No incumbent review, so quasi-permissionless under EI’s rule, with a very small active set. The TRON Virtual Machine is EVM compatible, so most Solidity contracts run unchanged. Tether issues USD₮ natively on TRON (TRC-20), one of its two largest deployments; Circle discontinued USDC on TRON in 2024. Smart contracts: yes; the EVM-compatible TRON Virtual Machine.'
  sources:
  - title: TRON developer docs, consensus (DPoS, 27 Super Representatives, 6-hour maintenance period)
    url: https://developers.tron.network/docs/concensus
    checked: '2026-10-25'
  - title: TRON developer docs, Super Representatives (9,999 TRX candidate fee)
    url: https://developers.tron.network/docs/super-representatives
    checked: '2026-10-25'
  - title: TRON developer docs, TVM vs EVM
    url: https://developers.tron.network/docs/tvm-vs-evm
    checked: '2026-10-25'
  - title: 'Tether, supported protocols (TRC-20)'
    url: https://tether.to/en/supported-protocols/
    checked: '2026-10-25'
  - title: 'Circle, discontinuing support for USDC on the Tron blockchain (February 2024)'
    url: https://www.circle.com/blog/circle-is-discontinuing-support-for-usdc-on-the-tron-blockchain
    checked: '2026-10-25'
- id: hyperliquid
  name: Hyperliquid
  circle: quasi
  x: 1200
  y: 444
  eth: true
  desc: 'HyperBFT, a HotStuff-derived protocol. Any validator with 10,000 HYPE of self-delegation (locked for a year) can become active, and the active set is the top of the stake ranking (27 active of 35 registered on 25 October 2026), so no incumbent review is needed and it is quasi-permissionless under EI’s rule. The caveats are large: foundation-run validators hold roughly half of the stake, validators can jail peers, and the node software is distributed as prebuilt binaries without published core source. HyperEVM is EVM compatible, and both Circle (native USDC since September 2025) and Tether (USDT0) issue on it. Smart contracts: yes; HyperEVM.'
  sources:
  - title: Hyperliquid docs, HyperCore overview (HyperBFT, a HotStuff variant)
    url: https://hyperliquid.gitbook.io/hyperliquid-docs/hypercore/overview
    checked: '2026-10-25'
  - title: Hyperliquid docs, staking (10k HYPE self-delegation to become active)
    url: https://hyperliquid.gitbook.io/hyperliquid-docs/hypercore/staking
    checked: '2026-10-25'
  - title: Hyperliquid docs, HyperEVM
    url: https://hyperliquid.gitbook.io/hyperliquid-docs/for-developers/hyperevm
    checked: '2026-10-25'
  - title: hyperliquid-dex/node (prebuilt binaries; core source not published) and Blofin, how decentralised is Hyperliquid (foundation stake share, jailing; secondary source)
    url: https://github.com/hyperliquid-dex/node
    checked: '2026-10-25'
  - title: 'Circle, USDC on Hyperliquid (native USDC and CCTP on HyperEVM, September 2025)'
    url: https://www.circle.com/blog/circle-expands-support-for-usdc-on-hyperliquid
    checked: '2026-10-25'
  - title: 'USDT0 deployments (HyperEVM)'
    url: https://docs.usdt0.to/technical-documentation/deployments
    checked: '2026-10-25'
- id: solana
  name: Solana
  circle: quasi
  x: 1175
  y: 418
  eth: false
  desc: 'Tower BFT over a proof-of-history clock. Anyone can run a validator without approval (no minimum stake, though voting costs up to about 1.1 SOL a day; around 690 vote accounts), but finality needs two-thirds of the stake to vote: block production continues below that, nothing becomes final, and when more than a third of the stake has been lost the cluster has needed coordinated restarts (most recently February 2024). Validators therefore have to stay online within a one-third budget: quasi-permissionless. Not EVM based (programs run on the Solana Virtual Machine). Smart contracts: yes; Turing-complete programs (Rust, C) on the Solana Virtual Machine, not the EVM.'
  sources:
  - title: Solana, Tower BFT (PoH as a clock before consensus)
    url: https://solana.com/news/tower-bft--solana-s-high-performance-implementation-of-pbft
    checked: '2026-10-25'
  - title: Anza, validator requirements (no strict minimum stake; vote costs up to 1.1 SOL a day)
    url: https://docs.anza.xyz/operations/requirements
    checked: '2026-10-25'
- id: stellar
  name: Stellar
  circle: pub
  x: 972
  y: 480
  eth: false
  desc: 'The Stellar Consensus Protocol is federated Byzantine agreement: each validator chooses the quorum slices it trusts. Anyone can run a validator, but it only matters once existing validators add it to their slices, and the network’s safety rests on about ten “Tier 1” organisations, which the docs say takes months of convincing the others. Public, with consensus that the incumbents curate: permissioned under EI’s rule. Smart contracts run on Soroban (Wasm), not the EVM. Smart contracts: yes, since Stellar’s Protocol 20 upgrade on 20 February 2024; Soroban contracts are written in Rust and compiled to WebAssembly, not the EVM.'
  sources:
  - title: Stellar developer docs, Stellar Consensus Protocol
    url: https://developers.stellar.org/docs/learn/fundamentals/stellar-consensus-protocol
    checked: '2026-10-25'
  - title: Stellar developer docs, Tier 1 organizations (must convince enough other organisations to trust them)
    url: https://developers.stellar.org/docs/validators/tier-1-orgs
    checked: '2026-10-25'
  - title: 'Stellar, Protocol 20 and smart contracts are live on mainnet (February 2024)'
    url: https://stellar.org/blog/developers/protocol-20-and-smart-contracts-are-live-on-mainnet
    checked: '2026-10-25'
- id: xrpl
  name: XRP Ledger
  circle: pub
  x: 972
  y: 440
  eth: false
  desc: 'Anyone can run a node and transact, so it is public, but consensus runs on Unique Node Lists: each server trusts the validators on its list, and almost all servers use the default lists published by the XRP Ledger Foundation and Ripple (35 validators each, near-identical), whose criteria include a year of uptime and a separate legal identity. The docs are explicit that issuing validations “does not automatically give your validator a say in the consensus process”. Influence therefore depends on the incumbents’ review: permissioned consensus under EI’s rule. Not EVM based (the XRPL EVM is a separate chain). Smart contracts: not on the main ledger, which offers native escrows, tokens and a decentralised exchange instead; WebAssembly “smart escrows” (XLS-100) are still in development, and the XRPL EVM is a separate chain.'
  sources:
  - title: xrpl.org, Unique Node List (two default publishers; inclusion criteria)
    url: https://xrpl.org/docs/concepts/consensus-protocol/unl
    checked: '2026-10-25'
  - title: xrpl.org, run rippled as a validator (validations alone give no say in consensus)
    url: https://xrpl.org/docs/infrastructure/configuration/server-modes/run-rippled-as-a-validator
    checked: '2026-10-25'
  - title: XRPL Foundation default UNL (35 validators, decoded 25 October 2026)
    url: https://unl.xrplf.org
    checked: '2026-10-25'
  - title: 'xrpl.org, known amendments (SmartEscrow: in development)'
    url: https://xrpl.org/resources/known-amendments
    checked: '2026-10-25'
- id: canton
  name: Canton
  circle: non
  x: 808
  y: 680
  eth: false
  desc: 'Mostly a consortium network with a small public component: see the “Network of Networks” circle for EI’s reasoning. Canton Coin (about $4 billion, rank 23) is the only globally visible asset on it. Smart contracts are written in Daml; an EVM execution layer (Zenith, built on Reth) is in development, so Canton is not drawn as Ethereum ecosystem. Smart contracts: yes; Daml, a functional contract language, with an EVM layer (Zenith) in development.'
  sources:
  - title: Canton docs, Participant node overview (stores only the contracts its parties are stakeholders in)
    url: https://docs.canton.network/overview/reference/participant-overview
    checked: '2026-10-25'
  - title: Digital Asset, Canton ledger model (the virtual global ledger as “an imaginary database”)
    url: https://archived.docs.digitalasset.com/overview/3.4/explanations/ledger-model/index.html
    checked: '2026-10-25'
  - title: Canton docs, Super Validator governance reference (SVs added by vote of existing SVs)
    url: https://docs.canton.network/overview/reference/sv-governance-reference.md
    checked: '2026-10-25'
  - title: Canton Foundation, becoming a validator (sponsor, Tokenomics Committee approval, IP allowlisting)
    url: https://intro.canton.foundation/validator.html
    checked: '2026-10-25'
  - title: Canton docs, transaction lifecycle (synchronizers see only encrypted views; timeouts and rejections)
    url: https://docs.canton.network/overview/reference/transaction-lifecycle
    checked: '2026-10-25'
  - title: Digital Asset press release, 24 June 2025 (“the first public, permissionless blockchain”)
    url: https://www.canton.network/canton-network-press-releases/digital-asset-raises-135-million-to-accelerate-adoption-of-canton-network
    checked: '2026-10-25'
