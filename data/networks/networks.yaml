    url: https://canton.network/blog/ethereum-and-canton-unifying-public-innovation-with-institutional-scale
    checked: '2026-10-25'
# ---- Public, permissioned consensus ----
- id: corda
  name: Corda
  circle: non
  x: 705
  y: 680
  eth: false
  desc: 'R3’s Corda is the consortium-side member of the Network of Networks: a peer-to-peer network of nodes in which each node keeps only the transactions it is party to, and notary clusters “validate uniqueness and sequencing of transactions without global broadcast”, so there is no global ledger for anyone to verify. Permissioned by design and run as business networks among known parties. Apache 2.0, outside the Ethereum ecosystem.'
  sources:
  - title: corda/corda README (peer-to-peer nodes; notaries validate uniqueness without global broadcast; Apache 2.0)
    url: https://github.com/corda/corda
    checked: '2026-10-25'
