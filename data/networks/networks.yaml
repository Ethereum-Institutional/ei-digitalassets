- id: solana
  name: Solana
  circle: quasi
  x: 425
  y: 418
  column: { x: 405, y: 477 }
  eth: false
  desc: "Alpenglow (Votor) replaced the consensus based on Proof of History and Tower BFT on 21 October 2026; local timeouts now do the pacing Proof of History did. Voting needs a registered BLS public key, an admission ticket of 0.8 SOL an epoch and a place in the top 2,000 by stake (no fixed minimum stake; about 690 validators with stake). More than 40% of stake going offline halts finality, or 20% if another 20% is adversarial (one third before Alpenglow), so validators have to stay online within a bounded budget: quasi-permissionless."
  glance:
    asset: "SOL"
    consensus: "Proof of stake (Alpenglow, since October 2026)"
    contracts: "Solana Virtual Machine (Rust, C)"
    confirmed: "Same as final"
