- id: quorum
  name: Quorum
  circle: priv
  x: 230
  y: 810
  eth: true
  desc: 'The earlier enterprise Ethereum fork: a permissioned version of Geth started by J.P. Morgan in 2016 and passed to Consensys in 2020 (GoQuorum). It carried Kinexys (Onyx) and Partior, among others, but the repository is now archived (“no longer actively maintained or supported by Consensys”) and Besu dropped its compatibility modes in 2023, so new deployments go to Besu. Ethereum ecosystem by code.'
  sources:
  - title: Consensys GoQuorum repository (go-ethereum fork with peer permissioning; archived, no longer maintained)
    url: https://github.com/Consensys/quorum
    checked: '2026-10-25'
- id: fabric
  name: Hyperledger Fabric
  circle: priv
  x: 230
  y: 850
  eth: false
  desc: '“An enterprise-grade permissioned distributed ledger framework” from the Hyperledger stable (now LF Decentralized Trust): modular, with pluggable consensus, written in Go under Apache 2.0. Outside the Ethereum ecosystem: no EVM by default and no public-chain upgrade path, which is the trade-off against Besu.'
  sources:
  - title: Hyperledger Fabric repository (LF Decentralized Trust)
    url: https://github.com/hyperledger/fabric
    checked: '2026-10-25'
