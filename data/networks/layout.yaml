# Digital Asset Networks: layout (geometry only), the wide map for desktops; layout-column.yaml is the phone column.
# cx,cy,rx,ry = ellipse center and radii; t:rect uses x,y,w,h,r. lx,ly = label anchor; fs/fw = label font size/weight.
# suby/liney position the small sub-labels; `collapsed` is an expandable circle's pill form; `zoom: [x0, x1]` is the
# strip of the canvas a collapsible region keeps when the other is hidden. Units on a 1600×1300 canvas.
# Permissionless on the left and Permissioned on the right (owner, 9 November 2026): public permissionless is the
