menu: Read the ledger
name: Who may read the ledger
short: Read
scope: networks
color: '#3730a3'
intro: 'Who may read the ledger. For each of the five rights, right-hand reading: anyone, with no approval (public). Middle: anyone who meets published, objective criteria, admitted without anyone’s discretion (open), or open only in part, as the note says. Left-hand reading: parties an operator or the members choose. Not applicable, with no reading filled: the network has no such right, as Bitcoin has no general-purpose contracts to deploy. One of five rights that together say how open a network is: who may read the ledger, transact, deploy contracts, validate, and change the rules. A network can be public for one right and restricted for another, so read the five together rather than calling a whole network public or permissioned.'
