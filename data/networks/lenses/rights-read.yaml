notes:
  base: 'Anyone may read the rollup, and every batch is posted to Ethereum mainnet, so its state can be rebuilt from
    mainnet alone.'
  hedera: 'Anyone may read the ledger through a mirror node.'
  canton: 'The Global Synchronizer orders encrypted messages; each party sees only the contracts it is party to, and
    no one reads the whole ledger.'
  corda: 'Each node keeps only the transactions it took part in; there is no shared ledger to read.'
  fnality: 'Readable by the members only.'
  hangang: 'Readable by the members only.'
  dcjpy: 'Readable by the members only.'
  quorum: 'Readable by the members only.'
  fabric: 'Readable by the members only.'
