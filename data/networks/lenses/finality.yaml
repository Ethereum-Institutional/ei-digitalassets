# Lens: Settlement finality, a row of each network's At a glance chart (chart_only; not in the menus).
# `networks` lists each badge as in | part; unlisted badges read as out.
# in: the protocol declares a transaction final and an attacker who reverts it forfeits slashable collateral.
# part: the protocol declares finality on the agreement of an admitted or elected set, with no collateral at risk, or
#   with collateral that is only partly slashable. Unmarked: finality is probabilistic and never declared.
# notes: shown when the reader opens the row; the intro is shown under "What the rows mean".

id: finality
group: chart
menu: Settlement finality
name: Settlement finality
short: Finality
scope: networks
color: '#155e75'
intro: 'Finality is the point after which a transaction cannot be undone without breaking the protocol’s rules, and it is the first thing a settlement engineer asks of a ledger. Three models exist. Deterministic: the protocol declares a transaction final once a quorum of a known set agrees, and nothing in the protocol can revert it; no collateral backs the declaration, so the guarantee is as strong as the set’s independence and no stronger. Economic: the protocol declares finality and makes reversal cost an attacker a quantified amount of staked collateral, destroyed by slashing. Probabilistic: the protocol never declares finality; reversal only grows more expensive with every block built on top, and “six confirmations” is custom, not a rule. Times run from under a second to about thirteen minutes, and the faster declarations usually come from smaller or elected sets. Left-hand reading: an admitted or elected set declares finality on its own trust, with no collateral or only part of it at risk. Middle: the protocol declares finality and backs it with slashable collateral that any staker may post. Right-hand reading: no one declares finality; it is probabilistic. Central banks read the categories differently: the Reserve Bank of Australia’s Project Acacia (May 2026) found that existing public permissionless platforms “tend to provide only probabilistic finality”, and that a public permissioned ledger can meet a central bank’s needs if configured for deterministic finality. The difference is one of category, not of fact: Ethereum mainnet declares finality at a checkpoint and makes reverting it cost a third of all staked ETH, which this chart reads as economic finality, while chains that never declare finality are probabilistic in both readings. Rollups add a second pair of terms: soft finality is the sequencer’s confirmation, in seconds, which is one operator’s promise; hard finality comes once the rollup’s batch is final on Ethereum mainnet and any challenge window has passed. Ethereum Institutional’s view: on a public permissionless network, economic finality backed by slashing is the guarantee an outsider can price; deterministic finality on a trusted set is a different guarantee, worth exactly the independence of the set. Each note gives the time to finality, what an attacker loses, the number of production clients and the longest halt, from the networks’ own documentation and an independent assessment of six networks (data as of March 2026).'
