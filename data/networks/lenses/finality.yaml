notes:
  ethereum: 'Economic finality in about 13 minutes: a checkpoint is finalized when validators holding two thirds of staked ETH vote for two consecutive checkpoints, and reverting it means at least a third of all staked ETH is slashed (about USD 25 billion in March 2026 on the assessment’s figures; the attacker’s whole stake is at risk). Five execution and six consensus clients in production, the only network with more than one or two. Never fully halted in eleven years; finality was delayed for an hour in May 2023 while blocks continued, and the inactivity leak restored it without intervention.'
  base: 'Hard finality comes once its batch is posted and that Ethereum mainnet block is final, so it inherits Ethereum mainnet’s economic finality; the challenge window (five days with one proof, one day with two) governs only withdrawals to Ethereum mainnet. Before hard finality, the sequencer’s confirmation is soft finality, a promise from one operator.'
  arbitrum: 'Hard finality comes once its batch is posted and finalized on Ethereum mainnet, so it inherits Ethereum mainnet’s economic finality; the challenge period (about six days plus a two-day execution delay) governs only withdrawals to Ethereum mainnet. Before hard finality, the sequencer’s sub-second confirmation is soft finality, a promise from one operator.'
  optimism: 'Hard finality comes once its batch is posted and that Ethereum mainnet block is final, typically 15 to 30 minutes after submission, so it inherits Ethereum mainnet’s economic finality; the seven-day challenge window governs only withdrawals through the Standard Bridge. Before hard finality, the sequencer’s confirmation is soft finality, a promise from one operator.'
  bnb: 'Finality declared within about two blocks (BEP-126) when two thirds of the 21 block producers attest to a block and its child, backed by only part of the stake: a double sign or malicious vote slashes 200 BNB of the validator’s self-bonded stake and jails it for 30 days, while delegated stake is untouched, so the assessment puts the loss for an attack at under USD 3 million against USD 17 billion staked. One production client, a Geth fork. Halted once, for eight hours in October 2022, deliberately, after a bridge exploit.'
  solana: 'Finality declared under Alpenglow when 80% of stake votes in one round or 60% in two, with no automatic slashing yet: SIMD-0204 would record evidence of duplicate blocks and the penalty economics are a later proposal, so an attacker’s stake is not destroyed by the protocol. Two clients in production, the dominant one on about nine tenths of stake. Seven full halts, the longest about 19 hours in February 2023, none since February 2024.'
  avalanche: 'Sub-second, irreversible finality once a block is accepted by the Snowman protocol, on bonded AVAX; Avalanche does not slash, a misbehaving validator forfeits only its reward, so no collateral is destroyed by an attack.'
  polygon: 'Milestones give deterministic finality in two to five seconds on Heimdall v2, and checkpoints anchor Bor’s history to Ethereum mainnet periodically; staking is on Ethereum mainnet and slashing is not active, so the declaration is backed by the validator set rather than by collateral at risk.'
  hyperliquid: 'HyperBFT, a HotStuff variant, commits blocks by validator vote weighted by staked HYPE, with a median 0.2 seconds to a committed response for a co-located client; the documentation does not state a slashing rule, so the declaration is read as backed by the set, not by collateral at risk.'
  tron: 'TRON’s documentation calls a block solidified, irreversible, once 19 of the 27 Super Representatives have confirmed it (about a minute at three-second blocks); the independent assessment reads this as probabilistic, since the protocol issues no finality certificate. Either way there is no penalty: a misbehaving Super Representative loses votes, never stake. One production client, java-tron. Halted once, for about two hours in November 2020.'
  xrpl: 'Deterministic: a ledger is validated when 80% of the validators on a server’s Unique Node List agree, every few seconds, and its contents can never change. No staking and no economic penalty: a validator that misbehaves is dropped from the recommended lists, which Ripple and the XRP Ledger Foundation publish. One production client, rippled. Two halts, the longest 64 minutes in February 2025.'
  stellar: 'Deterministic: the Stellar Consensus Protocol closes each ledger when the quorum slices of its trusted nodes agree, with a safety guarantee that no two nodes agree on different values; no rewards, no stake and no penalty, so the guarantee rests on the Tier 1 organizations’ independence.'
  hedera: 'Deterministic: the hashgraph algorithm is asynchronous Byzantine fault tolerant and delivers finality of consensus within seconds, with influence proportional to staked HBAR; the consensus nodes are run by Hedera Council members under a permissioned model, and no slashing is documented.'
  canton: 'Deterministic and near instant: a transaction is final when its parties confirm it and the Global Synchronizer’s Super Validators order it by two-thirds BFT vote; there is no staking, no slashing and no financial penalty, so the guarantee is the thirteen institutions’ trust. One client, Splice; test and development networks require allowlisting; no public bug bounty and, as of March 2026, one published audit (the Canton Coin contracts, 2025).'
  corda: 'Deterministic: a notary cluster signs each transaction final once it has checked for double spends, and only the parties see it; no collateral, the guarantee is the notary operator’s.'
  fnality: 'Permissioned consensus finalizes immediately on the members’ votes, with no forks; the guarantee is the members’ and the central bank reserves behind the token.'
  hangang: 'Permissioned consensus finalizes immediately on the members’ votes, with no forks; the guarantee is the members’ and the central bank’s.'
  dcjpy: 'Permissioned consensus finalizes immediately on the members’ votes, with no forks; the guarantee is the members’ and the deposits behind the token.'
  quorum: 'QBFT and IBFT finalize immediately, with no forks, when two thirds of a fixed validator set agree; the validators admit and remove each other by vote, and no collateral is at risk.'
  fabric: 'The ordering service (Raft) finalizes each block deterministically for the channel’s members; no collateral is at risk and the guarantee is the consortium’s.'
  bitcoin: 'Probabilistic: the protocol never declares a transaction final; it only becomes more expensive to reverse with each block, and the six-confirmation custom (about an hour) is a convention, not a rule. The guarantee is the cost of proof of work.'
  cardano: 'Probabilistic under Ouroboros Praos: a transaction is immutable once its depth exceeds 3k/f slots, and before that confidence grows with each block; stake pools are not slashed, so no collateral is destroyed by an attack.'
