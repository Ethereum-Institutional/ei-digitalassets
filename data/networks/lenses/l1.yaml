# Lens: Layer 1 (architecture)
# scope: networks means the lens highlights badges, not circles. `networks` lists each badge as in | part.
# notes: the sentence shown under a badge's definition when this lens is active.

id: l1
group: architecture
menu: Layer 1
name: Layer 1
short: Layer 1
scope: networks
color: '#312e81'
intro: 'A Layer 1 runs its own consensus and settles its own transactions: its validators or miners have the final word on what happened, and its native asset pays for its security. It exists because something has to be the base of trust. The benefit is self-sufficiency and the widest guarantee available, since nothing above it can override its state. The cost is that every node re-executes everything, so throughput is bounded by what one node can verify, which is why side-chains and rollups exist.'
