notes:
  ethereum: The Layer 1 of the Ethereum ecosystem, and the settlement layer for its rollups.
  canton: Canton settles nothing globally; each synchronizer orders its own contracts, so it is a Layer 1 only in the sense that nothing sits beneath it.
  corda: Corda settles nothing globally; each notary attests its own transactions, so it is a Layer 1 only in the sense that nothing sits beneath it.
  polygon: A side-chain, not a Layer 1; it checkpoints to Ethereum mainnet but has its own validators.
  base: A rollup, not a Layer 1; it settles on Ethereum mainnet.
  arbitrum: A rollup, not a Layer 1; it settles on Ethereum mainnet.
  optimism: A rollup, not a Layer 1; it settles on Ethereum mainnet.
  fnality: A permissioned Layer 1 in the architectural sense; its members are the final word.
  hangang: A permissioned Layer 1 in the architectural sense; its members are the final word.
  dcjpy: A permissioned Layer 1 in the architectural sense; its members are the final word.
