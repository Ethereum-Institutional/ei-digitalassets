notes:
  ethereum: 'The base fee is burned. The priority fee goes to the block’s fee recipient, which the proposer sets, and
    builders who supply most blocks pay the proposer; neither is identified to the payer in advance. A transaction with a
    zero priority fee pays only the burned base fee, but whether a builder includes it is the builder’s choice. A sponsored transaction (an ERC-4337 paymaster, or an EIP-7702 account) lets an identified provider pay the fee, so the institution need not hold ETH; whether a fee that reaches a sanctioned party counts as a payment to it is a legal question no design settles (OFAC, 2021).'
  base: 'The L2 execution fee and the L1 fee are collected on the rollup, operated by Coinbase, which pays Ethereum
    mainnet to post the data: the payer pays an identified operator.'
  optimism: 'Execution, L1 data and operator fees are each collected in a fee vault on the rollup, not burned; the Optimism
    Foundation sets the sequencer.'
  arbitrum: 'The L2 base fee goes to the network fee account, the L1 component reimburses the batch poster, and tips
    on Arbitrum One go 97% to the Arbitrum DAO treasury and 3% to the Arbitrum Developer Guild.'
  polygon: 'The base fee is burned; the priority fee goes to the validator that produced the block.'
  solana: 'Priority fees go in full to the block’s leader since SIMD-0096; the base fee’s distribution was left unchanged.'
  avalanche: 'Both the base fee and the priority fee are burned.'
  xrpl: 'The transaction cost is destroyed, paid to no one.'
  stellar: 'Fees go into a locked account and are not given to or used by anyone.'
  tron: 'An account that has not staked for bandwidth or energy pays by burning TRX; staked resources cost no fee.'
  hedera: 'The node fee compensates the consensus node that submitted the transaction, run by a Hedera Council member;
    the documentation reviewed does not name the recipient of the network and service fees.'
  bnb: 'Most of each block’s fees go to the validator that proposed it, one of the 45 elected by stake; a share goes
    to a system reward contract.'
  cardano: 'Fees are pooled and paid each epoch to the stake pools that made blocks.'
  bitcoin: 'The fee, the difference between a transaction’s inputs and outputs, goes to the miner who includes it in a block.'
  canton: 'Traffic fees are priced in US dollars and paid by burning Canton Coin, which leaves circulation; validators earn newly minted coins, not the fee.'
  hyperliquid: 'Gas on HyperEVM is burned, the priority fee too. Trading fees on HyperCore go to the HLP vault, to the Assistance Fund, whose HYPE is burned, and up to half to the asset’s deployer; HLP depositors and deployers are not identified to the payer.'
  corda: 'No protocol fee reaches an unknown party; participants pay the network operator under its terms.'
  fnality: 'No protocol fee reaches an unknown party; members pay the operator under the scheme’s terms.'
  hangang: 'No protocol fee reaches an unknown party; members pay the operator under the scheme’s terms.'
  dcjpy: 'No protocol fee reaches an unknown party; members pay the operator under the scheme’s terms.'
  quorum: 'No protocol fee reaches an unknown party; members pay the operator under the scheme’s terms.'
  fabric: 'No protocol fee reaches an unknown party; members pay the operator under the scheme’s terms.'
