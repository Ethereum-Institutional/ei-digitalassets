id: fees
group: chart
menu: Who receives your fees
name: Who receives your fees
short: Fees
scope: networks
color: '#6d28d9'
intro: 'Where a payer’s fees go. An institution may not pay a sanctioned party, a fee included, so where fees go is part of whether it can use a network. Left-hand reading: no fee reaches a party the payer cannot identify, because fees are burned, locked, or paid to a named operator or members. Middle: part is burned and the rest goes to a validator the payer cannot identify in advance. Right-hand reading: fees go to miners or validators the payer cannot identify, because anyone may become one. Two arrangements change the picture on Ethereum mainnet: a sponsored transaction (an ERC-4337 paymaster, or an EIP-7702 account) lets an identified provider pay the fee, so the institution need not hold ETH; and on a rollup the institution pays the rollup’s operator, which pays Ethereum mainnet. Whether a fee folded into a block reward is a prohibited payment is a legal question no design settles: US sanctions apply to virtual currency as to any payment (OFAC, 2021), and a June 2026 report by Kinexys by J.P. Morgan and the MIT Digital Currency Initiative names fees reaching sanctioned entities as an open problem.'
