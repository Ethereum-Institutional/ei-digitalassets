notes:
  base: OP Stack rollup; data and settlement on Ethereum mainnet, sequencer run by Coinbase.
  arbitrum: Nitro rollup; data and fraud proofs on Ethereum mainnet, permissionless validation (BoLD), sequencer run by Offchain Labs.
  optimism: OP Stack rollup; data and fault proofs on Ethereum mainnet, a single sequencer set by Optimism governance.
  polygon: A side-chain, not a rollup; its security does not come from Ethereum mainnet.
