id: rights-govern
group: chart
menu: Change the rules
name: Who may change the rules
short: Govern
scope: networks
color: '#3730a3'
intro: 'Who may change the rules. For this right, the right-hand reading means anyone may propose and a change takes effect only when independent operators who joined without approval run it, so no one holds a vote or a veto; the middle reading means token holders or a stake-elected set vote.'
networks:
  hyperliquid: part
  ethereum: in
  avalanche: in
  bitcoin: in
  solana: part
  cardano: part
  bnb: part
  tron: part
  arbitrum: part
  optimism: part
notes:
  ethereum: 'Anyone may propose an EIP; a change takes effect only when independent client teams ship it and validators
    run it. No one holds a vote or a veto, though a client team can decline to implement a change.'
  avalanche: 'Anyone may propose an ACP; a change takes effect when validators adopt it.'
  bitcoin: 'Changes take effect when node operators and miners adopt new software.'
  solana: 'Anyone may propose a SIMD; features activate once enough stake runs supporting software, and some changes
    have gone to stake-weighted votes.'
  cardano: 'On-chain governance: ADA holders through delegated representatives, stake pool operators and a constitutional
    committee vote on changes.'
  bnb: 'Changes are adopted by the stake-elected validators running new client releases.'
  tron: 'Network parameters change by votes of the 27 Super Representatives.'
  arbitrum: 'The Arbitrum DAO (ARB holders) votes on upgrades, which then wait about 17 days; a Security Council (9
    of 12) can upgrade instantly.'
  optimism: 'The Optimism Collective votes on upgrades; the Foundation and a Security Council execute them together,
    instantly in an emergency.'
  base: 'Contracts upgrade instantly through a multisig of Coinbase and a Security Council, with no window to exit an
    unwanted upgrade.'
  hedera: 'The Hedera Council decides.'
  stellar: 'Protocol changes take effect when the Tier 1 validators vote to upgrade.'
  xrpl: 'An amendment takes effect after 80% of a server’s trusted validators support it for two weeks; the trusted
    lists are curated.'
  canton: 'The super validators vote.'
  polygon: 'A proposal needs a majority of the Polygon Protocol Council; stakers and their delegates may then signal approval or a veto, and the Council confirms or declines execution on chain. The Council also controls the upgradeable PoS contracts.'
  hyperliquid: 'Protocol changes go to an on-chain vote of the validators, as the Assistance Fund decision did in December 2025. The Hyper Foundation proposes most changes, and validators it runs hold roughly half of the stake, so in practice it can carry a vote.'
  corda: 'The network operator and its members.'
  fnality: 'The operator or the members.'
  hangang: 'The operator or the members.'
  dcjpy: 'The operator or the members.'
  quorum: 'The operator or the members.'
  fabric: 'The operator or the members.'
