# Architecture page (kind: architecture): a blueprint driven by architecture.yaml (content) and layout.yaml (geometry).
# Rendered from src/architecture.html. Each folder under systems/ becomes a due diligence page linked from the blueprint.

kind: architecture
title: Digital Asset Architecture
slug: architecture
eyebrow: Ethereum Institutional · Research
heading:
  text: Digital Asset Architecture
  italic: Architecture
intro: 'A blueprint of what a digital asset team runs inside an institution: from the clients it serves at the top, through channels, identity, systems of record, order control, screening and approval, custody and signing, down to the private keys that move assets on the ledger. Lines show how the components feed each other: instructions, data and controls. Hover over a component to see its connections, pick a flow to trace it end to end, and follow the DDQ tags to due diligence questions for the systems you may procure.'
intro_more: 'Every request is first classified by who is asking (a retail or wholesale client, new, existing or acting through a third party; a member of staff or an administrator; or an authority such as a regulator, law enforcement, a court or a tax authority), where they are accessing from and their nationality. That classification resolves to a scenario on the Scenarios page, an asset class on the Taxonomy map and a permission set on the Identity map, tied back to the client directory in the core architecture, and sets the risk tier that drives onboarding depth, screening intensity and limits. The main transaction runs straight down the middle of the blueprint. The two side rails hold what applies to every lane: governance, risk and conduct on the left; security, third parties and people on the right.'
svg_label: Blueprint of a digital asset team's architecture, from clients at the top to private keys at the bottom, with the connections between components
panel_default:
  title: Components
  text: Hover over a component to see what it covers and what it connects to; click to pin it, then follow its connections from the card. On a narrow screen, scroll the blueprint sideways.
