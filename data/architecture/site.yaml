# due diligence pages (systems/<id>/system.yaml): shared text
ddq:
  title: Due diligence questions
  text: 'Questions to put to the vendors and service providers behind each system on the blueprint, built from one YAML file per system so anyone can propose a question on GitHub. Use them as a starting point for your own questionnaire, not as a checklist to pass.'
  # the headings the due diligence pages are listed under (each system.yaml names one as its group)
  groups:
    custody: Custody and keys
    fincrime: Financial crime and compliance
    ledger: Ledger, data and trading
    security: Security, resilience and people
  notice:
    title: Work in progress.
    text: These questions are a v0.x draft for discussion. Vendor names are examples for orientation, not endorsements or assessments. Not legal advice.
  contribute:
    title: Suggest a question.
    text: Each page is built from one YAML file. Edit it on GitHub to add or sharpen a question, or open an issue to propose one.
