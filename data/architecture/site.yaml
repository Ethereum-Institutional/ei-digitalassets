# Architecture page (kind: architecture): a blueprint driven by architecture.yaml (content) and layout.yaml (geometry).
# Rendered from src/architecture.html. Each folder under systems/ becomes a due diligence page linked from the blueprint.

kind: architecture
title: Digital Asset Architecture
slug: architecture
eyebrow: Ethereum Institutional · Research
heading:
  text: Digital Asset Architecture
  italic: Architecture
intro: 'What a digital asset team runs inside an institution, from the clients it serves to the ledger: institutional systems, identity and access, the scenario and the token, then a custody platform that manages, approves and signs each transaction, calling out to screening and to key management, before it reaches the distributed ledger. Click an area to reveal what is behind it.'
intro_more: 'Every request is first classified by who is asking (a retail or wholesale client, new, existing or acting through a third party; a member of staff or an administrator; or an authority such as a regulator, law enforcement, a court or a tax authority), where they are accessing from and their nationality. That classification resolves to a scenario on the Scenarios page, an asset class on the Taxonomy map and a permission set on the Identity map, and sets the risk tier that drives onboarding depth, screening intensity and limits. Each area opens into the components behind it; the full blueprint draws all of them with their connections and lets you trace a key flow end to end. Governance, risk and conduct, and security, third parties and people, apply to every area and are listed under the overview.'
svg_label: Blueprint of a digital asset team's architecture, from clients at the top to private keys at the bottom, with the connections between components
panel_default:
  title: How to read it
  text: 'The blueprint of what a digital asset team runs, from the clients to the ledger, with each area covered so you see the simple flow first. Click a covered area, or an area below, to reveal its components; click a component for what it covers, its connections, its sources and its due diligence questions. Lines appear only when you trace a key flow; a picked component lights up the components it connects to, and the panel lists them. Dashed items are optional; not every institution needs them.'
