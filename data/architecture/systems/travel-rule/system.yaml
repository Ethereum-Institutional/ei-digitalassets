# Due diligence: Travel Rule solution. The page /architecture/travel-rule/ is built from this file.
# To propose a question, add it under the right section (q, and why: what a good answer shows) and open a pull request.

title: Travel Rule solution
short: Travel Rule
group: fincrime
tagline: 'Exchange originator and beneficiary data with counterparty VASPs'
order: 9
summary: 'Software that exchanges originator and beneficiary information with the counterparty institution (VASP) when digital assets are transferred, identifies whether the counterparty is a VASP or a self-hosted wallet, and holds transfers that do not meet the rule.'
components: [D2.4, D2.2, D4.1]
last_reviewed: 2026-10-27

guidance:
- title: Interoperability decides it
  text: 'The Travel Rule only works if your counterparties can receive your messages. Providers use different messaging protocols; ask which of your actual counterparties each provider can reach today, not how many VASPs are on its network.'

sections:
- title: Reach and interoperability
  questions:
  - q: 'Which messaging protocols do you support, and can you reach counterparties on other providers'' networks?'
    must: true
  - q: 'Of the counterparties we send to and receive from most, how many can you reach today?'
  - q: 'How do you discover whether an address belongs to a VASP, and how do you assess that VASP before sending personal data to it?'

- title: Rules and jurisdictions
  questions:
  - q: 'How do you apply different thresholds and data requirements by jurisdiction, and how quickly are rule changes reflected?'
  - q: 'How do you handle transfers to and from self-hosted wallets, including proof of ownership?'
  - q: 'How do you handle counterparties in jurisdictions where the rule is not yet in force?'

- title: Integration and data protection
  questions:
  - q: 'Can a transfer be held in our approval flow until the Travel Rule exchange completes, and released or rejected automatically?'
  - q: 'Where is personal data stored, encrypted with whose keys, and for how long?'
    must: true
  - q: 'Can the data be retrieved for audit and regulatory requests years later?'

