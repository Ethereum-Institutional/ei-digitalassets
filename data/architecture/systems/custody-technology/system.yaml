# Due diligence: custody technology platform (in-house). The page /architecture/custody-technology/ is built from this file.
# To propose a question, add it under the right section (q, and why: what a good answer shows) and open a pull request.

title: Custody technology platform
short: Custody technology
group: custody
tagline: 'Software to hold assets yourself, with keys you control'
order: 2
summary: 'Software that lets an institution hold digital assets itself: it creates and manages wallets, enforces approval policy and orchestrates signing with keys held in infrastructure the institution controls. The institution remains the custodian. If you would rather a regulated firm held the keys for you, see the third-party custodian questions.'
components: [D5.1, D5.3, D6.2, D4.4, D4.6]
last_reviewed: 2026-10-27

models:
- name: In-house platform, vendor software
  text: 'You license the platform and run signing with keys in your own HSMs, cloud KMS or MPC nodes. You are the custodian and carry the operational risk.'
  examples: [Fireblocks, Ripple Custody (formerly Metaco), Taurus-PROTECT]
- name: Third-party custodian
  text: 'A regulated custodian holds the keys and signs on your instruction. Covered on its own page.'
  link: custodian
- name: Hybrid
  text: 'Hot and warm wallets in-house for speed, cold storage or client assets with a third-party custodian, reconciled into one view.'

guidance:
- title: Ask who can sign without you
  text: 'The single most important answer: under any combination of vendor staff, vendor infrastructure and a court order against the vendor, can assets move without your approval? A good platform can show, by design and by audit, that it cannot.'
- title: Plan the exit on day one
  text: 'Ask how you would move every asset and every policy to another platform, and how you would recover keys if the vendor stopped operating. Vendor-independent recovery should be tested, not described.'

sections:
- title: Keys and signing
  questions:
  - q: 'Which signing technologies do you support (MPC, HSM, on-chain multisig), and can we use our own HSMs or cloud KMS?'
  - q: 'Where are keys or key shares generated and stored, and can the vendor ever reconstruct a key or sign without us?'
    why: The answer should be no, demonstrated by architecture and independent audit, not by policy alone.
    must: true
  - q: 'Which MPC protocol do you implement, which independent audits has it had, and how did you respond to published MPC vulnerabilities?'
  - q: 'Can the signing threshold and the set of signers be changed without moving assets?'
  - q: 'How are keys backed up and recovered, and can we recover without you if your company ceases to operate?'
    must: true

- title: Policy and approvals
  questions:
  - q: 'Can the policy engine express our approval workflow: quorums by amount, asset, destination, time and client?'
  - q: 'Are allowlists, limits and velocity controls enforced at the signing layer, so that they hold even if the user interface or an API key is compromised?'
    must: true
  - q: 'Is a change to the policy itself subject to quorum approval and recorded in a tamper-evident log?'
  - q: 'Do you decode and show what a transaction will do (simulation) before approvers sign?'
    why: Several large losses came from approvers signing transactions whose effect was not what the screen showed.

- title: Chains, assets and events
  questions:
  - q: 'Which chains and token standards do you support, and how long does it take to add a new chain?'
  - q: 'Do you support staking, smart contract interactions and decentralized finance protocols, and how are those calls restricted by policy?'
  - q: 'How do you handle forks, airdrops, token migrations and contract upgrades on supported chains?'

- title: Integration and segregation
  questions:
  - q: 'Which APIs and webhooks connect you to our order management, screening, reconciliation and books and records?'
  - q: 'Can client assets be held in segregated wallets per client as well as omnibus wallets, with records that support each model?'
  - q: 'Can screening and Travel Rule checks run inside your approval flow, using our chosen providers?'

- title: Security and resilience
  questions:
  - q: 'Which certifications and reports can you share (SOC 2 Type II, ISO 27001), and when were your last penetration test and code audit?'
  - q: 'What security incidents have you had, and what did you change afterwards?'
  - q: 'Which deployment models do you offer (SaaS, private cloud, on-premise), and what availability do you commit to?'
  - q: 'When did you last test disaster recovery end to end, including signing from a recovery site?'

- title: Vendor and exit
  questions:
  - q: 'How do you fund your operations, and can we see your financial statements?'
  - q: 'Do you offer source code escrow and documented vendor-independent recovery?'
    must: true
  - q: 'How would we export wallets, policies and history to another platform, and how long has that taken for other clients?'
  - q: 'How is pricing structured (assets under custody, transactions, wallets, seats), and what changes on renewal?'

