# Architecture blueprint layout. Lanes run from the clients (top) to the private keys (bottom). Columns sit on a
# 200-unit grid (x = 124, 324, 524, 724, 924); x = 524 is the spine that the main transaction runs down:
# client channels, identity, scenarios, order control, allowlisting, approval, multi-signature, custody, signing, keys.
# The ledger column sits to the right. The two rails (domains that apply to every lane) are listed under the
# blueprint, not drawn in it, so `rails` only names their items.
# nodes: id: [x, y] or [x, y, width] (centers, in canvas units). Every component is placed once: as a node or in a rail.
