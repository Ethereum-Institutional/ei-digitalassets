        status: new
        notes: GDPR erasure, on-chain position confidentiality
        sources:
          - { title: 'Regulation (EU) 2016/679 (GDPR), Article 17 (right to erasure) and Article 25 (data protection by design and by default)', url: 'https://eur-lex.europa.eu/eli/reg/2016/679/oj', checked: '2026-10-27' }
          - { title: 'EDPB, Guidelines 02/2025 on processing of personal data through blockchain technologies, version 2.0 (adopted 7 July 2026)', url: 'https://www.edpb.europa.eu/system/files/2026-07/edpb_guidelines_202502_blockchain_v2_en.pdf', checked: '2026-10-27' }
      - id: D15.3
        name: Records retention & evidence archive
        status: extend
        sources:
