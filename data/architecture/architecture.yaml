# Digital asset architecture: the components a digital asset team runs inside an institution, by domain, and how they
# connect. This file is the content of the Architecture blueprint; layout.yaml places each component, site.yaml holds
# the page text, and systems/<id>/system.yaml holds the due diligence questions for each system you may procure.
#
# Conventions
#   status:  existing | extend | new | evaluate
#   source:  brief (drawn from practice at a global bank; generic) | suggested (a gap worth considering); a domain's
#            source applies to its components
#   status:  how most global banks and similar institutions are likely to meet the need (generic, not one firm's plan)
#   maps_to: links into the reference maps (scenarios, taxonomy, identity, core directory, privacy, networks,
#            decentralization, quantum)
#   sources: optional [{ title, url, checked }] for the standard, regulation or guidance behind a component
#   short:   the label drawn on the blueprint when the name is too long for a box
#   type:    system (system of record) | process | technology | control | key; components drawn as boxes need one
#   any other list (examples, techniques, controls, topics, operating_models) is shown in the component's detail card

meta:
  title: Digital Asset Architecture
  status_legend:
    existing: Usually met by the core platform as it is
    extend: Usually an existing core capability, extended for digital assets
    new: Usually new for digital assets
    evaluate: A technology choice most institutions assess before they commit
  flow_groups:
    client: Client and staff journeys
    ledger: Ledger and post-trade
    oversight: Incidents and oversight
  reference_maps:
    scenarios_map: Business scenarios supported (the Scenarios page)
    taxonomy_map: Digital asset classification (the Taxonomy map)
    identity_map: Permissions and entitlements (the Identity map)
    core_directory: Existing client directory in core architecture
    privacy_map: Privacy designs, confidential tokens and the institutional wish list (the Privacy page)
    networks_map: Ledger networks by type and consensus (the Networks map)
    decentralization_map: How decentralized a ledger is, property by property (the Decentralization page)
    quantum_map: Quantum risk and the Ethereum roadmap (the Quantum page)

# ---------------------------------------------------------------------------
# TOP BAND: who is being served, and from where
# ---------------------------------------------------------------------------
client_context:
  segments:
    - id: retail
      name: Retail
      states: [new, existing, third_party]
    - id: wholesale
      name: Wholesale
      states: [new, existing, third_party]
    - id: staff
      name: Staff & administrators
      states: [operator, approver, administrator]
    - id: authority
      name: Authorities
      states: [regulator, law_enforcement, court, tax_authority]
  access_origin: [domestic, abroad, unknown]
  nationality: [domestic, foreign, unknown]
  routing_rule: 'Segment, client state, access origin and nationality together resolve to a scenario (Scenarios page), an asset class (Taxonomy map) and a permission set (Identity map), and set the risk tier that drives onboarding depth, screening intensity and limits.'

# ---------------------------------------------------------------------------
# DOMAINS (placed on the page by layout.yaml)
# ---------------------------------------------------------------------------
domains:

  - id: D0
    name: Core Architecture
    components:
      - id: D0.1
        name: Client channels (portal, app, API)
        type: technology
        status: extend
        source: suggested
        notes: Where every client and counterparty request enters; extended for wallet and digital asset journeys
      - id: D0.2
        name: Core client directory
        type: system
        status: existing
        source: brief
        maps_to: [core_directory]
        notes: The institution's system of record for clients; identity and wallets resolve back to it
      - id: D0.3
        name: Books & records (general ledger)
        type: system
        status: extend
        source: suggested
        notes: Positions and valuations of digital assets, reconciled against the chain and against custodian statements
        sources:
          - { title: 'FASB, Accounting Standards Update 2023-08, Intangibles, Goodwill and Other: Crypto Assets (Subtopic 350-60), December 2023 (fair value measurement, separate presentation and disclosure)', url: 'https://storage.fasb.org/ASU%202023-08.pdf', checked: '2026-10-27' }
          - { title: 'BCBS, Prudential treatment of cryptoasset exposures (December 2022), SCO60.125(5) (valuation risk)', url: 'https://www.bis.org/publications/202212-standards-prudential-treatment-cryptoasset-exposures.pdf', checked: '2026-10-27' }
      - id: D0.4
        name: Internal tools & admin console
        short: Internal tools & admin console
        type: technology
        status: extend
        source: brief
        notes: How staff and administrators reach digital asset systems, under privileged access management and separate from client channels

  - id: D1
    name: Reference Maps & Client Directory
    components:
      - id: D1.1
        name: Scenarios map linkage
        short: Scenarios map
        type: system
        status: extend
        source: brief
        maps_to: [scenarios_map]
      - id: D1.2
        name: Digital asset taxonomy linkage
        short: Taxonomy map
        type: system
        status: extend
        source: brief
        maps_to: [taxonomy_map]
        notes: Asset class, chain, token standard, regulatory classification
        sources:
          - { title: 'Basel Framework, SCO60 Cryptoasset exposures (in force 1 January 2026), SCO60.6 to SCO60.19 (classification conditions; Groups 1a, 1b, 2a and 2b)', url: 'https://www.bis.org/basel_framework/chapter/SCO/60.htm', checked: '2026-10-27' }
          - { title: 'ISO 24165-1:2025, Digital token identifier (DTI), Part 1: Method for registration and assignment (edition 2, May 2025)', url: 'https://www.iso.org/standard/85546.html', checked: '2026-10-27' }
      - id: D1.3
        name: Identity & permissions linkage
        short: Identity map & permissions
        type: system
        status: extend
        source: brief
        maps_to: [identity_map, core_directory]
        notes: Permissions resolve back to the existing core client directory
      - id: D1.4
        name: Chain & protocol registry
        type: system
        status: new
        source: suggested
        maps_to: [taxonomy_map]
        notes: Approved chains, protocol versions, contract addresses
        sources:
          - { title: 'BCBS, Prudential treatment of cryptoasset exposures (December 2022), SCO60.125(1) (cryptoasset technology risk: network stability, permissioned or permissionless validation, node operator diversity)', url: 'https://www.bis.org/publications/202212-standards-prudential-treatment-cryptoasset-exposures.pdf', checked: '2026-10-27' }
          - { title: 'ISO 24165-1:2025, Digital token identifier (DTI), Part 1: Method for registration and assignment (identifies tokens and the distributed ledgers they run on)', url: 'https://www.iso.org/standard/85546.html', checked: '2026-10-27' }

  - id: D2
    name: Identity, KYC/KYB & Wallet Ownership
    components:
      - id: D2.1
        name: KYC/KYB extension for digital assets
        short: KYC/KYB for digital assets
        type: process
        status: extend
        source: brief
        notes: Source of funds and wealth in digital assets, exchange history, wallet declarations
        sources:
          - { title: 'FATF Recommendations, Recommendation 10 (customer due diligence) and Recommendation 15 with its Interpretive Note (virtual assets and VASPs)', url: 'https://www.fatf-gafi.org/en/publications/Fatfrecommendations/Fatf-recommendations.html', checked: '2026-10-27' }
          - { title: 'FATF, Updated Guidance for a Risk-Based Approach to Virtual Assets and Virtual Asset Service Providers (October 2021), section on preventive measures for VASPs (customer due diligence)', url: 'https://www.fatf-gafi.org/en/publications/Fatfrecommendations/Updated-guidance-va-vasp.html', checked: '2026-10-27' }
          - { title: 'Regulation (EU) 2024/1624 (AMLR), Articles 19 and 20 (application of customer due diligence; customer due diligence measures)', url: 'https://eur-lex.europa.eu/eli/reg/2024/1624/oj', checked: '2026-10-27' }
      - id: D2.2
        name: Wallet ownership proof
        type: process
        status: new
        source: brief
        techniques:
          - Message signature (account-based chains, e.g. ERC-191 or EIP-712)
          - UTXO ownership proof (e.g. BIP-322 message signing)
          - Micro-deposit test
          - Custodian attestation for hosted wallets
        sources:
          - { title: 'EBA, Travel Rule Guidelines (EBA/GL/2024/11, 4 July 2024), section 4.8.4, paragraph 83 (proof of ownership or control of a self-hosted address: test transfer of a predefined amount, signed message, attended or unattended verification)', url: 'https://www.eba.europa.eu/sites/default/files/2024-07/6de6e9b9-0ed9-49cd-985d-c0834b5b4356/Travel%20Rule%20Guidelines.pdf', checked: '2026-10-27' }
          - { title: 'EIP-712: Typed structured data hashing and signing (Final)', url: 'https://eips.ethereum.org/EIPS/eip-712', checked: '2026-10-27' }
          - { title: 'BIP-322: Generic Signed Message Format', url: 'https://github.com/bitcoin/bips/blob/master/bip-0322.mediawiki', checked: '2026-10-27' }
      - id: D2.3
        name: Wallet-to-client binding in directory
        short: Wallet-to-client binding
        type: system
        status: new
        source: brief
        maps_to: [core_directory, identity_map]
      - id: D2.4
        name: Travel Rule / VASP counterparty identification
        short: Travel Rule & VASP identification
        type: process
        status: new
        source: suggested
        notes: Originator and beneficiary data exchange, VASP discovery, self-hosted wallet rules
        sources:
          - { title: 'FATF Recommendations, Interpretive Note to Recommendation 15, paragraph 7(b), and Recommendation 16 (payment transparency, revised June 2025)', url: 'https://www.fatf-gafi.org/en/publications/Fatfrecommendations/Fatf-recommendations.html', checked: '2026-10-27' }
          - { title: 'Regulation (EU) 2023/1113 (Transfer of Funds Regulation), Articles 14 to 18 (information accompanying crypto-asset transfers; self-hosted addresses in Articles 14(5) and 16(2); missing information; assessment and reporting)', url: 'https://eur-lex.europa.eu/eli/reg/2023/1113/oj', checked: '2026-10-27' }
          - { title: 'EBA, Travel Rule Guidelines (EBA/GL/2024/11, 4 July 2024), sections 4.5 to 4.8 (detecting missing information, repeatedly failing CASPs, transfers from or to self-hosted addresses)', url: 'https://www.eba.europa.eu/sites/default/files/2024-07/6de6e9b9-0ed9-49cd-985d-c0834b5b4356/Travel%20Rule%20Guidelines.pdf', checked: '2026-10-27' }
      - id: D2.6
        name: Decentralized identity & verifiable credentials
        short: Decentralized identity
        type: technology
        status: evaluate
        source: brief
        maps_to: [identity_map]
        notes: Credentials a client holds in a wallet and presents to prove KYC status, accreditation or jurisdiction without resubmitting documents
        examples: [W3C Verifiable Credentials, W3C Decentralized Identifiers, On-chain attestations]
        sources:
          - { title: 'W3C, Verifiable Credentials Data Model v2.0 (W3C Recommendation, 15 May 2025)', url: 'https://www.w3.org/TR/vc-data-model-2.0/', checked: '2026-10-27' }
          - { title: 'W3C, Decentralized Identifiers (DIDs) v1.0 (W3C Recommendation; v1.1 is a Candidate Recommendation, March 2026)', url: 'https://www.w3.org/TR/did-core/', checked: '2026-10-27' }
          - { title: 'Regulation (EU) 2024/1183 (European Digital Identity Framework, eIDAS 2), Articles 5a and 5b (European Digital Identity Wallets)', url: 'https://eur-lex.europa.eu/eli/reg/2024/1183/oj', checked: '2026-10-27' }
      - id: D2.5
        name: Right-sized EDD for clients with digital asset exposure
        short: Enhanced due diligence
        type: process
        status: extend
        source: brief
        notes: Includes clients adjacent to the technology (miners, developers, VASPs)
        sources:
          - { title: 'Regulation (EU) 2024/1624 (AMLR), Article 34 (scope of enhanced due diligence measures) and Article 40 (measures to mitigate risks in transactions with a self-hosted address)', url: 'https://eur-lex.europa.eu/eli/reg/2024/1624/oj', checked: '2026-10-27' }
          - { title: 'FATF, Updated Guidance for a Risk-Based Approach to Virtual Assets and Virtual Asset Service Providers (October 2021), risk indicators and enhanced due diligence for higher-risk VA activity', url: 'https://www.fatf-gafi.org/en/publications/Fatfrecommendations/Updated-guidance-va-vasp.html', checked: '2026-10-27' }

  - id: D3
    name: AML / Financial Crime
    components:
      - id: D3.1
        name: Blockchain analytics & AML platform
        short: Blockchain analytics platform
        type: technology
        status: new
        source: brief
        notes: Extends beyond the core AML system; integrates alerts into existing case management
        sources:
          - { title: 'OFAC, Sanctions Compliance Guidance for the Virtual Currency Industry (October 2021), Internal Controls, pages 13 to 17 (transaction monitoring and investigation; sanctions screening of wallet addresses)', url: 'https://ofac.treasury.gov/media/913571/download?inline', checked: '2026-10-27' }
          - { title: 'FATF, Updated Guidance for a Risk-Based Approach to Virtual Assets and Virtual Asset Service Providers (October 2021), ongoing monitoring of VA transactions', url: 'https://www.fatf-gafi.org/en/publications/Fatfrecommendations/Updated-guidance-va-vasp.html', checked: '2026-10-27' }
      - id: D3.2
        name: Exposure tolerance configuration
        short: Exposure tolerances
        type: control
        status: new
        source: brief
        exposure_types: [direct, counterparty, indirect]
        signal_strength: [positive_confirmation, strong_indicator, weak_suspicious]
        risk_categories:
          - Sanctions
          - Darknet markets
          - Ransomware, hacks and stolen funds
          - Mixers and privacy protocols
          - Scams and fraud
          - Gambling
          - High-risk jurisdictions and unlicensed VASPs
          - Terrorist financing
          - CSAM-linked
        notes: A tolerance matrix (exposure x signal x category) mapped to an action (allow, review, hold, block, report)
        sources:
          - { title: 'OFAC, Sanctions Compliance Guidance for the Virtual Currency Industry (October 2021), Risk Assessment, page 12', url: 'https://ofac.treasury.gov/media/913571/download?inline', checked: '2026-10-27' }
          - { title: 'EBA, Guidelines on internal policies, procedures and controls to ensure the implementation of Union and national restrictive measures (EBA/GL/2024/14 and EBA/GL/2024/15, 14 November 2024), section 4.2 of GL/2024/14 (restrictive measures exposure assessment)', url: 'https://www.eba.europa.eu/sites/default/files/2024-11/eaeae49d-81a5-4154-8af9-5014f6ee8881/Final%20Report%20Guidelines%20restrictive%20measures%20.pdf', checked: '2026-10-27' }
      - id: D3.3
        name: Wallet and transaction screening
        short: Wallet & transaction screening
        type: process
        status: new
        source: brief
        notes: Orchestrates screening at onboarding, before each transaction, periodically, after settlement and retrospectively
        trigger_points:
          - onboarding
          - pre_transaction_approval
          - periodic_activity_review
          - post_transaction_monitoring
          - retrospective_rescreening
        sources:
          - { title: 'OFAC, Sanctions Compliance Guidance for the Virtual Currency Industry (October 2021), Internal Controls: Sanctions Screening, page 16 (screening customers at onboarding and transactions for physical, digital wallet and IP addresses)', url: 'https://ofac.treasury.gov/media/913571/download?inline', checked: '2026-10-27' }
          - { title: 'EBA, Guidelines on restrictive measures under Regulation (EU) 2023/1113 (EBA/GL/2024/15, 14 November 2024), section 4.1 (restrictive measures screening, including originator and beneficiary wallet addresses)', url: 'https://www.eba.europa.eu/sites/default/files/2024-11/eaeae49d-81a5-4154-8af9-5014f6ee8881/Final%20Report%20Guidelines%20restrictive%20measures%20.pdf', checked: '2026-10-27' }
      - id: D3.4
        name: Case management
        type: system
        status: extend
        source: suggested
      - id: D3.5
        name: Investigations & expert witness capability
        short: Investigations & expert witness
        type: process
        status: new
        source: brief
        notes: Evidence preservation, chain of custody, reproducible tracing methodology
        sources:
          - { title: 'ISO/IEC 27037:2012, Guidelines for identification, collection, acquisition and preservation of digital evidence (confirmed 2018)', url: 'https://www.iso.org/standard/44381.html', checked: '2026-10-27' }
      - id: D3.6
        name: Staff / third-party processes & training
        status: new
        source: brief
        sources:
          - { title: 'FATF Recommendations, Recommendation 18 (internal controls, including ongoing employee training)', url: 'https://www.fatf-gafi.org/en/publications/Fatfrecommendations/Fatf-recommendations.html', checked: '2026-10-27' }
          - { title: 'OFAC, Sanctions Compliance Guidance for the Virtual Currency Industry (October 2021), Training, page 19', url: 'https://ofac.treasury.gov/media/913571/download?inline', checked: '2026-10-27' }
      - id: D3.7
        name: Deposit quarantine
        type: control
        status: new
        source: brief
        notes: 'Inbound assets from unknown or flagged sources are held in a segregated address until cleared, returned, frozen or reported; funds of a sanctioned person are blocked property, held and reported to OFAC within 10 business days, never returned'
        sources:
          - { title: 'OFAC, Sanctions Compliance Guidance for the Virtual Currency Industry (October 2021), How Do You Block Virtual Currency?, page 5, and Reporting Requirements (blocked virtual currency reported within 10 business days)', url: 'https://ofac.treasury.gov/media/913571/download?inline', checked: '2026-10-27' }
          - { title: '31 CFR 501.603, Reports of blocked, unblocked, or transferred blocked property', url: 'https://www.ecfr.gov/current/title-31/subtitle-B/chapter-V/part-501/subpart-C/section-501.603', checked: '2026-10-27' }
          - { title: 'Regulation (EU) 2023/1113 (Transfer of Funds Regulation), Article 17 (rejecting, returning or suspending crypto-asset transfers with missing or incomplete information)', url: 'https://eur-lex.europa.eu/eli/reg/2023/1113/oj', checked: '2026-10-27' }
      - id: D3.8
        name: Suspicious activity reporting (SAR/STR)
        short: Suspicious activity reporting
        type: process
        status: extend
        source: brief
        notes: Filing to the financial intelligence unit, with on-chain evidence and without tipping off the client
        sources:
          - { title: 'FATF Recommendations, Recommendation 20 (reporting of suspicious transactions) and Recommendation 21 (tipping-off and confidentiality)', url: 'https://www.fatf-gafi.org/en/publications/Fatfrecommendations/Fatf-recommendations.html', checked: '2026-10-27' }
          - { title: 'Regulation (EU) 2024/1624 (AMLR), Article 69 (reporting of suspicions) and Article 73 (prohibition of disclosure)', url: 'https://eur-lex.europa.eu/eli/reg/2024/1624/oj', checked: '2026-10-27' }

  - id: D4
    name: Transaction Control & Approvals
    components:
      - id: D4.1
        name: Transaction approval workflow
        type: process
        status: new
        source: brief
        dimensions: [scenario, asset, chain, internal_custody, external_custody]
        sources:
          - { title: 'C4, CryptoCurrency Security Standard (CCSS) v9.0, aspect 1.05 Key Material Usage, control 1.05.8 Spend Verification (destination and amount verified over an approved channel before key material is used)', url: 'https://cryptoconsortium.org/ccss-table-v9/', checked: '2026-10-27' }
      - id: D4.2
        name: Address & protocol allowlisting
        short: Allowlisting & limits
        type: control
        status: new
        source: brief
        controls:
          - Approved addresses
          - Approved protocols and contract functions
          - Notional limits
          - Volume limits
          - Fat-finger limits
          - Velocity and time-window limits
      - id: D4.3
        name: Integration with existing order control systems
        short: Order control systems
        type: technology
        status: extend
        source: brief
      - id: D4.4
        name: Multi-signature approvals for key flows
        short: Multi-signature approvals
        type: control
        status: new
        source: brief
        sources:
          - { title: 'C4, CryptoCurrency Security Standard (CCSS) v9.0, aspect 1.02 Wallet Generation (signing configuration, redundant key, geographic and operator distribution) and control 1.05.9 Multi-Signer Mechanism Usage', url: 'https://cryptoconsortium.org/ccss-table-v9/', checked: '2026-10-27' }
      - id: D4.5
        name: Segregation of duties
        type: control
        status: extend
        source: brief
        sources:
          - { title: 'NIST SP 800-53 Rev. 5, Security and Privacy Controls for Information Systems and Organizations, control AC-5 (Separation of Duties)', url: 'https://csrc.nist.gov/pubs/sp/800/53/r5/upd1/final', checked: '2026-10-27' }
          - { title: 'ISO/IEC 27001:2022, Information security management systems, Annex A control 5.3 (Segregation of duties)', url: 'https://www.iso.org/standard/27001', checked: '2026-10-27' }
          - { title: 'C4, CryptoCurrency Security Standard (CCSS) v9.0, control 1.02.4 Entity Key Material Distribution (multi-signer keys held by distinct operators)', url: 'https://cryptoconsortium.org/ccss-table-v9/', checked: '2026-10-27' }
      - id: D4.6
        name: Transaction simulation / pre-sign decoding
        short: Transaction simulation
        type: technology
        status: new
        source: suggested
        notes: Human-readable preview of what a signature actually does
        sources:
          - { title: 'EIP-712: Typed structured data hashing and signing (Final)', url: 'https://eips.ethereum.org/EIPS/eip-712', checked: '2026-10-27' }
          - { title: 'ERC-7730: Structured Data Clear Signing Format (Draft)', url: 'https://eips.ethereum.org/EIPS/eip-7730', checked: '2026-10-27' }

  - id: D5
    name: Custody
    components:
      - id: D5.1
        name: Custody technology platform (in-house)
        short: Custody technology (in-house)
        type: technology
        status: evaluate
        source: brief
        notes: Software you run or subscribe to, with keys in infrastructure you control; you remain the custodian
        examples: [Fireblocks, Ripple Custody (formerly Metaco), Taurus-PROTECT]
        sources:
          - { title: 'Regulation (EU) 2023/1114 (MiCA), Article 75 (custody and administration of crypto-assets on behalf of clients), in particular 75(3) (custody policy)', url: 'https://eur-lex.europa.eu/eli/reg/2023/1114/oj', checked: '2026-10-27' }
          - { title: 'Federal Reserve, OCC and FDIC, Crypto-Asset Safekeeping by Banking Organizations (joint statement, 14 July 2025)', url: 'https://www.federalreserve.gov/newsevents/pressreleases/files/bcreg20250714a1.pdf', checked: '2026-10-27' }
          - { title: 'ISO/TR 23576:2020, Blockchain and distributed ledger technologies: Security management of digital asset custodians', url: 'https://www.iso.org/standard/76072.html', checked: '2026-10-27' }
      - id: D5.2
        name: Wallet-as-a-service for self-custody clients
        short: Wallet-as-a-service
        type: technology
        status: new
        source: brief
        sources:
          - { title: 'ERC-4337: Account Abstraction Using Alt Mempool (Final)', url: 'https://eips.ethereum.org/EIPS/eip-4337', checked: '2026-10-27' }
          - { title: 'EIP-7702: Set Code for EOAs (Final)', url: 'https://eips.ethereum.org/EIPS/eip-7702', checked: '2026-10-27' }
      - id: D5.3
        name: Wallet tiering (hot / warm / cold)
        short: Wallet tiering (hot, warm, cold)
        type: control
        status: new
        source: suggested
        sources:
          - { title: 'C4, CryptoCurrency Security Standard (CCSS) v9.0, aspect 1.03 Key Material Storage and control 1.05.2 Operational Key Material Environment', url: 'https://cryptoconsortium.org/ccss-table-v9/', checked: '2026-10-27' }
          - { title: 'ISO/TR 23576:2020, Blockchain and distributed ledger technologies: Security management of digital asset custodians', url: 'https://www.iso.org/standard/76072.html', checked: '2026-10-27' }
      - id: D5.4
        name: Reconciliation & proof of reserves
        type: process
        status: new
        source: suggested
        notes: On-chain balances against books and records and against custodian statements
        sources:
          - { title: 'IOSCO, Policy Recommendations for Crypto and Digital Asset Markets (FR11/2023, 16 November 2023), Recommendation 15 (Client Asset Reconciliation and Independent Assurance)', url: 'https://www.iosco.org/library/pubdocs/pdf/IOSCOPD747.pdf', checked: '2026-10-27' }
          - { title: 'Regulation (EU) 2023/1114 (MiCA), Article 75(2) (register of positions per client) and 75(5) (statement of position at least every three months)', url: 'https://eur-lex.europa.eu/eli/reg/2023/1114/oj', checked: '2026-10-27' }
      - id: D5.5
        name: Third-party custodian
        type: technology
        status: evaluate
        source: brief
        notes: A regulated custodian holds the keys and signs on the institution's authenticated instruction
        examples: [Anchorage Digital Bank, BitGo Trust Company, Coinbase Custody Trust Company]
        sources:
          - { title: 'Regulation (EU) 2023/1114 (MiCA), Article 75(9) (use of other authorized custodians) and 75(8) (liability for loss of crypto-assets or means of access)', url: 'https://eur-lex.europa.eu/eli/reg/2023/1114/oj', checked: '2026-10-27' }
          - { title: 'Federal Reserve, OCC and FDIC, Crypto-Asset Safekeeping by Banking Organizations (joint statement, 14 July 2025)', url: 'https://www.federalreserve.gov/newsevents/pressreleases/files/bcreg20250714a1.pdf', checked: '2026-10-27' }
          - { title: 'OCC, Interpretive Letter 1184 (May 2025): bank crypto-asset custody and execution services, including through sub-custodians', url: 'https://www.occ.gov/topics/charters-and-licensing/interpretations-and-actions/2025/int1184.pdf', checked: '2026-10-27' }

      - id: D5.6
        name: Confidential tokens and privacy layer
        short: Confidential tokens
        type: technology
        status: evaluate
        source: suggested
        notes: 'Hides amounts, and often counterparties, from the public while the ledger still checks every rule. Choose on permissioning (verified participants or anyone), who else can see the data (a notary with an on-chain notice, or the operator), the issuer controls that survive, the ledgers and token standards supported, and whether a service under the same name also serves permissionless privacy. The Privacy page compares the designs and its institutional wish list shows which come closest.'
        maps_to: [privacy_map]
        examples: ['Hyperledger Paladin (Noto, Zeto and Pente)', 'Zama confidential tokens (ERC-7984)', ZKsync Prividium]
        sources:
          - { title: 'Ethereum Institutional, Privacy map: designs, facets and the institutional wish list', url: 'https://ethereum-institutional.github.io/ei-digitalassets/privacy/', checked: '2026-10-27' }
          - { title: 'J.P. Morgan Kinexys, Project Epic whitepaper (2024), What is on-chain privacy', url: 'https://www.jpmorgan.com/kinexys/documents/JPMC-Kinexys-Project-Epic-Whitepaper-2024.pdf', checked: '2026-10-27' }
          - { title: 'ERC-7984, Confidential Fungible Token (Draft)', url: 'https://eips.ethereum.org/EIPS/eip-7984', checked: '2026-10-27' }
  - id: D6
    name: Key Management & Cryptography
    components:
      - id: D6.1
        name: Approved cryptographic inventory
        short: Cryptographic inventory
        type: system
        status: new
        source: brief
        sources:
          - { title: 'Commission Delegated Regulation (EU) 2024/1774 (DORA RTS on ICT risk management), Article 6 (encryption and cryptographic controls) and Article 7 (cryptographic key management, register of certificates)', url: 'https://eur-lex.europa.eu/eli/reg_del/2024/1774/oj', checked: '2026-10-27' }
          - { title: 'NIST SP 800-57 Part 1 Rev. 5, Recommendation for Key Management: General (May 2020), Section 9.2 (key and certificate inventories)', url: 'https://csrc.nist.gov/pubs/sp/800/57/pt1/r5/final', checked: '2026-10-27' }
          - { title: 'NIST CSWP 39, Considerations for Achieving Crypto Agility: Strategies and Practices (December 2025)', url: 'https://csrc.nist.gov/pubs/cswp/39/upd1/considerations-for-achieving-crypto-agility/final', checked: '2026-10-27' }
      - id: D6.2
        name: Private key lifecycle management
        short: Signing & key lifecycle
        type: technology
        status: new
        source: brief
        sources:
          - { title: 'NIST SP 800-57 Part 1 Rev. 5, Recommendation for Key Management: General (May 2020), Sections 7 and 8 (key states and transitions; key-management phases and functions)', url: 'https://csrc.nist.gov/pubs/sp/800/57/pt1/r5/final', checked: '2026-10-27' }
          - { title: 'C4, CryptoCurrency Security Standard (CCSS) v9.0, aspects 1.01 to 1.05 (key material generation, wallet generation, storage, access and usage)', url: 'https://cryptoconsortium.org/ccss-table-v9/', checked: '2026-10-27' }
          - { title: 'Commission Delegated Regulation (EU) 2024/1774 (DORA RTS on ICT risk management), Article 7 (cryptographic key management across the full key lifecycle)', url: 'https://eur-lex.europa.eu/eli/reg_del/2024/1774/oj', checked: '2026-10-27' }
      - id: D6.3
        name: Key ceremony
        type: process
        status: new
        source: brief
        sources:
          - { title: 'C4, CryptoCurrency Security Standard (CCSS) v9.0, aspect 1.01 Key Material Generation (actor-generated keys, validated methodology, NIST SP 800-90A DRBG, entropy)', url: 'https://cryptoconsortium.org/ccss-table-v9/', checked: '2026-10-27' }
          - { title: 'NIST SP 800-57 Part 1 Rev. 5, Recommendation for Key Management: General (May 2020), Section 8.1.5 (key establishment: generation and distribution of key pairs)', url: 'https://csrc.nist.gov/pubs/sp/800/57/pt1/r5/final', checked: '2026-10-27' }
      - id: D6.4
        name: Hard key recovery
        type: process
        status: new
        source: brief
        sources:
          - { title: 'NIST SP 800-57 Part 1 Rev. 5, Recommendation for Key Management: General (May 2020), Section 9.5 (key-management system survivability) and Appendix B (key recovery)', url: 'https://csrc.nist.gov/pubs/sp/800/57/pt1/r5/final', checked: '2026-10-27' }
          - { title: 'C4, CryptoCurrency Security Standard (CCSS) v9.0, control 1.02.2 Key Material Redundancy and control 1.03.2 Key Material Backup(s)', url: 'https://cryptoconsortium.org/ccss-table-v9/', checked: '2026-10-27' }
      - id: D6.5
        name: Multi-jurisdictional key material vaulting
        short: Key material vault
        type: system
        status: new
        source: brief
        sources:
          - { title: 'C4, CryptoCurrency Security Standard (CCSS) v9.0, aspect 1.03 Key Material Storage (backups geographically separate, environmentally protected, access-controlled, tamper-evident, encrypted) and control 1.02.3 Geographic Key Material Distribution', url: 'https://cryptoconsortium.org/ccss-table-v9/', checked: '2026-10-27' }
      - id: D6.6
        name: Multi-signature schemes
        type: control
        status: new
        source: brief
        notes: On-chain multisig (e.g. Safe smart accounts on EVM chains, multisig scripts on Bitcoin) as an alternative or complement to MPC
        sources:
          - { title: 'C4, CryptoCurrency Security Standard (CCSS) v9.0, aspect 1.02 Wallet Generation (multi-signer mechanisms) and control 1.05.9 Multi-Signer Mechanism Usage', url: 'https://cryptoconsortium.org/ccss-table-v9/', checked: '2026-10-27' }
          - { title: 'ERC-1271: Standard Signature Validation Method for Contracts (Final)', url: 'https://eips.ethereum.org/EIPS/eip-1271', checked: '2026-10-27' }
      - id: D6.7
        name: Key storage technology evaluation
        short: Key technology evaluation
        type: process
        status: evaluate
        source: brief
        items: [MPC, TEE, HSM, FHE, ZKP]
        sources:
          - { title: 'NIST FIPS 140-3, Security Requirements for Cryptographic Modules (March 2019)', url: 'https://csrc.nist.gov/pubs/fips/140-3/final', checked: '2026-10-27' }
          - { title: 'NIST IR 8214C, NIST First Call for Multi-Party Threshold Schemes (January 2026)', url: 'https://csrc.nist.gov/pubs/ir/8214/c/final', checked: '2026-10-27' }
      - id: D6.8
        maps_to: [quantum_map]
        name: Post-quantum cryptography evaluation & migration plan
        short: Post-quantum cryptography
        type: process
        status: evaluate
        source: brief
        sources:
          - { title: 'NIST IR 8547 (initial public draft), Transition to Post-Quantum Cryptography Standards (November 2024)', url: 'https://csrc.nist.gov/pubs/ir/8547/ipd', checked: '2026-10-27' }
          - { title: 'NIST FIPS 204, Module-Lattice-Based Digital Signature Standard (ML-DSA), August 2024', url: 'https://csrc.nist.gov/pubs/fips/204/final', checked: '2026-10-27' }
          - { title: 'Commission Delegated Regulation (EU) 2024/1774 (DORA RTS on ICT risk management), Article 6(4) (updating cryptographic technology on the basis of developments in cryptanalysis)', url: 'https://eur-lex.europa.eu/eli/reg_del/2024/1774/oj', checked: '2026-10-27' }
      - id: D6.9
        name: Private keys
        type: key
        status: new
        source: brief
        notes: The key material (whole keys, MPC shares or multisig signers) that authorizes every movement of assets on chain
        sources:
          - { title: 'SECG, SEC 2: Recommended Elliptic Curve Domain Parameters, version 2.0 (secp256k1)', url: 'https://www.secg.org/sec2-v2.pdf', checked: '2026-10-27' }
          - { title: 'NIST FIPS 186-5, Digital Signature Standard (DSS), February 2023 (ECDSA and EdDSA)', url: 'https://csrc.nist.gov/pubs/fips/186-5/final', checked: '2026-10-27' }
          - { title: 'NIST SP 800-57 Part 1 Rev. 5, Recommendation for Key Management: General (May 2020), Section 6 (protection requirements for key information)', url: 'https://csrc.nist.gov/pubs/sp/800/57/pt1/r5/final', checked: '2026-10-27' }
      - id: D6.10
        name: On-premise HSM
        type: technology
        status: evaluate
        source: brief
        notes: Certified hardware in your own data centers; check native support for secp256k1, ed25519 and BLS12-381
        examples: [Thales Luna, Entrust nShield, Utimaco]
        sources:
          - { title: 'NIST FIPS 140-3, Security Requirements for Cryptographic Modules (March 2019)', url: 'https://csrc.nist.gov/pubs/fips/140-3/final', checked: '2026-10-27' }
          - { title: 'NIST and CCCS, Cryptographic Module Validation Program (CMVP), validated modules search', url: 'https://csrc.nist.gov/projects/cryptographic-module-validation-program', checked: '2026-10-27' }
      - id: D6.11
        name: Cloud HSM & KMS
        type: technology
        status: evaluate
        source: brief
        notes: Hyperscaler key services and enclaves; keys stay in the provider's region and hardware under your account
        examples: [AWS CloudHSM, AWS KMS, AWS Nitro Enclaves, Google Cloud KMS and Cloud HSM, Azure Key Vault Managed HSM]
        sources:
          - { title: 'NIST FIPS 140-3, Security Requirements for Cryptographic Modules (March 2019)', url: 'https://csrc.nist.gov/pubs/fips/140-3/final', checked: '2026-10-27' }
          - { title: 'Regulation (EU) 2022/2554 (DORA), Article 28 (ICT third-party risk, general principles) and Article 30 (key contractual provisions, including data location)', url: 'https://eur-lex.europa.eu/eli/reg/2022/2554/oj', checked: '2026-10-27' }
      - id: D6.12
        name: MPC signing
        type: technology
        status: evaluate
        source: brief
        notes: Threshold signing where no single party ever holds the whole key; implementations differ in protocol, audits and share refresh
        examples: ['Threshold ECDSA (e.g. CGGMP21, DKLs)', FROST for Schnorr and EdDSA, Vendor and open-source libraries]
        sources:
          - { title: 'NIST IR 8214C, NIST First Call for Multi-Party Threshold Schemes (January 2026)', url: 'https://csrc.nist.gov/pubs/ir/8214/c/final', checked: '2026-10-27' }
          - { title: 'IETF RFC 9591, The Flexible Round-Optimized Schnorr Threshold (FROST) Protocol for Two-Round Schnorr Signatures (June 2024)', url: 'https://www.rfc-editor.org/rfc/rfc9591', checked: '2026-10-27' }
      - id: D6.13
        name: Key rotation
        type: process
        status: new
        source: brief
        notes: 'For an ordinary account (including under EIP-7702) a key cannot be rotated in place: rotation means new keys or addresses and moving assets, or refreshing MPC shares. Smart contract accounts (Safe, ERC-4337) can replace their signers without moving assets'
        sources:
          - { title: 'NIST SP 800-57 Part 1 Rev. 5, Recommendation for Key Management: General (May 2020), Section 5.3 (cryptoperiods)', url: 'https://csrc.nist.gov/pubs/sp/800/57/pt1/r5/final', checked: '2026-10-27' }
          - { title: 'Commission Delegated Regulation (EU) 2024/1774 (DORA RTS on ICT risk management), Article 7 (key renewal, revocation and replacement of lost, compromised or damaged keys)', url: 'https://eur-lex.europa.eu/eli/reg_del/2024/1774/oj', checked: '2026-10-27' }
      - id: D6.14
        name: Key compromise response
        short: Key compromise response
        type: process
        status: new
        source: brief
        notes: Suspected or confirmed exposure of key material; sweep assets to fresh keys, revoke, investigate and report
        sources:
          - { title: 'C4, CryptoCurrency Security Standard (CCSS) v9.0, aspect 2.04 Key Compromise Documentation (key compromise policy, training and rehearsals)', url: 'https://cryptoconsortium.org/ccss-table-v9/', checked: '2026-10-27' }
          - { title: 'NIST SP 800-57 Part 1 Rev. 5, Recommendation for Key Management: General (May 2020), Section 5.5 (compromise of keys) and Section 9.5.4 (compromise recovery)', url: 'https://csrc.nist.gov/pubs/sp/800/57/pt1/r5/final', checked: '2026-10-27' }
      - id: D6.15
        name: Data spill response
        type: process
        status: new
        source: brief
        notes: Seed phrases, key shares, backups or signing credentials found in logs, tickets, chats, screenshots or backups
        sources:
          - { title: 'C4, CryptoCurrency Security Standard (CCSS) v9.0, aspect 1.06 Data Sanitization Documentation', url: 'https://cryptoconsortium.org/ccss-table-v9/', checked: '2026-10-27' }
          - { title: 'NIST SP 800-88 Rev. 2, Guidelines for Media Sanitization', url: 'https://csrc.nist.gov/pubs/sp/800/88/r2/final', checked: '2026-10-27' }
          - { title: 'NIST SP 800-61 Rev. 3, Incident Response Recommendations and Considerations for Cybersecurity Risk Management (April 2025)', url: 'https://csrc.nist.gov/pubs/sp/800/61/r3/final', checked: '2026-10-27' }

  - id: D7
