  - id: D15
    name: Regulator Access & Data
    source: suggested
    components:
      - id: D15.1
        name: Supervisory observer access (portal or node)
        status: evaluate
        notes: Rare in banking today; some permissioned ledger pilots give a supervisor a read-only observer node. Most supervision runs through requests, reporting and on-site inspection
        sources:
          - { title: 'BIS Working Paper No. 811, Embedded supervision: how to build regulation into decentralised finance (Raphael Auer, 2019)', url: 'https://www.bis.org/publ/work811.htm', checked: '2026-10-27' }
      - id: D15.4
        name: Authority request handling
        short: Authority request handling
        type: process
        status: extend
        source: brief
        notes: Staff receive, verify, collect and respond to requests from authorities, under tipping-off controls; authorities rarely have direct access to systems
        requests:
          - Supervisory information requests and on-site inspections
          - Production orders, subpoenas and warrants
          - Freezing and seizure orders (executed through the break-glass runbook)
          - Tax authority requests
          - Requests from the financial intelligence unit following a report
        sources:
          - { title: 'Regulation (EU) 2024/1624 (AMLR), Article 73 (prohibition of disclosure)', url: 'https://eur-lex.europa.eu/eli/reg/2024/1624/oj', checked: '2026-10-27' }
