      - id: D7.4
        name: Indexing strategy for high-frequency calls
        short: Indexer
        type: technology
        status: new
        source: brief
      - id: D7.5
        name: Blockchain data analytics
        short: Blockchain data analytics
        type: technology
        status: new
        source: brief
      - id: D7.6
        name: Pricing & market data
        type: technology
        status: new
        source: suggested
      - id: D7.9
        name: Reference & static data (asset master, closing prices)
        short: Reference & static data
        type: system
        status: new
        source: brief
        notes: Asset identifiers (DTI, ISIN where one exists), contract addresses, decimals, chains, and official end-of-day prices for valuation and reporting
        sources:
          - { title: 'ISO 24165-1:2025, Digital token identifier (DTI), Part 1: Method for registration and assignment (edition 2, May 2025)', url: 'https://www.iso.org/standard/85546.html', checked: '2026-10-27' }
      - id: D7.10
        name: Oracles & attestations
        type: technology
        status: evaluate
        source: brief
        notes: Price and reference oracles used by on-chain contracts, and attestations (proof of reserves, NAV, collateral) published on chain
        sources:
          - { title: 'IOSCO, Policy Recommendations for Decentralized Finance (FR/14/2023, December 2023), Recommendation 5, Oracles and Bridges', url: 'https://www.iosco.org/library/pubdocs/pdf/IOSCOPD754.pdf', checked: '2026-10-27' }
      - id: D7.11
        name: Bridges & cross-chain messaging
        short: Bridges & cross-chain
        type: technology
        status: evaluate
        source: brief
        notes: Moving assets or messages between chains; among the largest sources of losses, so each bridge is a third-party risk decision
        sources:
          - { title: 'IOSCO, Policy Recommendations for Decentralized Finance (FR/14/2023, December 2023), Recommendation 5, Oracles and Bridges', url: 'https://www.iosco.org/library/pubdocs/pdf/IOSCOPD754.pdf', checked: '2026-10-27' }
      - id: D7.7
        name: Validator client operations
        short: Validator operations
        type: technology
        status: evaluate
        source: brief
        notes: Running consensus and execution clients that propose and attest; in-house or through an operator
        operating_models: [in_house, third_party_non_custodial, third_party_custodial]
        sources:
          - { title: 'Ethereum consensus specifications, Honest Validator (phase0 validator.md)', url: 'https://github.com/ethereum/consensus-specs/blob/master/specs/phase0/validator.md', checked: '2026-10-27' }
          - { title: 'ethereum.org, Proof-of-stake (developer documentation)', url: 'https://ethereum.org/en/developers/docs/consensus-mechanisms/pos/', checked: '2026-10-27' }
      - id: D7.8
        name: Validator keys
        type: key
        status: new
        source: brief
        notes: Signing keys are online and slashable if run twice; withdrawal credentials control the stake and should point to an address you hold
        techniques: [Remote signer, Slashing protection database, Distributed validator technology, HSM-backed signing]
        sources:
          - { title: 'ERC-2335: BLS12-381 Keystore (Review)', url: 'https://eips.ethereum.org/EIPS/eip-2335', checked: '2026-10-27' }
