  italic: Quantum
intro: 'Quantum computing is not a digital asset problem; it is an internet problem. The same public-key cryptography secures every TLS connection, software update, passport chip, payment network and certificate your institution relies on, and a large enough quantum computer breaks all of it at once. Ledgers are where the stakes are visible and the fix is furthest along: Ethereum has a published, dated plan to rebuild its cryptography on hashes, and its researchers now warn that advances in machine-generated mathematics could shorten the clock further. Four short pages:'
