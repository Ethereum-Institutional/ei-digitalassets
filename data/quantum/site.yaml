eyebrow: Ethereum Institutional · Research
heading:
  text: Quantum
  italic: Quantum
intro: 'What a large quantum computer could break on a distributed ledger, what it could not, and what Ethereum is doing about it. Two algorithms matter: Shor’s, which would break the elliptic-curve signatures every ledger uses today, and Grover’s, which only weakens the hash functions ledgers are built from. The page will map where each bites (your keys, the validators’ keys, the data-availability commitments, the proof systems) and set the Ethereum roadmap against it: what is available to you now, and what is coming, with dates.'
