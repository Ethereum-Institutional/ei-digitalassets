    title: The two algorithms
    text: Shor breaks today’s signatures; Grover only weakens hashes. Why the fix is to rebuild on hashes.
  - path: quantum/ledger
    icon: key
    title: Where it bites a ledger
    text: Your keys, the validators’ keys, data commitments and proofs; what is not at risk on a ledger, and what is at risk everywhere else.
  - path: quantum/roadmap
    icon: milestones
    title: The Ethereum roadmap
    text: What is post-quantum today (hashes, STARK rollups, account abstraction) and what is coming, with the community’s target dates.
  - path: quantum/institution
    icon: identity
    title: Where your digital asset team fits
    text: Inventory, exposure clocks, procurement and vendor management, crypto-agility, and the NCSC, EU and NIST timelines.
