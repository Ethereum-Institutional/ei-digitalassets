cards:
- path: quantum/algorithms
  icon: quantum
  title: The two algorithms
  text: Shor breaks today’s signatures; Grover only weakens hashes; and a newer warning that AI-driven mathematics could get there first. Why the fix is to rebuild on hashes.
- path: quantum/ledger
  icon: key
  title: Where it bites a ledger
  text: Your keys and seed phrases, the validators’ keys, data commitments and proofs; the emergency plan; what is not at risk on a ledger, and what is at risk everywhere else.
- path: quantum/roadmap
  icon: milestones
  title: The Ethereum roadmap
  text: What is post-quantum today (hashes, STARK rollups, account abstraction), what is coming and when, with the community’s own threat estimate beside its target dates.
- path: quantum/institution
  icon: identity
  title: Where your digital asset team fits
  text: Inventory, exposure clocks, procurement and vendor management, crypto-agility, and the NCSC, EU and NIST timelines.
