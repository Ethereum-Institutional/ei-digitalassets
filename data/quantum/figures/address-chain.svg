<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" class="ei-fig-svg">
  <defs>
    <marker id="ac-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#15803d"/></marker>
    <marker id="ac-k" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#14130f"/></marker>
    <marker id="ac-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c81e1e"/></marker>
  </defs>
  <g font-family="Söhne, Archivo, Helvetica Neue, Arial, sans-serif" fill="#14130f">
    <g font-size="15" font-weight="600" text-anchor="middle">
      <rect x="10" y="30" width="140" height="54" rx="8" fill="#fff" stroke="#14130f"/><text x="80" y="62">Seed phrase</text>
      <rect x="210" y="30" width="140" height="54" rx="8" fill="#fff" stroke="#14130f"/><text x="280" y="62">Private key</text>
      <rect x="410" y="30" width="140" height="54" rx="8" fill="#fff" stroke="#14130f"/><text x="480" y="62">Public key</text>
      <rect x="610" y="30" width="140" height="54" rx="8" fill="#fff" stroke="#14130f"/><text x="680" y="62">Address</text>
    </g>
    <g font-size="12" text-anchor="middle">
      <line x1="152" y1="57" x2="206" y2="57" stroke="#15803d" stroke-width="2" marker-end="url(#ac-g)"/><text x="180" y="22" fill="#15803d" font-weight="600">hash</text><text x="180" y="104" fill="#15803d">one way, stays</text>
      <line x1="352" y1="57" x2="406" y2="57" stroke="#14130f" stroke-width="2" marker-end="url(#ac-k)"/><text x="380" y="22" font-weight="600">curve</text>
      <line x1="552" y1="57" x2="606" y2="57" stroke="#15803d" stroke-width="2" marker-end="url(#ac-g)"/><text x="580" y="22" fill="#15803d" font-weight="600">hash</text><text x="580" y="104" fill="#15803d">one way, stays</text>
      <path d="M480 86 C 470 130, 300 130, 284 92" fill="none" stroke="#c81e1e" stroke-width="2" marker-end="url(#ac-r)"/>
      <text x="382" y="140" font-size="13" font-weight="600" fill="#c81e1e">Shor reverses this step</text>
    </g>
    <line x1="10" y1="160" x2="750" y2="160" stroke="#dfdbd2"/>
    <rect x="10" y="176" width="4" height="58" fill="#15803d"/>
    <text x="24" y="192" font-size="14" font-weight="600">Only ever received</text>
    <text x="24" y="212" font-size="13">The ledger shows the address, a hash.</text>
    <text x="24" y="230" font-size="13">Nothing for a quantum computer to work on.</text>
    <rect x="390" y="176" width="4" height="58" fill="#c81e1e"/>
    <text x="404" y="192" font-size="14" font-weight="600">Has sent a transaction</text>
    <text x="404" y="212" font-size="13">The public key is on the ledger for good.</text>
    <text x="404" y="230" font-size="13">Exposed the day a capable machine exists.</text>
  </g>
</svg>
