title: 'Quantum: the Ethereum roadmap'
slug: quantum-roadmap
heading:
  text: The Ethereum roadmap
  italic: roadmap
intro: 'The plan rebuilds every cryptographic primitive on hashes, in four areas: consensus signatures, data availability, account signatures and application proofs. What you can use now, what is coming, and the community’s own estimate of the threat beside its target dates.'
sections:
- title: The Ethereum roadmap
  items:
  - title: Available now
    text: Hashes are safe, STARK rollups are safe, and account abstraction (ERC-4337, EIP-7702) lets an institution run a post-quantum signature scheme on its own accounts today without waiting for the protocol. Few systems of comparable scale, on or off the internet, offer their users that option yet.
    more:
      title: EIP-7702, live since May 2025
      url: https://eips.ethereum.org/EIPS/eip-7702
  - title: Coming next
    text: 'Signature agility by protocol rule (EIP-8141, which ethereum.org says is being considered for the Hegotá upgrade, and EIP-7932), a hash-based state tree (EIP-7864), and Lean Ethereum: leanXMSS, a hash-based signature scheme for validators in place of BLS, aggregated with SNARK proofs in a minimal zero-knowledge virtual machine (leanVM), with core infrastructure targeted for about 2029. For accounts, a lean adaptation of the NIST hash-based standard SPHINCS+ (SLH-DSA) is being finalized, built for hardware wallets, multi-party signing and aggregation; an EVM-optimized variant that needs no protocol change was proposed in June 2026. The L1 is choosing hash-based schemes over the lattice-based NIST standards (ML-DSA) because a scheme meant to last decades should rest on the fewest assumptions, and researchers put a significant chance on lattices being attacked in the coming years; the lattice standards remain an option for faster movers. The Foundation’s Post-Quantum team (formed January 2026) describes the path as three phases, readiness and infrastructure, gradual opt-in adoption, then protocol-level consolidation, with no flag day: protocol upgrades could be complete by 2029 and the execution-layer migration takes years beyond; its primer for governments (July 2026) presents this as hardening critical infrastructure before the threat materializes, through the open upgrade process.'
    more:
      title: The Lean Ethereum roadmap
      url: https://ethereum.org/en/roadmap/security/quantum-resistance/
