  - title: What to do now
    text: Keep long-lived holdings on addresses that have never spent, move funds to a fresh address after every spend where keys are already exposed, prefer smart accounts whose signature scheme can be rotated, and ask every proof system and bridge you rely on whether it rests on pairings or on hashes.
