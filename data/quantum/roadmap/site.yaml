  - title: The threat estimate, and the cadence
    text: 'The community’s own estimate of the threat moved forward in 2026. ethereum.org puts a capable machine around the end of the decade at the earliest, citing research that about 1,200 logical qubits would break a 256-bit elliptic-curve key, and notes that NIST expects to deprecate ECDSA by 2030 and disallow it by 2035; the Ethereum Foundation’s post-quantum team wrote in mid 2026 that most roadmaps place it in the early to mid 2030s and that it is not imminent; and at Devcon in November 2026 its researchers gave 2029 as the earliest and 2032 as the expected date, three years earlier than their estimate of two years before.'
    detail: 'One of them had already put the odds at 10% by 2030 and 50% by 2032, in June, after Google’s March result. On the protocol side the bottleneck is now coordination rather than technology: upgrades ship about every ten months, so the earliest protocol-level migration on the current cadence is 2028, sooner if client teams make it the priority. The plan is moving earlier. In June the Foundation’s portal placed post-quantum validator attestations in L*; its strawmap, updated on 2 November 2026, places post-quantum key registrations in Hegotá (2027), post-quantum transactions and proofs in I* (2028), and post-quantum attestations and data sampling, completing a hash-based L1, in J* (2028–29). On 12 November the All Core Devs consensus call discussed how urgent the threat is and the realistic options to accelerate, and many developers favored reprioritizing the roadmap toward post-quantum work; no decision has been recorded. Every date here is a target or an estimate, not a commitment.'
    more:
      title: The Ethereum Foundation’s post-quantum portal
      url: https://pq.ethereum.org/
