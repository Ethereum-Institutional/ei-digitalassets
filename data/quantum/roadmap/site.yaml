  - title: The threat estimate, and the cadence
    text: 'The community’s own estimate of the threat moved forward in 2026. ethereum.org puts a capable machine around the end of the decade at the earliest, citing research that about 1,200 logical qubits would break a 256-bit elliptic-curve key, and notes that NIST expects to deprecate ECDSA by 2030 and disallow it by 2035; the Ethereum Foundation’s post-quantum team wrote in mid 2026 that most roadmaps place it in the early to mid 2030s and that it is not imminent; and at Devcon in November 2026 its researchers gave 2029 as the earliest and 2032 as the expected date, three years earlier than their estimate of two years before. On the protocol side the bottleneck is now coordination rather than technology: upgrades ship about every ten months and the next two are scoped for other work, so the earliest protocol-level migration on the current cadence is 2028, sooner if client teams make it the priority. Every date here is a target or an estimate, not a commitment.'
