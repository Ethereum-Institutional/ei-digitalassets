title: 'Quantum: the two algorithms'
slug: quantum-algorithms
heading:
  text: The two algorithms
  italic: two
intro: 'Only two quantum algorithms matter for cryptography, and they do very different things: one breaks public-key signatures, the other only weakens hashes. A third threat, from machine-generated mathematics rather than quantum hardware, points to the same fix.'
sections:
- title: The two algorithms
  items:
  - title: Shor breaks public-key signatures
    text: 'A large enough quantum computer recovers a private key from its public key. That covers every elliptic-curve scheme a ledger uses: transaction signatures, validator signatures, and the pairings behind data commitments and most SNARKs. No such machine exists yet; the migration must be done before one does.'
    more:
      title: NIST’s post-quantum standards (August 2024)
      url: https://www.nist.gov/news-events/news/2024/08/nist-releases-first-3-finalized-post-quantum-encryption-standards
  - title: Grover only weakens hashes
    text: 'It halves a hash’s effective strength, so 256-bit hashes behave like 128-bit ones: weakened, not broken. Addresses, state trees, hash-based signatures and STARK proofs all survive, which is why the fix is to rebuild on hashes.'
    more:
      title: ethereum.org on quantum resistance
      url: https://ethereum.org/en/roadmap/security/quantum-resistance/
  - title: 'A second threat: cryptanalysis by AI'
    text: 'Since October 2026 Ethereum Foundation researchers have warned that advances in machine-generated mathematics could weaken the assumptions behind elliptic-curve signatures before any quantum computer does, in their worst case within months rather than years; no such attack has been demonstrated, and the warning is a research view, not a finding. The reasoning is that curves have rich structure for a clever attack to use and hashes have as little as cryptography offers, which is why the same fix serves both threats: build on hashes, and verify the implementations formally, which has become far cheaper. Ethereum Institutional reads it as a reason to prefer the schemes with the fewest assumptions and to keep signature schemes replaceable, not as a forecast.'
    more:
      title: Ethereum researcher says AI may break encryption before quantum does (Decrypt, 7 October 2026)
      url: https://decrypt.co/380363/ethereum-researcher-ai-break-encryption-before-quantum
    sources:
    - title: 'Decrypt, Ethereum researcher says AI may break encryption before quantum does (7 October 2026; secondary): the worst case in months not years; bunker mode; curves vulnerable, hashes preferred; no attack demonstrated'
      url: https://decrypt.co/380363/ethereum-researcher-ai-break-encryption-before-quantum
