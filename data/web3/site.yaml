intro: 'How Web3 differs from the web that came before it. The page will set the three generations side by side: Web 1.0, the read-only web of published pages; Web 2.0, the read-and-write web of platforms, where users create the content but the platform owns the accounts, the data and the rules; and Web3, the read, write and own web, where accounts, assets and records live on shared ledgers that no single platform controls, so users and institutions hold them directly and applications compose on each other. We write Web3 rather than Web 3.0 deliberately: the two name the same thing, but the shorter form reflects a definition that is no longer handed down by institutions and standards bodies and is instead formed by the broad community that builds on and uses the web, a sign of how pervasive and important the web has become. The map will place today’s digital asset networks and deployments against those generations.'
