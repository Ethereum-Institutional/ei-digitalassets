heading:
  text: Web3
  italic: Web3
intro: 'Three generations of the web as rings: each keeps what the last could do and adds one thing. Web 1.0 let anyone read, Web 2.0 let anyone write, and Web3 lets anyone own. Each wedge follows one theme across all three, from the use case to who holds a user’s identity and content. In every generation the shift came the same way: open-source technology plus common standards built a new paradigm of adoption.'
# intro_more: shown when the reader clicks the link after the intro; intro_more_label is the link text
intro_more_label: Why Web3 instead of Web 3.0?
intro_more: '“Web 3.0” has been used for two different things. Tim Berners-Lee used it for the Semantic Web, machine-readable linked data under W3C standards. Gavin Wood used it in April 2014 for a decentralised, “post-Snowden” web built on blockchains, in a post titled “ĐApps: What Web 3.0 Looks Like”. For several years the two were conflated and the term caused confusion. The shorter form, Web3, has since come to mean only the decentralised web, and it is what the community that builds on and uses it writes, from ethereum.org to Chris Dixon’s Read Write Own. Ethereum Institutional writes Web3 for that reason: the definition is no longer handed down by an institution or a standards body; it is formed by the broad community of builders and users, a mark of how pervasive the web has become.'
