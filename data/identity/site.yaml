# Identity map: page text and settings. A Venn map (no `kind`) of the three questions an institution answers before
# an asset moves on a shared ledger (who, which key, what may it do), with badges for the mechanisms that answer them
# (badges.yaml), a "Focus on" sidebar of facts (`facets` below, values in each badge's `facts`) and the narrative in
# `sections` under the map. The whole page is public. Draft: not yet checked by a second model or reviewed by counsel.
# Writing rules: US spelling; no em-dashes; quote YAML values that contain ": "; "Ethereum mainnet" for the chain;
# third person ("Ethereum Institutional"), never "we".

title: Identity
slug: identity
eyebrow: Ethereum Institutional · Research
heading:
  text: Identity
  italic: Identity
intro: 'Who is behind an address, and how an institution carries its know-your-customer checks onto a shared ledger: the mechanisms that answer who a party is, whether the key is theirs, and what it may do. Click a mechanism for what it does; Focus on picks out the ones that fit your needs.'
intro_more: 'A shared ledger lets any two keys transact, and that openness is what makes it a settlement layer anyone can build on. Institutions rarely have that freedom: most are required to know their counterparties before value moves. Ethereum mainnet supports both, because a permissioned token or protocol is a contract and a contract can check before it acts. There is no single way to do so: several standards carry know-your-customer, know-your-business and, newest, know-your-agent checks onto the ledger, and people, institutions and software agents each bring their own requirements and their own wish list for how identity is managed. National and sector digital identity schemes are the closest relatives, the strongest source of verified identity there is, drawn below the ledger box because their reach stops at the relying party, with one now anchored on Ethereum. Every mechanism on the map answers one of three questions before an asset moves: who this party is, whether the key acting is theirs, and what it may do. The checks themselves run off the ledger, as they always have; what the ledger changes is where their result lives and who can act on it: a list the issuer keeps, an attestation anyone can read, or a credential the holder presents and proves without revealing. That choice decides what the public can infer, how a permission is revoked, and whether a smart contract, which is itself only an address, can take part at all. Rights and obligations belong to people and organizations; a wallet, an address, a contract or an agent has none, so every mechanism here ties the thing that acts to the party answerable for it.'
intro_more_label: 'Why identity on a shared ledger?'
panel_default:
  title: Identity on a shared ledger
  text: Hover over a circle or a mechanism to read what it establishes; click to pin it here with all its facts. Use Focus on to pick what matters to you.
badge: pill
sections_collapsed: true   # items under the map fold behind their titles (owner, 10 November 2026)
pill_scale: 1.1
facts_as_of: '2026-11-10'
legend:
- kind: pill
  color: '#627eea'
  text: 'On an Ethereum chain, or an Ethereum standard'
- kind: pill
  color: '#6b6760'
  text: 'Off the ledger: feeds the ledger through a mechanism in the overlaps'
# Facets: the "Focus on" sidebar. Each mechanism (badges.yaml `facts`) gives one or more values per facet: `in`
# (it has this), `part` (partly), a `note`. Readers pick values; within a facet any picked value matches, across
# facets all must. `na` (does not apply) and `unknown` never match. `neutral: true` marks a facet readers value
# differently (what the ledger reveals is a privacy cost to one reader and an audit trail to another).
facets_title: Focus on
facets_noun: mechanism
facets_help: Pick what matters to you. Mechanisms that have all of it stay highlighted; dashed means partly.
facet_presets:
- id: issuer
  label: A regulated token issuer's needs
  text: 'Verified people and entities, anchored in a sovereign or licensed source, checked by the token contract itself at transfer time, with revocation that can be audited, and nothing revealed to the public beyond the fact that a proof passed. Only the zero-knowledge credential designs give all of it today; allowlists and attestations come close but publish membership, which reveals counterparties. None of them is post-quantum today; the nearest is a contract account whose verifier can change.'
  require: [subject, checked]
  picks:
    subject: [person, org]
    anchor: [sovereign, licensed]
    checked: [onchain]
    reveals: [proof]
    revocation: [history, list]
    pq: [pq]
