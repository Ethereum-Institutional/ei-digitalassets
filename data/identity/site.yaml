# Identity map: page text and settings. A Venn map (no `kind`) of the three questions an institution answers before
# an asset moves on a shared ledger (who, which key, what may it do), with badges for the mechanisms that answer them
# (badges.yaml), a "Focus on" sidebar of facts (`facets` below, values in each badge's `facts`) and the narrative in
# `sections` under the map. The whole page is public. Draft: not yet checked by a second model or reviewed by counsel.
# Writing rules: US spelling; no em-dashes; quote YAML values that contain ": "; "Ethereum mainnet" for the chain;
# third person ("Ethereum Institutional"), never "we".

title: Identity
slug: identity
eyebrow: Ethereum Institutional · Research
heading:
  text: Identity
  italic: Identity
intro: 'A shared ledger knows keys, not people. Native cryptocurrencies are bearer assets for that reason, and the same ledger lets smart contracts build tokens and applications that admit only verified people, entities and agents. The map shows the mechanisms that carry an institution''s existing checks onto the ledger, by the question each one answers: who this party is, whether the key acting is theirs, and what it may do.'
intro_more: 'Every mechanism here supplements the know-your-customer, know-your-business and screening processes an institution already runs; none replaces them. What changes with a ledger is where the result of those processes lives and who can act on it: a list the issuer keeps, an attestation anyone can read, or a credential the customer presents and proves without revealing. The choice decides what the public can infer, how a permission is revoked, and whether a smart contract, which is itself only an address, can take part at all. This is a draft for review: placements and facts are Ethereum Institutional''s reading as of 6 November 2026 and will change.'
