facets:
- id: subject
  group: subject
  label: Subject
  help: 'The kind of party the mechanism identifies: a natural person (KYC), a legal entity and those who act for it (KYB), or a software agent or device and its principal (KYA).'
  values:
  - { id: person, label: A person }
  - { id: org, label: An organization }
  - { id: agent, label: An agent or device }
- id: anchor
  group: trust
  label: Trust anchor
  help: 'Where the trust ultimately comes from. A self-sovereign or decentralized design can still anchor in a sovereign registry or a licensed issuer; what it removes is the need to ask a registry for permission to hold the identifier.'
  values:
  - { id: sovereign, label: A government registry or national eID }
  - { id: licensed, label: A regulated or qualified issuer }
  - { id: commercial, label: A company''s own check or attestation }
  - { id: dns, label: A web domain (DNS and TLS) }
  - { id: selfkey, label: The key itself (self-asserted) }
- id: revocation
  group: trust
  label: Revocation
  help: 'How a verification is withdrawn, and whether the withdrawal leaves a record a third party can audit.'
  values:
  - { id: history, label: Recorded on the ledger, with history }
  - { id: list, label: An issuer-held list or registry, checked at use }
  - { id: replace, label: The record is replaced, with no history }
  - { id: expiry, label: Expiry only }
- id: checked
  group: ledger
  label: Checked by a contract
  help: 'Whether a smart contract can verify the mechanism itself at transfer time, whether an operator writes a conclusion to the ledger for contracts to read, or whether it stays off the ledger entirely.'
  values:
  - { id: onchain, label: 'Yes, a contract verifies it' }
  - { id: written, label: 'An operator writes the result on chain' }
  - { id: offchain, label: 'No, it stays off the ledger' }
- id: reveals
  group: ledger
  label: What the public ledger shows
  neutral: true
  help: 'What an observer of the public ledger learns. Membership (that an address passed a check) reveals counterparty relationships once the admitted addresses transact; a proof reveals only that a statement verified.'
  values:
  - { id: identity, label: The party''s name or identifier }
  - { id: membership, label: That the address passed a check, and whose }
  - { id: proof, label: Only that a proof verified }
  - { id: nothing, label: Nothing; it stays off the ledger }
- id: pq
  group: crypto
  label: Post-quantum
  help: 'Whether the mechanism''s signatures or proofs would survive a cryptographically relevant quantum computer. No mechanism on this map states a post-quantum position today; the readings say where the classical link is, and which mechanisms can swap their verifier without a protocol change. The Quantum pages cover the timelines.'
  values:
