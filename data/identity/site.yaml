facet_presets:
- id: issuer
  label: A regulated token issuer's needs
  text: 'Verified people and entities, anchored in a sovereign or licensed source, checked by the token contract itself at transfer time, with revocation that can be audited, and nothing revealed to the public beyond the fact that a proof passed. Only the zero-knowledge credential designs give all of it today; allowlists and attestations come close but publish membership, which reveals counterparties. None of them is post-quantum today; the nearest is a contract account whose verifier can change.'
