sections:
- title: Bearer assets and permissioned tokens
  text: 'The starting point is what a ledger can and cannot know. Everything on the map builds on one side of that line or the other.'
  items:
  - title: Native cryptocurrencies are permissionless bearer assets
    text: 'ETH, BTC and the other native assets belong to whoever controls the key. The protocol cannot know who that is, has no issuer who could be asked, and treats every valid signature alike. That is not a gap to be fixed; it is what makes the asset a bearer instrument and the network open. Identity, where an institution needs it, is added by what runs on top.'
  - title: Smart contracts can admit only certified parties
    text: 'A token or an application is a contract, and a contract can check before it acts. ERC-3643 passes a transfer only if the receiver is registered in an identity registry with claims from issuers the token trusts; ERC-7943 gives any token standard the same questions (canSend, canReceive, canTransfer) with frozen balances and forced transfers for enforcement. On the same ledger as the bearer assets, an issuer can therefore run a token open only to verified people, entities and, through the mechanisms in the center of the map, agents.'
    sources:
    - { title: 'ERC-3643, T-REX Token for Regulated Exchanges (Final)', url: 'https://eips.ethereum.org/EIPS/eip-3643', checked: '2026-11-06' }
    - { title: 'ERC-7943, uRWA Universal Real World Asset Interface (Final)', url: 'https://eips.ethereum.org/EIPS/eip-7943', checked: '2026-11-06' }
  - title: Most stablecoins are bearer assets with a blocklist
    text: 'USDC and USDT move between any addresses, like the native assets, but their issuers keep a blocklist at the contract: Circle''s terms let it block addresses it associates with illegal activity and freeze on a legal order, and Tether reported more than USD 4.4 billion frozen in all by April 2026, in coordination with OFAC and law enforcement. Screening data from blockchain analytics providers (Chainalysis, whose attribution a USENIX Security 2025 study tested against seized services, and others) lets issuers, exchanges and applications refuse transfers that touch sanctioned or high-risk clusters, whoever holds the key. The result is an open asset with sanctions and financial-crime controls, without any holder being verified.'
    sources:
    - { title: 'Circle, USDC risk factors (blocked addresses, freezing, legal orders)', url: 'https://www.circle.com/legal/usdc-risk-factors', checked: '2026-11-06' }
    - { title: 'The Block, Tether freezes 344 million USDT on Tron (23 April 2026; cumulative totals as stated by Tether)', url: 'https://www.theblock.co/post/398599/tether-freezes-344-million-in-usdt-on-tron-after-wallets-flagged-by-u-s-authorities', checked: '2026-11-06' }
    - { title: 'Lubbertsen, van Eeten and van Wegberg, Ghost Clusters (USENIX Security 2025)', url: 'https://www.usenix.org/conference/usenixsecurity25/presentation/lubbertsen', checked: '2026-11-06' }
  - title: Some regimes want every holder known
    text: 'Hong Kong''s AML/CFT guideline for licensed stablecoin issuers, in force since 1 August 2025, sets the opposite default: unless a licensee shows the HKMA that its other risk-mitigating measures are effective, the identity of each individual holder should be verified, by the issuer, a supervised institution or a reliable third party, and the issuer may keep a list of wallet addresses that have passed its controls. The HKMA says it will keep reassessing the approach. A stablecoin built to that default is a permissioned token at the on-ramp, the off-ramp and every wallet in between, and sits in the same place on this map as a tokenized fund.'
    sources:
    - { title: 'HKMA, Consultation conclusions on AML/CFT requirements for regulated stablecoin activities, with the Guideline (July and August 2025; paragraphs 2.18, 4.39, 4.40, 5.11)', url: 'https://www.hkma.gov.hk/media/eng/doc/key-functions/ifc/stablecoin-issuers/Consultation_conclusions_aml_stablecoin.pdf', checked: '2026-11-06' }
    - { title: 'Ledger Insights, Hong Kong rules require identity of every stablecoin holder (29 July 2025)', url: 'https://www.ledgerinsights.com/hong-kong-stablecoin-rules-require-holder-ids/', checked: '2026-11-06' }
  - title: Permission changes what a token can do
    text: 'A smart contract is itself an address. A lending pool, an exchange contract or an escrow cannot hold or receive a permissioned token unless that address is admitted, and an ERC-3643 transfer checks the receiver''s registration whether the receiver is a person or a contract. A token that insists on known holders is therefore less composable than a bearer asset: every application it should work with must be onboarded as a participant, and every application it has not been onboarded to is closed to it. That is a design choice with a cost, and comparisons of "programmable money" should say which side of the line each token sits on.'
    sources:
    - { title: 'ERC-3643, T-REX Token for Regulated Exchanges (isVerified checked on the receiver)', url: 'https://eips.ethereum.org/EIPS/eip-3643', checked: '2026-11-06' }
- title: Three questions, three circles
  text: 'The map separates questions that are often run together. Each mechanism answers one of them, or two, or in the center all three.'
  items:
  - title: Who (KYC, KYB, KYA)
    text: 'Know your customer verifies a natural person; know your business verifies a legal entity and the people entitled to act for it; know your agent, the newest, verifies a software agent or device and the principal responsible for it. All three are run off the ledger, against documents, registries and the sovereign schemes on the left of the map, and all three produce a conclusion that then has to reach an address.'
    sources:
    - { title: 'Sumsub, From AI agents to Know Your Agent (28 January 2026; vendor)', url: 'https://sumsub.com/blog/know-your-agent/', checked: '2026-11-06' }
  - title: Which key (proof of control)
    text: 'A verified party and an address are joined by a signature: the party signs a message with the key, and the institution records that this address is theirs. Everything on the right of the map is about making that signature safe to rely on, for ordinary accounts, for smart accounts and for devices.'
  - title: What (permission)
    text: 'A contract or an issuer decides whether this address may hold or move this asset: a blocklist, an allowlist, or a check at transfer time against a credential or attestation. Permission can exist without identity (a blocklist) and identity without permission (a known customer who is not eligible), which is why the questions stay apart.'
- title: Carrying a check onto the ledger
  text: 'Identity is verified off the ledger. What differs between designs is how its result arrives, and what each way reveals.'
  items:
  - title: Blocklist, allowlist, attestation, proof
    text: 'A blocklist names the excluded and admits everyone else; an allowlist names the admitted and excludes everyone else; an attestation is a signed statement about an address that any contract may read and gate on, with the attester as the thing to trust; a credential proof lets the holder show a contract that a trusted issuer vouches for them, without the contract holding any list. The first three are mapped from an institution''s records to addresses; the fourth is presented by the customer. Verifiable credentials are designed for the fourth path, and ERC-3643 and the attestation services combine the second and third. The same attestation pattern is being proposed for assets rather than parties: ERC-8320 (Draft, July 2026) is a registry of signed, versioned claims about a token (what it is, what it is worth, what backs it, its compliance and risk), proposed and validated by different parties, for the contracts and investors that read them.'
    sources:
    - { title: 'W3C, Verifiable Credentials Data Model v2.0 (Recommendation, 15 May 2025)', url: 'https://www.w3.org/TR/vc-data-model-2.0/', checked: '2026-11-06' }
    - { title: 'ERC-8320, Regulated Asset Claim (Draft, created 3 July 2026): a registry of signed, versioned claims about an asset (identity, valuation, mandate, terms, compliance, backing, event, risk) with a maker-checker lifecycle; complementary to ERC-7943 and ERC-3643', url: 'https://eips.ethereum.org/EIPS/eip-8320', checked: '2026-11-09' }
    - { title: 'Ethereum Attestation Service, eas-contracts', url: 'https://github.com/ethereum-attestation-service/eas-contracts', checked: '2026-11-06' }
  - title: Allowlists reveal counterparties
    text: 'The addresses on an allowlist are public, and so are the transfers among them. Anyone can read who an issuer''s investors transact with, when and how much, even though no name is on the ledger; a Privacy map design hides the amounts or the parties, but not membership of the list. Attestations reveal that an address passed a check and whose; a zero-knowledge proof reveals only that the check passed. Which of these is acceptable is a question for each institution''s privacy and conduct rules, and the Focus on sidebar lets a reader filter by it.'
  - title: Custody does not hide you
    text: 'Addresses behind an exchange or a custodian are attributed by the same heuristics that attribute everything else: inputs spent together belong to one party, change returns to the sender, services hand out one-time deposit addresses, and a cluster tied to an exchange resolves to a person by asking the exchange. The USENIX Security 2025 evaluation of the market leader found its attribution a reliable lower bound with under 0.5 percent false positives. An institution should assume that its own addresses, custodial or not, are known to counterparties and competitors who look.'
    sources:
    - { title: 'Lubbertsen, van Eeten and van Wegberg, Ghost Clusters: Evaluating Attribution of Illicit Services through Cryptocurrency Tracing (USENIX Security 2025)', url: 'https://www.usenix.org/conference/usenixsecurity25/presentation/lubbertsen', checked: '2026-11-06' }
    - { title: 'Deuber et al., Argumentation Schemes for Blockchain Deanonymization (arXiv, 2023)', url: 'https://arxiv.org/pdf/2305.16883', checked: '2026-11-06' }
    - { title: 'Kappos et al., How to Peel a Million (arXiv, 2022)', url: 'https://arxiv.org/pdf/2205.13882.pdf', checked: '2026-11-06' }
- title: Sovereign identity schemes and how far they reach
  text: 'National schemes are the strongest source of verified identity an institution can use. On this map they sit in the verified identity circle alone, because what they hand over stops at the relying party.'
  items:
  - title: What they give
    text: 'Singpass (Myinfo) releases government-verified personal data to an approved business with the user''s consent and is used by Singapore''s banks for KYC; UAE PASS authenticates verified individuals and lets them sign, with an eSeal and a verification API for organizations; iAM Smart offers Hong Kong organizations authentication, legally effective digital signing and form filling from stored personal data. Each is an assertion to the relying party at the time of the transaction: an API response, a signature, a session that expires.'
    sources:
    - { title: 'GovTech Singapore, Myinfo: how it works', url: 'https://developer.tech.gov.sg/products/categories/digital-identity/myinfo/how-it-works', checked: '2026-11-06' }
    - { title: 'UAE PASS developer FAQ', url: 'https://docs.uaepass.ae/faq', checked: '2026-11-06' }
    - { title: 'Digital Policy Office, Hong Kong: iAM Smart for organisations', url: 'https://www.digitalpolicy.gov.hk/en/our_work/data_governance/common_data_platforms/iam_smart/organisations', checked: '2026-11-06' }
  - title: Where they stop
    text: 'None of them is anchored on a shared ledger: a contract cannot call Singpass, a token cannot check an iAM Smart signature, and a revocation in the scheme is invisible to anything on chain. The institution that used the scheme carries its own conclusion to the ledger and takes responsibility for it, and the scheme''s reach ends at its jurisdiction. The EU wallet changes the form, a credential the holder carries with selective disclosure, but not the boundary: the relying party verifies the presentation, and it is due in every member state by about 24 December 2026, with one national wallet in production in October 2026. Zero-knowledge passport proofs are the exception on the map: the state''s own signature on the chip is verified by a contract, with the limits that come with government PKI. Bhutan shows the exception: its National Digital Identity anchors decentralized identifiers to Ethereum and issues verifiable credentials and signatures on it, so a credential can be checked on the ledger while the register stays sovereign. The Ethereum Foundation’s primer for governments (July 2026) puts it the same way: decentralized identifiers and verifiable credentials are W3C standards, and the ledger is a public, censorship-resistant registry for them.'
    sources:
    - { title: 'Bhutan NDI, Bhutan Adopts Ethereum for National Identity (13 October 2025; decentralized identifiers anchored to Ethereum, verifiable credentials and digital signing on Ethereum, migration planned by early 2026)', url: 'https://www.bhutanndi.com/resources/news/bhutan-adopts-ethereum-for-national-identity-a-new-chapter-in-digital', checked: '2026-11-10' }
    - { title: 'Ethereum Foundation, Ethereum Basics for Governments and Institutions (ethereum.org report, July 2026; the Foundation’s own positions; comparative figures as of March 2026 from OpenZeppelin’s assessment)', url: 'https://ethereum.org/reports/basics-for-governments-institutions.pdf', checked: '2026-11-10' }
    - { title: 'Open ID Europe, EUDI Wallet rollout timeline (status October 2026)', url: 'https://www.openideurope.eu/digital-identity/eudi-wallet-timeline/', checked: '2026-11-06' }
    - { title: 'Safe Research, ZK Passport: where are we now? (4 September 2025)', url: 'https://safefoundation.org/blog/safe-research-zk-passport-where-are-we-now', checked: '2026-11-06' }
  - title: Organizations
    text: 'For legal entities the equivalent anchor is the LEI, and the vLEI makes it a credential: Qualified vLEI Issuers under GLEIF''s framework issue credentials for an entity and for a person''s official role in it, each traceable to the entity''s record in the Global LEI Index, standardized in ISO 17442-3 (2024). It is a KYB credential with a regulated root of trust that is not itself an EVM mechanism, so a verifier or an attestation is still needed on the ledger side.'
    sources:
    - { title: 'GLEIF, The verifiable LEI (vLEI)', url: 'https://www.gleif.org/en/organizational-identity/lei-vlei/the-verifiable-lei-vlei', checked: '2026-11-06' }
- title: Decentralized identity, self-sovereign identity, and the state
  text: 'Two terms that are often read as a rejection of government identity. Neither is.'
  items:
  - title: What the words mean
    text: 'A decentralized identifier (DID) is an identifier its controller can create and prove control of without asking a registry for permission; it resolves to a document of keys and endpoints, and it carries no identity of its own. Self-sovereign identity adds the holder''s control over credentials: the holder keeps them and decides what to present. Neither says anything about who may issue a credential. A European Commission discussion paper on eIDAS-supported SSI proposed exactly the opposite of bypassing the state: binding a DID to a qualified certificate, so that a government-recognized trust service becomes the anchor a verifier can check for itself.'
    sources:
    - { title: 'W3C, Decentralized Identifiers (DIDs) v1.0 (Recommendation, 19 July 2022)', url: 'https://www.w3.org/TR/did-1.0/', checked: '2026-11-06' }
    - { title: 'European Commission (Futurium), eIDAS supported self-sovereign identity (discussion paper)', url: 'https://ec.europa.eu/futurium/en/system/files/ged/eidas_supported_ssi_may_2019_0.pdf', checked: '2026-11-06' }
  - title: Trust anchors are a choice
    text: 'A credential is as good as its issuer. The designs on this map anchor in a sovereign registry (passport proofs, the EU wallet), a licensed or qualified issuer (vLEI, a bank''s attestation), a company''s own check (Coinbase Verifications), a web domain (did:web) or nothing but the key (a bare DID, an ENS name). Self-sovereign designs with sovereign anchors are the ones institutions can use: the holder controls the presentation, the state or a licensed issuer stands behind the claim, and the ledger verifies the proof.'
  - title: DNS is a weak anchor
    text: 'Anchoring an identifier in a web domain borrows the domain''s reputation, and its specification says what that costs: resolution depends on DNS and a TLS certificate, DNS carries interception and spoofing risks, updates replace the document with no history unless the operator keeps one, no authorization for writing the document is defined, and a registrar or DNS provider can withdraw the identifier by taking the domain. A ledger registry keeps every issuance and revocation and cannot be withdrawn by a registrar; ENS shows the difference, with every record change a transaction, and can still import a DNS name through DNSSEC where the domain is the identity an institution wants to show.'
    sources:
    - { title: 'W3C CCG, did:web Method Specification (security and privacy considerations)', url: 'https://w3c-ccg.github.io/did-method-web/', checked: '2026-11-06' }
    - { title: 'ENS documentation, the ENS protocol', url: 'https://docs.ens.domains/learn/protocol', checked: '2026-11-06' }
- title: Signatures are part of identity
  text: 'Every mechanism on the map ends in a signature. Getting the signed message right is where wallet verification most often goes wrong.'
  items:
  - title: Typed data and sign-in
    text: 'EIP-712 lets a wallet show the user a structured message and binds the signature to a domain (name, version, chain id, verifying contract), so a signature for one application or chain is not accepted by another. It provides no replay protection of its own; that is left to the application. EIP-4361, Sign-In with Ethereum, is the sign-in message built on these rules: the requesting domain (which the wallet checks against the origin), the address, a chain id, a random nonce per session, an issued-at time and an optional expiry, with ERC-1271 for smart accounts.'
    sources:
    - { title: 'EIP-712, Typed structured data hashing and signing (Final)', url: 'https://eips.ethereum.org/EIPS/eip-712', checked: '2026-11-06' }
    - { title: 'EIP-4361, Sign-In with Ethereum (Final)', url: 'https://eips.ethereum.org/EIPS/eip-4361', checked: '2026-11-06' }
  - title: What a signed verification message should carry
    text: 'Ethereum Institutional''s reading of the two standards, as a checklist for linking a wallet to a verified customer: a typed EIP-712 message rather than a raw hash, so the user sees what they sign; a nonce issued by the institution, used once and stored; an expiry measured in minutes; the chain id and, where a contract will check it, the verifying contract; a statement of purpose in the message itself, so a sign-in signature cannot be replayed as an approval; verification through ERC-1271 for smart accounts, repeated when the account''s signers change; and never a request to sign something the institution could reuse to move funds.'
    sources:
    - { title: 'EIP-712 (replay protection is left to the application)', url: 'https://eips.ethereum.org/EIPS/eip-712', checked: '2026-11-06' }
    - { title: 'EIP-4361 (nonce, domain binding, expiration, ERC-1271)', url: 'https://eips.ethereum.org/EIPS/eip-4361', checked: '2026-11-06' }
    - { title: 'ERC-1271, Standard Signature Validation Method for Contracts (Final)', url: 'https://eips.ethereum.org/EIPS/eip-1271', checked: '2026-11-06' }
  - title: Smart accounts and devices
    text: 'ERC-1271 and ERC-6492 let an account that is a contract decide what counts as its signature, including one that is not deployed yet; ERC-4337 and EIP-7702 make such accounts practical for any user. Passkeys (WebAuthn, a W3C Recommendation at Level 3 since August 2026) give people device-bound, origin-scoped keys that a smart account can accept. Proof of control becomes a policy the institution writes, which is the right place for custody rules; the cost is that a signature''s validity can change with the account''s state.'
    sources:
    - { title: 'ERC-6492, Signature Validation for Predeploy Contracts (Final)', url: 'https://eips.ethereum.org/EIPS/eip-6492', checked: '2026-11-06' }
    - { title: 'ERC-4337, Account Abstraction Using Alt Mempool (Final)', url: 'https://eips.ethereum.org/EIPS/eip-4337', checked: '2026-11-06' }
    - { title: 'EIP-7702, Set Code for EOAs (Final)', url: 'https://eips.ethereum.org/EIPS/eip-7702', checked: '2026-11-06' }
    - { title: 'W3C, Web Authentication Level 3 (Recommendation, 25 August 2026)', url: 'https://www.w3.org/TR/webauthn-3/', checked: '2026-11-06' }
  - title: What a quantum computer breaks here
    text: 'Every mechanism on this map ends in a classical signature or proof: the chip signature in a passport, a passkey, an issuer''s claim, the key behind an address. A cryptographically relevant quantum computer derives the private key from the public one, and a public ledger publishes the public key of every address that has ever signed. For identity that means three exposures: a forged proof of control that links a customer to an address they never held; a forged issuer or document signature that admits a party no credential covered; and the administrator keys behind allowlists, blocklists and registries. No mechanism here states a post-quantum position today (the Post-quantum facet under Focus on reads each one). The structural hedge is a contract account: under ERC-1271 the account decides what counts as its signature, so it can adopt a post-quantum verifier once Ethereum mainnet makes one affordable, which is where the roadmap on the Quantum pages is heading. Ethereum Institutional''s reading: put identity keys and issuer signing keys on the same inventory as custody keys, and prefer mechanisms whose verification rule a contract can replace over ones fixed in a protocol or a national scheme.'
    more: { title: 'Quantum, what an institution does now', url: '../quantum/institution/' }
    sources:
    - { title: 'ethereum.org, Quantum resistance (SNARKs, KZG and STARKs)', url: 'https://ethereum.org/en/roadmap/future-proofing/quantum-resistance/', checked: '2026-10-26' }
    - { title: 'Ethereum Foundation, Post-Quantum Ethereum portal (updated 27 June 2026): not imminent, most roadmaps early to mid 2030s; Execution, Consensus and Data layers; leanXMSS, leanSig, leanVM, leanSpec; SPHINCS+ a candidate for the execution layer; cryptographic agility; L1 upgrades by 2029; a USD 20 million formal verification project', url: 'https://pq.ethereum.org/', checked: '2026-11-06' }
    - { title: 'Cointelegraph, Ethereum can quantum-proof accounts for 7 cents (14 June 2026; secondary): SPHINCS-, an EVM-optimized family derived from SPHINCS+, from the Ethereum Foundation Kohaku lead, without a hard fork; a bridge to leanSPHINCS with aggregation', url: 'https://cointelegraph.com/news/ethereum-quantum-proof-accounts-7-cents-researcher', checked: '2026-11-06' }
    - { title: 'ERC-1271, Standard Signature Validation Method for Contracts (Final)', url: 'https://eips.ethereum.org/EIPS/eip-1271', checked: '2026-11-06' }
- title: Agents and devices
  text: 'The newest party on the ledger is software acting for someone. The ledger treats its key like any other; the institution cannot.'
  items:
  - title: Know your agent
    text: 'Two vendor framings from 2026 describe the same shape: an agent gets its own revocable, time-bound identity; it is linked to a person or organization verified through KYC or KYB; and a mandate (permitted actions, limits, expiry) is enforced on each request, with the principal re-authenticating for anything outside it. The agent is the third subject on this map, after persons and organizations, and the principal behind it is the one the institution actually knows.'
    sources:
    - { title: 'Sumsub, From AI agents to Know Your Agent (28 January 2026; vendor)', url: 'https://sumsub.com/blog/know-your-agent/', checked: '2026-11-06' }
    - { title: 'Shufti, Know Your Agent press release (28 October 2026; vendor)', url: 'https://shuftipro.com/press-release/shufti-launches-know-your-agent-to-verify-ai-agents/', checked: '2026-11-06' }
  - title: On the ledger
    text: 'ERC-8004 gives an agent a persistent on-chain identity (an ERC-721 token pointing at a registration file), a reputation record and hooks for independent validation; its core registries went live on Ethereum mainnet on 29 January 2026 and the standard remains a Draft. It records the owner''s address, not who the owner is. An institutional design pairs it with a verified principal from the left of the map and a smart account whose validation rule is the mandate, so that identity, key and permission are checked together. ERC-8226 (Draft, April 2026) proposes that mandate layer: a cleared principal grants the agent a scoped, time-bounded and capped mandate per asset, and the token checks it at execution, beside its own eligibility rule and the agent''s registry entry. The Scenarios map carries the payment side (x402, ERC-8004, EIP-3009).'
    sources:
    - { title: 'ERC-8004, Trustless Agents (Draft)', url: 'https://eips.ethereum.org/EIPS/eip-8004', checked: '2026-11-06' }
    - { title: 'ERC-8226, Regulated Agent Mandate (Draft, created 12 April 2026): a KYC-cleared principal grants an agent a scoped, time-bounded, capped mandate per asset, checked by the token at execution; names ERC-8004, ERC-7943 and ERC-3643 as the other layers', url: 'https://eips.ethereum.org/EIPS/eip-8226', checked: '2026-11-09' }
    - { title: 'Forbes, ERC-8004 on mainnet (5 February 2026)', url: 'https://www.forbes.com/sites/digital-assets/2026/02/05/ai-agents-gain-trust-via-ethereum-erc-8004-on-mainnet/', checked: '2026-11-06' }
- title: AML, financial crime and the travel rule
  text: 'Identity on a ledger is shaped by rules written for institutions, not for contracts, and those rules are still moving. Regulatory treatment belongs to the Taxonomy''s lenses; this section names what bears on architecture.'
  items:
  - title: The travel rule
    text: 'FATF Recommendation 16, revised in June 2025, requires the institution sending a transfer to carry originator and beneficiary information with it and the receiving institution to check it; FATF''s virtual asset guidance applies the same duty to virtual asset service providers, with a USD or EUR 1,000 threshold below which less is required and which a jurisdiction may set lower. The United States applies its own rule to transmittals of USD 3,000 or more. The information travels between providers, off the ledger, in a common message format. For a self-hosted wallet there is no counterparty provider, and the FATF guidance lets a jurisdiction require the provider to verify that its customer controls the wallet, with a signed message or a micro-transaction. The identities exchanged here never touch the ledger, which is why the travel rule sits in the verified identity circle and the control proof outside it.'
    sources:
    - { title: 'FATF, Revised Recommendation 16 on payment transparency (June 2025), applied to virtual asset transfers through Recommendation 15', url: 'https://www.fatf-gafi.org/en/publications/Fatfrecommendations/update-Recommendation-16-payment-transparency-june-2025.html', checked: '2026-10-27' }
    - { title: 'FATF, Updated Guidance for a Risk-Based Approach to Virtual Assets and Virtual Asset Service Providers (October 2021)', url: 'https://www.fatf-gafi.org/en/publications/Fatfrecommendations/Guidance-rba-virtual-assets-2021.html', checked: '2026-10-27' }
    - { title: '31 CFR 1010.410(f), the US travel rule for transmittals of funds of USD 3,000 or more (Cornell LII copy of the e-CFR)', url: 'https://www.law.cornell.edu/cfr/text/31/1010.410', checked: '2026-11-09' }
  - title: Rules that mandate an architecture
    text: 'Some obligations decide the design before any technology choice. In the United States the GENIUS Act of July 2025 brings permitted payment stablecoin issuers within the Bank Secrecy Act, and the FinCEN and OFAC proposal of April 2026 would require a written AML program, suspicious activity reporting, a sanctions program able to block, freeze and reject transactions, and the technical capability to seize, freeze, burn or prevent transfers of the issuer''s stablecoin on a lawful order, where the stablecoin or wallet can be identified with reasonable particularity. An issuer that must be able to do that keeps a control at the contract, which is the blocklist on this map. Hong Kong''s default of a verified holder leads to the allowlist. Both are architectures a rule chose.'
    sources:
    - { title: 'WilmerHale, Treasury announces proposed rule to implement the GENIUS Act''s requirements to counter illicit finance (20 April 2026; comments due 9 June 2026)', url: 'https://www.wilmerhale.com/en/insights/client-alerts/20260420-treasury-announces-proposed-rule-to-implement-the-genius-acts-requirements-to-counter-illicit-finance', checked: '2026-11-06' }
    - { title: 'HKMA, Consultation conclusions on AML/CFT requirements for regulated stablecoin activities (July 2025)', url: 'https://www.hkma.gov.hk/media/eng/doc/key-functions/ifc/stablecoin-issuers/Consultation_conclusions_aml_stablecoin.pdf', checked: '2026-11-06' }
  - title: An evolution, not a settled state
    text: 'The FinCEN and OFAC rule was a proposal with comments due 9 June 2026; the HKMA says it will reassess its holder-verification default; the EU wallet''s first deadline falls in December 2026 with most states not yet in production; FATF''s revised Recommendation 16 takes effect by the end of 2030; ERC-8004 is a Draft. An institution building today should expect the mechanisms on this map to be asked to change, and prefer designs where the policy (who is admitted, what is revealed) can change without the token.'
    sources:
    - { title: 'WilmerHale, Treasury proposed rule under the GENIUS Act (20 April 2026)', url: 'https://www.wilmerhale.com/en/insights/client-alerts/20260420-treasury-announces-proposed-rule-to-implement-the-genius-acts-requirements-to-counter-illicit-finance', checked: '2026-11-06' }
    - { title: 'Open ID Europe, EUDI Wallet rollout timeline (status October 2026)', url: 'https://www.openideurope.eu/digital-identity/eudi-wallet-timeline/', checked: '2026-11-06' }
    - { title: 'FATF, Revised Recommendation 16 on payment transparency (June 2025), applied to virtual asset transfers through Recommendation 15', url: 'https://www.fatf-gafi.org/en/publications/Fatfrecommendations/update-Recommendation-16-payment-transparency-june-2025.html', checked: '2026-10-27' }
    - { title: 'CSSF (Luxembourg), Newsletter No 295 (August 2025): the amended Recommendation 16 and its Interpretive Note come into effect by the end of 2030', url: 'https://www.cssf.lu/wp-content/uploads/newsletter295.pdf', checked: '2026-11-09' }
- title: Choosing providers and standards
  text: 'Ethereum Institutional does not recommend vendors. These are the kinds of provider an institution will meet, with examples, and the questions that separate them.'
  items:
  - title: Supplement, do not replace
    text: 'Every provider on this map extends an institution''s existing KYC, KYB and screening to addresses and ledgers; none replaces the obligations or the records. The question to ask a credential or attestation provider is therefore not whether it will run the institution''s KYC, but how the institution''s conclusion reaches the ledger, what the public learns from it, how it is revoked, and what happens to it if the provider disappears.'
  - title: Kinds of provider
    text: 'Zero-knowledge credential stacks that verify on an EVM chain (Privado ID and Billions Network; the passport-proof projects ZKPassport, Rarimo and Self); attestation services and the institutions that attest on them (the Ethereum Attestation Service; Coinbase Verifications on Base); permissioned-token platforms with their own registries (ERC-3643 implementations; Securitize for BlackRock''s BUIDL); verification providers extending KYC and KYB to agents (Sumsub, Shufti); and blockchain analytics for screening (Chainalysis and others). Claims by any of them are vendor-stated on this page unless an independent source is cited.'
    sources:
    - { title: 'Safe Research, ZK Passport: where are we now? (4 September 2025)', url: 'https://safefoundation.org/blog/safe-research-zk-passport-where-are-we-now', checked: '2026-11-06' }
    - { title: 'Coinbase Developer Platform, Verifications: attestations', url: 'https://docs.cdp.coinbase.com/verifications/introduction/attestations', checked: '2026-11-06' }
    - { title: 'Eco, BUIDL deep dive (secondary source, 6 October 2026)', url: 'https://eco.com/support/en/articles/15254013-buidl-deep-dive-2026', checked: '2026-11-06' }
  - title: Questions that separate them
    text: 'Where is the trust anchor, and is it one a regulator in the institution''s jurisdiction recognizes? Can a contract verify the result itself, or does an operator write it? What does the public ledger show, and does an allowlist expose counterparties the institution must keep confidential? How is a verification revoked, and is the revocation auditable with history? Which standards does it implement (W3C credentials and DIDs, OpenID4VC and HAIP, ISO mdoc, EAS, ERC-3643, ERC-7943, EIP-712 and EIP-4361), so that the institution can change provider without changing the token? And what remains usable if the provider stops operating?'
    sources:
    - { title: 'OpenID Foundation, OpenID4VC High Assurance Interoperability Profile 1.0 (Final, 24 December 2025)', url: 'https://openid.net/specs/openid4vc-high-assurance-interoperability-profile-1_0-final.html', checked: '2026-11-06' }
