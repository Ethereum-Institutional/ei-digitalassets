intro: 'How participants are identified and permissioned on digital asset networks. The map will cover the ways an institution knows who it is dealing with on a shared ledger: network-level allowlists of nodes and accounts, token-level transfer restrictions, verifiable credentials and on-chain attestations, wallet screening and travel-rule messaging, and the standards behind them, and will show which of these each deployment style on the Digital Asset Networks map relies on.'
