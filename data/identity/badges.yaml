    anchor: { in: [sovereign], note: 'Government-verified personal data (Myinfo), released with the user''s consent.' }
    checked: { in: [offchain], note: 'An API response to the relying party at the time of the transaction; nothing is written to a ledger.' }
    reveals: { in: [nothing] }
    revocation: { in: ['na'], note: 'The data is fetched live; there is no issued credential to revoke.' }
    standard: { in: [national] }
    pq: { in: [unstated], note: 'The scheme''s public developer pages the map cites do not state the signature algorithms it relies on or a post-quantum plan.' }
  desc: 'Singapore''s national digital identity. Myinfo lets an approved business pull government-verified personal data about a Singpass user, with the user''s consent, to open an account or complete a check; the page cites DBS, OCBC and UOB among financial institutions using it for KYC since the private-sector release in 2017, and over 1,000 integrated digital services. What the business receives is an API response at the moment of the transaction, not a credential the user carries or a record a contract could verify: to reach a ledger, the institution records its own conclusion (an allowlist entry or an attestation) and takes responsibility for it.'
  sources:
  - { title: 'GovTech Singapore, Myinfo: how it works (Singpass API, KYC use by banks, 1,000 services)', url: 'https://developer.tech.gov.sg/products/categories/digital-identity/myinfo/how-it-works', checked: '2026-11-06' }
