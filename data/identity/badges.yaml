- id: kyx
  name: KYC and KYB checks
  circle: who
  x: 190
  y: 400
  eth: false
  facts:
    subject: { in: [person, org] }
    anchor: { in: [licensed, commercial], note: 'The institution''s own onboarding, usually with a verification provider, against documents, registries and screening lists.' }
    checked: { in: [offchain], note: 'The result stays in the institution''s records unless it is carried to the ledger by one of the mechanisms in the overlaps.' }
    reveals: { in: [nothing] }
    revocation: { in: [list], note: 'Periodic review and offboarding in the institution''s own systems.' }
    standard: { in: [national], note: 'National AML and customer due diligence law; no single technical standard.' }
    pq: { in: ['na'], note: 'An off-ledger check; its result reaches the ledger through an operator''s write (see allowlists and attestations).' }
  desc: 'The checks every regulated institution already runs: who a customer is (KYC), which legal entity it is and who may act for it (KYB), what the source of funds is, and whether any party is sanctioned or exposed. They are the input to everything else on this map, not something a ledger replaces. The design question for a digital asset program is only how their outcome reaches an address: a listed address, an attestation about it, or a credential the customer presents, each with its own privacy and liability profile. The sovereign schemes above are data sources for these checks, not substitutes for them.'
  sources:
  - { title: 'GovTech Singapore, Myinfo: how it works (KYC use by financial institutions)', url: 'https://developer.tech.gov.sg/products/categories/digital-identity/myinfo/how-it-works', checked: '2026-11-06' }
  - { title: 'FATF Recommendations, Recommendation 10 (customer due diligence) and Recommendation 15 with its Interpretive Note (virtual assets and VASPs)', url: 'https://www.fatf-gafi.org/en/publications/Fatfrecommendations/Fatf-recommendations.html', checked: '2026-10-27' }
- id: travelrule
  name: Travel rule messages
  circle: who
  x: 190
  y: 435
  eth: false
  facts:
    subject: { in: [person, org], note: 'Originator and beneficiary of a transfer, and the service providers on each side.' }
    anchor: { in: [licensed], note: 'Each VASP vouches for its own customer''s data to the counterparty VASP.' }
    checked: { in: [offchain], note: 'Messages travel beside the transfer between the two service providers, never on the ledger.' }
    reveals: { in: [nothing], note: 'The public ledger sees the transfer; the names travel in the message.' }
    revocation: { in: ['na'] }
    standard: { in: [national, iso], note: 'FATF Recommendation 16 (revised June 2025), implemented in national law; IVMS 101 as the common data format.' }
    pq: { in: ['na'], note: 'Messaging between providers, off the ledger; the transfer it accompanies is what the ledger keys sign.' }
  desc: 'FATF Recommendation 16 applied to virtual assets: a service provider sending a transfer must collect originator and beneficiary information (at minimum names, account identifiers and addresses) and send it to the receiving provider, so both sides and the authorities can see who is behind a transfer. The FATF threshold is USD or EUR 1,000, which a jurisdiction may set lower; the United States applies its own rule from USD 3,000. For a self-hosted wallet there is no counterparty provider to message, and the FATF guidance lets a jurisdiction require the provider to verify that its own customer controls the wallet, typically with a signed message. IVMS 101 is a common data format. The identity exchanged here is off the ledger, between institutions.'
  sources:
  - { title: 'FATF, Revised Recommendation 16 on payment transparency (June 2025), applied to virtual asset transfers through Recommendation 15', url: 'https://www.fatf-gafi.org/en/publications/Fatfrecommendations/update-Recommendation-16-payment-transparency-june-2025.html', checked: '2026-10-27' }
  - { title: 'FATF, Updated Guidance for a Risk-Based Approach to Virtual Assets and Virtual Asset Service Providers (October 2021)', url: 'https://www.fatf-gafi.org/en/publications/Fatfrecommendations/Guidance-rba-virtual-assets-2021.html', checked: '2026-10-27' }
  - { title: '31 CFR 1010.410(f), the US travel rule for transmittals of funds of USD 3,000 or more (Cornell LII copy of the e-CFR)', url: 'https://www.law.cornell.edu/cfr/text/31/1010.410', checked: '2026-11-09' }
# ---- Verified identity and proof of control: a credential or record bound to a key ----
- id: vc
  name: W3C credentials
  circle: who
  x: 400
  y: 290
  eth: false
  facts:
    subject: { in: [person, org, agent], note: 'Any subject an issuer is willing to make claims about.' }
    anchor: { in: [sovereign, licensed, commercial], note: 'Whoever issues the credential; the standard does not rank issuers, a trust framework does.' }
    checked: { in: [offchain], part: [onchain], note: 'Designed for verifier-side checking; on-chain verification needs a proof system such as the ZK credential stacks on this map.' }
    reveals: { in: [nothing], part: [proof], note: 'Selective and unlinkable disclosure are defined in the data model.' }
    revocation: { in: [list], note: 'Status lists kept by the issuer or a verifiable data registry; the W3C Bitstring Status List (Recommendation, 15 May 2025) sets a minimum of 131,072 entries per list so that a status check does not tell the issuer which credential is being checked.' }
    standard: { in: [w3c], note: 'Verifiable Credentials Data Model 2.0, W3C Recommendation, 15 May 2025.' }
    pq: { in: [classical], note: 'The data model leaves the proof to a securing mechanism (Data Integrity suites, JOSE or COSE); the suites in common use sign with elliptic-curve keys, and a post-quantum suite would be a new suite, not a change to the model.' }
  desc: 'The W3C data model for credentials that a holder carries and presents: an issuer makes signed claims about a subject, the holder keeps them and builds presentations, and a verifier checks the signatures and status. A verifiable data registry (a ledger, a database, a file system) holds the identifiers, keys and revocation data the verifier needs. Selective disclosure, and unlinkable disclosure across verifiers, are part of the model, which is what lets a credential prove an attribute without handing over the document. The model says nothing about who may issue; that comes from a trust framework such as eIDAS or GLEIF''s. The holder proves the credential is theirs by signing with the key it is bound to, which is why it sits across verified identity and proof of control.'
  sources:
  - { title: 'W3C, Verifiable Credentials Data Model v2.0 (Recommendation, 15 May 2025)', url: 'https://www.w3.org/TR/vc-data-model-2.0/', checked: '2026-11-06' }
  - { title: 'W3C, Bitstring Status List v1.0 (Recommendation, 15 May 2025; group privacy, minimum list length 131,072)', url: 'https://www.w3.org/TR/vc-bitstring-status-list/', checked: '2026-11-10' }
- id: did
  name: DIDs
  circle: who
  x: 505
  y: 290
  eth: false
  facts:
    subject: { in: [person, org, agent] }
    anchor: { in: [selfkey], part: [dns, sovereign, licensed], note: 'A DID proves control of its keys; whether it belongs to a known party depends on the credentials attached to it.' }
    checked: { in: [offchain], part: [onchain], note: 'Depends on the DID method: a ledger-registered method can be read by a contract, did:web cannot.' }
    reveals: { in: [nothing], part: [identity], note: 'A DID document lists public keys and service endpoints; a public method publishes them.' }
    revocation: { in: [list, replace], note: 'Key rotation and deactivation follow the method; some keep history, some replace the document.' }
    standard: { in: [w3c], note: 'DID Core 1.0, W3C Recommendation, 19 July 2022.' }
    pq: { in: [classical], note: 'A DID document lists verification methods by type; the types in use are elliptic-curve keys, and a post-quantum key would be a new type that resolver and verifier must both understand.' }
  desc: 'Decentralized identifiers: a URI that resolves to a DID document holding the subject''s public keys and endpoints, which the controller can prove control of without asking any registry for permission. That is the whole of what "decentralized" means here: no central registration authority is needed to create one. A DID carries no identity of its own; it is an anchor for keys, to which credentials from sovereign, licensed or commercial issuers attach. Each DID method defines where the document lives (a ledger, a web server, a database) and so whether a contract can read it and whether updates leave a history.'
  sources:
  - { title: 'W3C, Decentralized Identifiers (DIDs) v1.0 (Recommendation, 19 July 2022)', url: 'https://www.w3.org/TR/did-1.0/', checked: '2026-11-06' }
- id: erc8004
  name: ERC-8004 agents
  circle: who
  x: 400
  y: 325
  eth: true
  status: mainnet
  facts:
    subject: { in: [agent], note: 'Software agents; the ERC-721 owner is the agent''s owner, which can be any address.' }
    anchor: { in: [selfkey], part: [dns], note: 'Optional endpoint domain verification through a .well-known file; no legal identity of the operator.' }
    checked: { in: [onchain], note: 'Identity and reputation registries on Ethereum mainnet since 29 January 2026 (Forbes); the validation registry was still in design.' }
    reveals: { in: [identity], note: 'The registration file, the owner address and public feedback are on chain or linked from it.' }
    revocation: { in: [history], note: 'Ownership transfers and metadata changes are ledger transactions.' }
    standard: { in: [erc_draft], note: 'ERC-8004 is a Draft.' }
    pq: { in: [classical], note: 'An Ethereum account owns the agent''s record, so it signs as every account does today and moves with Ethereum mainnet''s post-quantum roadmap (the Quantum pages).' }
  desc: 'Trustless Agents, the Ethereum standard for discovering and trusting AI agents across organizations: an Identity Registry built on ERC-721, where each agent is a token whose URI resolves to a registration file (purpose, capabilities, endpoints, an A2A agent card); a Reputation Registry of feedback; and a Validation Registry for independent checks such as re-execution, zkML proofs or TEE attestations. The core registries went live on Ethereum mainnet on 29 January 2026 after more than 10,000 agents registered on testnet. It gives an agent a persistent handle and a track record, and a key its owner controls. It does not say who the owner is: the standard mentions neither KYC nor the operator''s legal identity, so know-your-agent needs a verified principal from the left circle on top of it.'
  sources:
  - { title: 'ERC-8004, Trustless Agents (Draft; registries, registration file, trust models)', url: 'https://eips.ethereum.org/EIPS/eip-8004', checked: '2026-11-06' }
  - { title: 'Forbes, AI agents gain trust via Ethereum: ERC-8004 on mainnet (5 February 2026)', url: 'https://www.forbes.com/sites/digital-assets/2026/02/05/ai-agents-gain-trust-via-ethereum-erc-8004-on-mainnet/', checked: '2026-11-06' }
- id: vlei
  name: vLEI
  circle: who
  x: 505
  y: 325
  eth: false
  facts:
    subject: { in: [org, person], note: 'A legal entity, and a person in an official role at it.' }
    anchor: { in: [licensed], note: 'Qualified vLEI Issuers under GLEIF''s governance framework; GLEIF is the root of trust, chained to the LEI record.' }
    checked: { in: [offchain], note: 'Verified by the counterparty''s software against the KERI and ACDC credential chain; not an EVM mechanism.' }
    reveals: { in: [nothing] }
    revocation: { in: [list], note: 'Issuer-managed, under the governance framework.' }
    standard: { in: [iso], note: 'ISO 17442-3 (2024) standardizes vLEIs as digital credentials.' }
    pq: { in: [unstated], note: 'GLEIF''s governance framework pages do not state a post-quantum position; the KERI technical requirements the credentials rest on (Technical Requirements Part 1: KERI Infrastructure, version 1.4, 25 March 2026) are published separately.' }
  desc: 'The verifiable LEI: a credential form of the Legal Entity Identifier that lets a counterparty check an organization''s identity and the role and authority of the person acting for it, traced through a cryptographically protected chain back to the entity''s record in the Global LEI Index, with GLEIF as the root of trust and Qualified vLEI Issuers doing the issuing. It is the clearest example on this map of a credential whose trust anchor is an existing, regulated registry: self-managed by the holder, yet answering to a sovereign-recognized source. It is the natural KYB credential for institutions; bringing it to an Ethereum chain still needs a verifier or an attestation on the other side. It rests on KERI identifiers and ACDC credentials and needs no blockchain: GLEIF describes the credentials as hostable on any infrastructure, ledgers and clouds alike, which is why it is the one widely deployed decentralized identity stack that uses no ledger at all.'
  sources:
  - { title: 'GLEIF, The verifiable LEI (vLEI): Qualified vLEI Issuers, root of trust, ISO 17442-3', url: 'https://www.gleif.org/en/organizational-identity/lei-vlei/the-verifiable-lei-vlei', checked: '2026-11-06' }
  - { title: 'GLEIF, response to the US-EU Trade and Technology Council on digital identity (1 March 2024; ACDC credentials, KERI as the backbone, vLEIs hostable on any infrastructure such as ledgers and clouds)', url: 'https://www.gleif.org/lei-solutions/regulatory-use-of-the-lei/consultation-responses/2024-03-01_gleif-response_us-eu-ttc_digital-identity_v1.0.pdf', checked: '2026-11-10' }
  - { title: 'GLEIF, Introducing the vLEI Ecosystem Governance Framework (controlled documents; Technical Requirements Part 1: KERI Infrastructure, version 1.4, 25 March 2026)', url: 'https://www.gleif.org/en/organizational-identity/introducing-the-verifiable-lei-vlei/introducing-the-vlei-ecosystem-governance-framework', checked: '2026-11-10' }
  - { title: 'Web of Trust, Web of Trust Map: The Global Infrastructure of Decentralized Digital Identity (Key State Capital, September 2025; CC BY 4.0; a census of 260 government-linked projects announced to July 2023)', url: 'https://www.weboftrust.org/pdf/web-of-trust-map-report---the-global-infrastructure-of-decentralized-digital-identity.pdf', checked: '2026-11-10' }
- id: didweb
  name: did:web
  circle: who
  x: 400
  y: 360
  eth: false
  facts:
    subject: { in: [org, person, agent], note: 'Whoever controls the web domain.' }
    anchor: { in: [dns], note: 'DNS, the TLS certificate and the web server; the domain''s existing reputation is the trust.' }
    checked: { in: [offchain], note: 'Resolved over HTTPS; a contract cannot read it.' }
    reveals: { in: [identity], note: 'The DID document is a public file on the domain.' }
    revocation: { in: [replace], note: 'Updates replace did.json with no record of earlier versions unless the operator adds one; removing the file deactivates the DID.' }
    standard: { in: [w3c], note: 'A W3C Credentials Community Group method specification, not a Recommendation.' }
    pq: { in: [classical], note: 'Rests on DNS and a TLS certificate, both classical today; the keys in the DID document are whatever the controller lists.' }
  desc: 'A DID method that puts the DID document at a well-known path on a web domain, so a domain''s existing reputation stands in for a ledger. Its own specification states the limits: resolution depends on DNS and a TLS certificate, DNS carries the usual interception and spoofing risks (DNSSEC and DNS over HTTPS are recommended, not required), updates simply replace the document with no history unless the operator keeps one, the method defines no authorization for writing the document, and a registrar or DNS provider can take the identifier down by removing the domain. A ledger-registered identifier keeps every change and cannot be withdrawn by a registrar; that is the trade a DNS anchor makes for convenience.'
  sources:
  - { title: 'W3C CCG, did:web Method Specification (security and privacy considerations)', url: 'https://w3c-ccg.github.io/did-method-web/', checked: '2026-11-06' }
- id: ens
  name: ENS
  circle: who
  x: 505
  y: 360
  eth: true
  status: mainnet
  facts:
    subject: { in: [person, org, agent], note: 'Whoever registers the name.' }
    anchor: { in: [selfkey], part: [dns], note: 'A .eth name is self-chosen; a DNS name imported through DNSSEC inherits the domain''s trust.' }
    checked: { in: [onchain], note: 'Names and records are contracts on Ethereum mainnet; any contract can resolve them.' }
    reveals: { in: [identity], note: 'The name and its records are public.' }
    revocation: { in: [history], note: 'Ownership and record changes are ledger transactions with full history.' }
    standard: { in: [erc_final], note: 'EIP-137 (ENS) and EIP-181 (reverse resolution).' }
    pq: { in: [classical], note: 'A name is owned by an Ethereum account, which signs as every account does today and moves with Ethereum mainnet''s roadmap.' }
  desc: 'The Ethereum Name Service: names such as alice.eth that resolve to Ethereum addresses, other addresses, content hashes and metadata, with reverse resolution. .eth names are issued as tokens by smart contracts, so ownership, transfers and every record change are on the ledger with history, which is the opposite of did:web. ENS can also import DNS names through DNSSEC, so an institution can let its existing domain resolve to its addresses. A name is a label a key controls: it makes an address recognizable and signable, but it verifies nothing about who registered it unless a credential or attestation says so.'
  sources:
  - { title: 'ENS documentation, the ENS protocol (names, records, DNSSEC import)', url: 'https://docs.ens.domains/learn/protocol', checked: '2026-11-06' }
# ---- Proof of control only: signatures and keys ----
- id: eip712
  name: EIP-712 typed data
  circle: key
  x: 710
  y: 300
  eth: true
  status: mainnet
  facts:
    subject: { in: ['na'] }
    anchor: { in: [selfkey] }
    checked: { in: [onchain], note: 'A contract recovers the signer from the typed-data hash.' }
    reveals: { in: [nothing], note: 'Only what the message and the contract publish.' }
    revocation: { in: ['na'], note: 'The standard has no replay protection; the application rejects repeats or makes the action idempotent.' }
    standard: { in: [erc_final], note: 'EIP-712, Final.' }
    pq: { in: [classical], note: 'A format for what is signed, not a signature scheme: on Ethereum mainnet today the signature is ECDSA over secp256k1, recovered with ecrecover; a post-quantum signature needs a different verifier, which is what ERC-1271 allows.' }
  desc: 'The standard for hashing and signing typed structured data instead of opaque bytes, so a wallet can show the user what they are signing. Its domain separator (name, version, chain id, verifying contract, an optional salt) keeps a signature for one application, contract or chain from being accepted by another that defines the same structure; wallets should refuse to sign for a chain id other than the active one. The standard itself provides no replay protection: it leaves repeated signed messages to the application, which must reject them (a nonce, an expiry) or make the action idempotent. That is why wallet verification and permit-style approvals built on it carry a nonce and a deadline inside the signed message.'
  sources:
  - { title: 'EIP-712, Typed structured data hashing and signing (Final; domain separator, replay protection left to the application)', url: 'https://eips.ethereum.org/EIPS/eip-712', checked: '2026-11-06' }
- id: siwe
  name: Sign-In with Ethereum
  circle: key
  x: 710
  y: 335
  eth: true
  status: mainnet
  facts:
    subject: { in: ['na'] }
    anchor: { in: [selfkey] }
    checked: { in: [offchain], part: [onchain], note: 'Verified by the relying party; smart accounts are checked through ERC-1271 on the named chain.' }
    reveals: { in: [nothing] }
    revocation: { in: [expiry], note: 'expiration-time and not-before fields; a nonce per session.' }
    standard: { in: [erc_final], note: 'EIP-4361, Final.' }
    pq: { in: [classical], note: 'Verified with ecrecover for an externally owned account, or through ERC-1271 for a contract account; classical today, with the contract route as the migration path.' }
  desc: 'A signed, human-readable message that proves an address''s controller is present: it binds the domain making the request (which the wallet must check against the origin, to stop phishing), the address, a URI, the chain id, a random nonce of at least eight characters chosen per session, an issued-at time and optional expiration, not-before, request-id and resources. The nonce and expiry are what stop a captured message being replayed; the domain and chain id stop it being presented elsewhere. For a smart account the relying party verifies through ERC-1271 on the named chain and should end sessions when that account''s state changes. It is the sign-in half of wallet verification; what the address may do is still a separate decision.'
  sources:
  - { title: 'EIP-4361, Sign-In with Ethereum (Final; message fields, nonce, domain binding, ERC-1271)', url: 'https://eips.ethereum.org/EIPS/eip-4361', checked: '2026-11-06' }
- id: erc1271
  name: ERC-1271 and 6492
  circle: key
  x: 710
  y: 370
  eth: true
  status: mainnet
  facts:
    subject: { in: ['na'] }
    anchor: { in: [selfkey], note: 'The account''s own validation logic decides what counts as its signature.' }
    checked: { in: [onchain] }
    reveals: { in: [nothing] }
    revocation: { in: [history], note: 'Changing the account''s signers is a ledger transaction; verifiers must re-check after state changes.' }
    standard: { in: [erc_final], note: 'ERC-1271 and ERC-6492, both Final.' }
    pq: { in: [classical], part: [pq], note: 'The contract decides what counts as its signature, so an account can adopt a post-quantum verifier without a protocol change. Deployed accounts verify ECDSA or passkey signatures today; research puts an EVM-optimized hash-based signature within reach of ordinary gas costs (SPHINCS-, June 2026).' }
  desc: 'Signature checking for accounts that are contracts. A contract has no private key, so ERC-1271 lets it expose isValidSignature and decide for itself what counts as its signature: one key, a threshold of keys, a passkey, a policy. ERC-6492 extends this to accounts that are not deployed yet, by wrapping the signature with the deployment call. Together with account abstraction (ERC-4337) and EIP-7702, which lets an ordinary account take on contract code through a signed delegation, they make proof of control a programmable question: the institution''s custody policy becomes the account''s validation rule. The price is that a signature''s validity can change with the account''s state, so a verifier cannot cache the answer.'
  sources:
  - { title: 'ERC-1271, Standard Signature Validation Method for Contracts (Final)', url: 'https://eips.ethereum.org/EIPS/eip-1271', checked: '2026-11-06' }
  - { title: 'ERC-6492, Signature Validation for Predeploy Contracts (Final)', url: 'https://eips.ethereum.org/EIPS/eip-6492', checked: '2026-11-06' }
  - { title: 'ERC-4337, Account Abstraction Using Alt Mempool (Final)', url: 'https://eips.ethereum.org/EIPS/eip-4337', checked: '2026-11-06' }
  - { title: 'EIP-7702, Set Code for EOAs (Final)', url: 'https://eips.ethereum.org/EIPS/eip-7702', checked: '2026-11-06' }
  - { title: 'Cointelegraph, Ethereum can quantum-proof accounts for 7 cents (14 June 2026; secondary): SPHINCS-, an EVM-optimized family derived from SPHINCS+, from the Ethereum Foundation Kohaku lead, without a hard fork; a bridge to leanSPHINCS with aggregation', url: 'https://cointelegraph.com/news/ethereum-quantum-proof-accounts-7-cents-researcher', checked: '2026-11-06' }
- id: passkeys
  name: Passkeys (WebAuthn)
  circle: key
  x: 710
  y: 405
  eth: false
  facts:
    subject: { in: [person], part: [agent], note: 'A person''s authenticator; a device key for a service.' }
    anchor: { in: [selfkey], note: 'Keys live in the authenticator; attestation can name the device model, not the person.' }
    checked: { in: [offchain], part: [onchain], note: 'Verified by the relying party; a smart account can verify the P-256 signature in its ERC-1271 logic.' }
    reveals: { in: [nothing] }
    revocation: { in: [list], note: 'The relying party or the smart account removes the credential.' }
    standard: { in: [w3c], note: 'Web Authentication Level 3, W3C Recommendation, 25 August 2026.' }
    pq: { in: [classical], note: 'A passkey signs with an algorithm the authenticator and the relying party both support, elliptic-curve or RSA in deployed authenticators; a post-quantum algorithm needs both sides to add it.' }
  desc: 'The web standard for public-key credentials created and held by an authenticator (a phone, a security key, a laptop''s secure element), scoped to one relying party and used only with the user''s consent, which is what makes them resistant to phishing. They answer proof of control for people without seed phrases: a smart account can accept a passkey signature as its own through ERC-1271, and a relying party can use one for sign-in beside or instead of a wallet signature. They say nothing about who the person is; a passkey is a key, bound to a device and an origin, and identity still comes from the left circle.'
  sources:
  - { title: 'W3C, Web Authentication: An API for accessing Public Key Credentials, Level 3 (Recommendation, 25 August 2026)', url: 'https://www.w3.org/TR/webauthn-3/', checked: '2026-11-06' }
  - { title: 'ERC-1271, Standard Signature Validation Method for Contracts (Final)', url: 'https://eips.ethereum.org/EIPS/eip-1271', checked: '2026-11-06' }
# ---- Proof of control and permission, outside verified identity ----
- id: controlproof
  name: Control proofs
  circle: key
  x: 578
  y: 520
  eth: false
  facts:
    subject: { in: [person, org], note: 'A service provider''s own customer, for a transfer to or from a self-hosted wallet.' }
    anchor: { in: [licensed], note: 'The provider that already knows the customer accepts the proof.' }
    checked: { in: [offchain], note: 'A signed message or a micro-transaction checked by the provider; nothing is recorded on the ledger.' }
    reveals: { in: [nothing] }
    revocation: { in: ['na'] }
    standard: { in: [national], note: 'Asked for by several travel-rule regimes; the FATF guidance lets a jurisdiction require it, and Australia''s rules make an ordering institution collect and verify payer information and say how it will verify who controls a self-hosted wallet.' }
    pq: { in: [classical], note: 'Whatever the account signs with: ECDSA for an externally owned account, the contract''s own rule under ERC-1271. The link an institution records between a customer and an address is only as strong as that key.' }
  desc: 'Where a transfer goes to or comes from a self-hosted wallet, travel-rule regimes in several jurisdictions ask the service provider to verify that its own customer controls that wallet before allowing the transfer: a signed message from the wallet, a micro-transaction, or another proof-of-control step. It is a permission decision (may this transfer proceed) resting on proof of control, for a customer the provider has already identified elsewhere: the identity lives in the provider''s records, which is why the pill sits outside the verified identity circle. The same signed-message pattern, with a nonce and an expiry, is the usual way an institution links a customer''s own wallet to their account.'
  sources:
  - { title: 'FATF, Updated Guidance for a Risk-Based Approach to Virtual Assets and Virtual Asset Service Providers (October 2021)', url: 'https://www.fatf-gafi.org/en/publications/Fatfrecommendations/Guidance-rba-virtual-assets-2021.html', checked: '2026-10-27' }
  - { title: 'AUSTRAC, Additional travel rule obligations when transferring virtual assets (last updated 23 October 2026): self-hosted wallets, payer verification', url: 'https://www.austrac.gov.au/industry-and-business/obligations-and-guidance/additional-guidance/travel-rule/additional-travel-rule-obligations-when-transferring-virtual-assets', checked: '2026-11-09' }
# ---- Verified identity and permission, outside proof of control: a known party, admitted or gated ----
- id: allowlist
  name: Allowlists
  circle: who
  x: 315
  y: 520
  eth: true
  status: mainnet
  facts:
    subject: { in: [person, org], note: 'Investors or participants the operator has onboarded.' }
    anchor: { in: [licensed, commercial], note: 'The token issuer or its transfer agent, after its own KYC and eligibility checks.' }
    checked: { in: [onchain], note: 'The token contract checks a registry on every transfer; transfers to unlisted addresses revert.' }
    reveals: { in: [membership], note: 'Every admitted address is readable, and so is every transfer between them.' }
    revocation: { in: [history], note: 'Removing an address is a ledger transaction; the address can no longer send or receive.' }
    standard: { in: [erc_final], part: [proprietary], note: 'ERC-3643 and ERC-7943 standardize the checks; many issuers run their own registry contract.' }
    pq: { in: [state], note: 'The list is contract state. The exposure is the administrator key that edits it, and the holders'' keys, as for any ledger record.' }
  desc: 'The simplest way to carry an off-ledger check onto the ledger: the operator registers each address it has verified, and the token contract lets only registered addresses hold or receive. BlackRock''s BUIDL fund works this way: Securitize checks each investor''s KYC, AML and eligibility, adds the wallet to an allow-list that every transfer checks, and transfers to unlisted addresses revert (a secondary account of the fund, October 2026). The trade is privacy: the list of admitted addresses and the transfers among them are public, so anyone can read who the issuer''s investors transact with. Membership reveals a counterparty relationship even when names are not on chain; an attestation or a credential proof can admit an address without publishing a list. ERC-7943''s canSend and canReceive are the standardized form of the check, and ERC-3643 the fuller one.'
  sources:
  - { title: 'ERC-3643, T-REX Token for Regulated Exchanges (Final; Identity Registry checked on transfer)', url: 'https://eips.ethereum.org/EIPS/eip-3643', checked: '2026-11-06' }
  - { title: 'Eco, BUIDL deep dive (allow-list enforced at the token level, Securitize registry; secondary source, 6 October 2026)', url: 'https://eco.com/support/en/articles/15254013-buidl-deep-dive-2026', checked: '2026-11-06' }
- id: cbverified
  name: Coinbase Verified
  circle: who
  x: 323
  y: 555
  eth: true
  status: mainnet
  facts:
    subject: { in: [person], note: 'Coinbase account holders who link a wallet.' }
    anchor: { in: [licensed], note: 'Coinbase attests from its own account verification.' }
    checked: { in: [onchain], note: 'Attestations on Base through the Ethereum Attestation Service, read through an indexer contract.' }
    reveals: { in: [membership], note: 'A yes/no verified-account flag, a country and a Coinbase One flag, per address; the attestation data is public.' }
    revocation: { in: [history], note: 'EAS attestations carry expiration and revocation times.' }
    standard: { in: [proprietary], part: [erc_final], note: 'Coinbase schemas on EAS.' }
    pq: { in: [classical], note: 'Attestations are written by Coinbase''s attester account under EAS; classical today, moving with the chain they are on.' }
  desc: 'Coinbase Verifications: Coinbase writes an attestation on Base, through the Ethereum Attestation Service, that a wallet belongs to a verified Coinbase account, with a country and a Coinbase One flag as separate schemas. A contract or an application looks the wallet up through Coinbase''s indexer contract on Base mainnet (a read-only call) and reads the attestation from EAS. It is an attestation rather than a list: Coinbase vouches, and any application may gate on it, without the application holding a list of its own. What is public is that the address passed Coinbase''s check and its country, not the person''s name; what the relying application gets is Coinbase''s word, so its own obligations do not transfer.'
  sources:
  - { title: 'Coinbase Developer Platform, Verifications: attestations (schemas, EAS on Base)', url: 'https://docs.cdp.coinbase.com/verifications/introduction/attestations', checked: '2026-11-06' }
  - { title: 'Coinbase Developer Platform, Verifications: quickstart (indexer contract, EAS lookup on Base mainnet)', url: 'https://docs.cdp.coinbase.com/verifications/introduction/quickstart', checked: '2026-11-06' }
- id: zkpassport
  name: ZK passport proofs
  circle: who
  x: 342
  y: 590
  eth: true
  status: mainnet
  facts:
    subject: { in: [person] }
    anchor: { in: [sovereign], note: 'The issuing state''s signature on the passport chip (ICAO 9303); the design inherits the risks of government PKI.' }
    checked: { in: [onchain], part: [offchain], note: 'ZKPassport verifies proofs in on-chain verifier contracts on EVM networks; Rarimo uses an on-chain Merkle registry; Privado ID supports both.' }
    reveals: { in: [proof], note: 'Only the statement proved (over 18, a given nationality, a scoped personhood identifier), never the document.' }
    revocation: { in: ['na'], part: [list], note: 'A renewed document changes identifiers; no central revocation of a proof.' }
    standard: { in: [proprietary], part: [iso], note: 'Each project''s own circuits over the ICAO 9303 document signature.' }
    pq: { in: [classical], note: 'Two classical links: the passport chip''s signature, and the proof system (circuits in Circom or Noir in the projects'' current stacks); none of the three projects states a post-quantum position. A hash-based proof system would change the second link, not the first.' }
  desc: 'Zero-knowledge proofs over a passport''s chip: the holder proves on their phone that a government-signed document says something (older than 18, a citizen of a given country, one person per scope) and a verifier contract on an EVM network checks the proof, without the document or the name ever leaving the device. Safe Research compared ZKPassport, Rarimo, Self Protocol and Privado ID in September 2025: proofs made on the device and verified on chain, with the trust anchored in the state''s own signature on the chip (the ePassport standard, ICAO 9303, drawn in the schemes box below). It is the strongest example of a sovereign source anchored to the ledger without a middleman, and the limits are stated in the same review: dependence on government PKI, limited document coverage for some flows, no liveness check, and a renewed passport changes the identifier.'
  sources:
  - { title: 'Safe Research, ZK Passport: where are we now? (4 September 2025)', url: 'https://safefoundation.org/blog/safe-research-zk-passport-where-are-we-now', checked: '2026-11-06' }
  - { title: 'ZKPassport, how it works (on-chain verifiers for Ethereum, Base, Aztec and other EVM chains; ICAO 9303 documents; vendor)', url: 'https://zkpassport.id/', checked: '2026-11-07' }
  - { title: 'Rarimo documentation, ZK Passport (circuits built with Circom, transitioning to Noir; the on-chain Merkle registry; vendor)', url: 'https://docs.rarimo.com/zk-passport/', checked: '2026-11-07' }
# ---- All three: identity, key and permission in one mechanism ----
- id: kya
  name: Know Your Agent
  circle: who
  x: 450
  y: 430
  eth: false
  facts:
    subject: { in: [agent, person, org], note: 'The agent, and the person or organization responsible for it.' }
    anchor: { in: [commercial], part: [licensed], note: 'A verification provider links the agent to a principal it has verified; the mandate is the provider''s policy.' }
    checked: { in: [offchain], part: [onchain], note: 'Vendor products check each request against the mandate off the ledger; ERC-8226 (Draft) would put the mandate on the ledger so the token checks it at execution.' }
    reveals: { in: [nothing], part: [membership], note: 'Nothing in the vendor designs; under ERC-8226 the mandate (agent, principal, asset, scope, caps, expiry) and each execution would be on the ledger, with the principal''s identity staying with the compliance provider.' }
    revocation: { in: [list], part: [expiry, history], note: 'Time-bound, revocable agent credentials; mandates with expiry. Under ERC-8226 revocation and freezes are ledger transactions that keep the record.' }
    standard: { in: [proprietary], part: [erc_draft], note: 'No ratified standard. ERC-8226, Regulated Agent Mandate (Draft, April 2026), is one standard to consider for the mandate layer; the vendor framings are proprietary.' }
    pq: { in: [unstated], note: 'The vendor framings the map cites do not state the signature schemes an agent identity uses.' }
  desc: 'Know your agent: the emerging practice of treating a software agent as a party that needs an identity, a verified principal and a scope. Two vendor framings from 2026 (vendor-stated): Sumsub describes KYA as establishing an agent''s machine identity, linking it to a verified person or organization and enforcing policy, oversight and auditability over its actions (January 2026); Shufti''s product issues each agent a time-bound, revocable credential, requires it to be linked to a person or business verified through KYC or KYB, and enforces a mandate (permitted actions, limits, expiry, revocation) on every request, with a liveness check by the principal for out-of-mandate requests (October 2026). On an Ethereum chain the same shape is an ERC-8004 agent whose owner is a verified principal, acting from a smart account whose validation rule is the mandate: identity, key and permission in one design, which is why it sits in the center. One standard to consider for the mandate layer is ERC-8226, Regulated Agent Mandate (Draft, April 2026): a principal cleared by a compliance provider grants an on-chain agent a scoped, time-bounded and financially capped mandate for one asset, and the token checks it at execution, beside its own eligibility rule under ERC-7943 or ERC-3643 and the agent''s registry entry under ERC-8004; it comes from the authors of ERC-7943 and no deployment is recorded here.'
  sources:
  - { title: 'Sumsub, From AI agents to Know Your Agent (28 January 2026; vendor)', url: 'https://sumsub.com/blog/know-your-agent/', checked: '2026-11-06' }
  - { title: 'ERC-8226, Regulated Agent Mandate (Draft, created 12 April 2026): a KYC-cleared principal grants an agent a scoped, time-bounded, capped mandate per asset, checked by the token at execution; names ERC-8004, ERC-7943 and ERC-3643 as the other layers', url: 'https://eips.ethereum.org/EIPS/eip-8226', checked: '2026-11-09' }
  - { title: 'Shufti, press release: Know Your Agent (28 October 2026; vendor)', url: 'https://shuftipro.com/press-release/shufti-launches-know-your-agent-to-verify-ai-agents/', checked: '2026-11-06' }
  - { title: 'ERC-8004, Trustless Agents (Draft)', url: 'https://eips.ethereum.org/EIPS/eip-8004', checked: '2026-11-06' }
- id: erc3643
  name: ERC-3643
  circle: who
  x: 450
  y: 465
  eth: true
  status: mainnet
  facts:
    subject: { in: [person, org] }
    anchor: { in: [licensed, commercial], note: 'Trusted claim issuers listed by the token owner; typically the issuer''s own KYC provider.' }
    checked: { in: [onchain], note: 'isVerified on the Identity Registry on every transfer, plus a compliance contract.' }
    reveals: { in: [membership], note: 'Registered wallets, their on-chain identity contracts and claim topics are readable; claim data itself may be a hash.' }
    revocation: { in: [history], note: 'Claims and registrations change by transaction; recoveries are kept on chain.' }
    standard: { in: [erc_final], note: 'ERC-3643, Final.' }
    pq: { in: [classical], note: 'Claims are signed by claim issuers and checked by the identity registry; the ONCHAINID contract holds rotatable keys, which eases a scheme change, but the signatures are classical today and move with Ethereum mainnet''s roadmap.' }
  desc: 'The permissioned token standard (T-REX): an ERC-20 whose transfers pass only if the receiver''s wallet is registered in an Identity Registry, its on-chain identity contract holds the claims the token requires (ONCHAINID, the identity contract in the standard''s reference assets: an ERC-734 key holder and ERC-735 claim holder), those claims are signed by an issuer in the Trusted Issuers Registry, and a Compliance contract agrees. Agents appointed by the owner can force transfers and recover tokens to a new wallet, with the history kept on chain. It answers all three questions in one structure: who (claims from trusted issuers), which key (the wallet bound to the identity contract) and what (the compliance rules), which is why it sits in the center. The issuer still runs the KYC; the standard carries the result and enforces it.'
  sources:
  - { title: 'ERC-3643, T-REX Token for Regulated Exchanges (Final; identity registry, claim issuers, compliance, recovery)', url: 'https://eips.ethereum.org/EIPS/eip-3643', checked: '2026-11-06' }
  - { title: 'ERC-3643 reference assets, ONCHAINID/IIdentity.sol (IIdentity is IERC734, IERC735; CC0-1.0)', url: 'https://eips.ethereum.org/assets/eip-3643/ONCHAINID/IIdentity.sol', checked: '2026-11-06' }
  - { title: 'ONCHAINID documentation (the onchain identity standard: contracts, SDK, claim issuers)', url: 'https://docs.onchainid.com/', checked: '2026-11-06' }
- id: privado
  name: Privado ID
  circle: who
  x: 450
  y: 500
  eth: true
  status: mainnet
  facts:
    subject: { in: [person, org, agent] }
    anchor: { in: [licensed, commercial], part: [sovereign], note: 'Any issuer an application trusts; the stack is issuer-neutral.' }
    checked: { in: [onchain, offchain], note: 'Zero-knowledge proofs of a credential verified on any EVM chain or by a server.' }
    reveals: { in: [proof], note: 'Only that a proof over an accepted credential verified; a nullifier can prevent reuse.' }
    revocation: { in: [list], note: 'Revocation trees published with the issuer state.' }
    standard: { in: [w3c], part: [proprietary], note: 'W3C credentials with the iden3 proof system.' }
    pq: { in: [classical], note: 'The iden3 proof system (snarkjs circuits with on-chain verifiers) and the issuer''s keys are classical; the documentation states no post-quantum position.' }
  desc: 'A zero-knowledge credential stack from the iden3 protocol: Polygon ID, spun out of Polygon Labs as Privado ID in June 2024, with Billions Network as the consumer-facing network launched in February 2025 (vendor-stated: trials with named banks, work with Verax on Linea, DigiShares for investor onboarding). An issuer signs W3C-style credentials; the holder proves statements about them in zero knowledge; a verifier contract on any EVM chain, or a server, checks the proof against the issuer''s published state and revocation tree. It admits an address without listing it and without revealing the credential, so a token contract can gate on "this wallet holds a credential from an issuer I trust" and the public sees only that a proof passed. Identity, key and permission meet in one design, which is why it sits in the center.'
  sources:
  - { title: 'Billions Network, Introducing Privado ID (spin-out from Polygon Labs, 13 June 2024; vendor)', url: 'https://billions.network/blog/introducing-privado-id-moving-beyond-polygon-to-deliver-independent-privacy-preserving-identity-solutions', checked: '2026-11-06' }
  - { title: 'VentureBeat, Billions.Network launches verification platform for humans and AI (28 February 2025)', url: 'https://venturebeat.com/business/billions-network-launches-universally-accessible-verification-platform-for-humans-and-ai', checked: '2026-11-06' }
  - { title: 'Safe Research, ZK Passport: where are we now? (Privado ID: state publication, revocation trees, nullifiers)', url: 'https://safefoundation.org/blog/safe-research-zk-passport-where-are-we-now', checked: '2026-11-06' }
  - { title: 'Privado ID documentation, Introduction (the iden3 protocol; verification off-chain or on-chain via smart contracts; vendor)', url: 'https://docs.privado.id/docs/introduction/', checked: '2026-11-07' }
  - { title: 'iden3 documentation (Poseidon, Baby JubJub, snarkjs proof generation; vendor)', url: 'https://docs.iden3.io/', checked: '2026-11-07' }
- id: eas
  name: EAS attestations
  circle: who
  x: 450
  y: 535
  eth: true
  status: mainnet
  facts:
    subject: { in: [person, org, agent], note: 'Anything an attester is willing to make a statement about.' }
    anchor: { in: [commercial, licensed, selfkey], note: 'Any address may attest; the trust is in the attester, not the service.' }
    checked: { in: [onchain], note: 'Attestations against registered schemas, with resolver contracts for on-chain verification.' }
    reveals: { in: [membership], part: [identity], note: 'What the schema holds is public when attested on chain.' }
    revocation: { in: [history], note: 'Expiration and revocation resolvers; revocation is a transaction.' }
    standard: { in: [proprietary], note: 'An open protocol, not an ERC; deployed on Ethereum mainnet, Base, Optimism, Arbitrum, Polygon, Linea and others.' }
    pq: { in: [classical], note: 'An on-chain attestation is a transaction by the attester''s account; an off-chain one is an EIP-712 signature. Both classical today, moving with the chain.' }
  desc: 'The Ethereum Attestation Service: an open protocol for attestations on EVM chains, where anyone registers a schema and any address makes attestations against it about a recipient, with resolver contracts for on-chain verification, expiration and revocation. It is deployed on Ethereum mainnet, Base, Optimism, Arbitrum, Polygon, Linea and other chains. It is the general form of Coinbase Verifications: an institution can attest to its own conclusion about an address (verified, eligible, a role) and a contract can gate on it, with the attester''s address, not a list, as the thing to trust. Identity, key and permission meet because the attestation names the subject, is signed by the attester and is what the gate reads.'
  sources:
  - { title: 'Ethereum Attestation Service, eas-contracts (schemas, attestations, resolvers, deployments)', url: 'https://github.com/ethereum-attestation-service/eas-contracts', checked: '2026-11-06' }
  - { title: 'Coinbase Developer Platform, Verifications: attestations (an EAS deployment in use)', url: 'https://docs.cdp.coinbase.com/verifications/introduction/attestations', checked: '2026-11-06' }
# ---- Permission only: decisions about an address without a verified identity ----
- id: blocklist
  name: Issuer blocklist
  circle: may
  x: 450
  y: 707
  eth: true
  status: mainnet
  facts:
    subject: { in: ['na'], note: 'An address, whoever holds it.' }
    anchor: { in: [licensed], note: 'The issuer, acting in its discretion or on a legal order.' }
    checked: { in: [onchain], note: 'The token contract refuses transfers to and from a blocked address.' }
    reveals: { in: [membership], note: 'The blocked addresses are public.' }
    revocation: { in: [history], note: 'Blocking and unblocking are ledger transactions.' }
    standard: { in: [proprietary] }
    pq: { in: [state], note: 'The list is contract state. The exposure is the issuer''s administrator key (the blacklister role, in Circle''s contract), as for any admin key.' }
  desc: 'The permission mechanism most tokens already carry: the issuer may block an address at the contract, after which it can neither send nor receive. Issuers'' own words are blacklist in the contract (Circle''s USDC contract has a blacklister role with blacklist and unblacklist functions) and block or freeze in their terms; Ethereum Institutional says blocklist. USDC and USDT are the examples: Circle''s USDC terms let it block addresses it determines, in its discretion, to be associated with illegal activity or a breach of its terms, freeze USDC that touches a blocked address, and freeze or surrender funds on a legal order from a government authority. Tether said in April 2026 that it had frozen more than USD 4.4 billion in all, more than USD 2.1 billion tied to US authorities, after freezing USD 344 million on Tron in coordination with OFAC and US law enforcement. A blocklist needs no identity: everyone is permitted until named. That is its strength for open assets and its limit for regulated ones. ERC-7943 is the standardized form of the control (frozen balances, an enforced transfer, canSend and canReceive), written for real-world assets and usable by a tokenized currency.'
  sources:
  - { title: 'Circle, USDC risk factors (blocked addresses, freezing, legal orders)', url: 'https://www.circle.com/legal/usdc-risk-factors', checked: '2026-11-06' }
  - { title: 'Circle, stablecoin-evm token design (Blacklisting: the blacklister role, blacklist and unblacklist)', url: 'https://github.com/circlefin/stablecoin-evm/blob/master/doc/tokendesign.md', checked: '2026-11-06' }
  - { title: 'The Block, Tether freezes 344 million USDT on Tron (23 April 2026; cumulative totals as stated by Tether)', url: 'https://www.theblock.co/post/398599/tether-freezes-344-million-in-usdt-on-tron-after-wallets-flagged-by-u-s-authorities', checked: '2026-11-06' }
- id: screening
  name: Transaction screening
  circle: may
  x: 450
  y: 742
  eth: false
  facts:
    subject: { in: ['na'], note: 'Addresses and clusters, attributed to services and sometimes to people.' }
    anchor: { in: [commercial], note: 'Blockchain analytics providers and their attribution data; sanctions lists from governments.' }
    checked: { in: [offchain], note: 'A risk score consulted before a transfer or at onboarding; some contracts call an oracle.' }
    reveals: { in: [nothing], part: [identity], note: 'The ledger shows nothing new; the analysis reveals what the ledger already implied.' }
    revocation: { in: ['na'] }
    standard: { in: [proprietary], note: 'Each provider''s own heuristics and labels.' }
    pq: { in: ['na'], note: 'Analytics over the ledger''s public record, off the ledger; no signature of its own.' }
  desc: 'Permission decided from an address''s history rather than its owner''s identity: a transfer is allowed, held or refused on a risk score from blockchain analytics, which clusters addresses into entities and labels the clusters. The heuristics are public knowledge: inputs spent together belong to one party, change returns to the sender, exchanges hand out one-time deposit addresses, and a cluster tied to an exchange can be resolved to a person by asking the exchange, which holds the customer''s identity. Academic tests of the market leader found attribution reliable as a lower bound, 25 to 95 percent coverage with under 0.5 percent false positives (USENIX Security 2025). The consequence for institutions: custody does not hide you. An address behind a custodian is attributable to the custodian, and often to the account, by the same methods.'
  sources:
  - { title: 'Lubbertsen, van Eeten and van Wegberg, Ghost Clusters: Evaluating Attribution of Illicit Services through Cryptocurrency Tracing (USENIX Security 2025)', url: 'https://www.usenix.org/conference/usenixsecurity25/presentation/lubbertsen', checked: '2026-11-06' }
  - { title: 'Deuber et al., Argumentation Schemes for Blockchain Deanonymization (arXiv, 2023; common-input and change heuristics, exchange attribution)', url: 'https://arxiv.org/pdf/2305.16883', checked: '2026-11-06' }
  - { title: 'Kappos et al., How to Peel a Million: Validating and Expanding Bitcoin Clusters (arXiv, 2022; co-spend clustering, peel chains, one-time exchange deposit addresses)', url: 'https://arxiv.org/pdf/2205.13882.pdf', checked: '2026-11-06' }
- id: erc7943
  name: ERC-7943 checks
  circle: may
  x: 450
  y: 777
  eth: true
  status: mainnet
  facts:
    subject: { in: ['na'], note: 'The interface asks whether an address may send or receive; who it is comes from elsewhere.' }
    anchor: { in: [licensed, commercial], note: 'Whatever the implementing token consults.' }
    checked: { in: [onchain] }
    reveals: { in: [membership], part: [nothing], note: 'The answer to canSend and canReceive is public; the reason need not be.' }
    revocation: { in: [history], note: 'Frozen balances and eligibility changes are transactions.' }
    standard: { in: [erc_final], note: 'ERC-7943, Final.' }
    pq: { in: [state], note: 'Enforcement functions on the token contract, called by an authorized operator; the record is contract state and the exposure is the operator key.' }
  desc: 'The universal real-world asset interface: a minimal set of compliance functions added to ERC-20, ERC-721, ERC-1155 or ERC-6909 tokens, with eligibility checks per account (canSend, canReceive), a transfer-level check (canTransfer), frozen-balance management and an enforcement transfer (forcedTransfer). It standardizes the permission question without prescribing the answer: the token asks, and the implementation decides from an allowlist, an attestation, a credential proof or a blocklist. For an institution it means one interface to integrate against, whichever identity mechanism on this map sits behind it. Written for real-world assets, its functions are also the controls a deposit token or a regulated stablecoin needs (a freeze, an enforced transfer on a lawful order, eligibility checks), so the Scenarios map lists it as an option for the cash leg too.'
  sources:
  - { title: 'ERC-7943, uRWA Universal Real World Asset Interface (Final; canSend, canReceive, canTransfer, frozen tokens, forcedTransfer)', url: 'https://eips.ethereum.org/EIPS/eip-7943', checked: '2026-11-06' }
