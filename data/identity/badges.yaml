- id: eudi
  name: EU · EUDI Wallet
  circle: schemes
  x: 378
  y: 945
  eth: false
  facts:
    subject: { in: [person, org], note: 'Natural and legal persons under Regulation (EU) 2024/1183.' }
    anchor: { in: [sovereign, licensed], note: 'Person identification data from the member state; attestations from qualified and other trusted providers.' }
    checked: { in: [offchain], note: 'Credentials are presented to a relying party over OpenID4VP; the ledger is not a party. A relying party may record its conclusion on chain.' }
    reveals: { in: [nothing] }
    revocation: { in: [list], note: 'Issuer-managed status, checked by the relying party at presentation.' }
    standard: { in: [national, ietf, iso], note: 'eIDAS 2.0; HAIP profiles OpenID4VCI, OpenID4VP, SD-JWT VC and ISO mdoc.' }
    pq: { in: [classical], note: 'HAIP 1.0, the profile the wallet ecosystem builds on, requires every issuer, verifier and wallet to support ECDSA with P-256 and SHA-256 at a minimum and says nothing about post-quantum algorithms; ecosystem profiles may add suites.' }
  desc: 'The European Digital Identity Wallet under eIDAS 2.0 (Regulation (EU) 2024/1183, in force 20 May 2024). Every member state must make at least one wallet available by about 24 December 2026, and regulated private services, banks among them, must accept it for identification by about 24 December 2027; as of October 2026 one national wallet, Denmark''s, was in production and the Commission had voiced doubt that all 27 states would meet the first date. It is the first sovereign scheme on this map built as a holder-carried credential: the wallet presents person identification data and attestations to a relying party with selective disclosure, over the OpenID4VC protocols profiled by HAIP. The relying party, not the ledger, verifies the presentation; carrying the result on chain is still the institution''s own step. The EU''s own credential ledger, EBSI, runs Hyperledger Besu, Ethereum client software, as a network of independently operated validator nodes under Europeum-EDIC, a private Ethereum-technology network in this map''s terms; the wallet does not depend on it, and the Web of Trust Map records the Commission-funded work moving toward web-based trust infrastructure.'
  sources:
  - { title: 'EBSI, About (a shared infrastructure operated by Europeum-EDIC for participating member states; each validator node, operated by an independent organisation, executes the smart contracts on the ledger)', url: 'https://ebsi.eu/about', checked: '2026-11-10' }
  - { title: 'LF Decentralized Trust, Deploying and Hosting EBSI Nodes Based on Hyperledger Besu (webinar, 6 March 2024; Howest University as the Belgian node operator)', url: 'https://www.lfdecentralizedtrust.org/learn/webinars/deploying-and-hosting-ebsi-nodes-based-on-hyperledger-besu', checked: '2026-11-10' }
  - { title: 'Web of Trust, Web of Trust Map: The Global Infrastructure of Decentralized Digital Identity (Key State Capital, September 2025; EBSI on Hyperledger Besu; eIDAS 2.0 work moving toward web-based solutions)', url: 'https://www.weboftrust.org/pdf/web-of-trust-map-report---the-global-infrastructure-of-decentralized-digital-identity.pdf', checked: '2026-11-10' }
  - { title: 'Open ID Europe, EUDI Wallet rollout timeline 2024–2027 (status October 2026)', url: 'https://www.openideurope.eu/digital-identity/eudi-wallet-timeline/', checked: '2026-11-06' }
