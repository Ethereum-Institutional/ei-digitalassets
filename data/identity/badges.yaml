# Identity badges: one per mechanism, placed in the region matching what it ESTABLISHES: verified identity (who),
# proof of control (which key), permission (what the address may do), or a combination (the overlaps).
# `circle` names the region's primary circle; x,y place the pill inside the overlap where it belongs. Ethereum blue
# (`eth: true`) marks a mechanism that lives on an Ethereum chain or is an Ethereum standard; gray marks one that
# works off the ledger and feeds it. Facts checked 6 November 2026. Writing rules: US spelling; no em-dashes; quote
# YAML values that contain ": "; "Ethereum mainnet" for the chain. Vendor statements are vendor-stated until
# independently verified; the descriptions say which.

as_of: 6 November 2026
badges:
# ---- Verified identity only: who, established off the ledger ----
- id: singpass
  name: SG · Singpass
  circle: schemes
  x: 668
  y: 945
  eth: false
  facts:
