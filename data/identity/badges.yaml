  sources:
  - { title: 'Bhutan NDI, Bhutan Adopts Ethereum for National Identity (13 October 2025; decentralized identifiers anchored to Ethereum, verifiable credentials and digital signing on Ethereum, migration planned by early 2026)', url: 'https://www.bhutanndi.com/resources/news/bhutan-adopts-ethereum-for-national-identity-a-new-chapter-in-digital', checked: '2026-11-10' }
