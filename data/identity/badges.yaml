- id: epassport
  name: ICAO · ePassport (9303)
  circle: schemes
  x: 815
  y: 945
  eth: false
  facts:
    subject: { in: [person] }
    anchor: { in: [sovereign], note: 'The issuing State: its Document Signer certifies the chip data under its Country Signing Certification Authority; certificates and revocation lists are exchanged through the ICAO Public Key Directory.' }
    checked: { in: [offchain], note: 'A reader verifies the State''s signature on the chip; the ledger is not a party. On the ledger only through ZK passport proofs.' }
    reveals: { in: [nothing], note: 'Reading a passport puts nothing on a ledger; a ZK passport proof reveals only the statement proved.' }
    revocation: { in: [list], note: 'Certificate revocation lists through the Public Key Directory; a lost or stolen document is revoked by its issuing State.' }
    standard: { in: [iso], note: 'ICAO Doc 9303, endorsed by ISO as ISO/IEC 7501.' }
    pq: { in: [classical], note: 'The chip carries a conventional public-key signature by the issuing state''s Document Signer under ICAO''s PKI; a signature forged after a quantum break passes every verifier, including the zero-knowledge proofs built over it.' }
  desc: 'The passport chip standard. ICAO Doc 9303 (Eighth Edition, 2021; endorsed by the International Organization for Standardization as ISO/IEC 7501) specifies the electronic machine readable travel document, a passport, visa or card with a contactless integrated circuit holding the holder''s data and a facial image in a standard logical data structure (Part 10), the security mechanisms for reading it (Part 11), and the public key infrastructure in which the issuing State''s Document Signer certifies the chip data under its Country Signing Certification Authority, with certificates and revocation lists exchanged through the ICAO Public Key Directory. It is the sovereign credential most people already carry, and it is read, not issued, by the private sector: a reader verifies the State''s signature off the ledger. It reaches the ledger only through the ZK passport proofs in the circles above, which prove a statement about the signed chip data to a verifier contract without the document leaving the device.'
  sources:
  - { title: 'ICAO, Doc 9303 Machine Readable Travel Documents, Part 1 Introduction (Eighth Edition, 2021): the eMRTD, the parts, the Document Signer and CSCA, the Public Key Directory, ISO/IEC 7501', url: 'https://www.icao.int/sites/default/files/publications/DocSeries/9303_p1_cons_en.pdf', checked: '2026-11-06' }
