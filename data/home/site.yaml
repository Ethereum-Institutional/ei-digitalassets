# Landing page: links to each map. Rendered from src/static.html (no diagram).

kind: static
title: Ethereum Institutional Research Maps
slug: index
eyebrow: Ethereum Institutional · Research
heading:
  text: Digital Asset Maps
  italic: Maps
intro: 'Interactive maps of how digital assets fit together: what they are, the networks that carry them, and the properties institutions weigh when they choose between deployments. Each map is an Ethereum Institutional house view for discussion, built in the open and maintained on GitHub.'
# cards: one per map; `path` matches data/nav.yaml. Cards for pages marked wip there show an "in progress" tag.
cards:
- path: web3
  title: Web3
  text: 'Three generations of the web as rings: Web 1.0 let anyone read, Web 2.0 let anyone write, Web3 lets anyone own. Follow a theme (technology, language, identity, content and more) across all three.'
- path: taxonomy
  title: Digital Asset Taxonomy
  text: 'How digital money, tokenized real-world assets and other crypto-assets relate, with regulatory lenses showing where each regime’s definition reaches.'
- path: networks
  title: Digital Asset Networks
  text: 'How the networks that carry digital assets differ: permissioned or permissionless consensus, and who may run a node (private, consortium or public), with the institutions live on each.'
- path: scenarios
  title: Scenarios
  text: 'What institutions do with digital assets: payments, delivery versus payment, repo, treasury management and collateral, each showing which leg moves on the ledger and what settles atomically.'
- path: decentralization
  title: Decentralization
  text: 'How decentralization is measured and where networks and deployments sit on it: validators, clients, governance, infrastructure and the people behind them.'
- path: privacy
  title: Privacy
  text: 'How confidentiality is achieved on shared ledgers, from permissioned visibility to zero-knowledge proofs, and what each approach gives up.'
- path: identity
  title: Identity
  text: 'How participants are identified and permissioned on digital asset networks: allowlists, verifiable credentials, attestations and compliance tooling.'
