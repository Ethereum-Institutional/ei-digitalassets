# Lens: Ethereum mainnet. `cells` places each property on the level the reading falls in under themes.yaml; `notes`
# carries the reading, its date and its source. Readings checked 25 October 2026; validator, client, builder and node
# shares drift weekly. Writing rules: US spelling; no em-dashes; "Ethereum mainnet" for the chain.

id: ethereum
order: 1
name: Ethereum mainnet
menu: Ethereum mainnet
short: Ethereum mainnet
color: '#312e81'
intro: 'Ethereum mainnet, read on 25 October 2026. Eight properties at level 5, two at level 4 and one at level 2. The two at 4: the open process that sets its rules still lets a client team block an upgrade, and the largest client on each layer still runs on more than a third of nodes. The 2016 DAO fork is disclosed under property rights; it passed ten years in July 2026, and the community has since declined to make another. The one at 2 is neutral inclusion: one builder assembles half of relayed blocks today, and the protocol changes that fix it are not yet live. Each of those dials says what is being done about it; a fix moves a dial only once it is live on mainnet. Everything else, from a decade without a halt to a stake that costs more than thirty billion dollars to attack and is destroyed if used, is why a global shared ledger is a different kind of infrastructure from any ledger one party runs.'
