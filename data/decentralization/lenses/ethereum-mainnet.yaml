notes:
  history: '11.2 years in continuous production since the Frontier launch on 30 July 2015, through a change of consensus (the Merge, 15 September 2022, no history lost); ethereum.org counts 16 upgrades and no downtime. Tested twice without stopping: in November 2020 a minority of nodes on outdated Geth split off while the canonical chain kept producing blocks, and in May 2023 finality was delayed for four and then nine epochs while blocks continued and the chain recovered without intervention. One irregular state change, the DAO fork of 20 July 2016, disclosed and more than ten years old.'
  developers: 'The largest developer base of any ledger: 6,244 monthly active developers in Electric Capital’s 2024 report (the top ecosystem on every continent; more than half work on its Layer 2s), and 31,869 active developers in Electric Capital’s data to September 2025 on its broader measure. The core is spread across 7 execution and 6 consensus client teams (5 and 6 shipped the Fusaka upgrade) and 190 Protocol Guild members across 28 teams (August 2026). Level 5 on the absolute test, not because the base is the largest: thousands of monthly active developers, eleven production client teams in independent organizations, and no single funder paying most core maintainers.'
  stop: 'HHI about 600 on attributed stake (Lido 21.5%, Binance 7.4%, ether.fi 4.0%, Kraken 3.7%, Coinbase 3.3%, Figment 3.0%, Blockdaemon 2.5%, then 740 smaller entities; hildobby’s Dune dashboard, 25 October 2026), unconcentrated by the merger-guideline standard. Four brands together reach one third of stake (the Nakamoto coefficient at the finality threshold), but a brand is not a party: Lido is 772 operator records across its modules, and the keys that would have to go silent belong to its node operators, each a small fraction of all stake, so the number of parties that could halt finality is well above the handful line. The set is open, anyone may join it with 32 ETH, so the HHI bands apply: level 5. 819,915 active validators (Beaconscan, 25 October 2026). The legitimate concern: 39% of stake is not attributed to any named entity. Even counted as one entity it would give an HHI of about 2,100, but treat it as unknown, not as solo stakers; it is a limit of the public record and is not scored either way.'
  cost: 'About 14.6 million ETH, one third of the 43.9 million staked, worth about USD 34 billion at USD 2,341 (25 October 2026), must be acquired to stall finality, and reverting a finalized block means committing to lose at least that third: slashing destroys the stake, with a correlation penalty that scales with the total slashed, up to the whole balance (ethereum.org, proof of stake and rewards and penalties pages).'
  rules: 'Changes are Core EIPs agreed by rough consensus on All Core Devs calls, implemented independently by every client team and adopted by node operators who choose to upgrade; there is no coin vote and nobody can compel adoption (ethereum.org governance, EIP-1). Sixteen upgrades have shipped this way, the latest Fusaka on 3 December 2025. Level 4 rather than 5 because a client running on more than a third of nodes could block an upgrade by refusing to implement it; operators can switch clients and another team can fork the code, so the block is contestable, and it disappears when every client is below a third (see the single-point-of-failure dial).'
  property: 'No protocol role, opcode or key can freeze, move or seize a balance; state changes only through signed transactions, and nodes record every transaction without discrimination (ethereum.org). No balance has been changed outside the rules in the last ten years: level 5. Disclosed for ever: the DAO fork of 20 July 2016, a client-coordinated irregular state change that moved about 12 million ETH, which passed ten years in July 2026. The evidence since points the other way: in 2018 the community declined EIP-999, which would have restored the roughly 513,000 ETH frozen in the Parity multisig library, and no irregular state change has been made since. Controls the law requires live with issuers at the token layer: Circle’s USDC contract can blocklist addresses, and Circle’s terms say it may freeze USDC on a legal order.'
  verify: 'One global state that anyone can verify in full: a node needs 16 GB of RAM, a 2 TB NVMe drive and a 25 Mbit/s connection (ethereum.org run-a-node page, August 2026), hardware ethereum.org describes as consumer grade; about 8,500 full nodes were counted by the Cambridge Centre for Alternative Finance in 2026, beside roughly 820,000 validators.'
  entry: 'Anyone may hold and send assets, and anyone may validate with 32 ETH (up to 2,048 ETH per validator since Pectra) without approval; the activation queue was 23 days on 25 October 2026 (validatorqueue.com), exit about a day. Leaving is a withdrawal, not a negotiation.'
  resilience: 'Five execution and six consensus clients in production (Fusaka shipped on 5 and 6), the most of any ledger. The legitimate concern, and why this dial reads 4: the largest client on each layer still runs on more than a third of nodes on every published series, Geth on 50% of crawled execution nodes (43% by self-reported stake) and Lighthouse on 49% of crawled consensus nodes (Teku on 54% of validators by Rated’s count). The series disagree because they count nodes, stake or validators, but every one puts a client above the 33% at which a single bug could stall finality. The fix is operational, not protocol: the community’s goal is every client under 33%, and the clients exist to make that possible. Hosting is spread, with a second concern inside it: Hetzner, AWS and OVH together host about 40% of nodes, 36% run on residential hardware, and the United States, Germany, Finland and France hold about 62% between them (Cambridge Centre for Alternative Finance, July 2026). Unconcentrated by the merger-guideline standard, but a change of terms at one provider or a legal order in two jurisdictions would reach a large share of nodes at once; no protocol change fixes that. If you run a node, run it somewhere else.'
  issuance: 'The Ethereum Foundation held 0.26% of supply at the end of October 2024 (EF Report 2024) and under 0.3% in August 2025. Issuance is set by protocol: about 0.5% a year to validators, net supply growth 0.83% over the year to 25 October 2026 (ultrasound.money). The 2014 sale was open to anyone; its two endowment pools (early contributors and the Foundation) were each 9.9% of the ether sold. The legitimate concern: the early-contributor pool has never been re-disclosed, so it is recorded here and not counted, which is why this reading rests on the Foundation’s disclosure alone.'
  inclusion: 'Level 2, the lowest dial on this page and the main legitimate concern. Titan assembled 52.7% of MEV-Boost relayed blocks over the seven days to 25 October 2026 (Quasar 21.2%, BuilderNet 13.4%), and relays that filter sanctioned addresses delivered 17.6% of blocks on 24 October, down from a 2022 peak near 95% (relayscan.io; mevwatch.info). Builders cannot finalize anything or touch a balance, and a validator may build its own block, but today most do not. Two protocol changes address it: enshrined proposer-builder separation (EIP-7732, Last Call, scheduled for Glamsterdam) and inclusion lists (FOCIL, EIP-7805, Draft, the consensus-layer headliner for Hegotá), which would move this dial to 5 once live. Nothing moves until it is live on mainnet.'
