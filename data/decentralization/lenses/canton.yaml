# Lens: Canton Network, read as the Global Synchronizer and Canton Coin run by the Super Validators. `cells` places
# each property on the level the reading falls in under themes.yaml; `notes` carries the reading, its date and its
# source. Readings checked 26 October 2026 from the live DSO rules; the SV set, weights and validator count drift.
# Writing rules: US spelling; no em-dashes; "Ethereum mainnet" for the chain when it is compared.

id: canton
order: 3
name: Canton Network
menu: Canton
short: Canton
color: '#a21caf'
intro: 'Canton Network, read on 26 October 2026: the Global Synchronizer and Canton Coin as run by the Super Validators. All eleven properties at level 2. The three that define it: the synchronizer is ordered by 13 Super Validator nodes of 11 institutions, a club assembled by the vendor in which three parties can halt settlement; the rules are written and implemented by one vendor and ratified by a vote that has never gone against it; and there is no global state, so each participant verifies its own records while only Canton Coin is public. The design buys sub-transaction privacy and a membership of regulated institutions; what it does not give you is an operating record over three years, a security you can price, or a ledger anyone can check.'
