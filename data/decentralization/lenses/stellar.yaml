# Lens: Stellar (the public network). `cells` places each property on the level the reading falls in under
# themes.yaml; `notes` carries the reading, its date and its source. Readings checked 26 October 2026; the Tier 1 set,
# validator versions and SDF holdings drift. Writing rules: US spelling; no em-dashes; "Ethereum mainnet" for the chain
# when it is compared.

id: stellar
order: 5
name: Stellar
menu: Stellar
short: Stellar
color: '#0369a1'
intro: 'Stellar, read on 26 October 2026. One property at level 5, two at level 4, two at level 3 and six at level 2. Verifiability is the one at 5: a public ledger anyone can check in full on a 16 GB node. Three things define the rest. Consensus weight is membership: ten named Tier 1 organizations, each admitted by the existing ones over months, decide every vote at a threshold of seven, so four of them can halt settlement, rule changes are SDF’s proposals that the group has always ratified, inclusion sits with the same group, and nothing is staked or slashed. One client, stellar-core, written by SDF, runs every validator. And since May 2026 the base layer has a validator-voted freeze list, while SDF still holds 29% of a fixed supply. Eleven years in production and no network-wide halt since 2019 count in its favor.'
