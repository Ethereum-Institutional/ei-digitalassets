readings:
  history: '6.6 years; 7 halts; last restart Feb 2024'
  developers: '17,708 developers; Anza writes most core'
  stop: 'HHI about 150; 18 entities to 40%'
  cost: 'USD 17.7 billion to stall, not slashable'
  rules: 'Stake votes; 100,000 SOL to propose'
  property: 'No freeze function; never intervened'
  verify: 'About 3,200 RPC nodes; 512 GB RAM'
  entry: 'No minimum stake; 690 validators, falling'
  resilience: 'Agave-based 82%; Firedancer 17%'
  issuance: 'About 48% to insiders; +3.6% a year'
  inclusion: 'BAM assembles 37%; no forced inclusion'
notes:
  history: '6.6 years since the mainnet-beta launch on 16 March 2020, and the network still carries the beta label (the public RPC endpoint is api.mainnet-beta.solana.com). Seven network-wide halts, each ended by a validator-coordinated restart: December 2020 (about 6 hours), 14 September 2021 (about 17 hours), 30 April to 1 May 2022 (about 8 hours), June 2022 (about 4.5 hours), September 2022 (about 8.5 hours), 25 February 2023 (about 19 hours) and 6 February 2024 (about 5 hours; Helius outage history). No halt since, 2.7 years, through the slot-time cut and the Alpenglow switch on 21 October 2026. Level 3 rather than 4 because the 5-to-10-year band requires no network-wide halt; it reaches 4 by running without one until 2029.'
  developers: 'Electric Capital counts 17,708 active Solana developers in the nine months to September 2025 (second to Ethereum mainnet’s 31,869; 11,534 newcomers in the period) and about 3,000 monthly active developers in late 2025 (secondary reports of the same dataset). The core is narrower than the ecosystem: Agave, which runs about 82% of stake, is written by Anza (spun out of Solana Labs in 2024; 357 contributors, with Anza staff the top committers), and Anza researchers authored Alpenglow (SIMD-0326), the admission ticket (SIMD-0357) and the migration (SIMD-0384). Jump’s Firedancer (57 contributors) is the second production core; Jito Labs and Harmonic maintain Agave forks; Mithril (Overclock) and Sig (Syndica) are in development. Level 3 rather than 4 because one organization writes a majority of the production core.'
  stop: 'HHI about 150 on stake grouped by operator (vote-account HHI 101; Figment with Ledger by Figment 6.0%, Stakin 4.6%, Helius 3.8%, Bitwise with Chorus One 3.6%, Kraken 2.9%, Binance 2.9%, Jupiter 2.2%, Coinbase 2.0%, Everstake 1.8%, Kiln 1.6%; Stakewiz and the mainnet RPC, 26 October 2026), unconcentrated by the merger-guideline standard: level 5. 690 vote accounts hold stake (665 voting, 25 delinquent); 32.9% of stake sits on unnamed vote accounts counted as separate operators, which could understate concentration. Under Alpenglow the safety threshold is 20% and the liveness threshold 40%: 5 operators together exceed 20%, 12 exceed one third (18 by vote account, as Solana Compass and Fidelity’s FCAT report), 18 exceed 40%. The Foundation Delegation Program fell from 44.4% of stake at launch to 5.9% at epoch 881 (Solana Foundation case study, January 2026); liquid staking is about 13% of stake. Hosting concentration is scored under single points of failure.'
  cost: 'To stall finality an attacker must silence more than 40% of stake, about 175 million SOL, USD 17.7 billion at USD 101.12 on 26 October 2026, or 20% alongside a further 20% that happens to be offline (USD 8.9 billion); 20% of stake equivocating could in principle finalize conflicting blocks. None of it is destroyed if used: Solana has no slashing. SIMD-0204 (slashable event verification, Anza, status Review) would only record proofs of duplicate blocks on chain and “does not modify any stakes or rewards”; the penalty economics are a later SIMD. The protocol’s only penalty is the loss of future rewards. Level 3 is the cap for stake that is neither slashed by the protocol nor specific to the chain: it can be sold the next day.'
  rules: 'Protocol changes are SIMDs on GitHub (anyone may open one), implemented in Agave by Anza and activated by feature gates once a supermajority of stake runs supporting software; validators can block by not upgrading. Economic and directional questions go to stake-weighted votes: SIMD-0228 (issuance curve) failed in March 2025 at 61% of votes cast against a two-thirds bar, SIMD-0326 (Alpenglow) passed in September 2025 with 98.27% of a 52% turnout, and the Solana Governance Proposals framework launched on 2 July 2026 (a validator with 100,000 SOL may propose, endorsements from 15% of stake open a vote, quorum one third, approval two thirds; delegators may override their validator). SGP-0001 passed with 95.35% and SGP-0002 (faster disinflation) with 68.77% in August 2026. Level 3 because the deciding set is stake, in which about twelve operators hold a blocking third, and the Foundation and Anza hold the activation keys.'
  property: 'No protocol role, instruction or key can freeze, move or seize a balance; state changes only through signed transactions. The seven coordinated restarts resumed from the last optimistically confirmed slot and changed no confirmed balance, and the Alpenglow migration (SIMD-0384) rolled back only the vote-only slots it defined in advance. Controls the law requires live with issuers at the token layer: the USDC mint on Solana carries a Circle freeze authority (read from the mint on 26 October 2026), and SPL Token lets any issuer set one on its own mint. Level 4 rather than 5 because the top band asks for ten years of production; the record so far is clean.'
  verify: 'One global state anyone may replay, but not on consumer hardware: Anza’s requirements are a 12-core, 24-thread CPU at 2.8 GHz or faster, a motherboard able to hold 512 GB of RAM (RPC nodes 256 GB or more, 512 GB with account indexes), three NVMe drives of 1 TB, 1 TB and 500 GB, and 1 Gbit/s for an unstaked node (2 to 10 Gbit/s staked); Firedancer 26.10 uses 159 GiB of memory on mainnet. History is not kept by ordinary nodes: verifying from genesis depends on provider-supplied archives and snapshots. Gossip listed 3,918 nodes on 26 October 2026 against 690 voting validators, so about 3,200 are RPC or non-voting nodes (Helius counted 3,100 RPC nodes in October 2024). Level 4: anyone can verify, with heavy hardware.'
  entry: 'Anyone may transact, and anyone may run a validator with no minimum stake and no approval. The bar is economic: since Alpenglow every voting validator pays a Validator Admission Ticket of 1.6 SOL per epoch, burned (SIMD-0357; it replaces about 2 SOL of vote fees per epoch, and an epoch is now about a day), plus about USD 60,000 a year of hardware and bandwidth; Fidelity’s FCAT puts break-even near 200,000 SOL of delegated stake. The validator set has fallen from about 2,500 in early 2023 to 690 with stake on 26 October 2026 (665 voting; Bitwise counted 659 at the end of September), partly as Foundation delegation was withdrawn. Exit is a stake deactivation at the next epoch boundary. Level 4: open, but the bar excludes most participants.'
  resilience: 'Two independent clients in production: Agave and its forks (Jito-Solana, Harmonic Salsa, Rakurai) on 82.4% of stake, all on Agave 4.3.2, and Jump’s Firedancer family on 17.3% (Firedancer 26.10.3 and 26.10.4; Stakewiz and the mainnet RPC, 26 October 2026). One code base above two thirds means one bug can finalize a wrong chain, which fixes this dial at level 3; Firedancer’s share has to pass a third to move it. Hosting is the second concern: Teraswitch carries 28.4% of stake, Latitude.sh 10.3%, Cherry Servers 7.6%, Allnodes 7.3% (ASN HHI about 1,180); Germany holds 34.7%, the Netherlands 20.5%, the United States 14.4%, and Frankfurt alone 33.0%. On 12 August 2026 a Teraswitch routing fault took 28.8% of stake offline for 33 minutes, 4.5 points short of the one-third halt line then in force (InfStones; FCAT). The Foundation’s delegation rules now cap any one ASN at 25% and any data center at 15%.'
  issuance: 'At genesis (March 2020, 500 million SOL) about 48% went to insiders by Messari’s count: seed sale 15.9%, founding sale 12.6%, team 12.5%, validator and strategic sales 6.9%, with a further 12.5% to the Solana Foundation and 38% to a Foundation-controlled community reserve; the public auction was 1.6%. The Foundation has not published its holdings since, and Solana Labs, the team and the FTX estate have sold or distributed unknown amounts, so the founding set’s share today cannot be dated and the genesis reading stands. Issuance follows the protocol schedule, 3.59% a year at epoch 1068 (mainnet RPC, 26 October 2026), falling 15% a year toward 1.5%; SGP-0002 (SIMD-0550, double disinflation) passed in August 2026 but is not yet implemented. Level 2 until a dated disclosure shows the founding set under a quarter.'
  inclusion: 'The slot leader orders transactions, and leaders rotate by stake, so no validator produces more than Figment’s 6%. But 37.2% of stake (Jito BAM 35.5%, FireBAM 1.6%; Stakewiz, 26 October 2026) hands block assembly to Jito’s Block Assembly Marketplace, whose nodes are run by Jito Labs with a small admitted set of operators and whose scheduling is closed source, and 98.5% of stake accepts bundles from Jito’s block engine. That puts the largest assembler between a third and a half. No evidence of a sanctions filter at the engine or in clients; the Jito and Marinade blacklists (JIP-22) withdraw stake from validators that sandwich users, which is a stake decision, not a transaction filter. Nothing lets a validator force a transaction into someone else’s block. Level 3.'
