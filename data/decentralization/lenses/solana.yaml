# Lens: Solana mainnet-beta. `cells` places each property on the level the reading falls in under themes.yaml;
# `notes` carries the reading, its date and its source. Readings checked 26 October 2026, five days after Alpenglow
# replaced Tower BFT; stake, client and hosting shares drift weekly. Writing rules: US spelling; no em-dashes;
# "Ethereum mainnet" for the chain when it is compared.

id: solana
order: 4
name: Solana
menu: Solana
short: Solana
color: '#6366f1'
intro: 'Solana mainnet-beta, read on 26 October 2026, five days after Alpenglow replaced Tower BFT. One property at level 5, three at level 4, six at level 3 and one at level 2. The one at 5 is who can stop it: stake is spread across about 630 operators with an HHI near 150, and eighteen of them would have to go silent together to stall it. Three things define the rest of the reading: a six-year record with seven coordinated restarts, the last in February 2024; one code base on 82% of stake, hosted 28% at one provider and a third in Frankfurt; and a stake that costs USD 17.7 billion to stall but is never slashed. Issuance is the level 2: about half of genesis went to insiders and the Foundation has not dated its holdings since.'
