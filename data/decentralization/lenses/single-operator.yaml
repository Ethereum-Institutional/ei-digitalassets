notes:
  history: The ledger’s record is the operator’s record; it starts when the operator launches it and ends if the operator stops.
  developers: One vendor’s team maintains the software, or the operator’s own staff do; the roadmap is theirs.
  stop: One party can halt settlement, by decision, by outage or by order.
  cost: Control costs the operator nothing; it already has it. An attacker needs only the operator’s keys or the operator’s consent.
  rules: The operator changes fees, formats and access terms as it chooses.
  property: The operator can freeze, move or delete any balance.
  verify: Participants receive statements; nobody outside can verify the state.
  entry: The operator admits users and nodes, and can remove them.
  resilience: One client on the operator’s infrastructure; one bug or one outage stops it.
  inclusion: The operator assembles every block and can drop any transaction, with no recourse.
  issuance: Balances are the operator’s liabilities; there is no neutral asset.
