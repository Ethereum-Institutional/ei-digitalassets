# Lens: a ledger with one operator (an architecture, not any product). Lands at level 1 on every property.
id: single
order: 3
name: A private chain, one operator
menu: Private chain
short: a private chain
color: '#6b6760'
intro: 'A ledger run by one organization, whether a bank, a vendor or a market infrastructure, with permissioned nodes and a single administrator. It can be fast, confidential and compliant, and it lands at level 1 on every property on this page, because each property is held by the operator rather than by the ledger. Everything it offers is a promise; nothing is verifiable from outside; and every risk (outage, insolvency, a legal order, a change of terms) is the operator’s risk, borne by its users. Ethereum Institutional supports private deployments where that trade is the right one, and this map shows what is traded.'
