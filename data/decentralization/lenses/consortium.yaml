# Lens: a consortium ledger (an architecture, not any product). Several members run it and admit new members by vote.
id: consortium
order: 2
name: A typical consortium ledger
menu: Typical consortium
short: a typical consortium
color: '#0ea5e9'
intro: 'A ledger run by a defined group of organizations that admit new members by vote, each running its own node under one software implementation, typically with a shared governance body and a treasury rather than a neutral asset. It removes the single point of failure and spreads control across the members, which is a real gain over one operator, and it lands at levels 2 and 3 on most properties: the group can be compelled as a whole, outsiders cannot verify it, nobody outside can join or build on it without permission, and the software usually has one maintainer. Typical of the consortium networks on the Digital Asset Networks map.'
