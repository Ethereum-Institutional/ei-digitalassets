readings:
  history: '17.8 years; last chain split 2013'
  developers: 'Thousands; core funded by many orgs'
  stop: 'HHI about 1,580; 3 pools to 51%'
  cost: 'USD 12 billion in ASICs, sunk if used'
  rules: '3 soft forks since 2016; miners can stall'
  property: 'No freeze function; none since 2010'
  verify: 'About 12,900 reachable nodes; 2 GB RAM'
  entry: 'No approval, no minimum to mine'
  resilience: 'Core 82%, Knots 17%, one code base'
  issuance: 'No foundation; 5.5% dormant since 2010'
  inclusion: 'Largest pool 25.9%; F2Pool 16.6% filters'
notes:
  history: '17.8 years in continuous production since the genesis block of 3 January 2009, and block production has never stopped network-wide. Two early incidents, both disclosed and both older than ten years. On 15 August 2010 a value-overflow bug created 184 billion BTC in block 74,638; a patched client shipped within five hours and its chain overtook the invalid one at block 74,691 the next day (Bitcoin Wiki, value overflow incident). On 11 March 2013 a large block split version 0.8 nodes from older ones; the large pools downgraded and the network reunified on one chain the same day, with no loss of user funds (bitcoin.org alert; BIP 50). Neither halted the ledger. Nothing comparable since, so the reading is more than ten years with every intervention disclosed and over a decade old: level 5.'
  developers: 'Thousands active on Electric Capital’s broad measure (about 1,200 monthly active in its 2024 report; 7,494 new Bitcoin developers in the first nine months of 2025), wallets, Lightning and tooling included, which is the base an institution builds on. Core work is funded by many independent organizations with none dominant: Brink, Chaincode Labs, Blockstream, Spiral (formerly Square Crypto), MIT Digital Currency Initiative, OpenSats, HRF and others; Jameson Lopp’s statistics count 135 individuals contributing code to Bitcoin Core in 2025. If any one funder walked away, Core would keep improving: level 5. Five people hold merge keys, and one code base (Core and its Knots fork) runs on 99% of nodes; that concentration is scored on the resilience dial, not here.'
  stop: 'HHI about 1,580 on block share by mining pool over the 30 days to 26 October 2026 (mempool.space, 4,553 blocks: Foundry USA 25.9%, AntPool 20.8%, F2Pool 16.6%, ViaBTC 9.3%, SpiderPool 6.2%, MARA Pool 5.1%, SECPOOL 4.0%, Luxor 4.0%, OCEAN 2.9%, Braiins 1.5%, then seven smaller pools), moderately concentrated by the merger-guideline standard: level 4. The seven-day figure is about 1,600. Three pools reach 51%, the Nakamoto coefficient, shown and not scored. The legitimate concern: 0xB10C’s template analysis (April 2025) finds Poolin, Braiins, Binance Pool, SECPOOL, Luxor and CloverPool relaying AntPool’s block templates; counted as one entity they are 32.4% of blocks and the HHI rises to about 2,160, highly concentrated. That grouping is an inference from stratum job data (Braiins disputes it), so it is recorded, not scored. Hash power can leave a pool in minutes, which is the mitigation, and the reason pools rather than machine owners are the entities counted.'
  cost: 'To reach 51% of the 1,085 EH/s network (mempool.space, 26 October 2026) an attacker needs about 553 EH/s: about 2.0 million Antminer S21 XP units at the USD 6,000 vendor list price of September 2026, roughly USD 12 billion of hardware before sites and 7.5 GW of power. crypto51.app prices that hash power at USD 1.8 million an hour and finds 0% of it available for rent, so an attack means buying or diverting machines the market does not hold. Proof of work has no slashing, but the hardware does nothing except SHA-256: an attack that broke trust in the chain would collapse the price and with it the resale value of the machines, which is Budish’s point that specialized hardware is the proof-of-work analogue of slashing. Level 4, not 5, because the loss comes from the market, not the protocol: it falls on whoever owns the machines, so a pool operator or a renter directing hash power it does not own bears none of it, and a state attacker with no plan to resell is not deterred by it.'
  rules: 'Changes are BIPs (BIP 2) with no vote; a soft fork ships in a client and takes effect when miners signal (95% under BIP 9; 90% in Taproot’s Speedy Trial, BIP 343) and economic nodes enforce it. Three soft forks since 2016: CSV (BIP 68, 112 and 113, July 2016), SegWit (BIP 141, block 481,824, 24 August 2017, after BIP 91 and a user-activated threat broke a miner stall) and Taproot (BIP 341, block 709,632, 14 November 2021); none in five years. Anyone may propose, implement or adopt and nobody can force a change, but a tenth of hash power can decline to signal, and five maintainers gate what merges into the client on 82% of nodes. The covenant proposals (OP_CAT, BIP 347; CTV, BIP 119; CSFS, BIP 348) have debated activation since 2022 with no path agreed, evidence that change is hard. Level 4.'
  property: 'No opcode, role or key can freeze, move or seize a balance; state changes only through signed transactions. No balance has been changed outside the rules since 2010. Disclosed for ever: the value-overflow fix of 15 August 2010, a soft fork that rejected the overflowing transaction and replaced 53 blocks, erasing the 184 billion BTC it had created; and the March 2013 split, resolved by pools downgrading, which reorganized the blocks mined on version 0.8 (BIP 50). Both are more than ten years old, with sixteen years of not intervening since: level 5. Asset-level controls do not exist at the base layer at all: an issuer that needs a freeze keeps it off-chain or on another ledger, which is one reason tokenized assets rarely settle here.'
  verify: 'One global state that anyone verifies in full on consumer hardware. Bitcoin Core’s stated minimum is 750 GB of disk, 2 GB of RAM and about 15 GB a month of bandwidth (bitcoin.org requirements page); the chain was 778 GB on 25 October 2026 (blockchain.com), and a pruned node runs in 7 GB after verifying everything from genesis. Bitnodes counted 12,858 reachable nodes on 26 October 2026 (6,645 IPv4, 990 IPv6, 4,793 I2P, 423 Tor in that snapshot); nodes behind firewalls are several times more and are not counted here. Initial sync takes hours to a day on a desktop. No privileged reader: level 5.'
  entry: 'Anyone may hold and send bitcoin, run a node and mine without approval, with no stake, no identity and no minimum: proof of work at any scale, down to a CPU or a hobby device, earns its pro-rata share through a pool, and exit is a transaction. That is the most open entry of any ledger on this page. The economics favor scale (one Antminer S21 XP, 270 TH/s, listed at USD 6,000 in September 2026; producing blocks independently at 1% of the 1,085 EH/s network needs some 40,000 machines), and a pool member delegates block assembly to the pool, which the inclusion dial reads; but nothing is required to take part: level 5.'
  resilience: 'Bitcoin Core runs on 82.4% of reachable nodes and Bitcoin Knots on 17.0% (bitnodes snapshot, 26 October 2026, 12,858 nodes); btcd on 0.2%, bcoin and libbitcoin a handful. Knots is a patched fork of Core that shares its consensus code, so one code base validates on over 99% of nodes and one bug reaches all of them: the September 2018 inflation bug (CVE-2018-17144) was in that code and was fixed before anyone used it. Independent fallbacks exist (btcd, bcoin, libbitcoin) but are not run at scale, which is the level 3 cell, one implementation above two thirds. The Knots share is a policy protest over OP_RETURN limits after Core 30.0 (October 2025), not client diversity. The snapshot gives no country or provider shares (52% IPv4, 8% IPv6, 37% I2P, 3% Tor), so hosting concentration is not read here.'
  issuance: 'Issuance is fixed by protocol: 3.125 BTC a block since the halving at block 840,000 on 20 April 2024, about 164,000 BTC a year, 0.82% of the 20,103,787 BTC in circulation (blockchain.com, 26 October 2026), halving again in 2028, cap just under 21 million. No foundation, treasury or premine, and nobody can change the schedule alone. The founding share is the creator’s own mining: Sergio Lerner’s Patoshi analysis (2019) attributes about 22,000 early blocks, about 1.1 million BTC or 5.5% of supply, to one miner, BitMEX Research about 700,000 (3.5%); 99.9% of it has never moved. It is an estimate from chain patterns, not a disclosure. Those coins belong to no identifiable party, have not moved in sixteen years and carry no vote (Bitcoin has none), so under the dial’s rule they are disclosed here, not counted: level 5, with the overhang named (about USD 88 billion at USD 80,213 on 26 October 2026) and the dial dropping the day they move.'
  inclusion: 'Pools assemble blocks: Foundry USA 25.9%, AntPool 20.8%, F2Pool 16.6% (mempool.space, 30 days to 26 October 2026), so no producer is above a third. Filtering is the concern. 0xB10C’s miningpool.observer found F2Pool omitting OFAC-sanctioned transactions in 2023 (which F2Pool acknowledged) and again in nine blocks in December 2024 and January 2025; every one was mined later by another pool, and no 2026 report either way was found. OCEAN (2.9%) defaults to a Knots template that drops data-carrying transactions, overridable per miner through DATUM since September 2024. With F2Pool’s 16.6% counted, filtering sits in the 10% to a third band: level 3. Pools relaying AntPool’s templates would put one party’s template choice near a third of blocks. There is no inclusion list; Stratum V2 and DATUM let miners build their own templates, and only a few pools run them.'
