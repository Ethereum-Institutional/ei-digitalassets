# Lens: Bitcoin. `cells` places each property on the level the reading falls in under themes.yaml; `notes` carries
# the reading, its date and its source. Readings checked 26 October 2026; pool shares, node counts and hashrate drift
# weekly. Writing rules: US spelling; no em-dashes; "Ethereum mainnet" for the chain when it is compared.

id: bitcoin
order: 2
name: Bitcoin
menu: Bitcoin
short: Bitcoin
color: '#155e75'
intro: 'Bitcoin, read on 26 October 2026. Six properties at level 5, three at level 4 and two at level 3. The six at 5: 17.8 years without a network-wide halt; a developer base funded by many independent organizations; no balance changed outside the rules since 2010; a ledger anyone verifies in full on a desktop with 2 GB of RAM; entry with no stake and no minimum; and an asset with no foundation and a fixed schedule, whose only founding share has not moved since 2010. The two at 3 define the rest: one code base (Bitcoin Core and its Knots fork) validating on 99% of nodes, and the three largest pools assembling 63% of blocks, one of them on record omitting sanctioned transactions. At 4: who can stop it (HHI about 1,580 across pools), the security budget (USD 12 billion of hardware that would lose its value with the chain, imposed by the market rather than the protocol), and the rules (an open process in which miners and the maintainers of the one client can still block a change).'
