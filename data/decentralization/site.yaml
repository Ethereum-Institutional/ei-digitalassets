score:
  title: Weighted score
  text: 'The default weights are ours; move the sliders to make the score yours. Your weights stay in your browser and are not sent anywhere.'
stats:
  title: What an open ledger attracts
  text: 'A ledger nobody owns is the one everybody can build on, so it draws the widest participation: the most holders, the most tokenized assets, the deepest tokenized-currency liquidity and the largest developer base. That is what you join when you settle on it. Figures are for Ethereum mainnet alone unless stated, checked 25 October 2026.'
  items:
  - label: holders of tokenized dollars
    value: 27.0 million
    text: Addresses holding a stablecoin on Ethereum mainnet, beside 288,000 holders of tokenized real-world assets.
    sources:
    - { title: 'rwa.xyz, Ethereum network page', url: https://app.rwa.xyz/networks/ethereum, checked: '2026-10-25' }
  - label: in tokenized real-world assets
    value: USD 15.9 billion
    text: Treasuries, funds, credit and other tokenized assets on Ethereum mainnet, the largest of any network.
    sources:
    - { title: 'rwa.xyz, Ethereum network page', url: https://app.rwa.xyz/networks/ethereum, checked: '2026-10-25' }
  - label: in tokenized currency
    value: USD 143 billion
    text: Dollar stablecoins circulating on Ethereum mainnet (plus about EUR 600 million in euro tokens), the deepest pool of tokenized money on any ledger.
    sources:
    - { title: 'DefiLlama, stablecoins by chain', url: https://defillama.com/stablecoins/Ethereum, checked: '2026-10-25' }
  - label: active developers
    value: '31,900'
    text: Developers active in the Ethereum ecosystem including its Layer 2s in Electric Capital’s data to September 2025, the largest of any ecosystem; 6,244 monthly active in its 2024 report.
    sources:
    - { title: 'Electric Capital, 2024 Developer Report', url: https://www.developerreport.com/reports/devs/2024, checked: '2026-10-25' }
    - { title: 'Electric Capital data to September 2025, as reported 17 October 2025', url: https://finance.yahoo.com/news/ethereum-leads-16-000-developers-054251913.html, checked: '2026-10-25' }
footnote: 'Readings for Ethereum mainnet were checked on 25 October 2026 and drift; validator, client and builder shares change weekly. The levels are an Ethereum Institutional house method informed by Srinivasan and Lee (2017), the Edinburgh SoK on measuring decentralization (2025), the US Merger Guidelines (2023) and Budish (2018, Quarterly Journal of Economics 2025). This map is a house view for discussion, not legal advice. © 2026 Ethereum Institutional. Licensed under CC BY-NC-ND 4.0 (non-commercial use only; no derivatives without consent).'
