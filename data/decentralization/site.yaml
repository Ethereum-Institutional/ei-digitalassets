intro: 'How decentralization is measured and where networks and deployments sit on it. The map will separate the layers that can each be more or less decentralized: who orders transactions (validators and their stake or work), who writes and runs the software (clients and their diversity), who decides changes (governance), what the network runs on (infrastructure, hosting and geography), and who holds the asset. It will place the networks from the Digital Asset Networks map on those layers with sourced measurements.'
