# Digital Asset Taxonomy: layout (geometry only)
# cx,cy,rx,ry = ellipse centre and radii; t:rect uses x,y,w,h,r. lx,ly = label anchor; fs/fw = label font size/weight.
# suby/sy/s3y/liney/l2y position the small sub-labels. Units are SVG user units on a 1600×1300 canvas.

# bridges: corridors that join a lens group's perimeter into one continuous outline, keyed "<lens id>.<group id>".
#   Each corridor is a list of [x, y] waypoints routed through empty space so the outline encloses no other circle.
bridges:
  ch.pay:
  - [[330, 560], [372, 610], [930, 610], [964, 550]]   # Other Layer-1s → USDC, USDT
  - [[330, 560], [372, 700], [392, 836]]               # Other Layer-1s → Community Coins
