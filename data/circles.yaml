# Digital Asset Taxonomy — circles (content)
# Each circle: id, label (lines), family (palette key) or explicit colors, optional sub-labels, and its definition (desc).
# Positions and sizes live in data/layout.yaml so content edits never touch geometry.
# `containers` are grouping circles whose lens status is derived from what they contain (`children`).
# `inherit_status`: a circle takes its lens status from another when a lens does not mention it.

