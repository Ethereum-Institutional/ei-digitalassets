circles:
- id: da
  label:
  - Digital Assets
  family: da
  path: ''
  desc: All assets whose ownership is recorded and transferred on a distributed ledger (DLT). We use “Digital Assets” rather than “Crypto-Assets” for the outer set because in regulation (EU MiCA, Dubai VARA) “crypto-asset / virtual asset” is a legal term that excludes CBDCs, deposits and tokenized securities.
- id: dm
  label:
  - Digital Money
  family: dm
  path: Digital Assets
  desc: 'On-chain assets designed to function as money: a medium of exchange, unit of account or settlement asset. Includes both native cryptocurrencies and tokenized forms of fiat currency.'
- id: nat
  label:
  - Native
  - Cryptocurrencies
  family: nat
  path: Digital Assets › Digital Money
  desc: Assets native to a public blockchain, issued by the protocol itself (not by an issuer) and used to pay transaction fees and secure the network. No issuer liability or claim on a reserve.
- id: btc
  label:
  - Bitcoin
  family: nat
  path: Digital Money › Native Cryptocurrencies
  desc: BTC — the native asset of the Bitcoin network; fixed 21m supply, secured by proof-of-work.
- id: eth
  label:
  - Ethereum
  family: nat
  path: Digital Money › Native Cryptocurrencies
  desc: ETH — the native asset of Ethereum; pays gas fees and is staked to secure the network under proof-of-stake.
- id: natoth
  label:
  - Other Layer-1s
  family: nat
  path: Digital Money › Native Cryptocurrencies
  desc: Native assets of other Layer-1 networks, e.g. SOL (Solana), XRP (XRP Ledger), ADA (Cardano), AVAX (Avalanche).
- id: tc
  label:
  - Tokenized Currencies
  family: tc
  path: Digital Assets › Digital Money
  sub2: by issuer type
  desc: Tokens that represent a claim denominated in, and redeemable for, a fiat currency. Grouped here by who issues the liability, because the issuer determines the regulatory treatment and risk.
- id: cb
  label:
  - Central Bank
  family: iss
  path: Digital Money › Tokenized Currencies
  desc: Money that is a direct liability of a central bank.
- id: cbdc
  label:
  - CBDC
  family: cbdc
  path: Tokenized Currencies › Central Bank
  desc: Central Bank Digital Currency — a digital form of central bank money. Retail CBDC is for the public (e.g. e-CNY, Digital Euro pilot); wholesale CBDC is for interbank settlement (e.g. Project mBridge, Digital Dirham).
- id: rcbdc
  label:
  - Retail
  - CBDC
  family: cbdc
  path: Central Bank › CBDC
  desc: A CBDC for the general public — households and businesses — used for everyday payments (e.g. e-CNY, the planned Digital Euro, Digital Dirham retail). Usually issued with holding limits and run through intermediaries, and may be a different token from its wholesale counterpart.
- id: wcbdc
  label:
  - Wholesale
  - CBDC
  family: cbdc
  path: Central Bank › CBDC
  desc: A CBDC restricted to banks and financial institutions for interbank and securities settlement (e.g. Project mBridge, Project Agorá). Often a separate token and ledger from any retail CBDC.
- id: bank
  label:
  - Commercial
  - Bank
  family: iss
  path: Digital Money › Tokenized Currencies
  desc: 'Commercial bank money: a liability of a licensed deposit-taking bank. Both tokenized deposits and deposit tokens are commercial bank money — they differ in architecture, not in the nature of the claim.'
- id: td
  label:
  - Tokenized
  - Deposits
  family: td
  path: Tokenized Currencies › Commercial Bank
  desc: 'EI house view: the strict interpretation. Each token is a one-to-one, on-ledger representation of an identified client’s deposit, recorded on the bank’s (usually permissioned) ledger and transferable only between the bank’s own clients (e.g. Kinexys Digital Payments, Citi Token Services). A deposit liability on the bank’s balance sheet, subject to capital rules and, where applicable, deposit insurance.'
- id: dt
  label:
  - Deposit
  - Token
  family: dt
  path: Commercial Bank › Tokenized Deposits
  desc: 'EI house view: a more liberal architecture choice within tokenized deposits. Tokens are backed by an omnibus deposit account and held in wallets, so they can circulate more freely, potentially on public blockchains (e.g. JPMD on Base and Ethereum mainnet). Still commercial bank money and a liability of the issuing bank. It looks and behaves very much like a bank-issued stablecoin (wallet-held, transferable, price-stable) — shown by the dotted “look-alike” line — but is legally distinct: a deposit on the bank’s balance sheet, not a token backed by segregated reserves. That is why MiCA, VARA, DIFC, ADGM, MAS and the GENIUS Act all treat it differently from stablecoins (switch on the lenses). We will revisit this view as industry usage settles.'
- id: fin
  label:
  - Regulated
  - Non-Bank
  family: iss
  path: Digital Money › Tokenized Currencies
  sub3: fintechs, EMIs, FMIs
  desc: 'Licensed issuers that are not banks, so cannot lend out the money they hold: fintechs, e-money and payment institutions, trust companies, stablecoin-licensed firms and financial market infrastructures (FMIs). Their tokens must be backed in full at all times — what differs is the quality of that backing.'
- id: fmi
  label:
  - FMI
  - Tokens
  family: cbdc
  path: Tokenized Currencies › Regulated Non-Bank
  desc: 'Wholesale settlement tokens issued by a financial market infrastructure and backed 1:1 by central bank reserves (or wholesale CBDC) held in an omnibus account at the central bank — effectively narrow banking. Holders have no commercial-bank credit risk, so the token settles at par with central bank money. Example: Fnality’s sterling system, backed by an omnibus account at the Bank of England and open only to admitted institutions. If the backing were Treasury bills instead of reserves, the token would be a licensed stablecoin: redeeming would mean selling bonds, adding market and liquidity risk.'
- id: oiss
  label:
  - Other
  - Issuers
  family: iss
  path: Digital Money › Tokenized Currencies
  sub3: unlicensed issuers
  desc: 'Issuers without a recognised licence in the relevant jurisdiction. Higher risk: participants and reserves are often unknown or unverified; designs may be algorithmic or backed by multiple volatile assets (crypto-collateralised or synthetic dollars); and some have collapsed or proven fraudulent.'
- id: sc
  label:
  - Stablecoins
  family: sc
  path: Tokenized Currencies › Bank · Non-Bank · Other
  desc: 'Broad, market definition: any token designed to hold a stable value against a fiat currency and circulate on blockchains. What a given “stablecoin” actually is depends on three things — the issuer and its licence, the backing assets, and the implementation (reserves vs. algorithm, segregated vs. on balance sheet, public vs. permissioned chain). The circle therefore cuts across banks, regulated fintechs and unregulated issuers. Bank-issued stablecoins are legally distinct from deposit tokens but look very similar (dotted “look-alike” line). Licensed regimes carve out narrower, legally defined subsets.'
- id: unreg
  label:
  - Unlicensed
  - higher risk
  colors:
    fill: url(#ei-hatch)
    stroke: '#a8402f'
  path: Stablecoins › Other Issuers
  tc: '#8e2f22'
  clip: oiss
  desc: 'Unlicensed stablecoins: issued without a licence, often by unknown parties, sometimes algorithmic or backed by multiple volatile assets — and in some cases have collapsed or proven fraudulent. Holders may have no enforceable redemption right.'
- id: lsc
  label:
  - Licensed Stablecoins
  - '& Payment Tokens'
  family: lsc
  path: Stablecoins › Bank · Non-Bank
  desc: Fiat-referenced tokens issued under a specific regulatory regime with reserve, redemption and disclosure rules — e.g. EU MiCA e-money tokens, US GENIUS Act payment stablecoins, and UAE Central Bank (CBUAE) licensed Payment Tokens. Issued only by licensed banks or regulated fintechs.
- id: alg
  label:
  - Algorithmic
  colors:
    fill: '#efc4bb'
    stroke: '#a8402f'
  path: Stablecoins › Other Issuers
  tc: '#7a1a10'
  desc: 'Stablecoins that try to hold their peg through code — minting and burning a companion token, or over-collateralising with volatile crypto — rather than holding cash-equivalent reserves. Prone to “death spirals” (e.g. TerraUSD, 2022). Sits only with unregulated issuers: no major licensing regime permits them as stablecoins.'
- id: rwa
  label:
  - Tokenized Real-World Assets
  family: rwa
  path: Digital Assets
  desc: Tokens that represent ownership of, or a claim on, an off-chain asset. Value comes from the underlying asset; legal enforceability depends on the issuer, custodian and structure. Many RWA tokens are issued through a special-purpose vehicle (SPV) that holds the asset, in which case the token is usually a security — a share or note in the SPV — even when the underlying is real estate, art or a loan book.
- id: com
  label:
  - Commodities
  family: com
  path: Digital Assets › Real-World Assets
  desc: Tokens backed by, or tracking, physical commodities held in custody.
- id: pm
  label:
  - Precious
  - Metals
  family: com
  path: Real-World Assets › Commodities
  sub: Gold · Silver · Platinum
  desc: Tokens backed by allocated, vaulted bullion — e.g. PAXG, XAUT, and bank-issued gold tokens.
- id: ocom
  label:
  - Other
  - Commodities
  family: com
  path: Real-World Assets › Commodities
  lines:
  - Energy
  - Agriculture
  - Industrial metals
  - Carbon credits
  desc: Energy (oil, gas, power), agricultural (grains, softs), industrial/base metals (copper, aluminium) and environmental commodities such as carbon credits.
- id: re
  label:
  - Real
  - Estate
  family: re
  path: Digital Assets › Real-World Assets
  desc: Tokenized ownership of property or property vehicles (SPVs, REIT units), including fractional ownership and tokenized title deeds.
- id: coll
  label:
  - Collectibles
  - '& Luxury'
  family: re
  path: Digital Assets › Real-World Assets
  sub: art, wine, watches
  desc: Tokenized ownership of physical collectibles held in custody — fine art, wine, watches, classic cars — often fractionalised. Digital-native art (NFTs) sits under Other Crypto-Assets.
- id: ip
  label:
  - IP &
  - Royalties
  family: re
  path: Digital Assets › Real-World Assets
  sub: music, patents
  desc: Tokenized rights to income from intellectual property — music and media royalties, patents and licensing streams.
- id: pc
  label:
  - Loans &
  - Trade Finance
  family: re
  path: Digital Assets › Real-World Assets
  sub: credit · mortgages
  desc: 'Tokenized loans and credit exposures: private credit, mortgages and home-equity loans, trade finance (letters of credit, supply-chain and invoice financing) and receivables. One of the largest RWA categories by value, with tokenized mortgage and home-equity lending a major component. If the exposure is packaged into a bond — a mortgage-backed security, for example — it moves into Fixed Income.'
- id: sec
  label:
  - Financial Instruments
  family: sec
  path: Digital Assets › Real-World Assets
  desc: 'Tokenized securities and derivatives — the instruments regulated under securities and derivatives law (MiFID II, SEC/CFTC, SCA, DFSA, FSRA, MAS SFA), not as crypto-assets or virtual assets. Overlaps show hybrids that are legally both: structured notes (debt + derivative) and stock trackers or warrants (equity-linked derivatives). Whether an instrument is issued natively on-chain (the ledger is the legal register, e.g. Euroclear’s digitally native notes) or is a tokenized representation of a security registered elsewhere (e.g. DTCC tokens tied to DTC holdings), the token technology is the same; what differs is which record is legally authoritative. Tokens used only to move or pledge an asset held elsewhere — “collateral” or “settlement” tokens, as on repo and collateral networks — are treated here as part of the asset they represent, since the same mechanism can carry a bond, a fund unit, gold or a trade-finance claim.'
- id: eq
  label:
  - Equities
  family: sec
  path: Real-World Assets › Financial Instruments
  sub: listed · private
  desc: 'Tokenized shares: listed (public) equities and private company shares, either issued natively on-chain or as tokenized representations of existing shares that carry shareholder rights. “Cash equities” is the trading term for the same thing — shares as opposed to equity derivatives.'
- id: fund
  label:
  - Funds
  family: sec
  path: Real-World Assets › Financial Instruments
  sub: incl. TMMFs
  desc: Tokenized fund units, e.g. money market funds (BlackRock BUIDL, Franklin BENJI), private equity and credit funds. Tokenized MMFs increasingly act as collateral and a cash substitute. Funds that use derivatives (leveraged or inverse ETFs) are still funds, so this circle does not overlap Derivatives.
- id: fi
  label:
  - Fixed
  - Income
  family: sec
  path: Real-World Assets › Financial Instruments
  lines2:
  - bonds · notes
  - T-bills
  desc: 'Tokenized debt securities: government, supranational and corporate bonds, notes, T-bills and commercial paper (e.g. digital bonds issued by the EIB, HSBC Orion, UBS), and securitizations such as mortgage-backed securities. Loans and trade finance belong here once packaged into a bond; otherwise they sit under Loans & Trade Finance.'
- id: dv
  label:
  - Derivatives
  family: sec
  path: Real-World Assets › Financial Instruments
  lines2:
  - futures · options
  - perps · swaps
  desc: 'Contracts whose value derives from an underlying asset — futures, forwards, options, swaps and crypto-native perpetual futures (“perps”: futures with no expiry, kept near spot by a funding rate). Options and perps are both derivatives. Legally they are financial instruments whatever the underlying, including Bitcoin or Ether. Only derivatives issued or recorded as tokens (on-chain options, tokenized positions, DeFi perps) are digital assets; most are positions on an exchange, not tokens.'
- id: trk
  label:
  - ''
  colors:
    fill: '#b9c9d8'
    stroke: '#33506a'
  path: Financial Instruments › Equities ∩ Derivatives
  desc: 'Equity-linked derivatives that are often marketed as “tokenized stocks”: tracker tokens and certificates that give price exposure to a share without shareholder rights, plus warrants. Many tokenized-stock products sold to retail are structured this way — check whether the token is the share itself or a derivative on it.'
- id: sn
  label:
  - ''
  colors:
    fill: '#b9c9d8'
    stroke: '#33506a'
  path: Financial Instruments › Fixed Income ∩ Derivatives
  desc: 'Structured notes and certificates: debt securities with an embedded derivative (e.g. capital-protected notes, autocallables, reverse convertibles) — which is why they sit where Fixed Income and Derivatives overlap. Tokenized structured notes are among the more active institutional tokenization use cases.'
- id: oth
  label:
  - Other Crypto-Assets
  family: oth
  path: Digital Assets
  desc: Digital assets that are neither money nor claims on real-world assets. Their value comes from use, community, scarcity or rights within a protocol or platform.
- id: art
  label:
  - Digital Art
  - '& NFTs'
  family: oth
  path: Other Crypto-Assets
  desc: Digital-native art and collectibles (NFTs). Tokenized physical artwork would sit under Real-World Assets instead.
- id: game
  label:
  - Gaming
  - Points
  family: oth
  path: Other Crypto-Assets
  sub: '& in-game items'
  desc: In-game currencies, points and items issued as tokens.
- id: comm
  label:
  - Community
  - Coins
  family: oth
  path: Other Crypto-Assets
  sub: memecoins, fan
  desc: Tokens whose value is driven mainly by community and attention — memecoins, fan and social tokens.
- id: gov
  label:
  - Governance
  - Tokens
  family: oth
  path: Other Crypto-Assets
  desc: Tokens granting voting rights over a protocol (e.g. UNI, AAVE). Often the largest “other” category by market value.
- id: util
  label:
  - Utility
  - Tokens
  family: oth
  path: Other Crypto-Assets
  desc: Tokens giving access to a service or network resource (e.g. storage, compute, oracle data).
- id: loy
  label:
  - Loyalty
  - Points
  family: oth
  path: Other Crypto-Assets
  desc: Tokenized airline, retail and brand loyalty points.
- id: lst
  label:
  - Staking &
  - Wrapped
  family: oth
  path: Other Crypto-Assets
  sub: stETH, WBTC
  desc: Derivative tokens representing staked or bridged native assets (liquid staking tokens, wrapped tokens). They carry smart-contract and custodian risk on top of the underlying asset.
- id: id
  label:
  - Identity &
  - Domains
  family: oth
  path: Other Crypto-Assets
  sub: ENS, credentials
  desc: On-chain names (ENS), credentials and non-transferable (“soulbound”) attestations.
- id: tix
  label:
  - Tickets &
  - Memberships
  family: oth
  path: Other Crypto-Assets
  sub: events, clubs
  desc: Tokenized event tickets, club memberships and access passes — usually closed-loop and often non-transferable.
