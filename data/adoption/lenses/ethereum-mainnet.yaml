# Lens: Ethereum mainnet. `cells` places each property on the level the reading falls in under themes.yaml; `notes`
# carries the reading, its date and its source. Readings checked 25 and 26 October 2026; validator, client, builder and node
# shares drift weekly. Writing rules: US spelling; no em-dashes; "Ethereum mainnet" for the chain.

id: ethereum
order: 1
name: Ethereum mainnet
menu: Ethereum mainnet
short: Ethereum mainnet
color: '#312e81'
intro: 'Ethereum mainnet, read on 26 October 2026. Eight properties at level 5, one at level 4 and two at level 2. The one at 4: the open process that sets its rules still lets a client team block an upgrade. The 2016 DAO fork is disclosed under property rights; it passed ten years in July 2026, and the community has since declined to make another. The two at 2: single points of technical failure, because the largest client on each layer runs on about half of nodes and nodes across legal jurisdictions, the EU counted as one, are highly concentrated; and neutral inclusion, because one builder assembles half of relayed blocks today and the protocol changes that fix it are not yet live. Each of those dials says what is being done about it; a fix moves a dial only once it is live on mainnet. Everything else, from a decade without a halt to a stake that costs more than thirty billion dollars to attack and is destroyed if used, is why a global shared ledger is a different kind of infrastructure from any ledger one party runs.'
