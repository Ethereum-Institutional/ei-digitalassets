footnote: 'Readings for Ethereum mainnet were checked on 25 October 2026 and for Bitcoin, Canton, Solana and Stellar on 26 October 2026; all drift, since validator, pool, client and builder shares change weekly. The levels are an Ethereum Institutional house method informed by Srinivasan and Lee (2017), the Edinburgh SoK on measuring decentralization (2025), the US Merger Guidelines (2023) and Budish (2018, Quarterly Journal of Economics 2025). This map is a house view for discussion, not legal advice. © 2026 Ethereum Institutional. Licensed under CC BY-SA 4.0 (share and adapt with credit, under the same license).'
sections:
- title: Why decentralization drives adoption
  text: 'Ledgers built for closed membership in the same years as Ethereum mainnet (live since 30 July 2015) had institutional backing but had to win every participant over network by network. TradeLens, the shipping platform IBM and Maersk built on Hyperledger Fabric, reached over 300 members and was closed on 29 November 2022 because “the need for full global industry collaboration has not been achieved”. An open ledger needs no such agreement: anyone can join, build and compete, and what one firm builds the next can use. That compounding, more than any single feature, is why adoption has gathered on open, decentralized networks, and it holds for institutions that never ask about decentralization: what they adopt is a ledger that no counterparty can halt, reprice or close, and the dials are what makes that true. This is Ethereum Institutional''s view; the dials show the properties behind it, ledger by ledger, and each lens states the adoption it carries today.'
  sources:
  - { title: 'Global Trade Review, Maersk and IBM pull the plug on TradeLens (press, 29 November 2022)', url: 'https://www.gtreview.com/news/fintech/maersk-and-ibm-pull-the-plug-on-tradelens/', checked: '2026-10-29' }
  - { title: 'SiliconANGLE, IBM and Maersk pull the plug on blockchain-based TradeLens shipping platform (press, 30 November 2022; built on Hyperledger Fabric)', url: 'https://siliconangle.com/2022/11/30/ibm-maersk-pull-plug-blockchain-based-tradelens-shipping-platform/', checked: '2026-10-29' }
