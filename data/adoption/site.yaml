# Adoption page (was Decentralization; renamed 29 October 2026): adoption follows decentralization, so the page measures
# eleven properties of a ledger, five levels from one party to an open network, and lenses that
# place a named ledger (Ethereum mainnet, Bitcoin, Canton, Solana, Stellar) or a generic architecture (consortium, one
# operator) on the dials.

kind: gauges
default_lens: ethereum
title: Adoption
slug: adoption
eyebrow: Ethereum Institutional · Research
heading:
  text: Adoption
  italic: Adoption
intro: 'Institutions adopt the ledgers that decentralization made trustworthy, whether or not they value decentralization itself. A ledger nobody controls is one everybody can build on and nobody can be asked to change, so it draws the developers, the holders and the tokenized assets, and each new application is open to the next. This page measures the cause: eleven properties of a ledger, each on a dial from 1 (one party holds the property) to 5 (an open network holds it), with each lens naming the adoption that sits on top of them today. Ethereum Institutional''s reading, with the evidence ledger by ledger; the dials are a proposal, not a standard.'
intro_more_label: Why measure it this way?
intro_more: 'The eleven questions: how long it has run, who maintains it, who can stop it, what control costs, who can change the rules, who can freeze a balance, who can verify it, who can join, what fails together, who owns the asset, and whether your transaction gets in on the same terms as everyone else’s. Decentralization is usually argued, not measured. Here each property has a definition and a scale, so that a design lands where the evidence puts it. Where a property is a share of something (stake, nodes, commits, supply), the scale uses the Herfindahl-Hirschman Index, the concentration measure regulators apply to markets, scored on the lines the US merger guidelines publish, because it counts the whole distribution rather than only the largest few; the Nakamoto coefficient (how many parties must act together) is shown beside it. Where a property is a capability (who can change the rules, who can freeze a balance), the levels describe the capability, following the academic reviews of blockchain decentralization. The levels apply to every design alike, Ethereum mainnet included, and the legitimate concerns about Ethereum mainnet sit inside the dials they belong to, with the work addressing each, because a page that hides its weak points is not believed on its strong ones. Disagree with a metric? Open an issue on GitHub and tell us what you would measure instead, and why.'
