footnote: 'Readings for Ethereum mainnet were checked on 25 October 2026 and for Bitcoin, Canton, Solana and Stellar on 26 October 2026; all drift, since validator, pool, client and builder shares change weekly. The levels are an Ethereum Institutional house method informed by Srinivasan and Lee (2017), the Edinburgh SoK on measuring decentralization (2025), the US Merger Guidelines (2023) and Budish (2018, Quarterly Journal of Economics 2025). This map is a house view for discussion, not legal advice. © 2026 Ethereum Institutional. Licensed under CC BY-SA 4.0 (share and adapt with credit, under the same license).'
sections:
- title: Why decentralization drives adoption
  text: 'Ledgers built for closed membership in the same years as Ethereum mainnet (live since 30 July 2015) had institutional backing but had to win every participant over network by network. TradeLens, the shipping platform IBM and Maersk built on Hyperledger Fabric, reached over 300 members and was closed on 29 November 2022 because “the need for full global industry collaboration has not been achieved”. An open ledger needs no such agreement: anyone can join, build and compete, and what one firm builds the next can use. That compounding, more than any single feature, is why adoption has gathered on open, decentralized networks, and it holds for institutions that never ask about decentralization: what they adopt is a ledger that no counterparty can halt, reprice or close, and the dials are what makes that true. This is Ethereum Institutional''s view; the dials show the properties behind it, ledger by ledger, and each lens states the adoption it carries today. The Ethereum Foundation’s primer for governments and institutions (July 2026) makes the same argument in its own words: the breadth of participation is what makes the network secure, and that security is what makes it the choice of institutions and the public sector.'
  sources:
  - { title: 'Ethereum Foundation, Ethereum Basics for Governments and Institutions (ethereum.org report, July 2026; the Foundation’s own positions; comparative figures as of March 2026 from OpenZeppelin’s assessment)', url: 'https://ethereum.org/reports/basics-for-governments-institutions.pdf', checked: '2026-11-10' }
  - { title: 'Global Trade Review, Maersk and IBM pull the plug on TradeLens (press, 29 November 2022)', url: 'https://www.gtreview.com/news/fintech/maersk-and-ibm-pull-the-plug-on-tradelens/', checked: '2026-10-29' }
  - { title: 'SiliconANGLE, IBM and Maersk pull the plug on blockchain-based TradeLens shipping platform (press, 30 November 2022; built on Hyperledger Fabric)', url: 'https://siliconangle.com/2022/11/30/ibm-maersk-pull-plug-blockchain-based-tradelens-shipping-platform/', checked: '2026-10-29' }
- title: Read alongside independent assessments
  text: 'OpenZeppelin’s Technical Risk Assessment on Blockchain Networks (30 April 2026, conditions as of early March 2026) reads six networks (Ethereum, BNB Smart Chain, the XRP Ledger, TRON, Solana and Canton) across six dimensions and about 25 factors, for regulators and institutions, and ranks nothing. Five of its dimensions are dials on this page under other names, and the sixth, network activity, is the “Adoption today” sentence in each lens: its maturity and track record is Operating history; its finality dimension is What control costs, whose one-third and two-thirds of stake lines are this page’s method and whose slashing economics separate level 5 from level 3 here, while its three finality models are the Networks map’s Settlement finality lens; its technical resilience and concentration are No single point of technical failure and Who can stop it, with genesis insider allocation scored here under Neutral issuance; its control and governance are Who can change the rules, Open entry and exit and Who gets in on the same terms; its continuity is Developer base and Neutral issuance, with post-quantum preparation on the Quantum pages. What it scores and this page does not (bug bounties, published post-incident analyses, test networks that mirror production, upgrade cadence, emergency procedures, audits of the client, the sponsor’s audited accounts) sits as evidence inside the notes rather than as dials, because they are practices rather than properties of the ledger. Where the report covers a ledger read here, its figures appear in the notes beside ours, dated; its activity figures (DeFi value, stablecoin supply, active addresses, market value) are a March 2026 snapshot, and the Networks map’s named deployments are the evidence this site keeps current.'
  items:
  - title: Maturity and operational track record
    text: Operating history.
  - title: Finality
    text: What control costs; the finality models are on the Networks map.
  - title: Technical resilience and supply concentration
    text: No single point of technical failure; Who can stop it.
  - title: Control, governance and concentration of authority
    text: Who can change the rules; Open entry and exit; Who gets in on the same terms.
  - title: Continuity and institutional sustainability
    text: Developer base; Neutral issuance; the Quantum pages.
  - title: Network activity and adoption
    text: The “Adoption today” sentence in each lens.
    sources:
    - { title: 'OpenZeppelin, Technical Risk Assessment on Blockchain Networks (report dated 30 April 2026, conditions as of early March 2026; Ethereum, BNB Smart Chain, XRP Ledger, TRON, Solana and Canton across six dimensions; industry report, no ranking)', url: 'https://www.openzeppelin.com/news/technical-risk-assessment-blockchain-networks', checked: '2026-11-10' }
  - title: A central bank’s experiment
    text: 'The Reserve Bank of Australia’s Project Acacia (May 2026) ran 20 wholesale use cases on Ethereum, Hedera, the XRP Ledger, Redbelly and Canvas Connect. Every use case that settled in the pilot wholesale CBDC ran on an EVM-compatible ledger, so the bank wrote one ERC-20 implementation and used it on all of them. The same report records limited central bank appetite for issuing real claims on a central bank on permissionless ledgers, citing finality, ledger integrity and accountability for governance.'
    sources:
    - { title: 'Reserve Bank of Australia and DFCRC, Project Acacia final report (May 2026): 20 use cases and five platforms (chapter 3); one ERC-20 implementation across the EVM-compatible platforms (chapter 3); central bank appetite for permissionless platforms (Box F)', url: 'https://www.rba.gov.au/payments-and-infrastructure/tokenised-money/pdf/project-acacia-final-report.pdf', checked: '2026-11-11' }
