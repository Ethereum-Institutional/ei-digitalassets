name: Build & check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-24.04  # pinned: Playwright 1.56 does not support Ubuntu 26.04 (ubuntu-latest from Oct 2026)
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Validate data and build page
        run: npm run build
      - name: Install Chromium for the smoke test
        run: npx playwright install --with-deps chromium
      - name: Smoke test (renders page, applies every lens, screenshots)
        run: npm run check
      - name: Upload built page and preview
        uses: actions/upload-artifact@v4
        with:
          name: digital-asset-taxonomy-${{ github.sha }}
          path: |
            dist/digital-asset-taxonomy.html
            dist/digital-asset-taxonomy.fragment.html
            dist/preview.png
            dist/digital-asset-networks.html
            dist/digital-asset-networks.fragment.html
            dist/networks/preview.png
      - name: Comment on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `✅ Build and checks passed. Download the rendered page and preview screenshot from the **Artifacts** section of [this run](${url}) to review the change visually.`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const mine = comments.find(c => c.user.type === 'Bot' && c.body.startsWith('✅ Build and checks passed'));
            if (mine) await github.rest.issues.updateComment({ ...context.repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
