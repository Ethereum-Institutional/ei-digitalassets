name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04  # pinned to match build.yml
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build versioned page
        run: TAXONOMY_VERSION=${GITHUB_REF_NAME} npm run build
      - name: Package
        run: |
          cp dist/digital-asset-taxonomy.html "digital-asset-taxonomy-${GITHUB_REF_NAME}.html"
          cp dist/digital-asset-taxonomy.fragment.html "digital-asset-taxonomy-${GITHUB_REF_NAME}.fragment.html"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}  # v0.x = draft pending legal review
          files: |
            digital-asset-taxonomy-${{ github.ref_name }}.html
            digital-asset-taxonomy-${{ github.ref_name }}.fragment.html
