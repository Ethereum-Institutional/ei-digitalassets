<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;1,7..72,400&display=swap">
__STYLE__
<style>
  /* architecture pages (kind: architecture): a blueprint. Lanes run from the clients at the top to the private keys at
     the bottom; nodes are components drawn by type (system of record, process, technology, control); lines are typed
     connections (instruction solid, data dashed, control dotted). Status is drawn by line weight and fill only. */
  .ei-taxonomy.arch{max-width:1760px}
  .ei-wrap.bp{padding:0;overflow-x:auto}
  .ei-wrap.bp svg{min-width:1180px}
  .ei-wrap.bp svg text{font-family:var(--sans);pointer-events:none}
  .ei-wrap.bp svg text.serif{font-family:var(--serif)}
  .ei-wrap.bp .nd,.ei-wrap.bp .ri{cursor:pointer}
  .ei-wrap.bp .nd:focus,.ei-wrap.bp .ri:focus{outline:none}
  .ei-wrap.bp .nd:focus-visible .bx,.ei-wrap.bp .ri:focus-visible .bx{stroke:#0ea5e9;stroke-width:3}
  .ei-wrap.bp .nd,.ei-wrap.bp .ri,.ei-wrap.bp .eg{transition:opacity .15s}
  .ei-wrap.bp.dim .nd:not(.on),.ei-wrap.bp.dim .ri:not(.on){opacity:.22}
  .ei-wrap.bp.dim .eg:not(.on){opacity:.08}
  .ei-wrap.bp .eg.on path.ln{stroke-width:2.4}
  .ei-wrap.bp .eg.on text{font-weight:600;fill:#14130f}
  .ei-wrap.bp .nd.pin .bx,.ei-wrap.bp .ri.pin .bx{stroke:#0ea5e9;stroke-width:3}
  .ei-wrap.bp.flow .eg{opacity:.06}
  .ei-flowbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
  .ei-flowbar label{font-family:var(--serif);font-size:20px;letter-spacing:-.02em}
  .ei-flowbar .sel{position:relative;flex:0 1 380px;min-width:0}
  .ei-flowbar select{font:inherit;font-size:14px;color:var(--ink);background:#fff;border:1px solid var(--rule);border-radius:12px;padding:9px 36px 9px 14px;width:100%;appearance:none;-webkit-appearance:none;cursor:pointer;
    background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 15px) 55%;background-size:5px 5px;background-repeat:no-repeat}
  .ei-flowbar select:hover{border-color:var(--ink)}
  .ei-flowbar select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .ei-flowbar select.on{border-color:#0ea5e9;box-shadow:inset 0 0 0 1px #0ea5e9}
  .ei-flowbar .hint{font-size:12.5px;color:var(--muted)}
  details.ei-legend-box summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--ink);list-style:none;display:inline-flex;align-items:center;gap:7px;padding:2px 6px}
  details.ei-legend-box summary::-webkit-details-marker{display:none}
  details.ei-legend-box summary::before{content:'';width:6px;height:6px;border-right:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);transform:rotate(-45deg);transition:transform .15s}
  details.ei-legend-box[open] summary::before{transform:rotate(45deg)}
  details.ei-legend-box[open] .ei-legend{margin-top:8px}
  .ei-ddq{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,600px),1fr));gap:14px;align-items:start}
  .ei-ddq section{border:1px solid var(--rule);border-radius:16px;background:var(--card);overflow:hidden}
  .ei-ddq h3{margin:0;padding:12px 18px;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--rule)}
  .ei-ddq ul{list-style:none;margin:0;padding:0}
  .ei-ddq li+li{border-top:1px solid var(--rule)}
  .ei-ddq a{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:16px;row-gap:2px;padding:11px 18px;color:var(--ink);text-decoration:none;background:#fff}
  .ei-ddq a:hover,.ei-ddq a:focus-visible{background:#f4f8fb;outline:none}
  .ei-ddq b{font-size:15px;font-weight:600}
  .ei-ddq span{grid-column:1;font-size:13px;color:var(--muted);line-height:1.4}
  .ei-ddq em{grid-column:2;grid-row:1 / span 2;align-self:center;font-style:normal;font-size:12px;font-weight:600;color:#0369a1;white-space:nowrap;font-variant-numeric:tabular-nums}
  .ei-ddq em::after{content:' questions →'}
  i.sw,.ei-lens.arch button i.sw{display:inline-block;width:18px;height:11px;border-radius:3px;flex:none;box-sizing:border-box;background:#fff}
  i.sw.st-existing,.ei-lens.arch button i.sw.st-existing{background:var(--sand);border:1.2px solid #a9a397}
  i.sw.st-extend,.ei-lens.arch button i.sw.st-extend{border:1.3px solid var(--ink)}
  i.sw.st-new,.ei-lens.arch button i.sw.st-new{border:2.6px solid var(--ink)}
  i.sw.st-evaluate,.ei-lens.arch button i.sw.st-evaluate{border:1.3px dashed var(--ink)}
  i.sugdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#312e81;flex:none}
  i.ref{font-style:normal;font-size:9px;font-weight:700;padding:0 4px;border-radius:5px;border:1px solid currentColor;line-height:1.5;flex:none}
  .ei-legend svg{vertical-align:middle}
  .ei-legend.bottom{padding:12px 16px;border:1px solid var(--rule);border-radius:14px;background:var(--card);gap:8px 18px}
  .ei-legend.bottom .lt{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);flex-basis:auto;margin-left:6px}
  .ei-legend.bottom .lt:first-child{margin-left:0}
  .ei-h.ddq{display:flex;flex-direction:column;gap:4px;margin-top:8px}
  .ei-h.ddq b{font-family:var(--serif);font-weight:400;font-size:24px;letter-spacing:-.02em}
  .ei-h.ddq span{font-size:14px;color:var(--muted);line-height:1.5;max-width:90ch}
  .ei-systems{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
  .ei-sys{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border:1px solid var(--rule);border-radius:14px;background:var(--card);color:var(--ink);text-decoration:none;transition:border-color .15s}
  .ei-sys:hover,.ei-sys:focus-visible{border-color:var(--ink);outline:none}
  .ei-sys b{font-family:var(--serif);font-weight:400;font-size:18px;letter-spacing:-.01em}
  .ei-sys span{font-size:13px;line-height:1.45;color:var(--muted)}
  .ei-sys em{font-style:normal;font-size:12.5px;margin-top:auto;color:#0369a1;font-weight:600}
  .ei-card-float .ddq a{background:#0369a1;color:#fff;border-color:#0369a1}
  .ei-card-float .ddq a:hover{background:#075985;border-color:#075985}
  .ei-wrap.bp .tag{cursor:pointer}
  /* detail card: floats over the blueprint so it stays in view while you explore */
  /* the rails: domains that apply across every lane, listed under the blueprint rather than drawn in it */
  .ei-rails{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
  .ei-rail{border:1px solid var(--rule);border-radius:16px;background:var(--card);padding:16px 18px}
  .ei-rail>b{display:block;font-family:var(--serif);font-weight:400;font-size:20px;letter-spacing:-.02em}
  .ei-rail>span{display:block;font-size:13px;color:var(--muted);margin:2px 0 6px}
  .ei-rail h4{margin:12px 0 6px;font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
  .ei-rail .ri-list{display:flex;flex-wrap:wrap;gap:6px}
  .ei-rail .ri{font:inherit;font-size:13px;line-height:1.3;text-align:left;padding:5px 10px;border-radius:9px;border:1px solid #cfc9bd;background:#fff;color:var(--ink);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
  .ei-rail .ri:hover,.ei-rail .ri.on{border-color:var(--ink)}
  .ei-rail .ri.pin{border-color:#0ea5e9;box-shadow:0 0 0 2px #0ea5e9}
  .ei-rail .ri:focus-visible{outline:2px solid #0ea5e9;outline-offset:2px}
  .ei-rail .ri i{font-style:normal;font-size:9px;font-weight:700;letter-spacing:.04em;color:#fff;background:#0369a1;border-radius:3px;padding:1px 4px}
  .ei-card-float{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(400px,calc(100vw - 32px));max-height:min(70vh,640px);overflow:auto;z-index:20;
    background:#fff;border:1px solid var(--rule);border-radius:16px;padding:16px 20px 18px;box-shadow:0 12px 40px rgba(20,19,15,.16)}
  .ei-card-float[hidden]{display:none}
  .ei-card-float h2{margin:0 0 6px;font-family:var(--serif);font-weight:400;font-size:21px;letter-spacing:-.02em;line-height:1.2;padding-right:20px}
  .ei-card-float p{margin:0;font-size:14px;line-height:1.55}
  .ei-card-float .path{font-size:12px;color:var(--muted);margin-bottom:4px}
  .ei-card-float .kind{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;padding:1px 7px;border-radius:8px;border:1px solid var(--rule);background:var(--card);color:var(--muted);margin-left:8px;vertical-align:middle}
  .ei-card-float .stx{font-size:13px;color:var(--muted);margin-top:2px}
  .ei-card-float h3{margin:14px 0 4px;font-size:12px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
  .ei-card-float ul,.ei-card-float ol{margin:0;padding-left:18px;font-size:14px;line-height:1.55}
  .ei-card-float .links{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .ei-card-float .links a,.ei-card-float .links button,.ei-card-float .links span{font:inherit;font-size:12.5px;padding:3px 9px;border-radius:9px;border:1px solid var(--rule);background:var(--card);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;gap:5px;align-items:center}
  .ei-card-float .links span{cursor:default;color:var(--muted)}
  .ei-card-float .links a:hover,.ei-card-float .links button:hover{border-color:var(--ink)}
  .ei-card-float .links .k{font-size:10px;color:var(--muted);border:none;padding:0;background:none}
  .ei-card-float .x{position:absolute;top:10px;right:12px;font:inherit;font-size:18px;line-height:1;border:none;background:none;color:var(--muted);cursor:pointer;padding:4px}
  .ei-card-float .x:hover{color:var(--ink)}
  .ei-card-float ol.fl li{cursor:pointer}
  .ei-card-float ol.fl li:hover{text-decoration:underline;text-underline-offset:3px}
  .ei-hint{font-size:13px;color:var(--muted);padding:0 6px;margin:0}
  .ei-features{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:14px}
  @media (max-width:520px){.ei-features{grid-template-columns:1fr}}
  .ei-feature{padding:18px 20px;border:1px solid var(--rule);border-radius:16px;background:var(--card);display:flex;flex-direction:column;gap:12px;min-width:0}
  .ei-feature .from{margin:0;font-size:12px;color:var(--muted)}
  .ei-tier-h{display:flex;flex-direction:column;gap:2px}
  .ei-tier-h b{font-family:var(--serif);font-weight:400;font-size:20px;letter-spacing:-.02em}
  .ei-tier-h span{font-size:13px;color:var(--muted);line-height:1.45;max-width:90ch}
  ol.ei-tl{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
  ol.ei-tl li{padding:10px 12px;background:#fff;border:1px solid var(--rule);border-radius:12px}
  ol.ei-tl .num{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:11px;font-weight:700;align-items:center;justify-content:center;margin-bottom:6px}
  ol.ei-tl li:last-child .num{background:#fff;color:var(--ink);border:1.5px dashed var(--ink)}
  ol.ei-tl b{display:block;font-size:13px;font-weight:600;margin-bottom:3px}
  ol.ei-tl p{margin:0;font-size:12.5px;line-height:1.45;color:var(--muted)}
  .ei-mx{overflow-x:auto}
  table.ei-std{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border:1px solid var(--rule);border-radius:12px;overflow:hidden}
  table.ei-std th,table.ei-std td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--rule);vertical-align:middle;line-height:1.4}
  table.ei-std thead th{font-weight:600;background:var(--card);font-size:12px;color:var(--muted)}
  table.ei-std tbody th{font-weight:600;font-size:13px}
  table.ei-std tr:last-child td,table.ei-std tr:last-child th{border-bottom:none}
  table.ei-std .cell{display:inline-block;font-size:11px;color:var(--muted);padding:2px 8px;border:1px dashed var(--rule);border-radius:8px}
  .ei-mx .cats{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:10px}
  .ei-mx .cats .rl{font-size:12px;color:var(--muted);margin-right:4px}
  .ei-mx .cats span:not(.rl){font-size:11px;padding:2px 8px;border-radius:8px;background:#fff;border:1px solid var(--rule)}
  .ei-sections{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
  .ei-section{padding:18px 20px;border:1px solid var(--rule);border-radius:16px;background:var(--card)}
  .ei-section h2{margin:0 0 8px;font-family:var(--serif);font-weight:400;font-size:21px;letter-spacing:-.02em}
  .ei-section p{margin:0;font-size:14px;line-height:1.55}
</style>
</head>
<body>
<div class="ei-taxonomy arch">
  __NOTICE__
  <div class="ei-head">
    <span class="ei-eyebrow">__EYEBROW__</span>
    __NAV__
    <h1>__HEADING__</h1>
    <p class="sub">__INTRO__</p>
    __INTRO_MORE__
  </div>
  __CONTROLS__
  <div class="ei-wrap bp" id="ei-bp"><svg id="ei-svg" viewBox="0 0 __CANVAS_W__ __CANVAS_H__" role="img" aria-label="__SVG_LABEL__"></svg></div>
  <p class="ei-hint">__PANEL_TEXT__</p>
  <div class="ei-rails" id="ei-rails" aria-label="Around every lane"></div>
  __ARCH_LEGEND__
  <div class="ei-card-float" id="ei-panel" aria-live="polite" hidden></div>
  __SYSTEMS__
  <div class="ei-features">__FEATURES__</div>
  __SECTIONS__
  __CONTRIBUTE__
  <p class="ei-foot">__FOOTNOTE__ <span class="ei-ver">__VERSION__</span></p>
</div>

<script>
(function(){
  const DATA = __DATA__;
  const moreBtn=document.querySelector('.ei-more'), moreTxt=document.getElementById('ei-intro-more');
  if(moreBtn&&moreTxt) moreBtn.addEventListener('click',()=>{ const open=moreTxt.hidden; moreTxt.hidden=!open; moreBtn.textContent=open?moreBtn.dataset.less:moreBtn.dataset.more; moreBtn.setAttribute('aria-expanded',String(open)); });
  const NS='http://www.w3.org/2000/svg', INK='#14130f', PAPER='#f8f6f2', MUTED='#615f5a', SAND='#eae6de', SKY='#0ea5e9';
  const KIND={instruction:{stroke:'#4b4740',dash:'',w:1.3},data:{stroke:'#0369a1',dash:'5 4',w:1.3},control:{stroke:'#4338ca',dash:'1.5 3.5',w:1.7}};
  const el=(t,a,txt)=>{ const e=document.createElementNS(NS,t); for(const k in a) e.setAttribute(k,a[k]); if(txt!=null) e.textContent=txt; return e; };
  const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
  const wrapTxt=(s,max)=>{ const out=[]; let line=''; for(const w of String(s).split(' ')){ if(line&&(line+' '+w).length>max){ out.push(line); line=w; } else line=line?line+' '+w:w; } if(line) out.push(line); return out; };
  const svg=document.getElementById('ei-svg'), bp=document.getElementById('ei-bp'), panel=document.getElementById('ei-panel');
  const C=DATA.components, W=DATA.canvas.width, H=DATA.canvas.height;
  const G={}; ['bg','lanes','edges','labels','nodes','flow'].forEach(k=>{ G[k]=el('g',{}); svg.appendChild(G[k]); });

  // ---- defs: blueprint grid and arrowheads ----
  const defs=el('defs',{});
  defs.innerHTML=`<pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#e6e1d8" stroke-width=".6"/></pattern>`
    +Object.entries(KIND).map(([k,v])=>`<marker id="m-${k}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L10 5L0 9z" fill="${v.stroke}"/></marker>`).join('')
    +`<marker id="m-flow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${SKY}"/></marker>`;
  svg.insertBefore(defs,svg.firstChild);
  G.bg.appendChild(el('rect',{x:0,y:0,width:W,height:H,fill:'#fbfaf7'}));
  G.bg.appendChild(el('rect',{x:0,y:0,width:W,height:H,fill:'url(#grid)'}));

  // ---- node shapes by type, status by line ----
  function boxShape(type,x,y,w,h){ const st=type==='rail'?{fill:'#fff',stroke:'#b9b4a8',sw:1}:{fill:'#fff',stroke:INK,sw:1.5};
    const a={class:'bx',fill:st.fill,stroke:st.stroke,'stroke-width':st.sw}; if(st.dash) a['stroke-dasharray']=st.dash;
    if(type==='control'){ const n=10; return el('path',Object.assign(a,{d:`M${x+n} ${y}H${x+w-n}L${x+w} ${y+h/2}L${x+w-n} ${y+h}H${x+n}L${x} ${y+h/2}Z`})); }
    return el('rect',Object.assign(a,{x,y,width:w,height:h,rx:type==='process'?h/2:type==='rail'?7:3})); }
  const glyph=(type,x,y)=>{ const g=el('g',{});
    if(type==='system'){ g.appendChild(el('rect',{x:x-7,y:y-7,width:14,height:14,rx:1,fill:'none',stroke:INK,'stroke-width':1.2})); g.appendChild(el('path',{d:`M${x-7} ${y-3.5}H${x+7}M${x-3.5} ${y-7}V${y+7}`,stroke:INK,'stroke-width':1})); }
    if(type==='technology'){ g.appendChild(el('rect',{x:x-6,y:y-6,width:12,height:12,rx:1.5,fill:'none',stroke:INK,'stroke-width':1.2})); g.appendChild(el('path',{d:`M${x-3} ${y-9}V${y-6}M${x+3} ${y-9}V${y-6}M${x-3} ${y+6}V${y+9}M${x+3} ${y+6}V${y+9}M${x-9} ${y-3}H${x-6}M${x-9} ${y+3}H${x-6}M${x+6} ${y-3}H${x+9}M${x+6} ${y+3}H${x+9}`,stroke:INK,'stroke-width':1})); }
    if(type==='control'){ g.appendChild(el('path',{d:`M${x} ${y-7}L${x+6} ${y-4.5}V${y+0.5}C${x+6} ${y+4} ${x+3} ${y+6} ${x} ${y+7.5}C${x-3} ${y+6} ${x-6} ${y+4} ${x-6} ${y+0.5}V${y-4.5}Z`,fill:'none',stroke:INK,'stroke-width':1.2})); }
    if(type==='process'){ g.appendChild(el('path',{d:`M${x+6} ${y-3.5}A7 7 0 1 0 ${x+6} ${y+3.5}`,fill:'none',stroke:INK,'stroke-width':1.2})); g.appendChild(el('path',{d:`M${x+3.5} ${y-6.5}L${x+6.5} ${y-3.5}L${x+3} ${y-1}`,fill:'none',stroke:INK,'stroke-width':1.2})); }
    if(type==='key'){ g.appendChild(el('circle',{cx:x-4,cy:y,r:5.5,fill:'none',stroke:PAPER,'stroke-width':1.8})); g.appendChild(el('path',{d:`M${x+1.5} ${y}H${x+12}M${x+8} ${y}V${y+4}M${x+11} ${y}V${y+3}`,stroke:PAPER,'stroke-width':1.8})); }
    return g; };

  // a small DDQ tag: this component has due diligence questions on its own page
  function ddqTag(g,x,y){ const t=el('g',{class:'tag'}); t.appendChild(el('rect',{x,y,width:26,height:12,rx:3,fill:'#0369a1'})); t.appendChild(el('text',{x:x+13,y:y+9,'text-anchor':'middle','font-size':7.5,'font-weight':700,'letter-spacing':'.04em',fill:'#fff'},'DDQ')); g.appendChild(t); }
  // ---- lanes, ledger column, rails ----
  const M=DATA.main;
  DATA.lanes.forEach((L,i)=>{ G.lanes.appendChild(el('rect',{x:M.x0,y:L.y0,width:M.x1-M.x0,height:L.y1-L.y0,fill:i%2?'#f4f1eb':'#f9f7f3',stroke:'#e2ddd3','stroke-width':1}));
    G.labels.appendChild(el('text',{x:M.x0+12,y:L.y0+17,'font-size':10.5,'font-weight':600,'letter-spacing':'.08em',fill:MUTED,stroke:i%2?'#f4f1eb':'#f9f7f3','stroke-width':4,'paint-order':'stroke'},L.label.toUpperCase())); });
  if(DATA.column){ const K=DATA.column; G.lanes.appendChild(el('rect',{x:K.x0,y:K.y0,width:K.x1-K.x0,height:K.y1-K.y0,rx:14,fill:'#eef1f4',stroke:'#c9d2da','stroke-width':1.2}));
    G.lanes.appendChild(el('text',{x:(K.x0+K.x1)/2,y:K.y0+22,'text-anchor':'middle','font-size':10.5,'font-weight':600,'letter-spacing':'.08em',fill:'#3f5664'},K.label.toUpperCase())); }
  const pos={};
  // rails: domains that apply across every lane (no connections), listed under the blueprint by domain
  const railsBox=document.getElementById('ei-rails');
  if(railsBox) DATA.rails.forEach(R=>{ const sec=document.createElement('section'); sec.className='ei-rail';
    sec.innerHTML=`<b>${esc(R.label)}</b><span>Applies across every lane of the blueprint.</span>`; let dom=null, list=null;
    R.items.forEach(it=>{ if(it.domain!==dom){ dom=it.domain; const h=document.createElement('h4'); h.textContent=DATA.domains[dom].name; sec.appendChild(h); list=document.createElement('div'); list.className='ri-list'; sec.appendChild(list); }
      const b=document.createElement('button'); b.type='button'; b.className='ri'; b.dataset.id=it.id; b.innerHTML=esc(it.name)+(DATA.ddq[it.id]?'<i>DDQ</i>':'');
      list.appendChild(b); pos[it.id]={el:b,rail:true}; });
    railsBox.appendChild(sec); });

  DATA.nodes.forEach(n=>{ const x=n.x-n.w/2, y=n.y-n.h/2, g=el('g',{class:'nd',tabindex:0,'data-id':n.id,'aria-label':n.name});
    if(n.type==='actor'){ g.appendChild(el('rect',{class:'bx',x,y,width:n.w,height:n.h,rx:n.h/2,fill:INK,stroke:INK,'stroke-width':1.5}));
      const subs=n.sub.length*5.7>n.w-28?wrapTxt(n.sub,Math.floor((n.w-28)/5.2)).slice(0,2):[n.sub], two=subs.length>1;
      g.appendChild(el('text',{x:n.x,y:n.y-(two?7:3),'text-anchor':'middle',class:'serif','font-size':two?15:17,fill:PAPER},n.name));
      subs.forEach((t,k)=>g.appendChild(el('text',{x:n.x,y:n.y+(two?8:14)+k*11,'text-anchor':'middle','font-size':two?9.5:10.5,fill:'#cfc9bd'},t))); }
    else if(n.type==='key'){ g.appendChild(el('rect',{class:'bx',x,y,width:n.w,height:n.h,rx:12,fill:INK,stroke:INK,'stroke-width':2}));
      const fs=n.w>=240?19:14; g.appendChild(glyph('key',x+24,n.y)); g.appendChild(el('text',{x:n.x+12,y:n.y+fs/3,'text-anchor':'middle',class:'serif','font-size':fs,fill:PAPER},n.name)); }
    else { g.appendChild(boxShape(n.type,x,y,n.w,n.h,n.status)); g.appendChild(glyph(n.type,x+19,n.y));
      const tx=x+34, lines=wrapTxt(n.name,Math.floor((n.w-44)/6.6)).slice(0,2);
      lines.forEach((t,k)=>g.appendChild(el('text',{x:tx,y:n.y+4.5+(k-(lines.length-1)/2)*14,'font-size':12,'font-weight':500,fill:INK},t)));
    }
    if(DATA.ddq[n.id]) ddqTag(g,x+n.w-(n.type==='control'?36:30),y+n.h-7);
    G.nodes.appendChild(g); pos[n.id]={x:n.x,y:n.y,w:n.w,h:n.h,el:g}; });
  if(DATA.context){ const X=DATA.context, h=60, x=X.x-X.w/2, y=X.y-h/2, g=el('g',{});
    g.appendChild(el('rect',{x,y,width:X.w,height:h,rx:10,fill:'#fff',stroke:'#cfc9bd','stroke-width':1,'stroke-dasharray':'3 3'}));
    X.lines.forEach(([k,v],i)=>{ g.appendChild(el('text',{x:x+12,y:y+18+i*24,'font-size':9,'font-weight':600,'letter-spacing':'.06em',fill:MUTED},k.toUpperCase())); g.appendChild(el('text',{x:x+12,y:y+30+i*24,'font-size':11,fill:INK},v)); });
    G.nodes.appendChild(g); }

  // ---- connections: ports spread along each side, cubic curves, typed strokes ----
  function side(a,b){ const dy=b.y-a.y, dx=b.x-a.x; if(Math.abs(dy)>=Math.max(40,a.h)) return dy>0?'b':'t'; return dx>0?'r':'l'; }
  const opp={b:'t',t:'b',l:'r',r:'l'};
  const ports={};
  const E=DATA.edges.map((e,i)=>{ const a=pos[e.from], b=pos[e.to], s=side(a,b); return Object.assign({},e,{i,a,b,sa:e.sides?e.sides[0]:s,sb:e.sides?e.sides[1]:opp[s]}); });
  E.forEach(e=>{ [[e.from,e.sa,e.b,'a'],[e.to,e.sb,e.a,'b']].forEach(([id,s,other,end])=>{ const k=id+'|'+s; (ports[k]=ports[k]||[]).push({e,other,end}); }); });
  Object.entries(ports).forEach(([k,list])=>{ const s=k.slice(-1), horiz=s==='t'||s==='b';
    list.sort((p,q)=>horiz?p.other.x-q.other.x:p.other.y-q.other.y);
    list.forEach((p,i)=>{ const n=p.end==='a'?p.e.a:p.e.b, span=horiz?Math.min(n.w-40,(list.length-1)*22):Math.min(n.h-16,(list.length-1)*10), off=list.length>1?-span/2+span*i/(list.length-1):0;
      p.e['o'+p.end]=off; }); });
  const pt=(n,s,o)=>s==='b'?[n.x+o,n.y+n.h/2]:s==='t'?[n.x+o,n.y-n.h/2]:s==='r'?[n.x+n.w/2,n.y+o]:[n.x-n.w/2,n.y+o];
  function curve(a,sa,oa,b,sb,ob){ const [x1,y1]=pt(a,sa,oa||0), [x2,y2]=pt(b,sb,ob||0), v=sa==='t'||sa==='b';
    const same=sa===sb, k=same?26:v?Math.max(26,Math.abs(y2-y1)*0.5):Math.max(26,Math.abs(x2-x1)*0.5), d1=sa==='b'||sa==='r'?1:-1, d2=sb==='b'||sb==='r'?1:-1;
    const c1=v?[x1,y1+d1*k]:[x1+d1*k,y1], c2=v?[x2,y2+d2*k]:[x2+d2*k,y2];
    return {d:`M${x1} ${y1}C${c1[0]} ${c1[1]} ${c2[0]} ${c2[1]} ${x2} ${y2}`, mid:[(x1+3*c1[0]+3*c2[0]+x2)/8,(y1+3*c1[1]+3*c2[1]+y2)/8], room:v?Math.abs(y2-y1):Math.abs(x2-x1)}; }
  // a label is drawn only where it clears every box and lane title; otherwise it stays in the detail card
  const clear=(x,y,w)=>!Object.values(pos).some(p=>Math.abs(p.x-x)<p.w/2+w/2+2&&Math.abs(p.y-y)<p.h/2+8)&&!DATA.lanes.some(L=>Math.abs(L.y0+13-y)<12&&x-w/2<M.x0+12+L.label.length*7.6);
  E.forEach(e=>{ const K=KIND[e.kind], c=curve(e.a,e.sa,e.oa,e.b,e.sb,e.ob), g=el('g',{class:'eg','data-from':e.from,'data-to':e.to});
    g.appendChild(el('path',{d:c.d,fill:'none',stroke:'#fbfaf7','stroke-width':4.5,opacity:.85}));
    const p=el('path',{class:'ln',d:c.d,fill:'none',stroke:K.stroke,'stroke-width':K.w,'marker-end':`url(#m-${e.kind})`,'stroke-linecap':'round'}); if(K.dash) p.setAttribute('stroke-dasharray',K.dash); g.appendChild(p);
    if(e.label&&c.room>24&&clear(c.mid[0],c.mid[1],e.label.length*5.3)){ g.appendChild(el('text',{x:c.mid[0],y:c.mid[1]+3.5,'text-anchor':'middle','font-size':10,'font-style':'italic',fill:'#5e5a52',stroke:'#fbfaf7','stroke-width':3.5,'paint-order':'stroke'},e.label)); }
    G.edges.appendChild(g); e.g=g; });

  // ---- detail card ----
  const nameOf=id=>DATA.clients[id]?DATA.clients[id].name:C[id]?C[id].name:id;
  const linkBtn=(id,k,l)=>`<button type="button" data-go="${esc(id)}">${esc(nameOf(id))}${l||(k&&k!=='instruction')?` <span class="k">${esc([l,k!=='instruction'?k:''].filter(Boolean).join(' · '))}</span>`:''}</button>`;
  const conn=id=>{ const ins=E.filter(e=>e.to===id), outs=E.filter(e=>e.from===id);
    return (ins.length?`<h3>Receives from</h3><div class="links">${ins.map(e=>linkBtn(e.from,e.kind,e.label)).join('')}</div>`:'')+(outs.length?`<h3>Sends to</h3><div class="links">${outs.map(e=>linkBtn(e.to,e.kind,e.label)).join('')}</div>`:''); };
  const ddqOf=id=>(DATA.ddq[id]||[]).length?`<h3>Due diligence</h3><div class="links ddq">${DATA.ddq[id].map(s=>`<a href="${s.href}">${esc(s.title)}: ${s.n} questions →</a>`).join('')}</div>`:'';
  const flowsOf=id=>{ const fs=DATA.flows.filter(f=>f.path.includes(id)); return fs.length?`<h3>In flows</h3><div class="links">${fs.map(f=>`<button type="button" data-flow="${f.id}">${esc(f.id)} ${esc(f.name)}</button>`).join('')}</div>`:''; };
  function compHtml(id){ if(DATA.clients[id]){ const c=DATA.clients[id];
      return `<div class="path">Client segment</div><h2>${esc(c.name)}</h2><p class="stx">${c.states.map(esc).join(', ')}</p>${DATA.context?`<p style="margin-top:8px">${esc(DATA.context.rule)}</p>`:''}`+conn(id)+flowsOf(id); }
    const c=C[id], d=DATA.domains[c.domain];
    return `<div class="path">${esc(c.domain)} · ${esc(d.name)}</div><h2>${esc(c.name)}</h2>`
      +`<p class="stx">${c.type?esc({system:'system of record',process:'process',technology:'technology',control:'control',key:'key material'}[c.type])+' · ':''}${esc(DATA.status_legend[c.status]||'')} · ${esc(c.id)}</p>`
      +(c.notes?`<p style="margin-top:8px">${esc(c.notes)}</p>`:'')
      +c.lists.map(([k,v])=>`<h3>${esc(k)}</h3><ul>${v.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`).join('')
      +((c.maps_to||[]).length?`<h3>Reference maps</h3><div class="links">${c.maps_to.map(r=>{ const R=DATA.refs[r]; return R.href?`<a href="${R.href}" title="${esc(R.text)}">${esc(R.label)} →</a>`:`<span title="${esc(R.text)}">${esc(R.label)}</span>`; }).join('')}</div>`:'')
      +ddqOf(id)+conn(id)+flowsOf(id)+(pos[id]&&pos[id].rail?`<p class="stx" style="margin-top:12px">Applies across every lane of the blueprint.</p>`:'')+srcOf(c); }
  function srcOf(c){ const s=c.sources||[]; return s.length?`<h3>Sources</h3><ul class="src">${s.map(x=>`<li><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a>${x.checked?` <span class="stx">(checked ${esc(x.checked)})</span>`:''}</li>`).join('')}</ul>`:''; }
  const flowHtml=f=>`<div class="path">Flow ${esc(f.id)} · ${f.path.length} steps</div><h2>${esc(f.name)}</h2><ol class="fl" style="margin-top:8px">${f.path.map(id=>`<li data-go="${esc(id)}">${esc(nameOf(id))}</li>`).join('')}</ol>`;
  let pinned=null, hl=null;
  const showCard=(html,closable)=>{ panel.innerHTML=(closable?'<button type="button" class="x" aria-label="Close">×</button>':'')+html; panel.hidden=false; wire(); };
  const hideCard=()=>{ panel.hidden=true; panel.innerHTML=''; };
  const rest=()=>hideCard();
  function wire(){ panel.querySelectorAll('.x').forEach(b=>b.addEventListener('click',e=>{ e.stopPropagation(); if(pinned) unpin(); else setHl(null); }));
    panel.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',e=>{ e.stopPropagation(); const p=pos[b.dataset.go]; if(p){ pin(b.dataset.go); p.el.scrollIntoView({block:'center',inline:'center',behavior:'smooth'}); } }));
    panel.querySelectorAll('[data-flow]').forEach(b=>b.addEventListener('click',e=>{ e.stopPropagation(); unpin(true); setHl('flow:'+b.dataset.flow); })); }

  // ---- focus a component: its connections and neighbours stay, the rest fades ----
  function clearMarks(){ bp.classList.remove('dim'); document.querySelectorAll('#ei-svg .on, #ei-rails .on').forEach(x=>x.classList.remove('on')); }
  function focus(id){ clearMarks(); G.flow.innerHTML=''; bp.classList.remove('flow'); if(!pos[id].rail) bp.classList.add('dim'); pos[id].el.classList.add('on');
    E.forEach(e=>{ if(e.from===id||e.to===id){ e.g.classList.add('on'); pos[e.from].el.classList.add('on'); pos[e.to].el.classList.add('on'); G.edges.appendChild(e.g); } }); }
  function pin(id){ if(pinned) pos[pinned].el.classList.remove('pin'); pinned=id; pos[id].el.classList.add('pin'); focus(id); showCard(compHtml(id),true); }
  function unpin(quiet){ if(!pinned) return; pos[pinned].el.classList.remove('pin'); pinned=null; if(!quiet){ applyHl(); rest(); } }
  Object.entries(pos).forEach(([id,p])=>{ const g=p.el;
    g.addEventListener('mouseenter',()=>{ if(pinned) return; if(!hl) focus(id); showCard(compHtml(id)); });
    g.addEventListener('mouseleave',()=>{ if(pinned) return; if(!hl) applyHl(); rest(); });
    g.addEventListener('focus',()=>{ if(!pinned){ focus(id); showCard(compHtml(id)); } });
    g.addEventListener('click',e=>{ e.stopPropagation(); if(pinned===id) unpin(); else pin(id); });
    g.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); if(pinned===id) unpin(); else pin(id); } }); });
  document.addEventListener('click',e=>{ if(pinned&&!e.target.closest('#ei-panel')) unpin(); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(pinned) unpin(); else if(hl) setHl(null); } });

  // ---- trace bar: one flow, status, source or reference map at a time ----
  const sel=document.getElementById('ei-flow-sel');
  function applyHl(){ clearMarks(); bp.classList.remove('flow'); G.flow.innerHTML='';
    if(!hl) return;
    if(hl.type==='flow'){ const f=DATA.flows.find(x=>x.id===hl.value); bp.classList.add('dim','flow');
      const ids=f.path.filter(id=>pos[id]);
      ids.forEach(id=>pos[id].el.classList.add('on'));
      for(let i=0;i<ids.length-1;i++){ const a=pos[ids[i]], b=pos[ids[i+1]], fw=E.find(e=>e.from===ids[i]&&e.to===ids[i+1]), bw=E.find(e=>e.from===ids[i+1]&&e.to===ids[i]);
        let c; if(fw) c=curve(fw.a,fw.sa,fw.oa,fw.b,fw.sb,fw.ob); else if(bw) c=curve(bw.b,bw.sb,bw.ob,bw.a,bw.sa,bw.oa); else { const s=side(a,b); c=curve(a,s,0,b,opp[s],0); }
        G.flow.appendChild(el('path',{d:c.d,fill:'none',stroke:'#fbfaf7','stroke-width':7,opacity:.9}));
        G.flow.appendChild(el('path',{d:c.d,fill:'none',stroke:SKY,'stroke-width':3,'stroke-linecap':'round','marker-end':'url(#m-flow)'})); }
      ids.forEach((id,i)=>{ const p=pos[id], x=p.x-p.w/2, y=p.y-p.h/2; G.flow.appendChild(el('circle',{cx:x+2,cy:y+2,r:10,fill:SKY,stroke:'#fff','stroke-width':2})); G.flow.appendChild(el('text',{x:x+2,y:y+6,'text-anchor':'middle','font-size':11,'font-weight':700,fill:'#fff'},String(i+1))); });
      return; }
    bp.classList.add('dim');
    Object.entries(pos).forEach(([id,p])=>{ const c=C[id]; if(!c) return; const ok=hl.type==='status'?c.status===hl.value:hl.type==='source'?c.source===hl.value:(c.maps_to||[]).includes(hl.value); if(ok) p.el.classList.add('on'); }); }
  function setHl(key){ const same=hl&&key===`${hl.type}:${hl.value}`; hl=!key||same?null:{type:key.split(':')[0],value:key.split(':').slice(1).join(':')};
    if(sel){ sel.value=hl&&hl.type==='flow'?hl.value:''; sel.classList.toggle('on',!!hl); }
    if(pinned) unpin(true); applyHl(); rest(); }
  if(sel) sel.addEventListener('change',()=>{ hl=null; setHl(sel.value?'flow:'+sel.value:null); });
  const fromHash=()=>{ const id=decodeURIComponent(location.hash.slice(1)); if(pos[id]){ pin(id); pos[id].el.scrollIntoView({block:'center',inline:'center'}); } };
  window.addEventListener('hashchange',fromHash); if(location.hash) setTimeout(fromHash,60);
})();
</script>
</body>
</html>
