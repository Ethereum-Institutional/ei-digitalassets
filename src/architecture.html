<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;1,7..72,400&display=swap">
__STYLE__
<style>
  /* architecture pages (kind: architecture): the areas a digital asset team runs, from the clients to the ledger, drawn
     as blocks over the blueprint. Opening a block draws its components and their connections inside it; the panel on
     the right explains what is open or picked. Components are drawn by type (system of record, process, technology,
     control, key material); lines are typed (instruction solid, data dashed, control dotted). */
  /* architecture pages (kind: architecture): a blueprint. Lanes run from the clients at the top to the private keys at
     the bottom; nodes are components drawn by type (system of record, process, technology, control); lines are typed
     connections (instruction solid, data dashed, control dotted). Status is drawn by line weight and fill only. */
  .ei-taxonomy.arch{max-width:1760px}
  .ei-flowbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
  .ei-flowbar label{font-family:var(--serif);font-size:20px;letter-spacing:-.02em}
  .ei-flowbar .sel{position:relative;flex:0 1 380px;min-width:0}
  .ei-flowbar select{font:inherit;font-size:14px;color:var(--ink);background:#fff;border:1px solid var(--rule);border-radius:12px;padding:9px 36px 9px 14px;width:100%;appearance:none;-webkit-appearance:none;cursor:pointer;
    background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 20px) 55%,calc(100% - 15px) 55%;background-size:5px 5px;background-repeat:no-repeat}
  .ei-flowbar select:hover{border-color:var(--ink)}
  .ei-flowbar select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .ei-flowbar select.on{border-color:#0ea5e9;box-shadow:inset 0 0 0 1px #0ea5e9}
  .ei-flowbar .hint{font-size:12.5px;color:var(--muted)}
  details.ei-legend-box summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--ink);list-style:none;display:inline-flex;align-items:center;gap:7px;padding:2px 6px}
  details.ei-legend-box summary::-webkit-details-marker{display:none}
  details.ei-legend-box summary::before{content:'';width:6px;height:6px;border-right:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);transform:rotate(-45deg);transition:transform .15s}
  details.ei-legend-box[open] summary::before{transform:rotate(45deg)}
  details.ei-legend-box[open] .ei-legend{margin-top:8px}
  .ei-ddq{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,600px),1fr));gap:14px;align-items:start}
  .ei-ddq section{border:1px solid var(--rule);border-radius:16px;background:var(--card);overflow:hidden}
  .ei-ddq h3{margin:0;padding:12px 18px;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--rule)}
  .ei-ddq ul{list-style:none;margin:0;padding:0}
  .ei-ddq li+li{border-top:1px solid var(--rule)}
  .ei-ddq a{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:16px;row-gap:2px;padding:11px 18px;color:var(--ink);text-decoration:none;background:#fff}
  .ei-ddq a:hover,.ei-ddq a:focus-visible{background:#f4f8fb;outline:none}
  .ei-ddq b{font-size:15px;font-weight:600}
  .ei-ddq span{grid-column:1;font-size:13px;color:var(--muted);line-height:1.4}
  .ei-ddq em{grid-column:2;grid-row:1 / span 2;align-self:center;font-style:normal;font-size:12px;font-weight:600;color:#0369a1;white-space:nowrap;font-variant-numeric:tabular-nums}
  .ei-ddq em::after{content:' questions →'}
  i.sw,.ei-lens.arch button i.sw{display:inline-block;width:18px;height:11px;border-radius:3px;flex:none;box-sizing:border-box;background:#fff}
  i.sw.st-existing,.ei-lens.arch button i.sw.st-existing{background:var(--sand);border:1.2px solid #a9a397}
  i.sw.st-extend,.ei-lens.arch button i.sw.st-extend{border:1.3px solid var(--ink)}
  i.sw.st-new,.ei-lens.arch button i.sw.st-new{border:2.6px solid var(--ink)}
  i.sw.st-evaluate,.ei-lens.arch button i.sw.st-evaluate{border:1.3px dashed var(--ink)}
  i.sugdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#312e81;flex:none}
  i.ref{font-style:normal;font-size:9px;font-weight:700;padding:0 4px;border-radius:5px;border:1px solid currentColor;line-height:1.5;flex:none}
  .ei-legend svg{vertical-align:middle}
  .ei-legend.bottom{padding:12px 16px;border:1px solid var(--rule);border-radius:14px;background:var(--card);gap:8px 18px}
  .ei-legend.bottom .lt{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);flex-basis:auto;margin-left:6px}
  .ei-legend.bottom .lt:first-child{margin-left:0}
  .ei-h.ddq{display:flex;flex-direction:column;gap:4px;margin-top:8px}
  .ei-h.ddq b{font-family:var(--serif);font-weight:400;font-size:24px;letter-spacing:-.02em}
  .ei-h.ddq span{font-size:14px;color:var(--muted);line-height:1.5;max-width:90ch}
  .ei-systems{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
  .ei-sys{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border:1px solid var(--rule);border-radius:14px;background:var(--card);color:var(--ink);text-decoration:none;transition:border-color .15s}
  .ei-sys:hover,.ei-sys:focus-visible{border-color:var(--ink);outline:none}
  .ei-sys b{font-family:var(--serif);font-weight:400;font-size:18px;letter-spacing:-.01em}
  .ei-sys span{font-size:13px;line-height:1.45;color:var(--muted)}
  .ei-sys em{font-style:normal;font-size:12.5px;margin-top:auto;color:#0369a1;font-weight:600}
  /* detail card: floats over the blueprint so it stays in view while you explore */
  /* the rails: domains that apply across every lane, listed under the blueprint rather than drawn in it */
  .ei-rails{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
  .ei-rail{border:1px solid var(--rule);border-radius:16px;background:var(--card);padding:16px 18px}
  .ei-rail>b{display:block;font-family:var(--serif);font-weight:400;font-size:20px;letter-spacing:-.02em}
  .ei-rail>span{display:block;font-size:13px;color:var(--muted);margin:2px 0 6px}
  .ei-rail h4{margin:12px 0 6px;font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
  .ei-rail .ri-list{display:flex;flex-wrap:wrap;gap:6px}
  .ei-rail .ri{font:inherit;font-size:13px;line-height:1.3;text-align:left;padding:5px 10px;border-radius:9px;border:1px solid #cfc9bd;background:#fff;color:var(--ink);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
  .ei-rail .ri:hover,.ei-rail .ri.on{border-color:var(--ink)}
  .ei-rail .ri.pin{border-color:#0ea5e9;box-shadow:0 0 0 2px #0ea5e9}
  .ei-rail .ri:focus-visible{outline:2px solid #0ea5e9;outline-offset:2px}
  .ei-rail .ri i{font-style:normal;font-size:9px;font-weight:700;letter-spacing:.04em;color:#fff;background:#0369a1;border-radius:3px;padding:1px 4px}
  .ei-features{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:14px}
  @media (max-width:520px){.ei-features{grid-template-columns:1fr}}
  .ei-feature{padding:18px 20px;border:1px solid var(--rule);border-radius:16px;background:var(--card);display:flex;flex-direction:column;gap:12px;min-width:0}
  .ei-feature .from{margin:0;font-size:12px;color:var(--muted)}
  .ei-tier-h{display:flex;flex-direction:column;gap:2px}
  .ei-tier-h b{font-family:var(--serif);font-weight:400;font-size:20px;letter-spacing:-.02em}
  .ei-tier-h span{font-size:13px;color:var(--muted);line-height:1.45;max-width:90ch}
  ol.ei-tl{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px}
  ol.ei-tl li{padding:10px 12px;background:#fff;border:1px solid var(--rule);border-radius:12px}
  ol.ei-tl .num{display:inline-flex;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:11px;font-weight:700;align-items:center;justify-content:center;margin-bottom:6px}
  ol.ei-tl li:last-child .num{background:#fff;color:var(--ink);border:1.5px dashed var(--ink)}
  ol.ei-tl b{display:block;font-size:13px;font-weight:600;margin-bottom:3px}
  ol.ei-tl p{margin:0;font-size:12.5px;line-height:1.45;color:var(--muted)}
  .ei-mx{overflow-x:auto}
  table.ei-std{width:100%;border-collapse:collapse;font-size:13px;background:#fff;border:1px solid var(--rule);border-radius:12px;overflow:hidden}
  table.ei-std th,table.ei-std td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--rule);vertical-align:middle;line-height:1.4}
  table.ei-std thead th{font-weight:600;background:var(--card);font-size:12px;color:var(--muted)}
  table.ei-std tbody th{font-weight:600;font-size:13px}
  table.ei-std tr:last-child td,table.ei-std tr:last-child th{border-bottom:none}
  table.ei-std .cell{display:inline-block;font-size:11px;color:var(--muted);padding:2px 8px;border:1px dashed var(--rule);border-radius:8px}
  .ei-mx .cats{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:10px}
  .ei-mx .cats .rl{font-size:12px;color:var(--muted);margin-right:4px}
  .ei-mx .cats span:not(.rl){font-size:11px;padding:2px 8px;border-radius:8px;background:#fff;border:1px solid var(--rule)}
  .ei-arch{display:grid;grid-template-columns:minmax(0,7fr) minmax(300px,3fr);gap:20px;align-items:start}
  .ei-arch-main{display:flex;flex-direction:column;gap:12px;min-width:0}
  .ei-bp{border:1px solid var(--rule);border-radius:18px;background:#fbfaf7;overflow:hidden}
  .ei-bp svg{display:block;width:100%;height:auto}
  .ei-bp svg text{font-family:var(--sans);pointer-events:none}
  .ei-bp svg text.serif{font-family:var(--serif)}
  .ei-bp .blk,.ei-bp .nd,.ei-bp .tg{cursor:pointer}
  .ei-bp .blk:focus,.ei-bp .nd:focus,.ei-bp .tg:focus{outline:none}
  .ei-bp .blk:focus-visible .hit,.ei-bp .tg:focus-visible rect{stroke:#0ea5e9;stroke-width:3}
  .ei-bp .nd:focus-visible .bx{stroke:#0ea5e9;stroke-width:3}
  .ei-bp .blk:hover .hit{fill:rgba(14,165,233,.05)}
  .ei-bp .tg:hover rect{stroke:#0ea5e9}
  .ei-bp .nd,.ei-bp .eg{transition:opacity .15s}
  .ei-bp.dim .nd:not(.on){opacity:.22}
  .ei-bp.dim .eg:not(.on){opacity:.06}
  .ei-bp .eg.on path.ln{stroke-width:2.4}
  .ei-bp .eg.on text{font-weight:600;fill:#14130f}
  .ei-bp .nd.pin .bx{stroke:#0ea5e9;stroke-width:3}
  .ei-bp.flow .eg{opacity:.06}
  .ei-bp .cv,.ei-bp .lbl{cursor:pointer}
  .ei-bp .cv:hover rect.card{stroke:#0ea5e9;stroke-width:2.4}
  /* covers pulse until the reader first reveals one, so they read as the thing to click (as the Privacy wish list) */
  @keyframes ei-cv-pulse{0%{stroke-opacity:.5;stroke-width:1.6}70%{stroke-opacity:0;stroke-width:18}100%{stroke-opacity:0;stroke-width:18}}
  .ei-bp.pulse .cv rect.halo{animation:ei-cv-pulse 1.8s ease-out infinite}
  @media (prefers-reduced-motion: reduce){ .ei-bp.pulse .cv rect.halo{animation:none;stroke-opacity:.35;stroke-width:5} }
  .ei-bp .cv.on rect.card{stroke:#0ea5e9;stroke-width:2.4;stroke-dasharray:none}
  .ei-bp .cv:focus{outline:none}
  .ei-bp .cv:focus-visible rect.card{stroke:#0ea5e9;stroke-width:3}
  .ei-bp .lbl:hover text{text-decoration:underline}
  .ei-arch-tools{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
  .ei-arch-tools .all{display:flex;gap:6px}
  .ei-arch-tools .all button{font:inherit;font-size:13px;padding:6px 12px;border-radius:10px;border:1px solid var(--rule);background:#fff;color:var(--ink);cursor:pointer}
  .ei-arch-tools .all button:hover{border-color:var(--ink)}
  /* the panel: sticky beside the diagram, so an explanation is always in view next to what it explains */
  .ei-side{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;background:#fff;border:1px solid var(--rule);border-radius:18px;padding:18px 20px 20px}
  .ei-side h2{margin:0 0 6px;font-family:var(--serif);font-weight:400;font-size:23px;letter-spacing:-.02em;line-height:1.2}
  .ei-side p{margin:0;font-size:14px;line-height:1.55}
  .ei-side p+p{margin-top:8px}
  .ei-side .path{font-size:12px;color:var(--muted);margin-bottom:4px}
  .ei-side .stx{font-size:13px;color:var(--muted);margin-top:2px}
  .ei-side h3{margin:16px 0 6px;font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
  .ei-side ul,.ei-side ol{margin:0;padding-left:18px;font-size:14px;line-height:1.55}
  .ei-side .links{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .ei-side .links a,.ei-side .links button,.ei-side .links span{font:inherit;font-size:12.5px;padding:4px 10px;border-radius:9px;border:1px solid var(--rule);background:var(--card);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;gap:5px;align-items:center;text-align:left}
  .ei-side .links span{cursor:default;color:var(--muted)}
  .ei-side .links a:hover,.ei-side .links button:hover{border-color:var(--ink)}
  .ei-side .links .k{font-size:10px;color:var(--muted);border:none;padding:0;background:none}
  .ei-side .links.opt button{border-style:dashed;border-color:var(--ink);background:#fff}
  .ei-side .links i{font-style:normal;font-size:9px;font-weight:700;letter-spacing:.04em;color:#fff;background:#0369a1;border-radius:3px;padding:1px 4px}
  .ei-side .ddq a{background:#0369a1;color:#fff;border-color:#0369a1}
  .ei-side .ddq a:hover{background:#075985;border-color:#075985}
  .ei-side .back{font:inherit;font-size:12.5px;border:none;background:none;color:#0369a1;cursor:pointer;padding:0;margin-bottom:8px}
  .ei-side .back::before{content:'← '}
  .ei-side .tog{font:inherit;font-size:13.5px;font-weight:600;margin-top:12px;padding:8px 14px;border-radius:11px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer}
  .ei-side .tog.open{background:#fff;color:var(--ink)}
  .ei-side .nav{list-style:none;padding:0;margin:6px 0 0;display:flex;flex-direction:column;gap:6px}
  .ei-side .nav button{font:inherit;width:100%;text-align:left;padding:9px 12px;border-radius:11px;border:1px solid var(--rule);background:var(--card);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:1px}
  .ei-side .nav button:hover{border-color:var(--ink)}
  .ei-side .nav b{font-family:var(--serif);font-weight:400;font-size:16.5px;letter-spacing:-.01em}
  .ei-side .nav span{font-size:12px;color:var(--muted)}
  .ei-side .nav .opt{font-size:11.5px;color:var(--ink)}
  .ei-side .x{display:none;position:absolute;top:10px;right:12px;font:inherit;font-size:20px;line-height:1;border:none;background:none;color:var(--muted);cursor:pointer;padding:4px}
  .ei-side ol.fl li{cursor:pointer}
  .ei-side ol.fl li:hover{text-decoration:underline;text-underline-offset:3px}
  .ei-sections{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
  .ei-section{padding:18px 20px;border:1px solid var(--rule);border-radius:16px;background:var(--card)}
  .ei-section h2{margin:0 0 8px;font-family:var(--serif);font-weight:400;font-size:21px;letter-spacing:-.02em}
  .ei-section p{margin:0;font-size:14px;line-height:1.55}
  /* narrow screens: the diagram takes the width and the panel becomes a sheet at the bottom, shown once you pick something */
  @media (max-width:900px){
    .ei-arch{grid-template-columns:1fr}
    .ei-bp{overflow-x:auto}
    .ei-bp svg{min-width:720px}
    .ei-side{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));top:auto;max-height:52vh;z-index:20;box-shadow:0 12px 40px rgba(20,19,15,.18)}
    .ei-side.idle{display:none}
    .ei-side .x{display:block}
  }
</style>
</head>
<body>
<div class="ei-taxonomy arch">
  __NOTICE__
  <div class="ei-head">
    <span class="ei-eyebrow">__EYEBROW__</span>
    __NAV__
    <h1>__HEADING__</h1>
    <p class="sub">__INTRO__</p>
    __INTRO_MORE__
  </div>
  <div class="ei-arch">
    <div class="ei-arch-main">
      <div class="ei-arch-tools">__CONTROLS__<span class="all"><button type="button" data-all="1">Reveal every area</button><button type="button" data-all="0">Cover every area</button></span></div>
      <div class="ei-bp pulse" id="ei-bp"><svg id="ei-svg" viewBox="0 0 1000 800" role="img" aria-label="__SVG_LABEL__"></svg></div>
      __ARCH_LEGEND__
    </div>
    <aside class="ei-side idle" id="ei-side" aria-live="polite"></aside>
  </div>
  <div class="ei-rails" id="ei-rails" aria-label="Around every area"></div>
  __SYSTEMS__
  <div class="ei-features">__FEATURES__</div>
  __SECTIONS__
  __CONTRIBUTE__
  <p class="ei-foot">__FOOTNOTE__ <span class="ei-ver">__VERSION__</span></p>
</div>

<script>
(function(){
  const DATA = __DATA__;
  const moreBtn=document.querySelector('.ei-more'), moreTxt=document.getElementById('ei-intro-more');
  if(moreBtn&&moreTxt) moreBtn.addEventListener('click',()=>{ const open=moreTxt.hidden; moreTxt.hidden=!open; moreBtn.textContent=open?moreBtn.dataset.less:moreBtn.dataset.more; moreBtn.setAttribute('aria-expanded',String(open)); });
  const NS='http://www.w3.org/2000/svg', INK='#14130f', PAPER='#f8f6f2', MUTED='#615f5a', SKY='#0ea5e9', BLUE='#0369a1';
  const KIND={instruction:{stroke:'#4b4740',dash:'',w:1.3},data:{stroke:'#0369a1',dash:'5 4',w:1.3},control:{stroke:'#4338ca',dash:'1.5 3.5',w:1.7}};
  const el=(t,a,txt)=>{ const e=document.createElementNS(NS,t); for(const k in a) e.setAttribute(k,a[k]); if(txt!=null) e.textContent=txt; return e; };
  const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
  const wrapTxt=(s,max)=>{ const out=[]; let line=''; for(const w of String(s).split(' ')){ if(line&&(line+' '+w).length>max){ out.push(line); line=w; } else line=line?line+' '+w:w; } if(line) out.push(line); return out; };
  const svg=document.getElementById('ei-svg'), bp=document.getElementById('ei-bp'), panel=document.getElementById('ei-side');
  const C=DATA.components, CL=DATA.clients, clientIds=Object.keys(CL);
  const AREAS=DATA.overview, AM=Object.fromEntries(AREAS.map(a=>[a.id,a]));

  // ---- what can be revealed: each area, and each step of an area with steps (the custody platform) ----
  const UNITS={}, unitOf={};
  AREAS.forEach(a=>{ UNITS[a.id]={area:a,ids:[...a.components,...a.optional.flatMap(o=>o.components)]};
    a.parts.forEach(p=>{ UNITS[a.id+'/'+p.id]={area:a,part:p,ids:p.components}; }); });
  Object.entries(UNITS).forEach(([k,u])=>u.ids.forEach(id=>unitOf[id]=k));
  clientIds.forEach(id=>unitOf[id]='clients');
  const optOf={}; AREAS.forEach(a=>a.optional.forEach(o=>o.components.forEach(id=>optOf[id]=o.name)));
  const shown=new Set(['clients']);   // revealed units; the clients are never covered
  const unitsOfArea=id=>Object.keys(UNITS).filter(k=>k===id||k.startsWith(id+'/'));
  const areaShown=id=>unitsOfArea(id).some(k=>shown.has(k));
  const ddqOfIds=ids=>{ const out=[]; ids.forEach(id=>(DATA.ddq[id]||[]).forEach(s=>{ if(!out.some(x=>x.id===s.id)) out.push(s); })); return out; };
  const idsOfKey=k=>k==='clients'?clientIds:k.includes('/')?UNITS[k].ids:unitsOfArea(k).flatMap(u=>UNITS[u].ids);
  const countTxt=k=>{ if(k==='clients') return `${clientIds.length} client segments`; const ids=idsOfKey(k), d=ddqOfIds(ids).length;
    return `${ids.length} ${ids.length===1?'component':'components'}${d?` · ${d} due diligence ${d===1?'page':'pages'}`:''}`; };

  // ---- shapes ----
  function boxShape(type,x,y,w,h){ const a={class:'bx',fill:'#fff',stroke:INK,'stroke-width':1.5};
    if(type==='control'){ const n=10; return el('path',Object.assign(a,{d:`M${x+n} ${y}H${x+w-n}L${x+w} ${y+h/2}L${x+w-n} ${y+h}H${x+n}L${x} ${y+h/2}Z`})); }
    return el('rect',Object.assign(a,{x,y,width:w,height:h,rx:type==='process'?h/2:3})); }
  const glyph=(type,x,y)=>{ const g=el('g',{});
    if(type==='system'){ g.appendChild(el('rect',{x:x-7,y:y-7,width:14,height:14,rx:1,fill:'none',stroke:INK,'stroke-width':1.2})); g.appendChild(el('path',{d:`M${x-7} ${y-3.5}H${x+7}M${x-3.5} ${y-7}V${y+7}`,stroke:INK,'stroke-width':1})); }

      +`<h3>Client segments</h3><div class="links">${clientIds.map(chip).join('')}</div>`+DATA.context.lines.map(([k,v])=>`<h3>${esc(k)}</h3><p class="stx">${esc(v)}</p>`).join('');
    const isOpen=p?isShown(k):areaShown(aid);
    let h=`<button type="button" class="back" data-home>All areas</button>${p?`<div class="path">${esc(a.name)}, step ${a.parts.indexOf(p)+1} of ${a.parts.length}</div>`:a.beside?`<div class="path">Called out from the ${esc(AM[a.beside].name.toLowerCase())}</div>`:''}<h2>${esc(p?p.name:a.name)}</h2>`
      +(a.sub&&!p?`<p class="stx">${esc(a.sub)}</p>`:'')+(p?'':`<p>${esc(a.text)}</p>`)
      +(`<button type="button" class="tog${isOpen?' open':''}" data-toggle="${esc(k)}">${isOpen?'Cover it again':'Reveal it in the diagram'}</button>`);
    if(p) h+=`<h3>Components</h3><div class="links">${p.components.map(chip).join('')}</div>`;
    else { if(a.components.length) h+=`<h3>${a.parts.length?'The platform':'Components'}</h3><div class="links">${a.components.map(chip).join('')}</div>`;
      a.parts.forEach(q=>{ h+=`<h3>${esc(q.name)}${q.callout?` · calls out to ${esc(AM[q.callout].name.toLowerCase())}`:''}</h3><div class="links">${q.components.map(chip).join('')}</div>`; });
      a.optional.forEach(o=>{ h+=`<h3>Optional · ${esc(o.name)}</h3><div class="links opt">${o.components.map(chip).join('')}</div>`; }); }
    return h+ddqHtml(idsOfKey(k)); }
  const linkBtn=(id,k,l)=>`<button type="button" data-go="${esc(id)}">${esc(nameOf(id))}${l||(k&&k!=='instruction')?` <span class="k">${esc([l,k!=='instruction'?k:''].filter(Boolean).join(' · '))}</span>`:''}</button>`;
  const conn=id=>{ const ins=DATA.edges.filter(e=>e.to===id), outs=DATA.edges.filter(e=>e.from===id);
    return (ins.length?`<h3>Receives from</h3><div class="links">${ins.map(e=>linkBtn(e.from,e.kind,e.label)).join('')}</div>`:'')+(outs.length?`<h3>Sends to</h3><div class="links">${outs.map(e=>linkBtn(e.to,e.kind,e.label)).join('')}</div>`:''); };
  const flowsOf=id=>{ const fs=DATA.flows.filter(f=>f.path.includes(id)); return fs.length?`<h3>In flows</h3><div class="links">${fs.map(f=>`<button type="button" data-flow="${f.id}">${esc(f.id)} ${esc(f.name)}</button>`).join('')}</div>`:''; };
  function srcOf(c){ const s=c.sources||[]; return s.length?`<h3>Sources</h3><ul class="src">${s.map(x=>`<li><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a>${x.checked?` <span class="stx">(checked ${esc(x.checked)})</span>`:''}</li>`).join('')}</ul>`:''; }
  function compHtml(id){ const u=unitOf[id], back=u?`<button type="button" class="back" data-area="${esc(u)}">${esc(areaName(u))}</button>`:`<button type="button" class="back" data-home>All areas</button>`;
    if(CL[id]){ const c=CL[id]; return back+`<div class="path">Client segment</div><h2>${esc(c.name)}</h2><p class="stx">${esc(c.sub)}</p><p style="margin-top:8px">${esc(DATA.context.rule)}</p>`+conn(id)+flowsOf(id); }
    const c=C[id], d=DATA.domains[c.domain];
    return back+`<div class="path">${esc(c.domain)} · ${esc(d.name)}${optOf[id]?` · optional (${esc(optOf[id])})`:''}</div><h2>${esc(c.name)}</h2>`
      +`<p class="stx">${c.type?esc({system:'system of record',process:'process',technology:'technology',control:'control',key:'key material'}[c.type])+' · ':''}${esc(DATA.status_legend[c.status]||'')} · ${esc(c.id)}</p>`
      +(c.notes?`<p style="margin-top:8px">${esc(c.notes)}</p>`:'')
      +c.lists.map(([k,v])=>`<h3>${esc(k)}</h3><ul>${v.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`).join('')
      +((c.maps_to||[]).length?`<h3>Reference maps</h3><div class="links">${c.maps_to.map(r=>{ const R=DATA.refs[r]; return R.href?`<a href="${R.href}" title="${esc(R.text)}">${esc(R.label)} →</a>`:`<span title="${esc(R.text)}">${esc(R.label)}</span>`; }).join('')}</div>`:'')
      +((DATA.ddq[id]||[]).length?`<h3>Due diligence</h3><div class="links ddq">${DATA.ddq[id].map(s=>`<a href="${s.href}">${esc(s.title)}: ${s.n} questions →</a>`).join('')}</div>`:'')
      +conn(id)+flowsOf(id)+(railIds.has(id)?`<p class="stx" style="margin-top:12px">Applies across every area.</p>`:'')+srcOf(c); }
  const flowHtml=f=>`<button type="button" class="back" data-home>All areas</button><div class="path">Flow ${esc(f.id)} · ${f.path.length} steps</div><h2>${esc(f.name)}</h2><ol class="fl" style="margin-top:8px">${f.path.map(id=>`<li data-go="${esc(id)}">${esc(C[id]&&C[id].short||nameOf(id))}</li>`).join('')}</ol>`;
  function showPanel(){ let html;
    if(sel&&sel.type==='comp') html=compHtml(sel.id); else if(sel&&sel.type==='area') html=areaHtml(sel.key); else if(sel&&sel.type==='flow') html=flowHtml(DATA.flows.find(f=>f.id===sel.id)); else html=defaultHtml();
    panel.innerHTML='<button type="button" class="x" aria-label="Close">×</button>'+html; panel.classList.toggle('idle',!sel); panel.scrollTop=0;
    panel.querySelector('.x').addEventListener('click',()=>home());
    panel.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',e=>{ e.stopPropagation(); go(b.dataset.go); }));
    panel.querySelectorAll('[data-area]').forEach(b=>b.addEventListener('click',e=>{ e.stopPropagation(); pickArea(b.dataset.area,{reveal:true,scroll:true}); }));
    panel.querySelectorAll('[data-toggle]').forEach(b=>b.addEventListener('click',e=>{ e.stopPropagation(); toggle(b.dataset.toggle); render(); showPanel(); }));
    panel.querySelectorAll('[data-home]').forEach(b=>b.addEventListener('click',e=>{ e.stopPropagation(); home(); }));
    panel.querySelectorAll('[data-flow]').forEach(b=>b.addEventListener('click',e=>{ e.stopPropagation(); setFlow(b.dataset.flow); })); }

  // ---- state ----
  const unitsOf=k=>k.includes('/')?[k]:unitsOfArea(k);
  function toggle(k,single){ if(k==='clients') return; bp.classList.remove('pulse'); /* the first reveal stops the pulse */ const us=single?[k]:unitsOf(k), any=us.some(u=>shown.has(u)); us.forEach(u=>any?shown.delete(u):shown.add(u)); }
  function pickArea(k,o){ flow=null; pinned=null; if(flowSel) flowSel.value='';
    if(o.reveal){ if(!unitsOf(k).some(u=>shown.has(u))) toggle(k); } else if(o.toggle) toggle(k,o.single);
    sel={type:'area',key:k}; render(); showPanel();
    if(o.scroll){ const R=REG[k]||REG[unitsOf(k)[0]]; if(R){ const el_=svg.querySelector(`[data-key="${CSS.escape(k)}"]`); if(el_) el_.scrollIntoView({block:'nearest',behavior:'smooth'}); } } }
  function home(){ sel=null; pinned=null; flow=null; if(flowSel) flowSel.value=''; railsBox&&railsBox.querySelectorAll('.ri.pin').forEach(x=>x.classList.remove('pin')); render(); showPanel(); }
  function go(id){ flow=null; if(flowSel) flowSel.value=''; const u=unitOf[id]; if(u&&u!=='clients') shown.add(u); pinned=POS[id]?id:null; sel={type:'comp',id}; render(); showPanel();
    if(POS[id]&&POS[id].el) POS[id].el.scrollIntoView({block:'center',behavior:'smooth'}); }
  function setFlow(fid){ const f=DATA.flows.find(x=>x.id===fid); if(!f) return home(); flow=f; pinned=null; bp.classList.remove('pulse'); shown.clear(); shown.add('clients'); f.path.forEach(id=>{ const u=unitOf[id]; if(u) shown.add(u); });
    sel={type:'flow',id:fid}; if(flowSel) flowSel.value=fid; render(); showPanel(); }
  function marks(){ bp.classList.remove('dim','flow'); G.flow.innerHTML='';
    if(flow){ bp.classList.add('dim','flow'); const ids=flow.path.filter(id=>POS[id]&&POS[id].el); ids.forEach(id=>POS[id].el.classList.add('on'));
      for(let i=0;i<ids.length-1;i++){ const a=POS[ids[i]], b=POS[ids[i+1]], d=edgePath(null,a,b);
        G.flow.appendChild(el('path',{d,fill:'none',stroke:'#fbfaf7','stroke-width':7,opacity:.9})); G.flow.appendChild(el('path',{d,fill:'none',stroke:SKY,'stroke-width':3,'stroke-linecap':'round','marker-end':'url(#m-flow)'})); }
      // a flow may pass a component twice (out through the RPC nodes and back): its step numbers sit side by side
      const seen={}; ids.forEach((id,i)=>{ const p=POS[id], k=seen[id]=(seen[id]||0)+1, x=p.x-p.w/2+(k-1)*23, y=p.y-p.h/2;
        G.flow.appendChild(el('circle',{cx:x+2,cy:y+2,r:10,fill:SKY,stroke:'#fff','stroke-width':2})); G.flow.appendChild(el('text',{x:x+2,y:y+6,'text-anchor':'middle','font-size':11,'font-weight':700,fill:'#fff'},String(i+1))); });
      return; }
    if(pinned&&POS[pinned]&&POS[pinned].el){ POS[pinned].el.classList.add('pin'); focus(pinned); } }
  function wire(){
    svg.querySelectorAll('.cv').forEach(g=>{ const k=g.dataset.key, act=e=>{ e.stopPropagation(); pickArea(k,{toggle:true,single:true}); };
      g.addEventListener('click',act); g.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); act(e); } }); });
    svg.querySelectorAll('.lbl').forEach(g=>{ const k=g.dataset.key, frm=g.classList.contains('frm'), act=e=>{ e.stopPropagation(); pickArea(k,{toggle:true,single:!frm}); };
      g.addEventListener('click',act); g.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); act(e); } }); });
    Object.entries(POS).forEach(([id,p])=>{ const g=p.el; if(!g) return; const act=e=>{ e.stopPropagation(); if(pinned===id){ pinned=null; sel=unitOf[id]?{type:'area',key:unitOf[id]}:null; render(); showPanel(); } else go(id); };
      g.addEventListener('click',act); g.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); act(e); } }); }); }

  // ---- rails: what applies to every area, listed under the diagram ----
  const railIds=new Set(); const railsBox=document.getElementById('ei-rails');
  if(railsBox) DATA.rails.forEach(R=>{ const sec=document.createElement('section'); sec.className='ei-rail';
    sec.innerHTML=`<b>${esc(R.label)}</b><span>Applies across every area.</span>`; let dom=null, list=null;
    R.items.forEach(it=>{ railIds.add(it.id); if(it.domain!==dom){ dom=it.domain; const h=document.createElement('h4'); h.textContent=DATA.domains[dom].name; sec.appendChild(h); list=document.createElement('div'); list.className='ri-list'; sec.appendChild(list); }
      const b=document.createElement('button'); b.type='button'; b.className='ri'; b.dataset.id=it.id; b.innerHTML=esc(it.name)+(DATA.ddq[it.id]?'<i>DDQ</i>':'');
      b.addEventListener('click',e=>{ e.stopPropagation(); railsBox.querySelectorAll('.ri.pin').forEach(x=>x.classList.remove('pin')); b.classList.add('pin'); pinned=null; flow=null; sel={type:'comp',id:it.id}; render(); showPanel(); panel.scrollIntoView({block:'nearest'}); });
      list.appendChild(b); });
    railsBox.appendChild(sec); });

  const flowSel=document.getElementById('ei-flow-sel');
  if(flowSel) flowSel.addEventListener('change',()=>{ if(flowSel.value) setFlow(flowSel.value); else home(); });
  document.querySelectorAll('[data-all]').forEach(b=>b.addEventListener('click',()=>{ const on=b.dataset.all==='1'; bp.classList.remove('pulse');
    Object.keys(UNITS).forEach(k=>{ if(k!=='clients') on?shown.add(k):shown.delete(k); }); flow=null; pinned=null; if(flowSel) flowSel.value=''; render(); showPanel(); }));
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&(sel||flow)) home(); });
  render(); showPanel();
  const fromHash=()=>{ const id=decodeURIComponent(location.hash.slice(1)); if(C[id]||CL[id]) go(id); else if(AM[id]) pickArea(id,{reveal:true,scroll:true}); };
  window.addEventListener('hashchange',fromHash); if(location.hash) setTimeout(fromHash,60);
})();
</script>
</body>
</html>
