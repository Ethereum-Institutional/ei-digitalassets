<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400;1,7..72,400&display=swap">
<style>
  /* Layout: one column (heading, diagram, lens selector, definition panel). Styled after ethereuminstitutional.org:
     warm paper ground, near-black ink, serif headlines (Tiempos → Literata), grotesk UI (Söhne → Archivo). */
  :root{
    color-scheme:light;
    --paper:#f2efe9;   /* page ground */
    --card:#f8f6f2;    /* raised surfaces */
    --sand:#eae6de;    /* quiet fills */
    --rule:#dfdbd2;    /* hairlines */
    --ink:#14130f;     /* text + primary buttons */
    --muted:#615f5a;   /* secondary text */
    --serif:"Tiempos Text", Literata, "Iowan Old Style", Georgia, serif;
    --sans:Söhne, Archivo, "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;-webkit-font-smoothing:antialiased}
  .ei-taxonomy{max-width:1400px;margin:0 auto;padding-block:40px 56px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:20px}
  .ei-head{display:flex;flex-direction:column;gap:10px}
  .ei-taxonomy .ei-head .sub{max-width:110ch}
  .ei-more{font:inherit;font-size:14px;color:var(--ink);background:none;border:none;padding:0;margin-left:6px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  .ei-more:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .ei-head .sub.more[hidden]{display:none}
  .ei-eyebrow{font-size:13px;color:var(--muted)}
  .ei-nav{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px}
  .ei-nav a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--rule);padding-bottom:2px}
  .ei-nav a:hover{color:var(--ink);border-color:var(--ink)}
  .ei-nav .cur{color:var(--ink);font-weight:600;border-bottom:1px solid var(--ink);padding-bottom:2px}
  .ei-tag{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.02em;text-transform:uppercase;padding:1px 7px;border-radius:8px;background:#fdf3e1;border:1px solid #e3b45f;color:#4a3108;vertical-align:middle;margin-left:6px}
  .ei-legend{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:12px;color:var(--muted);padding:0 6px}
  .ei-legend span{display:inline-flex;align-items:center;gap:7px}
  .ei-legend svg{flex:none}
  /* draft notice: amber = caution */
  .ei-notice{padding:12px 16px;border-radius:12px;background:#fdf3e1;border:1px solid #e3b45f;color:#4a3108;font-size:14px;line-height:1.5}
  .ei-notice b{font-weight:600}
  .ei-taxonomy h1{font-family:var(--serif);font-weight:400;font-size:clamp(28px,4vw,40px);line-height:1.05;letter-spacing:-.032em;margin:0;text-wrap:balance}
  .ei-taxonomy h1 em{font-style:italic}
  .ei-taxonomy .sub{color:var(--muted);margin:0;font-size:15px;line-height:1.55;max-width:65ch}
  .ei-wrap{width:100%;overflow-x:auto;background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:8px}
  .ei-wrap svg{width:100%;min-width:720px;height:auto;display:block}
  .ei-wrap svg text{pointer-events:none;font-family:var(--sans)}
  .ei-wrap svg text.serif{font-family:var(--serif);letter-spacing:-.02em}
  .ei-wrap svg .node{cursor:pointer;transition:stroke-width .15s, opacity .2s}
  .ei-wrap svg .node.on{stroke-width:3.5}
  .ei-wrap svg .hide,.ei-wrap svg .rhide{display:none}
  .ei-wrap svg text.ctl{pointer-events:auto;cursor:pointer}
  .ei-wrap svg text.ctl:hover,.ei-wrap svg text.ctl:focus-visible{fill:var(--ink)}
  .ei-wrap svg text.ctl:focus{outline:none}
  .ei-regions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:12px;color:var(--muted);padding:0 6px}
  .ei-regions button{font:inherit;font-size:12px;color:var(--ink);background:#fff;border:1px solid var(--rule);border-radius:10px;padding:5px 10px;cursor:pointer}
  .ei-regions button:hover{border-color:var(--ink)}
  .ei-regions button.all{border:none;background:none;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
  .ei-wrap svg .node.pinned{stroke:var(--ink) !important;stroke-width:4.5 !important}
  .ei-wrap svg .asset.pinned circle,.ei-wrap svg .asset.pinned rect{stroke:#0ea5e9;stroke-width:3.5}
  .ei-panel .pinbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--rule)}
  .ei-panel .pinbar button{font:inherit;font-size:12px;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:10px;padding:5px 10px;cursor:pointer}
  .ei-panel .pinbar button:hover{border-color:var(--ink)}
  .ei-wrap svg .node:focus-visible{outline:none;stroke:var(--ink);stroke-width:4}
  .ei-wrap svg .asset{cursor:pointer}
  .ei-wrap svg .asset text{font-family:var(--sans)}
  .ei-wrap svg .dim{opacity:.16}
  .ei-wrap svg text.dim{opacity:.2}
  .ei-wrap svg .perimeter{pointer-events:none}

  .ei-lens{display:flex;flex-direction:column;gap:12px;padding:18px 20px;border:1px solid var(--rule);border-radius:16px;background:var(--card)}
  .ei-lens-head{display:flex;gap:6px 14px;flex-wrap:wrap;align-items:baseline}
  .ei-lens-head b{font-family:var(--serif);font-weight:400;font-size:22px;letter-spacing:-.02em}
  .ei-lens-head span{color:var(--muted);font-size:13px}
  .ei-lens .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .ei-lens .rl{font-size:12px;color:var(--muted);min-width:130px}
  .ei-lens button{font:inherit;font-size:14px;padding:9px 14px;border-radius:12px;border:1px solid var(--rule);background:#fff;color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:background .15s,color .15s}
  .ei-lens button:hover{border-color:var(--ink)}
  .ei-lens button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .ei-lens button .sw{width:10px;height:10px;border-radius:50%;background:var(--c)}
  .ei-lens button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .ei-ctl{display:flex;gap:12px 16px;flex-wrap:wrap;align-items:flex-end}
  .ei-field{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);flex:1 1 280px;min-width:0;max-width:440px}
  .ei-field select{font:inherit;font-size:14px;color:var(--ink);background:#fff;border:1px solid var(--rule);border-radius:12px;padding:10px 36px 10px 14px;width:100%;
    appearance:none;-webkit-appearance:none;cursor:pointer;
    background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);
    background-position:calc(100% - 20px) 55%,calc(100% - 15px) 55%;background-size:5px 5px;background-repeat:no-repeat}
  .ei-field select:hover{border-color:var(--ink)}
  .ei-field select:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .ei-field select.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
  .ei-lens [hidden]{display:none}
  .ei-lens .clear{border:none;background:none;color:var(--muted);text-decoration:underline;text-underline-offset:3px;padding:9px 4px}
  .ei-scope{display:none;gap:8px 18px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding-top:12px;border-top:1px solid var(--rule)}
  .ei-scope.show{display:flex}
  .ei-scope span{display:inline-flex;align-items:center;gap:6px}
  .ei-scope i{display:inline-block;width:20px;height:12px;border-radius:6px;border:3px solid var(--ink)}
  .ei-scope i.p{border-style:dashed}
  .ei-scope i.o{border:2px solid var(--rule)}
  .ei-scope .perim{display:inline-flex;align-items:center;gap:6px;margin-right:6px}
  .ei-scope.nets .key{display:none}
  .ei-panel .hint{font-size:12px;color:var(--muted);margin-top:8px;font-style:italic}
  .ei-panel .src{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.5}
  .ei-panel .src a{color:var(--muted)}
  .ei-scope svg{flex:none}

  .ei-panel{background:#fff;border:1px solid var(--rule);border-radius:16px;padding:18px 22px;min-height:96px}
  .ei-panel h2{margin:0 0 6px;font-family:var(--serif);font-weight:400;font-size:22px;letter-spacing:-.02em}
  .ei-panel p{margin:0;font-size:15px;line-height:1.6;color:var(--ink);max-width:90ch}
  .ei-panel .path{font-size:12px;color:var(--muted);margin-bottom:6px}
  .ei-panel .scope{margin-top:10px;font-size:14px;line-height:1.5;padding:10px 12px;border-radius:10px;background:var(--card);border-left:4px solid var(--c)}
  .ei-contrib{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between;padding:14px 18px;border:1px solid var(--rule);border-radius:16px;background:var(--card);font-size:14px;line-height:1.5}
  .ei-contrib p{margin:0;max-width:75ch}
  .ei-contrib b{font-weight:600}
  .ei-contrib .links{display:flex;flex-wrap:wrap;gap:8px}
  .ei-contrib a{color:var(--ink);text-decoration:none;font-size:13px;padding:6px 12px;border:1px solid var(--rule);border-radius:10px;background:#fff}
  .ei-contrib a:hover{border-color:var(--ink)}
  .ei-contrib a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .ei-foot{font-size:12px;color:var(--muted);line-height:1.5}
  .ei-ver{opacity:.7}
  @media (prefers-reduced-motion: reduce){ .ei-wrap svg .node, .ei-lens button{transition:none} }
</style>
</head>
<body>
<div class="ei-taxonomy">
  __NOTICE__
  <div class="ei-head">
    <span class="ei-eyebrow">__EYEBROW__</span>
    __NAV__
    <h1>__HEADING__</h1>
    <p class="sub">__INTRO__</p>
    __INTRO_MORE__
  </div>
  <div class="ei-wrap"><svg id="ei-svg" viewBox="0 0 1600 1300" role="img" aria-label="__SVG_LABEL__"></svg></div>
  __LEGEND__
  <div class="ei-lens" id="ei-lens">
    <div class="ei-lens-head"><b>__LENS_TITLE__</b><span>__LENS_HELP__</span></div>
    <div class="ei-scope" id="ei-scope">
      <span id="ei-perims"></span>
      <span class="key"><svg width="38" height="18" aria-hidden="true"><rect x="3" y="3" width="32" height="12" rx="6" fill="none" stroke="#14130f" stroke-width="5"/></svg> Inside the definition (thick line)</span>
      <span class="key"><svg width="46" height="18" aria-hidden="true"><rect x="3" y="3" width="40" height="12" rx="6" fill="none" stroke="#14130f" stroke-width="3" stroke-dasharray="16 8"/></svg> Depends, exempt or restricted (long dashes)</span>
      <span class="key"><svg width="38" height="18" aria-hidden="true"><rect x="3" y="3" width="32" height="12" rx="6" fill="none" stroke="#cfc9bd" stroke-width="1.5"/></svg> Outside the definition (faded)</span>
    </div>
  </div>
  <div class="ei-panel" id="ei-panel" aria-live="polite">
    <h2>__PANEL_TITLE__</h2>
    <p>__PANEL_TEXT__</p>
  </div>
  __CONTRIBUTE__
  <p class="ei-foot">__FOOTNOTE__ <span class="ei-ver">__VERSION__</span></p>
</div>

<script>
(function(){
  // Palette per family
  const DATA = __DATA__;
  // Ethereum brand colours, used only on the networks map: `eth: true` pills are Ethereum blue, the ETH mark disc Ethereum gray
  const ETH_BLUE='#627eea', ETH_GRAY='#3c3c3d';
  // "More" after the intro reveals the longer framing (site.yaml intro_more)
  const moreBtn=document.querySelector('.ei-more'), moreTxt=document.getElementById('ei-intro-more');
  if(moreBtn&&moreTxt) moreBtn.addEventListener('click',()=>{ const open=moreTxt.hidden; moreTxt.hidden=!open; moreBtn.textContent=open?moreBtn.dataset.less:moreBtn.dataset.more; moreBtn.setAttribute('aria-expanded',String(open)); });
  const C = DATA.palette;
  const N = DATA.circles.map(n=>Object.assign({}, n, {c: n.family ? C[n.family] : [n.colors.fill, n.colors.stroke]}));
  const OUTER = N[0].id; // the outer box is always the first circle
  const CONTAINERS = new Set(DATA.containers);
  const KIDS = DATA.children;
  const INHERIT = DATA.inherit_status;
  // scope:'networks' lenses highlight badges (their `networks` map) and leave the circles alone
  const LENSES = DATA.lenses.map(L=>Object.assign({}, L, {s:Object.assign({},L.status||{}), n:Object.assign({},L.notes||{}), nets:L.networks||null,
    groups:(L.groups&&L.groups.length) ? L.groups.map(G=>Object.assign({},G,{ids:G.circles})) : undefined,
    reveal:new Set([...Object.keys(L.status||{}),...Object.keys(L.notes||{}),...(L.groups||[]).flatMap(G=>G.circles||[])])}));
  // expand group lenses into per-circle status + group lookup; children inherit their parent's note when they have none
  const PARENT={}; Object.entries(KIDS).forEach(([p,ks])=>ks.forEach(k=>{ if(!(k in PARENT)) PARENT[k]=p; }));
  Object.entries(INHERIT).forEach(([c,p])=>PARENT[c]=p);
  LENSES.forEach(L=>{
    L.g={};
    (L.groups||[]).forEach(G=>G.ids.forEach(id=>{ L.s[id]=L.s[id]||'in'; L.g[id]=G; }));
    Object.entries(PARENT).forEach(([c,p])=>{ if(!L.n[c] && L.n[p]) L.n[c]=L.n[p]; });
  });
  const LBYID = Object.fromEntries(LENSES.map(l=>[l.id,l]));
  const activeLenses = []; // order = selection order

  function allOut(L,id){
    const st=L.s[id];
    if(st==='in'||st==='part'||L.g[id]) return false;
    if(CONTAINERS.has(id)) return st==='out' || (KIDS[id]||[]).every(k=>allOut(L,k));
    return status(L,id)==='out';
  }
  function status(L,id){
    if(!L.s[id] && INHERIT[id] && L.s[INHERIT[id]]) return L.s[INHERIT[id]];
    if(L.s[id]) return L.s[id];
    // inherit for Basel-style container entries (e.g. rwa children)
    return CONTAINERS.has(id) ? null : 'out';
  }

  const NS='http://www.w3.org/2000/svg';
  const svg=document.getElementById('ei-svg');
  const panel=document.getElementById('ei-panel');
  const el=(n,a)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);return e;};
  const defs=el('defs',{});
  defs.innerHTML='<pattern id="ei-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#f3dcd6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#c0685a" stroke-width="2.5"/></pattern>';
  const gShapes=el('g',{}), gPer=el('g',{}), gText=el('g',{});
  svg.append(defs,gShapes,gPer,gText);
  // shapes never draw outside the outer box (a stretched region can reach past it)
  const outer=DATA.circles.find(c=>c.t==='rect'); if(outer){ const cp=el('clipPath',{id:'clip-outer'}); cp.appendChild(el('rect',{x:outer.x,y:outer.y,width:outer.w,height:outer.h,rx:outer.r})); defs.appendChild(cp); gShapes.setAttribute('clip-path','url(#clip-outer)'); }
  const byId={};

  let curTexts=[];
  function txt(x,y,s,size,weight,fill){
    const big=size>=15;
    const t=el('text',{x,y,'text-anchor':'middle','font-size':big?size*1.08:size,'font-weight':big?400:(weight>=700?600:(weight||400)),fill:fill||'#14130f'});
    t.dataset.ox=x; t.dataset.oy=y; t.dataset.fs=t.getAttribute('font-size');
    if(big) t.setAttribute('class','serif');
    t.textContent=s; gText.appendChild(t); curTexts.push(t);
  }

  const ellPath=n=>`M${n.cx-n.rx} ${n.cy}a${n.rx} ${n.ry} 0 1 0 ${2*n.rx} 0a${n.rx} ${n.ry} 0 1 0 ${-2*n.rx} 0Z`;
  let active=null, hovered=null;
  // Hover previews a definition; click pins it until you click outside the circles (or press Esc).
  let pinned=null;
  function addPinBar(){
    panel.insertAdjacentHTML('afterbegin','<div class="pinbar"><span>Pinned: hover is paused. Click outside the circles or press Esc to release.</span><button type="button" class="unpin">Unpin</button></div>');
    panel.querySelector('.unpin').addEventListener('click',e=>{e.stopPropagation(); unpin();});
  }
  function pin(el,show){ if(pinned) pinned.el.classList.remove('pinned'); pinned={el,show}; el.classList.add('pinned'); show(); addPinBar(); }
  function unpin(){ if(!pinned) return; pinned.el.classList.remove('pinned'); pinned=null; const b=panel.querySelector('.pinbar'); if(b) b.remove(); }
  function bindInfo(el,show,outer,extra){
    const act=()=>{ if(extra) extra(); if(outer){ unpin(); show(); } else pin(el,show); };
    el.addEventListener('mouseenter',()=>{ if(!pinned) show(); });
    el.addEventListener('focus',()=>{ if(!pinned) show(); });
    el.addEventListener('click',e=>{ e.stopPropagation(); act(); });
    el.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); act(); } });
  }
  // expandable circles (`expand: collapsed | expanded` in circles.yaml, `collapsed:` geometry in layout.yaml):
  // collapsed, the circle is a small pill with a + and its participant badges are hidden; a click opens it on top of
  // everything else at its full geometry and shows them. The open circle, its labels and its badges move to gTop.
  const gTop=el('g',{});
  // `pill: true` network circles look like a badge while collapsed (ink = Ethereum ecosystem, gray = other)
  // XM: when regions are hidden the remaining strip [x0, x1] of the canvas is stretched across the full width
  // (positions and shape widths scale, text and badges keep their size)
  const XM={x0:0,k:1,off:0}; const mx=x=>XM.off+(x-XM.x0)*XM.k;
  const setOpen=(n,open)=>{
    const x=byId[n.id], g=open?n:n.collapsed; n.open=open;
    const asPill=n.pill&&!open;
    x.s.setAttribute('cx',mx(g.cx)); x.s.setAttribute('cy',g.cy); x.s.setAttribute('rx',asPill?g.rx:g.rx*XM.k); x.s.setAttribute('ry',g.ry);
    x.s.setAttribute('fill',asPill?(n.eth?ETH_BLUE:'#6b6760'):x.base.fill); x.s.setAttribute('fill-opacity',asPill?1:(open?.97:x.base.fop));
    if(!activeLenses.length){ x.s.setAttribute('stroke',asPill?'#f8f6f2':x.base.stroke); x.s.setAttribute('stroke-width',asPill?1.5:2); }
    const fs=open?n.fs:(g.fs||10), lh=fs*1.15, ink=asPill?'#f2efe9':'#14130f';
    const lx=mx(g.cx)+((open?n.lx:g.lx)-g.cx); // label keeps its unscaled offset from the shape's center
    x.labelTexts.forEach((t,i)=>{ t.setAttribute('x',lx); t.setAttribute('y',(open?n.ly:g.ly)+i*lh); t.setAttribute('font-size',fs>=15?fs*1.08:fs); t.setAttribute('fill',ink); t.classList.toggle('serif',fs>=15); });
    x.subTexts.forEach(t=>{ t.classList.toggle('hide',!open); if(t.dataset&&t.dataset.ox!==undefined) t.setAttribute('x',mx(g.cx)+(+t.dataset.ox-g.cx)); });
    const w=Math.max(...n.label.map(l=>l.length))*fs*0.56, hx=lx+w/2+7, hy=open?n.ly:g.ly;
    x.hint.setAttribute('x',hx); x.hint.setAttribute('y',hy); x.hint.textContent=open?'−':'+'; x.hint.setAttribute('fill',asPill?'#f2efe9':'#615f5a');
    if(x.mark){ const mx=hx+14, my=hy-9; x.mark.c.setAttribute('cx',mx); x.mark.c.setAttribute('cy',my); x.mark.t.setAttribute('x',mx); x.mark.t.setAttribute('y',my+2.2); }
    const kids=ASSETS.filter(a=>a.p===n.id);
    kids.forEach(a=>a.g.classList.toggle('hide',!open));
    if(open){ gTop.append(x.s,...x.texts,...kids.map(a=>a.g)); }
    else { gShapes.appendChild(x.s); x.texts.forEach(t=>gText.appendChild(t)); kids.forEach(a=>gText.appendChild(a.g)); }
  };
  document.addEventListener('click',e=>{ if(pinned && !e.target.closest('#ei-panel, #ei-lens')) unpin(); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') unpin(); });
  N.forEach(n=>{
    const [fill,stroke]=n.c;
    const common={class:'node',fill,'fill-opacity':n.id===OUTER?1:.55,stroke,'stroke-width':2,tabindex:0,'aria-label':n.label.join(' ')};
    // lens-only circles are paths: under a lens they stretch to take in the badges of tokens it licenses
    const s = n.t==='rect' ? el('rect',Object.assign({x:n.x,y:n.y,width:n.w,height:n.h,rx:n.r},common))
      : n.lens_only ? el('path',Object.assign({d:ellPath(n)},common))
      : el('ellipse',Object.assign({cx:n.cx,cy:n.cy,rx:n.rx,ry:n.ry},common));
    if(n.clip){
      const src=byId[n.clip].n, cp=el('clipPath',{id:'clip-'+n.id});
      cp.appendChild(el('ellipse',{cx:src.cx,cy:src.cy,rx:src.rx,ry:src.ry})); defs.appendChild(cp);
      s.setAttribute('clip-path','url(#clip-'+n.id+')'); s.setAttribute('fill-opacity',.9);
    }
    gShapes.appendChild(s);
    curTexts=[]; byId[n.id]={n,s,texts:curTexts,base:{stroke,fill:s.getAttribute('fill'),fop:s.getAttribute('fill-opacity')}};
    const lh=n.fs*1.15;
    n.label.forEach((line,i)=>txt(n.lx,n.ly+i*lh,line,n.fs,n.fw,n.tc||(n.c[1]==='#8a857a'?'#3d3b36':'#14130f')));
    byId[n.id].labelTexts=curTexts.slice(); const subStart=curTexts.length;

    if(n.collapsible){ // regions: a − after the label hides the region and everything in it, and zooms the map to the rest

  // ---------- badges (ticker discs or named pills; positions = house-view placement) ----------
  // Badges never move. Under a lens listed in a token's `licensed_under`, the lens-only circle that lens shows

  // ---------- collapsible regions (`collapsible: true`): hide a region and its contents, zoom the map to what is left ----------
  // A point is "in" a region when its center falls inside the region's shape. Containers that straddle a region
  // (`straddles: [ids]`) are never hidden by it; the outer box never hides.
  const hiddenRegions=new Set();
  const inside=(r,px,py)=> r.t==='rect' ? (px>=r.x&&px<=r.x+r.w&&py>=r.y&&py<=r.y+r.h) : (((px-r.cx)/r.rx)**2+((py-r.cy)/r.ry)**2<=1);
  const center=n=> n.t==='rect' ? [n.x+n.w/2,n.y+n.h/2] : [n.cx,n.cy];
  const hiddenBy=(px,py,self)=>[...hiddenRegions].some(id=>{ const r=byId[id].n; if(self&&(self.id===OUTER||self.id===r.id||(self.straddles||[]).includes(id))) return false; return inside(r,px,py); });
  const rbar=document.createElement('div'); rbar.className='ei-regions'; rbar.hidden=true;
  document.querySelector('.ei-wrap').insertAdjacentElement('afterend',rbar);
  const BAND={x:40,y:66,w:1520,h:36,r:18,ly:89,fs:13};
  function relayout(){
    Object.values(byId).forEach(({n,s,texts,ctl})=>{
      if(n.id===OUTER) return;
      const banded=n.band&&hiddenRegions.has(n.id);
      if(n.t==='rect'){
        if(banded){ s.setAttribute('x',BAND.x); s.setAttribute('y',BAND.y); s.setAttribute('width',BAND.w); s.setAttribute('height',BAND.h); s.setAttribute('rx',BAND.r); }
        else { s.setAttribute('x',mx(n.x)); s.setAttribute('y',n.y); s.setAttribute('width',n.w*XM.k); s.setAttribute('height',n.h); s.setAttribute('rx',n.r); }
      }
      else if(n.expand){ setOpen(n,n.open); return; }
      else if(!n.lens_only){ s.setAttribute('cx',mx(n.cx)); s.setAttribute('rx',n.rx*XM.k); }
      // `alt: {<region>: {lx, ly}}` moves a label while that region is hidden (Public's label into the permissioned crescent)
      const A=n.alt&&Object.entries(n.alt).find(([rid])=>hiddenRegions.has(rid)); const dx=A?A[1].lx-n.lx:0, dy=A?A[1].ly-n.ly:0;

        else { t.setAttribute('x',mx(+t.dataset.ox+dx)+(+(t.dataset.rel||0))); t.setAttribute('y',+t.dataset.oy+dy); if(t.dataset.fs) t.setAttribute('font-size',t.dataset.fs); } });

  }
  function hideRegion(id,hide){
    if(hide){ if(byId[id].n.band) [...hiddenRegions].filter(r=>byId[r].n.band).forEach(r=>hiddenRegions.delete(r)); hiddenRegions.add(id); } else hiddenRegions.delete(id);
    Object.values(byId).forEach(({n,s,texts})=>{ const [px,py]=center(n); const banded=n.band&&hiddenRegions.has(n.id); const h=!banded&&(hiddenRegions.has(n.id)||hiddenBy(px,py,n)); s.classList.toggle('rhide',h); texts.forEach(t=>t.classList.toggle('rhide',h)); });
    ASSETS.forEach(a=>a.g.classList.toggle('rhide',hiddenBy(a.x,a.y,null)));

    // stretch: the strip of the canvas still shown (regions name theirs with `zoom: [x0, x1]`) spreads across the full width
    let x0=0,x1=W; hiddenRegions.forEach(id=>{ const z=byId[id].n.zoom; if(!z) return; if(z[0]===0) x0=Math.max(x0,z[1]); else x1=Math.min(x1,z[0]); });

    if(x0===0&&x1===W){ XM.x0=0; XM.k=1; XM.off=0; } else { XM.x0=x0; XM.k=(W-40)/(x1-x0); XM.off=20; }

  }

  // ---------- outlines: union of shapes via marching squares (lens perimeters and lens-only blobs) ----------
  // Shapes: ellipses (optionally clipped), discs around token badges and capsules along `bridges` waypoints.
  // Fields are approximate signed distances in px (positive inside), joined with a smooth max so unions read as blobs.
  const W=1600,H=1300,STEP=5,SMOOTH=6;
  const ellShape=n=>({k:'e',cx:n.cx,cy:n.cy,rx:n.rx,ry:n.ry,clip:n.clip?byId[n.clip].n:null});
  const disc=(a,r)=>({k:'d',cx:a.x,cy:a.y,r});
  function sdEll(e,x,y,pad){
    const rx=e.rx+pad, ry=e.ry+pad, dx=x-e.cx, dy=y-e.cy, D=Math.hypot(dx,dy);
    return D<1e-6 ? Math.min(rx,ry) : 1/Math.sqrt((dx/D/rx)**2+(dy/D/ry)**2)-D;
  }
  function sd(s,x,y,pad){
    if(s.k==='d') return s.r+pad-Math.hypot(x-s.cx,y-s.cy);
    if(s.k==='c'){ const vx=s.x2-s.x1, vy=s.y2-s.y1, t=Math.max(0,Math.min(1,((x-s.x1)*vx+(y-s.y1)*vy)/(vx*vx+vy*vy)));
      return s.r+pad-Math.hypot(x-s.x1-t*vx,y-s.y1-t*vy); }
    const f=sdEll(s,x,y,pad); return s.clip ? Math.min(f,sdEll(s.clip,x,y,pad)) : f;
  }
  const smax=(a,b)=>{ const h=Math.max(SMOOTH-Math.abs(a-b),0); return Math.max(a,b)+h*h/(4*SMOOTH); };
  function outline(shapes,pad,step,box){
    const [x0,y0,x1,y1]=box||[0,0,W,H];
    const nx=Math.floor((x1-x0)/step)+1, ny=Math.floor((y1-y0)/step)+1, v=new Float32Array(nx*ny);
    for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){
      const x=x0+i*step,y=y0+j*step; let best=null;
      for(const s of shapes){ const f=sd(s,x,y,pad); best = best===null ? f : smax(best,f); }
      v[j*nx+i]=best===null?-1:best;
    }
    const V=(i,j)=>v[j*nx+i];
    // edge ids: horizontal h(i,j) between (i,j)-(i+1,j); vertical vv(i,j) between (i,j)-(i,j+1)
    const pts=new Map();
    const hp=(i,j)=>{const k='h'+i+'_'+j; if(!pts.has(k)){const a=V(i,j),b=V(i+1,j),t=a/(a-b); pts.set(k,[x0+(i+t)*step,y0+j*step]);} return k;};
    const vp=(i,j)=>{const k='v'+i+'_'+j; if(!pts.has(k)){const a=V(i,j),b=V(i,j+1),t=a/(a-b); pts.set(k,[x0+i*step,y0+(j+t)*step]);} return k;};
    const T={1:[['L','T']],2:[['T','R']],3:[['L','R']],4:[['R','B']],5:[['L','T'],['R','B']],6:[['T','B']],7:[['L','B']],
             8:[['B','L']],9:[['B','T']],10:[['T','R'],['B','L']],11:[['B','R']],12:[['R','L']],13:[['R','T']],14:[['T','L']]};
    const adj=new Map(); const add=(a,b)=>{(adj.get(a)||adj.set(a,[]).get(a)).push(b);(adj.get(b)||adj.set(b,[]).get(b)).push(a);};
    for(let j=0;j<ny-1;j++)for(let i=0;i<nx-1;i++){
      const c=(V(i,j)>0?1:0)|(V(i+1,j)>0?2:0)|(V(i+1,j+1)>0?4:0)|(V(i,j+1)>0?8:0);
      if(!T[c]) continue;
      const E={T:()=>hp(i,j),B:()=>hp(i,j+1),L:()=>vp(i,j),R:()=>vp(i+1,j)};
      T[c].forEach(([a,b])=>add(E[a](),E[b]()));
    }
    // chain into closed loops
    const seen=new Set(); let d='';
    for(const start of adj.keys()){
      if(seen.has(start)) continue;
      let cur=start, prev=null, loop=[];
      while(cur && !seen.has(cur)){
        seen.add(cur); loop.push(pts.get(cur));
        const nb=adj.get(cur).find(k=>k!==prev && !seen.has(k));
        prev=cur; cur=nb;
      }
      if(loop.length>2) d+='M'+loop.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join('L')+'Z';
    }
    return d;
  }
  // a lens-only circle under lens L: its ellipse, stretched rightwards just enough to hold the badges L licenses
  function lensOnlyGeom(n,L){
    const g={cx:n.cx,cy:n.cy,rx:n.rx,ry:n.ry}, x0=n.cx-n.rx, ts=ASSETS.filter(a=>joined(a,L)===n.id), m=17;
    const fits=()=>ts.every(a=>a.x+m<=g.cx+g.rx && ((a.x-g.cx)/g.rx)**2+((Math.abs(a.y-g.cy)+m)/g.ry)**2<=1);
    while(!fits() && g.rx<n.rx+300){ g.rx+=1; g.cx=x0+g.rx; }
    return g;
  }
  // shapes for a set of circles under lens L (lens-only circles use their stretched geometry)
  const shapesFor=(ids,L)=>ids.map(id=>byId[id].n).filter(n=>n.t!=='rect')
    .map(n=>n.lens_only ? Object.assign({k:'e'},lensOnlyGeom(n,L)) : ellShape(n));
  // a group's badges: a disc around each, joined by a capsule so neighboring badges read as one shape
  const tokenShapes=G=>{ const ts=ASSETS.filter(a=>(G.tokens||[]).includes(a.t));
    return [...ts.map(a=>disc(a,15)),...ts.slice(1).map((a,i)=>({k:'c',x1:ts[i].x,y1:ts[i].y,x2:a.x,y2:a.y,r:15}))]; };
  const bridge=key=>((DATA.bridges||{})[key]||[]).flatMap(w=>w.slice(1).map((p,i)=>({k:'c',x1:w[i][0],y1:w[i][1],x2:p[0],y2:p[1],r:3})));
  const perimCache={};

  // ---------- lens UI ----------
  const bar=document.getElementById('ei-lens');
  const MENU = Object.fromEntries(LENSES.map(L=>[L.id,L.menu]));
  const ctl=document.createElement('div'); ctl.className='ei-ctl';
  const mk=(grp,label,id)=>{
    const w=document.createElement('label'); w.className='ei-field'; w.htmlFor=id;
    w.innerHTML=`<span>${label}</span>`;
    const sel=document.createElement('select'); sel.id=id; sel.dataset.grp=grp;
    sel.innerHTML=`<option value="">Choose…</option>`+LENSES.filter(L=>L.group===grp)
      .sort((a,b)=>MENU[a.id].localeCompare(MENU[b.id],'en',{sensitivity:'base'}))
      .map(L=>`<option value="${L.id}">${MENU[L.id]}</option>`).join('');
    w.appendChild(sel); ctl.appendChild(w); return sel;
  };
  const sels=DATA.lens_groups.map(g=>mk(g.id,g.label,'ei-lens-'+g.id));
  const clr=document.createElement('button'); clr.type='button'; clr.className='clear'; clr.textContent='Clear lens';
  ctl.appendChild(clr);
  bar.insertBefore(ctl, document.getElementById('ei-scope'));
  const setLens=id=>{
    const L=LBYID[id]; activeLenses.length=0; if(L) activeLenses.push(L);
    N.filter(n=>n.pill&&n.open).forEach(n=>setOpen(n,false)); // open network circles close so a lens reads cleanly
    sels.forEach(sel=>{ sel.value = L&&L.group===sel.dataset.grp ? id : ''; sel.classList.toggle('on',!!sel.value); });
    clr.hidden=!L; applyLens(L, !!L);
  };
  sels.forEach(sel=>sel.addEventListener('change',()=>setLens(sel.value)));
  clr.addEventListener('click',()=>setLens('')); clr.hidden=true;

  // legend swatches drawn with the same strokes as the map
  const SW={
    dot:'<svg width="34" height="10" aria-hidden="true"><line x1="3" y1="5" x2="31" y2="5" stroke="var(--c)" stroke-width="3.6" stroke-linecap="round" stroke-dasharray="0.1 9"/></svg>',
    tint:'<svg width="16" height="14" aria-hidden="true"><rect x="1" y="1" width="14" height="12" rx="6" fill="var(--c)" fill-opacity=".32"/></svg>'};
  function applyLens(changed, added){
    const on=activeLenses.length>0;
    document.getElementById('ei-scope').classList.toggle('show',on);
    const netScope=on && activeLenses.every(L=>L.nets);
    document.getElementById('ei-scope').classList.toggle('nets',netScope);
    document.getElementById('ei-perims').innerHTML=activeLenses.map(L=> L.nets ? `<span class="perim" style="--c:${L.color}">${L.short}: highlighted badges are inside; faded ones are outside</span>`
      : L.groups ? L.groups.map(G=>`<span class="perim" style="--c:${G.color}">${SW.dot}${L.tint?SW.tint:''}${G.label}: ${G.name}</span>`).join('')
      : `<span class="perim" style="--c:${L.color}">${SW.dot}${L.short} perimeter</span>`).join('');
    // circles (a networks-scope lens leaves them as they are)
    Object.values(byId).forEach(({n,s,texts,base})=>{
      if(netScope){
        if(n.pill){ // a network drawn as an expandable circle is highlighted or faded like a badge
          const st=activeLenses.map(L=>L.nets[n.id]).find(Boolean), asPill=!n.open;
          s.classList.toggle('dim',!st); texts.forEach(t=>t.classList.toggle('dim',!st));
          s.setAttribute('stroke',st?activeLenses[0].color:(asPill?'#f8f6f2':base.stroke)); s.setAttribute('stroke-width',st==='in'?3:(asPill?1.5:2));
          s.setAttribute('stroke-dasharray',st==='part'?'4 3':'none'); return;
        }
        s.classList.remove('dim'); texts.forEach(t=>t.classList.remove('dim')); s.setAttribute('stroke',base.stroke); s.setAttribute('stroke-width',2); s.setAttribute('stroke-dasharray','none'); s.setAttribute('fill',base.fill); s.setAttribute('fill-opacity',base.fop); return; }
      if(n.pill && !n.open){ s.setAttribute('stroke','#f8f6f2'); s.setAttribute('stroke-width',1.5); s.setAttribute('stroke-dasharray','none'); return; }
      if(n.lens_only){
        const L=activeLenses.find(L=>L.reveal.has(n.id)); s.classList.toggle('hide',!L); texts.forEach(t=>t.classList.toggle('hide',!L));
        if(L) s.setAttribute('d',ellPath(lensOnlyGeom(n,L)));
      }
      const sts=activeLenses.map(L=>[L,status(L,n.id)]);
      const dim = on && n.id!==OUTER && activeLenses.every(L=>allOut(L,n.id));
      s.classList.toggle('dim',dim); texts.forEach(t=>t.classList.toggle('dim',dim));
      const inL=sts.find(([,st])=>st==='in'), partL=sts.find(([,st])=>st==='part');
      const isBox = n.id===OUTER || (CONTAINERS.has(n.id) && !(inL && inL[0].g[n.id]));
      if(inL && !isBox){ const G=inL[0].g[n.id]; s.setAttribute('stroke',G?G.color:inL[0].color); s.setAttribute('stroke-width',5.5); s.setAttribute('stroke-dasharray','none'); }
      else if(partL && n.id!==OUTER){ s.setAttribute('stroke',partL[0].color); s.setAttribute('stroke-width',3.5); s.setAttribute('stroke-dasharray','16 8'); }
      else { s.setAttribute('stroke',base.stroke); s.setAttribute('stroke-width',2); s.setAttribute('stroke-dasharray','none'); }
      // prohibition-style lenses also tint each circle in its group color
      const T=activeLenses.find(L=>L.tint && L.g[n.id]);
      if(T && !n.clip){ s.setAttribute('fill',T.g[n.id].color); s.setAttribute('fill-opacity',CONTAINERS.has(n.id)?.14:.32); }
      else { s.setAttribute('fill',base.fill); s.setAttribute('fill-opacity',base.fop); }
    });
    // token badges stay put: they dim with the circle they count in, and take a group's color when a group lists them
    ASSETS.forEach(a=>{
      if(netScope){ const st=activeLenses.map(L=>L.nets[a.t]).find(Boolean);
        a.g.classList.toggle('dim',!st); a.ring.setAttribute('stroke',st?activeLenses[0].color:'#f8f6f2'); a.ring.setAttribute('stroke-width',st==='in'?3:1.5);
        a.ring.setAttribute('stroke-dasharray',st==='part'?'4 3':'none'); return; }
      a.ring.setAttribute('stroke-dasharray','none');
      const G=activeLenses.map(L=>tokGroup(a,L)).find(Boolean), J=activeLenses.map(L=>joined(a,L)).find(Boolean);
      a.g.classList.toggle('dim',!G && byId[J||a.p].s.classList.contains('dim'));
      a.ring.setAttribute('stroke',G?G.color:'#f8f6f2'); a.ring.setAttribute('stroke-width',G?3:1.5);
    });
    // perimeters (nested: later lenses drawn a little wider so lines never coincide)
    gPer.innerHTML='';
    activeLenses.filter(L=>!L.nets).forEach((L,k)=>{
      const pad=10+k*8;
      const sets = L.groups ? L.groups.map(G=>({key:L.id+G.id+pad,color:G.color,
                                shapes:()=>[...shapesFor(G.ids,L),...tokenShapes(G),...bridge(L.id+'.'+G.id)]}))
                            : [{key:L.id+pad,color:L.color,shapes:()=>shapesFor(N.filter(n=>n.t!=='rect' && status(L,n.id)==='in').map(n=>n.id),L)}];
      sets.forEach(S=>{
        const d=perimCache[S.key]||(perimCache[S.key]=outline(S.shapes(),pad,STEP));
        gPer.appendChild(el('path',{class:'perimeter',d,fill:S.color,'fill-opacity':.05,stroke:S.color,'stroke-width':3.6,'stroke-linecap':'round','stroke-dasharray':'0.1 9'}));
      });
    });
    // panel
    if(pinned){ pinned.show(); addPinBar(); }
    else if(changed && added){ panel.innerHTML=`<h2 style="color:${changed.color}">${changed.name}</h2><p>${changed.intro}</p>`; }
    else if(!on){ panel.innerHTML=`<h2>${DATA.panel.title}</h2><p>${DATA.panel.text}</p>`; }
    else { const L=activeLenses[activeLenses.length-1]; panel.innerHTML=`<h2 style="color:${L.color}">${L.name}</h2><p>${L.intro}</p>`; }
  }
})();
</script>
</body>
</html>
